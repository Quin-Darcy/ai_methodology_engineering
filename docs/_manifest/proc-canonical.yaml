  - id: k049
    cluster_id: c050
    section: "DATA EXTRACTION / CHARTING"
    label: "Hold relevance discipline when bulk-pasting is easy"
    directive: "When extracting qualitative data using software (e.g. NVivo) that makes bulk paste easy, revisit the review question before extracting and only extract data that is relevant or potentially relevant — do not let cut-and-paste convenience override the judgement that not all data is equally relevant."
    trigger: "When extracting qualitative data using software where bulk paste is easy."
    qualification: ""
    is_fork: false
