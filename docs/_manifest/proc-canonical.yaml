  - id: k033
    cluster_id: c033
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Prefer validated filters; pilot before using"
    directive: "When considering an off-the-shelf search filter, run an initial search first — if results are manageable, do not use a filter; if the literature is plentiful and you need to limit by study design or population, use a filter that has been carefully developed and validated against a 'gold standard' for sensitivity and specificity."
    trigger: "When deciding whether to apply a search filter."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.5, pp.138,155"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d48"
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d66"
  - id: k034
    cluster_id: c034
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Save full search strings with metadata"
    directive: "Record each constructed search string in full — including database, platform/provider, syntax, years covered, date searched, filters applied with citations, and result counts at each stage — so the user can rerun it to correct errors, add omitted terms, or refresh against newly-published papers; reproduce at least one full search string in an appendix exactly as run; if the database supports it, save the search or export the strategy as Word/text, or capture a screenshot."
    trigger: "When running searches and when writing up the search documentation or appendices."
    qualification: "Cochrane expectations require reporting of 'sources, searched, when, by whom and using which terms.'"
    is_fork: false
    sources:
      - "Arksey & O'Malley 2005, Stage 2, p. 8"
      - "Booth & Sutton 2022, Ch.5, pp.138,144"
      - "Booth & Sutton 2022, Ch.10, pp.324,326"
    member_ids:
