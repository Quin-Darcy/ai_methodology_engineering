  - id: k013
    cluster_id: c013
    section: "SCOPE / QUESTION DEFINITION"
    label: "Match review perspective to chosen aim, not to intervention complexity"
    directive: "Choose the review's perspective (e.g. straightforward effectiveness review on specific outcomes) from the question being asked, acknowledging the intervention's complexity and context separately rather than letting complexity force a complex review."
    trigger: "When deciding the lens for a review of a complex intervention."
    qualification: ""
    is_fork: false
    sources:
