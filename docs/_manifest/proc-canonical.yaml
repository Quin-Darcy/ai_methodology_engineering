  - id: k045
    cluster_id: c046
    section: "STUDY SELECTION / SCREENING"
    label: "Flag uncertain inclusion calls to user"
    directive: "When you are unsure whether to include a study, flag the uncertainty to the user rather than silently deciding; restate the relevant inclusion/exclusion criteria, and ask the user (or a designated colleague) to apply the criteria as a second opinion."
    trigger: "When you are unsure whether to include a study in the review."
    qualification: ""
    is_fork: false
