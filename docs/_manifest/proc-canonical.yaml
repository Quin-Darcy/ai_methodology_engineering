  - id: k011
    cluster_id: c011
    section: "SCOPE / QUESTION DEFINITION"
    label: "Search on essential facets only"
    directive: "In your search strategy, retrieve the essential PICOS facets (those whose absence would lead you to reject a study) rather than all five, and defer the remaining facets to the screening stage to keep the result set manageable."
    trigger: "When designing a search strategy using a PICOS-style framework."
    qualification: "Retrieved results can still be examined more closely at screening."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.4, p.98"
    member_ids:
