  - id: k100
    cluster_id: c101
    section: "REPORTING / WRITE-UP"
    label: "Produce a PRISMA flow diagram"
    directive: "For any type of review (not just full systematic reviews), produce a PRISMA flow diagram of study selection — with numbers screened, assessed for eligibility, and included, plus exclusion reasons at each stage — and signal transparently the transitions from numbers of references to numbers of papers to numbers of studies, since duplicate references inflate reference counts and one study may appear in multiple papers."
    trigger: "When reporting study selection in a literature review of any type."
    qualification: "Authors note 'a PRISMA flow diagram is a useful aid for the reader for any type of review.'"
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, pp.325,329"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d26"
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d32"
  - id: k101
    cluster_id: c102
    section: "REPORTING / WRITE-UP"
    label: "Locate findings in prior context in Discussion"
    directive: "In the Discussion of a literature review, return to what was previously known (as described in the Introduction) to locate the new results within the context of other evidence, and frame implications using 'Implications for Practice' and 'Implications for Research' rather than 'Recommendations'."
    trigger: "When writing the Discussion and conclusions of a literature review."
    qualification: "Some funders resist 'Recommendations' because they imply commitment to follow-up actions."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, p.325"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d29"
  - id: k102
    cluster_id: c103
    section: "REPORTING / WRITE-UP"
    label: "Walk the reporting-standard hierarchy"
    directive: "When deciding which reporting standard to follow, walk the hierarchy: first look for a standard specific to your synthesis type; if none, follow a generic standard in its entirety; if not, combine sections from multiple generic standards; if not, supplement a generic standard with stage-specific guidance; if not, compile relevant items from a recent collection of review features."
    trigger: "When deciding which reporting standard or combination of standards to follow for your review."
    qualification: "Hierarchy outlined for qualitative reviews (Flemming et al., 2018) but offered as a general basis."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, pp.322,326"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d31"
  - id: k103
    cluster_id: c104
    section: "REPORTING / WRITE-UP"
    label: "Place and edit tables with discipline"
    directive: "Place fully reported data-extraction tables in an appendix to support auditability, keep summary tables of fewer than 20 studies inside the main body, choose a natural order for listed studies (chronological, reverse chronological, geographical region) to support the narrative — or, lacking a natural order, sort by author surname then date so the reader can find familiar studies quickly; edit table content (strip filler such as 'This study was conducted in', standardise format and detail across studies, avoid splitting tables and cells across pages); standardise inconsistent data under common labels where the categorisation is appropriate (e.g. 'Survey design'/'Survey questionnaire'/'Survey' under 'Survey'), but not where the labels carry meaningful distinctions or where the authors' own labels are the focus of study (e.g. 'Third World'/'Developing Countries'/'LMIC')."
    trigger: "When deciding placement, ordering, and editing of tables in a review report."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, p.329"
      - "Booth & Sutton 2022, Ch.8, p.264"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d33"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d57"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d58"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d59"
  - id: k104
    cluster_id: c105
    section: "REPORTING / WRITE-UP"
    label: "Check forest-plot orientation, caption, point-of-no-effect"
    directive: "When relabelling or redrawing a forest plot from meta-analysis software for publication, check the orientation (is more of an outcome better or worse?), the caption (what exactly is the outcome?), and the notation for the point of no effect (one for ratios, zero for differences)."
    trigger: "When preparing forest plots from meta-analysis software for publication."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, pp.329-330"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d34"
  - id: k105
    cluster_id: c106
    section: "REPORTING / WRITE-UP"
    label: "Compile references continuously"
    directive: "Throughout the conduct of any literature review, compile the reference list as each new item is identified rather than at the end."
    trigger: "Throughout the conduct of any literature review."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, p.330"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d35"
  - id: k106
    cluster_id: c107
    section: "REPORTING / WRITE-UP"
    label: "Structure research recommendations as EPICOT+"
    directive: "When formulating research recommendations for a review of treatment effects, structure them using EPICOT+ — Evidence (current state), Population, Intervention, Comparison, Outcome, Time stamp — adding optional Disease burden, Time aspects, and Study type as needed."
    trigger: "When writing the research-recommendations section of a review of treatment effects."
    qualification: "EPICOT was proposed for treatment-effects recommendations specifically."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, pp.336-337"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d40"
  - id: k107
    cluster_id: c108
    section: "REPORTING / WRITE-UP"
    label: "Empty-review reporting: highlight gaps, not smuggle evidence"
    directive: "If the review finds no eligible studies, base conclusions only on what the review actually contains — do not draw conclusions from excluded or non-eligible studies, unrelated evidence, or no evidence at all — and use the empty review to highlight major gaps and provide specific research-design recommendations."
    trigger: "When writing the conclusions of an 'empty' review."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, p.339"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d41"
  - id: k108
    cluster_id: c109
    section: "REPORTING / WRITE-UP"
    label: "Explain limitations' consequences, not just list them"
    directive: "When writing up review limitations, explain the meaning of each systematic error or validity issue and its likely influence on the findings, so the audience gains a clear picture of how the methodological limitations impact the results — rather than merely listing them."
    trigger: "When writing up the limitations of a qualitative review."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, p.267"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d56"
  - id: k109
    cluster_id: c110
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Transfer methods across sub-disciplines and domains"
    directive: "Watch for the relevance of considerations from one philosophical sub-discipline (e.g. epistemology) to questions in another (e.g. philosophy of language), rather than staying entirely within one subdiscipline; when a problem appears intractable in the area in which it was first posed, try recharacterising it in another area and bringing that other area's resources to bear; beget new arguments by exploiting analogies between domains (e.g. space, time, and modality; rationality and morality)."
    trigger: "When working on a question within any single philosophical sub-discipline, or looking for new arguments or counterexamples in a target domain resembling one for which arguments are already known."
    qualification: "There is no recipe for when to invoke another sub-discipline; this is a loose aphorism calling for skillful receptiveness rather than rule-following, and relations between sub-areas are not a pre-given hierarchy."
    is_fork: false
    sources:
      - "Dever 2016, ch. 1, §§8-9, pp. 18-20"
      - "Hájek 2016, ch. 19, p. 349"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch1-dever-what-is-philosophical-methodology/d01"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch1-dever-what-is-philosophical-methodology/d02"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d04"
  - id: k110
    cluster_id: c111
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Hunt counterexamples via extreme, self-referential, and enumerated cases"
    directive: "When searching for counterexamples to a thesis or analysis, check extreme and near-extreme cases first; appeal to self-referential cases by plugging a function into itself ('death by diagonalization'), and when evaluating a position whose subject matter includes positions of its own kind, check whether it treats itself consistently; when ingenuity fails and the relevant cases can be enumerated, run systematically through them by trial and error until you find one that meets your needs."
    trigger: "When searching for counterexamples to a thesis or analysis."
    qualification: "Heuristic only — defeasible guides that tend to work, not sure-fire recipes; reduce but do not eliminate the search space."
    is_fork: false
    sources:
      - "Hájek 2016, ch. 19, p. 349"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d01"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d02"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d03"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d05"
  - id: k111
    cluster_id: c112
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Probe definite/indefinite descriptions for uniqueness, existence, and indeterminacy"
    directive: "When a philosophical thesis uses a definite description 'the F', ask (i) whether there are or could be multiple F's and (ii) whether there are or could be no F's; when it uses an indefinite description 'a(n) F', ask whether there are or could be no F's; when the description is hidden under paraphrase (e.g. 'maximize' as 'achieve the greatest amount'), expose it by paraphrase before applying these checks; if the ordinary checks yield no problem case, also ask whether the count of F's, or whether 'the F' has a determinate referent, is itself indeterminate (not merely zero or many)."
    trigger: "When a thesis or analysis is phrased using 'the F', 'a(n) F', or terms that may presuppose uniqueness or existence under paraphrase."
    qualification: "Falling back from definite to indefinite description does not rescue an analysis whose existence presupposition fails."
    is_fork: false
    sources:
      - "Hájek 2016, ch. 19, §§1.1-1.4, pp. 350-353"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d06"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d07"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d08"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d09"
  - id: k112
    cluster_id: c113
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Treat arbitrariness as flaw signal; try symmetry-breaking first"
    directive: "Treat arbitrariness in a philosophical position's choice among multiple equally-good candidates as a prima facie flaw signal; in responding, look first to symmetry-breaking strategies, and only when those fail to leave one candidate standing, look to symmetry-preserving strategies over the candidates that remain."
    trigger: "When a philosophical position must select one item from multiple candidates that all appear to satisfy the relevant role equally well."
    qualification: "Not all arbitrary choices are fatal — choices that are 'partly' arbitrary (some setting must be made and a range of reasonable settings exists) are typically not troubling; no further heuristic decides which response to use, so case-by-case philosophical judgement remains necessary."
    is_fork: false
    sources:
      - "Hájek 2016, ch. 19, §§2, 2.3, pp. 353-359"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d10"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d11"
  - id: k113
    cluster_id: c114
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Do the opposite, turn things around"
    directive: "Take an approach to a problem on the table and follow the opposite, dual, or complementary approach — replace universal quantifiers by existential, necessities by possibilities, conjunctions by disjunctions, parameter values by complementary values; more generally, take the configuration of a problem (e.g. which side of an analysis comes in degrees) and consider the converse configuration."
    trigger: "When a philosophical approach is on the table and you wish to canvas alternatives or generate new approaches."
    qualification: "Self-cautioned by the 'see definite descriptions in neon lights' heuristic — this move assumes there is exactly one such opposite approach."
    is_fork: false
    sources:
      - "Hájek 2016, ch. 19, §§2.2.6, 4.1, pp. 358-365"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d12"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d20"
  - id: k114
    cluster_id: c115
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Use continuity reasoning with bidirectional sanity check"
    directive: "When evaluating a thesis that maps similar inputs to dissimilar outputs, apply continuity reasoning: small input changes should yield small output changes, and large output changes from small input changes are suspect; make explicit the metric of 'distance' (more than a comparative ordering) by which similarity is judged and consider whether the choice of metric is itself arbitrary; check that the same continuity premise cannot be run in the opposite direction, since driving it both ways yields a contradiction."
    trigger: "When evaluating arguments that map similar inputs (cases, persons, premises) to dissimilar outputs, or wielding a continuity-based or slippery-slope argument."
    qualification: "The metric need not be numerical but must be more than a comparative ordering; the warning is against unbridled use, not against continuity reasoning itself."
    is_fork: false
    sources:
      - "Hájek 2016, ch. 19, §3.1, pp. 359-360"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d13"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d14"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d15"
  - id: k115
    cluster_id: c116
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Import maths theorems; identify ancillary philosophical premises"
    directive: "When a philosophical problem can be cast in terms of continuous functions on suitable spaces, import established theorems (e.g. intermediate value theorem, Brouwer's fixed point theorem) to do philosophical work; when somebody purports to establish a philosophical thesis with a mathematical theorem, identify and spell out the ancillary philosophical premises they have assumed."
    trigger: "When a problem casts in terms of continuous functions, or when evaluating an argument deriving a philosophical conclusion from a mathematical theorem."
    qualification: "Subject to Benacerraf's caution about deriving philosophical conclusions from mathematical theorems."
    is_fork: false
    sources:
      - "Hájek 2016, ch. 19, §§3.2-3.3, pp. 361-363"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d16"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d17"
  - id: k116
    cluster_id: c117
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Check analysandum/analysans degree mismatch; consider tollens over ponens"
    directive: "When evaluating a putative analysis of a concept C, diagnose it for a mismatch of degrees between analysandum and analysans (one side coming in degrees while the other does not, or admitting borderline cases while the other does not); when faced with a valid argument whose conclusion you reject, consider running it as modus tollens against one of its premises rather than as modus ponens to its conclusion."
    trigger: "When evaluating a putative philosophical analysis, or confronting a valid argument whose conclusion is unwelcome."
    qualification: ""
    is_fork: false
    sources:
      - "Hájek 2016, ch. 19, §§4, 4.1, pp. 364-365"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d18"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d19"
  - id: k117
    cluster_id: c118
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Failed analyses can still serve as heuristics"
    directive: "When a philosophical analysis has been refuted or is widely regarded as failed, treat it as a potentially useful heuristic for thinking about the associated concept rather than discarding it: even without giving necessary and sufficient conditions, it may be a reliable enough guide to the analysandum to remain useful."
    trigger: "When a philosophical analysis has been refuted or is widely regarded as failed."
    qualification: "It will typically get a wide range of central cases right (otherwise it would never have seen the light of day); but good rules of thumb are not the last word."
    is_fork: false
    sources:
      - "Hájek 2016, ch. 19, §4.2, p. 366"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d21"
  - id: k118
    cluster_id: c119
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Replace hard notions with tractable surrogates"
    directive: "When reasoning probabilistically and prone to base-rate neglect, translate the probability problem into a parallel frequency problem (or pretend that probabilities are frequencies); when reasoning about modal, counterfactual, indeterminacy, conditional, property-theoretic, normative, or other non-extensional notions, replace them with extensional surrogates; more generally, replace a hard notion with an easier surrogate (concepts that come more naturally, e.g. expressible in first-order logic and set theory)."
    trigger: "When grappling with a concept that confounds you and a more tractable close relative is available."
    qualification: "Heuristic, not a metaphysical claim — probabilities are not frequencies; surrogate need not provide an analysis or reduction; check that the distance between original and surrogate is not so great that the surrogate misguides; in 'an especially happy replacement' the replaceans has the same logic as the replaceandum; good rules of thumb are not the last word."
    is_fork: false
    sources:
      - "Hájek 2016, ch. 19, §5, pp. 366-369"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d22"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d23"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d24"
  - id: k119
    cluster_id: c120
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Render obscure relationships in text-representable diagrams"
    directive: "When conceptual relationships are obscure under words or symbols, or when checking the validity of an inference, render them in a text-representable visual form — ASCII Venn diagrams, causal or Kripke diagrams, structured tables, or step-by-step verbal descriptions of the diagram's regions and relations — rather than relying solely on prose; pair this with the extensional-surrogate move when applicable."
    trigger: "When conceptual relationships are obscure under words/symbols, or when checking the validity of an inference."
    qualification: "Works particularly well in tandem with 'replace non-extensional with extensional': translate first, then diagram."
    is_fork: false
    sources:
      - "Hájek 2016, ch. 19, §6, pp. 369-370"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d25"
  - id: k120
    cluster_id: c121
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Run self-consistency and unwelcome-consequence checks on outputs"
    directive: "When collecting/deploying intuitions, analyzing arguments, conducting thought experiments, refining definitions, or adducing normative constraints, check the products of your work for self-consistency and for unwelcome consequences."
    trigger: "When collecting, deploying, or systematizing intuitions; analyzing arguments; conducting thought experiments; refining definitions; or adducing normative constraints."
    qualification: "Logic is the great tool for this but not the only one — the heuristics in this cluster collectively form a Swiss army knife alongside it."
    is_fork: false
    sources:
      - "Hájek 2016, ch. 19, §7, p. 370"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d26"
  - id: k121
    cluster_id: c122
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Prefer heuristics of middling generality"
    directive: "When selecting or formulating a heuristic to teach, deploy, or include in one's repertoire, prefer heuristics of middling generality — general enough to apply across a wide range of cases, but specific enough to have real bite."
    trigger: "When selecting or formulating a heuristic to use repeatedly."
    qualification: "Heuristics may legitimately vary in generality and still earn their keep; the criterion is avoidance of the extremes ('make an insightful point!' is too general; an example-specific reply is too specific), not uniform middling generality."
    is_fork: false
    sources:
      - "Hájek 2016, ch. 19, §7, p. 371"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d27"
  - id: k122
    cluster_id: c123
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Reconstruct the question before paraphrasing the answer"
    directive: "Before reconstructing or appraising the arguments of a philosophical text, identify the problem behind it — the specific question the author was answering — and account for which questions philosophers in the past did and did not ask, plus what they would have taken to be satisfactory answers; then reconstruct the arguments offered for the solution by formulating them into premises and conclusion."
    trigger: "When interpreting a doctrine in a classic philosophical text or studying any historical philosophical milieu."
    qualification: "Reconstruction must draw on knowledge of historical context and content; applied without historical scholarship it will misfire on texts from distant epochs, languages, and cultures. Some past questions may no longer be reasonably askable; some present questions may have been unaskable in the past."
    is_fork: false
    sources:
      - "Skinner 2002, ch. 4, p. 101"
      - "Beiser 2016, ch. 26 sec. 3, p. 511"
      - "Normore 2016, §2, pp. 33-34"
    member_ids:
      - "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d28"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d01"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d02"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d08"
  - id: k123
    cluster_id: c124
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Critique internally by author's own goals and standards"
    directive: "When evaluating a historically-distant philosophical text, appraise its reconstructed arguments by internal (immanent) critique — using the author's own goals and standards — rather than by an external standard purporting to be a universal criterion of reason; examine whether the author achieves their goals, gives sufficient evidence for premises, whether premises entail conclusions, whether meaning is ambiguous, and (when the author's intention is known) whether the argument, if true, would fully establish what the author intended; determine the argument's formal validity and the quality of the evidence for it."
    trigger: "After reconstructing the arguments of a philosophical text, or when evaluating its truth or soundness."
    qualification: "Internal critique permits falsification of a standpoint but not verification of which standpoint is true; consistency is one but not the only dimension. Asking whether an argument serves an author's ends does not commit the genetic fallacy — it differs from disregarding it because one disapproves of those ends."
    is_fork: false
    sources:
      - "Beiser 2016, ch. 26 sec. 3-5, pp. 511-520"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d03"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d12"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d13"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d18"
  - id: k124
    cluster_id: c125
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Ground interpretation in historical scholarship, not armchair imagination"
    directive: "When interpreting a philosophical text — especially one from a distant epoch, language, or culture — ground reconstruction and appraisal in sound knowledge of its historical context (the intellectual: what contemporaries and predecessors wrote on the topic; and the social-political: the current crises, problems, and conflicts of the author's culture) rather than substituting armchair imagination or intuitions about 'what the author could possibly mean'; when the text is in another language than the conversation's working language, consult the original-language text and compare multiple translations, flagging where translation choices materially affect interpretation."
    trigger: "When interpreting any philosophical text, especially one from a distant epoch, language, or culture."
    qualification: "The prohibition is strongest for texts from very different epochs, languages, and cultures; the rationale is that meaning depends on language and context and translations always contain mistakes; taken alone as a complete guide the historicist rules reduce the history of philosophy to history alone."
    is_fork: false
    sources:
      - "Beiser 2016, ch. 26 sec. 3-4, pp. 512-515"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d04"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d05"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d06"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d09"
  - id: k125
    cluster_id: c126
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Apply charity before critique; presume face-value meaning"
    directive: "When interpreting another speaker, text, or historical author, apply the principle of charity across the board — count them right on most matters by default, treat the text as a rational whole, optimise (not maximise) agreement between your reading and theirs by your own lights, and prefer the face-value reading that makes the text intelligible to a search for an implicit text behind it; defer criticism until charity has been exhausted, since the most compelling criticisms come after the deepest sympathy; treat as a default presumption that a text means what it seems to mean and that a philosopher accepts what they assert."
    trigger: "When beginning interpretation of a philosophical work, when interpreting a user's verbal behaviour, or when choosing among candidate readings of an utterance whose wording is ambiguous or apparently false."
    qualification: "Charity is regulative not constitutive: proceed as if the work were a rational whole, but if apparent inconsistencies persist after the most concerted attempt they may be real. Charity does not aim to eliminate disagreement but to make meaningful disagreement possible — it leaves room for explicable error and differences of opinion. The face-value presumption is defeasible (Strauss-influenced 'hermeneutics of suspicion' readings challenge it). The 'maximise agreement' formulation is rejected by Davidson as a confused ideal; the aim is the right sort of agreement. Apply charity to all sentences, not only to logical connectives or obvious tautologies."
    is_fork: false
    sources:
      - "Beiser 2016, ch. 26 sec. 3, pp. 514-515"
      - "Normore 2016, §2, pp. 33,42"
      - "Davidson 1984, 'Conceptual Scheme', pp. 196-197"
      - "Davidson 1984, Introduction, pp. xvi-xvii"
      - "Davidson 1984, 'Radical Interpretation', pp. 135-137"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d07"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d08"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d04"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d05"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d11"
      - "davidson-1984-inquiries/conceptual-scheme/d09"
      - "davidson-1984-inquiries/conceptual-scheme/d10"
      - "davidson-1984-inquiries/introduction/d04"
      - "davidson-1984-inquiries/radical-interpretation/d10"
      - "davidson-1984-inquiries/radical-interpretation/d11"
      - "davidson-1984-inquiries/radical-interpretation/d12"
  - id: k126
    cluster_id: c127
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Recover author intent, standpoint, and illocutionary force"
    directive: "When historically interpreting a philosophical text, recover the author's intention — the specific purposes for which they wrote at a specific time and place — and try as far as possible to understand the text from their standpoint; inquire into purpose, motive, or intention behind each argument, not just argument validity; for any serious utterance from a past writer, grasp the intended illocutionary force with which it was issued (what they were doing in saying it), not just what they said."
    trigger: "When interpreting any historical philosophical text or any serious utterance from a past writer."
    qualification: "Recovering intention is necessary but not sufficient; understanding also requires grasping the work's logical geography. Inquiry into motives serves historical understanding, not philosophical truth — uncovering motives does not by itself validate or discredit an argument (avoiding the genetic fallacy)."
    is_fork: false
    sources:
      - "Beiser 2016, ch. 26 sec. 4-5, pp. 515-519"
      - "Skinner 2002, ch. 4, p. 100"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d10"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d11"
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d16"
      - "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d27"
  - id: k127
    cluster_id: c128
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Map the text's logical geography"
    directive: "In addition to recovering historical context and intention, map the text's 'logical geography': the premises required to justify each proposition, its implications, the various meanings of central terms, the sufficiency of evidence, and any internal contradictions."
    trigger: "When claiming to understand a philosophical text in the deeper sense."
    qualification: "Knowing this geography requires active appropriation and assimilation of the author's structure of thought, going beyond passive learning to exploration."
    is_fork: false
    sources:
      - "Beiser 2016, ch. 26 sec. 4, pp. 517-518"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d14"
  - id: k128
    cluster_id: c129
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Combine historical reconstruction with internal critique"
    directive: "When practicing the history of philosophy as a synthesis of historical and analytic methods, reconstruct arguments on the basis of their historical context and appraise them according to an internal critique."
    trigger: "When practicing the history of philosophy as a synthesis of historical and analytic methods."
    qualification: "This synthesis secures the search for truth only modestly: judgments are valid within the context of a particular text or thinker, not on general issues."
    is_fork: false
    sources:
      - "Beiser 2016, ch. 26 sec. 5, p. 518"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d15"
  - id: k129
    cluster_id: c130
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Investigate non-philosophical motives routinely"
    directive: "When historically explaining a philosopher's positions — including those in metaphysics or logic — investigate non-philosophical motives (moral, religious, political) routinely, not only in exceptional cases when philosophical reasoning breaks down."
    trigger: "When historically explaining a philosopher's positions."
    qualification: "Investigating motives is for historical understanding; it does not by itself validate or discredit the position. The genetic fallacy is real but does not foreclose this inquiry."
    is_fork: false
    sources:
      - "Beiser 2016, ch. 26 sec. 5, pp. 519-520"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d17"
  - id: k130
    cluster_id: c131
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Specialise and name the scope"
    directive: "When orienting a research program in the History of Philosophy without the linguistic and disciplinary range of an ideal Historian of the whole, scope your treatment to a particular figure or period rather than attempting a global synthesis, and name the chosen scope explicitly to the user."
    trigger: "When answering a question in the history of philosophy and one lacks the heroic range to do the whole."
    qualification: "Specialisation brings forgivable ignorance of certain languages and contexts only on assumptions (e.g. that nothing in those languages bears on the figure) that are themselves revisable."
    is_fork: false
    sources:
      - "Normore 2016, §3.1, p. 44"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d12"
  - id: k131
    cluster_id: c132
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Doxology vs strict historicism: name the active register"
    directive: "When engaging with a past philosophical text, decide whether you are operating in (A) strict-historicist mode — recover the question, intention, and standpoint as the writer or the writer's contemporaries would have framed them — or (B) doxological mode — examine the text's theses and arguments using considerations and weightings drawn from contemporary philosophy because the text has immediate philosophical appeal to a contemporary reader. Name the active branch and the trigger that activated it (which text, which audience, which contemporary appeal) before proceeding."
    trigger: "When teaching, writing about, or interpreting a past philosophical text that has immediate philosophical appeal to a contemporary reader."
    qualification: "Which texts have immediate contemporary appeal changes with time; the doxological maxim is contingent on Doxology remaining centred in Philosophy departments. The two registers do not foreclose each other but cannot be conducted simultaneously."
    is_fork: true
    fork_positions:
      - "strict historicism (Skinner 2002, Beiser 2016, Normore historical-context branch)"
      - "doxology (Normore 2016, §3.2)"
    sources:
      - "Normore 2016, §3.2, p. 45"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d13"
  - id: k132
    cluster_id: c133
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Test understanding by prediction"
    directive: "When claiming to understand an unfamiliar philosophical milieu or figure, test the claim before asserting it: predict what the figure would say on a related question or in a passage you have not yet examined, then check the prediction against the actual text and report any mismatch."
    trigger: "When trying to gauge whether you have achieved an Anthropology-of-Philosophy-style understanding of an unfamiliar milieu."
    qualification: "Even in one's own cultural environment one can be surprised; failures of prediction are akin to overgeneralizing from a restricted diet of examples and call for the 'Exhaust the Evidence' principle."
    is_fork: false
    sources:
      - "Normore 2016, §3.3, p. 45"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d14"
  - id: k133
    cluster_id: c134
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Exhaust the evidence as regulative ideal"
    directive: "When developing or defending a historical interpretation, treat 'Exhaust the Evidence' as a regulative ideal: actively seek out — including in hitherto neglected texts — any Philosophical factor that, when considered, would change the picture at issue."
    trigger: "When developing or defending a historical interpretation in the History of Philosophy."
    qualification: "At best a regulative ideal; there is likely no finite specification of all the evidence bearing on any question in the history of philosophy."
    is_fork: false
    sources:
      - "Normore 2016, §3.4, pp. 45-46"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d15"
  - id: k134
    cluster_id: c135
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Trust-or-suspicion on apparent contradictions: name the active branch"
    directive: "When a text on its face contradicts itself, decide whether you are operating under (A) the usual coherence canons — try first denying the inconsistency, attributing change of mind, or locating unexamined philosophical presuppositions — or (B) Strauss-style hermeneutics of suspicion — attribute intentional inconsistency or hidden teaching. Name the active branch and the trigger that activated it (e.g., 'usual canons' or 'Straussian suspicion + reason'), and treat the deliberate-inconsistency strategy with the most caution among the available options, since adopting it abandons the usual canons for determining interpretive worth."
    trigger: "When you cannot find an interpretation that makes sense of a text as a whole because the text appears to contradict itself."
    qualification: "Consistency 'is the lifeblood of History of Philosophy'; the Straussian branch should remain a last resort that requires its own justification."
    is_fork: true
    fork_positions:
      - "usual coherence canons (Normore default; aligned with c126 charity)"
      - "Straussian hermeneutics of suspicion (Strauss-influenced reading)"
    sources:
      - "Normore 2016, §3.5, p. 46"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d16"
  - id: k135
    cluster_id: c136
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Test interpretation against all relevant text"
    directive: "When defending or evaluating an interpretation of a philosophical text, test it against all the relevant text, and treat any interpretation that is incompatible with some of the relevant text as thereby disqualified as an interpretation of any of it."
    trigger: "When defending or evaluating an interpretation of a philosophical text."
    qualification: ""
    is_fork: false
    sources:
