  - id: k048
    cluster_id: c049
    section: "DATA EXTRACTION / CHARTING"
    label: "Extract context alongside content"
    directive: "When extracting from qualitative studies, capture information about contextual factors so cross-study differences can be explained, and keep findings tied to the context and relationships within each report rather than detaching them."
    trigger: "During qualitative data extraction and preliminary analysis."
    qualification: ""
    is_fork: false
