  - id: k043
    cluster_id: c044
    section: "STUDY SELECTION / SCREENING"
    label: "Set a cutoff and disclose late-arriving items"
    directive: "When working under time constraints in a scoping study, set a deadline after which no further studies will be added to the analysis, and list in an appendix any later-arriving articles that may be of interest to other researchers."
    trigger: "When working under time constraints in a scoping study."
    qualification: ""
    is_fork: false
    sources:
