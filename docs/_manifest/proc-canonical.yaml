  - id: k046
    cluster_id: c047
    section: "DATA EXTRACTION / CHARTING"
    label: "Pre-specify and pilot the extraction form"
    directive: "Before applying any extraction template across all included studies, pre-specify which data elements you will extract (general — author, year, location — and specific — population, intervention type, outcomes, design — plus context), trial the form on a small subset (e.g. 3-5 studies), check whether it captures the needed fields and produces consistent entries, and revise the template before full application; apply a common analytical framework to every included study (the 'descriptive-analytical' method) rather than producing only short profiles; balance form granularity with data quantity (avoid both 'just-in-case' empty fields and large quantities lumped under broad labels); picture what the final synthesis might look like before selecting fields."
    trigger: "When constructing a data-extraction form, before extracting from all included studies."
    qualification: ""
    is_fork: false
    sources:
      - "Arksey & O'Malley 2005, Stage 4, pp. 9-10"
