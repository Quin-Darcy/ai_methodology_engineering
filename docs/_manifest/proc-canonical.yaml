  - id: k017
    cluster_id: c017
    section: "PROTOCOL / PLANNING / DOCUMENTATION"
    label: "Track protocol amendments via a 'changes clause'"
    directive: "When amending the original scope or other protocol elements (including eligibility criteria) during the review, manage the change through an explicit 'changes clause' in the protocol that records each amendment and the reason for it; rapid-review protocols should accommodate post-hoc changes within an efficient iterative process."
    trigger: "When amending the scope or other protocol elements during an ongoing review."
    qualification: "Particularly important when working on official contracts or within a wider research team."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.4, pp.116,120"
    member_ids:
