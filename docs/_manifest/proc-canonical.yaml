      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d30"
  - id: k035
    cluster_id: c035
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Keep a running search log"
    directive: "Maintain a search log of sources searched, terms used, how they were combined, and counts retrieved by each method; export results to reference-management software to remove duplicates and facilitate selection; follow PRISMA-S reporting guidance for systematic reviews; for iterative search methods, keep a journal or search-summary table recording decisions made during searching; be consistent in the reporting elements you record across all searches in the review."
    trigger: "When reporting or conducting the search process, especially for iterative searches."
    qualification: "For systematic reviews, saving full search strings in an appendix is essential."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.5, pp.127-144"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d11"
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d12"
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d13"
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d34"
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d60"
  - id: k036
    cluster_id: c036
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Use review software and double-check de-duplication"
    directive: "Be able to account for every reference retrieved by the search; use online systematic-review software (e.g. Covidence, DistillerSR, Rayyan, EPPI-Reviewer) to streamline the workflow and reuse templates across reviews — but learn new software in between, not during, rapid reviews; after automated de-duplication via the reference manager, do an additional manual duplicate check (automated checks find only exact-format matches), record pre- and post-de-duplication totals for the PRISMA flowchart, and retain duplicates in 'Trash' rather than deleting them."
    trigger: "When managing references retrieved from multiple databases."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.5, pp.140-155"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d56"
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d57"
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d65"
  - id: k037
    cluster_id: c037
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Use journal-website search only as a supplement"
    directive: "Use full-text journal-website searching only as a supplement to database searching — typically to chase highly specific terms not in titles, abstracts, or other indexed fields — rather than as a substitute, since journal-website search functionality is far less sophisticated."
    trigger: "When considering hand-searching or full-text searches of online journals."
    qualification: ""
    is_fork: false
    sources:
