    section: "SEARCH STRATEGY / EXECUTION"
    label: "Prioritise sensitivity in effectiveness reviews"
    directive: "For systematic reviews of intervention effectiveness, prioritise sensitivity in the literature search so every relevant study meeting inclusion criteria is covered."
    trigger: "When supporting a systematic review of intervention effectiveness."
    qualification: "Keeping results manageable often requires effectiveness reviews to adopt a narrow focus with strict eligibility criteria."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.5, p.128"
