  - id: k020
    cluster_id: c020
    section: "PROTOCOL / PLANNING / DOCUMENTATION"
    label: "Hold the review to CART criteria"
    directive: "Evaluate and present a systematic approach to the literature against the four CART criteria — Clarity, Auditability, Replicability, and Transparency — rather than holding it to comprehensiveness, which is not a virtue shared by every systematic approach."
    trigger: "When evaluating or presenting a systematic approach to the literature."
    qualification: "Comprehensiveness 'may be present in some but not all such systematic approaches.'"
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, pp.312-313"
    member_ids:
