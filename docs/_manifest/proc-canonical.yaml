  - id: k047
    cluster_id: c048
    section: "DATA EXTRACTION / CHARTING"
    label: "Keep an explicit 'unclassified' bucket"
    directive: "When designing an extraction form for framework-style qualitative synthesis, keep an explicit 'unclassified' bucket for material that does not fit current categories, and revisit it before concluding."
    trigger: "When designing a data extraction form for framework-style qualitative synthesis."
