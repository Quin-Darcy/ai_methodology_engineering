  - id: k136
    cluster_id: c137
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Explain unfamiliar uses of the source's vocabulary"
    directive: "When a historical text uses ordinary words in unfamiliar ways (e.g. Aristotle's claim that the intellect 'becomes' what is thought about), explain the unfamiliar use to the audience — drawing on related earlier and later texts and contemporary work if needed — rather than resting content with merely repeating the original-language wording or a dictionary translation."
    trigger: "When a historical text uses ordinary words in unfamiliar ways."
    qualification: "The historian may still feel there is more here than yet understood; the requirement is to render the claim intelligible 'to some extent', not to settle it definitively."
    is_fork: false
    sources:
      - "Normore 2016, §2, p. 33"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d07"
  - id: k137
    cluster_id: c138
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Distinguish History of Philosophy from its kin"
    directive: "When labelling, classifying, or describing work that engages with the past of Philosophy, distinguish History of Philosophy from its near kin — Intellectual History, Social History, Doxology, and Anthropology of Philosophy — rather than conflating them under a single label."
    trigger: "When labelling, classifying, or describing work that engages with the past of Philosophy."
    qualification: "All these subjects legitimately study the past of Philosophy; the directive concerns terminological discipline, not exclusion."
    is_fork: false
    sources:
      - "Normore 2016, §2, p. 28"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d02"
  - id: k138
    cluster_id: c139
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "State whether you ask contemporary or contemporaries' questions"
    directive: "When beginning interpretive work on a historical philosophical text, approach it with explicit questions, and decide whether you are asking what you would ask of a contemporary philosopher's text or what one of the writer's own philosopher contemporaries would have asked — and state the choice."
    trigger: "When beginning interpretive work on a historical philosophical text."
    qualification: "Both options have 'respectable followings'; Normore treats the choice as a central methodological issue rather than requiring one over the other."
    is_fork: false
    sources:
      - "Normore 2016, §2, p. 32"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d03"
  - id: k139
    cluster_id: c140
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Default to internal philosophical reasons"
    directive: "When undertaking History of Philosophy (as opposed to Intellectual History, Cultural History, Doxology, or Anthropology of Philosophy), present the history internally by default — as driven by philosophical considerations and reasons internal to the practice of Philosophy."
    trigger: "When undertaking History of Philosophy as opposed to neighbouring genres."
    qualification: "A default, not an absolute; 'internal' history rests on the controversial assumption that philosophers adopt and change views on philosophical grounds, and context can play an important role."
    is_fork: false
    sources:
      - "Normore 2016, §1, p. 27"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d01"
  - id: k140
    cluster_id: c141
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Evaluate past reasoning from both perspectives"
    directive: "When assessing the rationality, reasonableness, or merit of a historical philosophical position or argument, evaluate it both from your own perspective (typically your current philosophical community's) and from the perspective of the thinker and that thinker's philosophical community."
    trigger: "When assessing the rationality, reasonableness, or merit of a historical position or argument."
    qualification: "The extent to which the two perspectives agree is in part empirical; remain open both to the possibility that standards of reasonableness have changed and to the possibility that they have not."
    is_fork: false
    sources:
      - "Normore 2016, §2, p. 41"
    member_ids:
      - "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d09"
