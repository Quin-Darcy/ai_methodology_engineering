  - id: k015
    cluster_id: c015
    section: "SCOPE / QUESTION DEFINITION"
    label: "Declare the sampling approach explicitly"
    directive: "State which sampling approach you used — comprehensiveness, theoretical saturation, representative, or pivotal works — explicitly in your methods; when drawing on less than the full relevant literature, state which slice was sampled, why, and how that sampling matches the synthesis purpose."
    trigger: "When deciding how wide to go in sampling literature, or when reporting the search for qualitative studies."
    qualification: ""
    is_fork: false
    sources:
