  - id: k050
    cluster_id: c051
    section: "QUALITY ASSESSMENT"
    label: "Match QA depth to review aim"
    directive: "Start quality assessment by asking 'What do I need to find out from my included studies to fulfil the aim of my literature review?' and match the depth of assessment to the review type — a systematic review needs in-depth quality assessment, a mapping review only enough to identify key characteristics; regardless of review type, always do at least the first two LoBiondo-Wood stages: preliminary understanding (skim) and comprehensive understanding (work up the concepts and research terms)."
    trigger: "When deciding how much effort to spend on assessing included studies."
    qualification: "All reviews benefit from some assessment; full QA also requires analysis-understanding and synthesis-understanding."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, pp.163,175-176"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d13"
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d14"
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d24"
  - id: k051
    cluster_id: c052
    section: "QUALITY ASSESSMENT"
    label: "Assess on intrinsic, not extrinsic, factors"
    directive: "When triaging research articles and conducting quality assessment, separate factors into applicability, extrinsic (author, institution, journal, funder), and intrinsic; base the QA on the intrinsic factors using a structured checklist, and discard prejudices about the extrinsic ones."
    trigger: "When triaging research articles and performing quality assessment."
    qualification: "QA explicitly asks you to discard extrinsic-factor prejudices."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, pp.166-167"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d15"
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d16"
  - id: k052
    cluster_id: c053
    section: "QUALITY ASSESSMENT"
    label: "Diagnose flaws and trace their impact"
    directive: "For every included study, identify each weakness or flaw, then determine first its potential impact on that study's findings and second its implications for the review's findings as a whole; be practical — judge whether a flaw with minimal impact really matters and do not chase study perfection."
    trigger: "When assessing the evidence base of a literature review."
    qualification: "All studies have weaknesses; not all flaws are critical. Avoid critical-appraisal 'nihilism' — QA is for application of research, not perfection."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, p.167"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d17"
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d18"
  - id: k053
    cluster_id: c054
    section: "QUALITY ASSESSMENT"
    label: "Ask whether design fits the question"
    directive: "Early in quality assessment for any included study, ask: 'Is this the most appropriate study design to answer this research question?'"
    trigger: "Early in the quality-assessment process for any included study."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, p.167"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d19"
  - id: k054
    cluster_id: c055
    section: "QUALITY ASSESSMENT"
    label: "Weigh evidence hierarchies cautiously"
    directive: "Treat hierarchies of evidence (e.g. OCEBM Levels) with caution rather than as rigid rules: a poorly conducted RCT does not necessarily beat a well-conducted observational study, the most appropriate design may be limited by practical or ethical constraints, and for qualitative studies consider whether each method fits the research question instead of imposing a design hierarchy."
    trigger: "When applying or relying on study-design hierarchies, including for qualitative studies."
    qualification: "Hierarchies are mostly health-research focused and contested in other disciplines; consider a flexible per-question taxonomy instead (Petticrew & Roberts 2003)."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, p.170"
      - "Booth & Sutton 2022, Ch.8, p.243"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d20"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d23"
  - id: k055
    cluster_id: c056
    section: "QUALITY ASSESSMENT"
    label: "Check confounder identification and handling"
    directive: "When designing or appraising a study, confirm that researchers identified potential confounders at the outset and addressed them via analysis or stratification."
    trigger: "When assessing whether a study controls for confounding."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, p.174"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d21"
  - id: k056
    cluster_id: c057
    section: "QUALITY ASSESSMENT"
    label: "Separate practical from statistical significance"
    directive: "When interpreting results, separately ask whether the effect is large enough to matter in practice, not only whether it crosses a statistical-significance threshold."
    trigger: "When interpreting reliability and the results of a study."
    qualification: "Statistical significance uses arbitrary thresholds (typically 5%); a statistically significant change may still be too small to be practically significant."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, p.175"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d22"
  - id: k057
    cluster_id: c058
    section: "QUALITY ASSESSMENT"
    label: "Ask validity, reliability, generalisability, applicability"
    directive: "When reading any included study, ask the three core QA questions — Are the results true (validity)? What are the results (reliability)? Can I generalise the results (generalisability)? — then separately determine applicability by asking whether the results are useful for the review's target population and setting."
    trigger: "When reading and assessing any individual study in a literature review."
    qualification: "Applicability concerns strength of recommendations for practice, not strength of evidence."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, pp.175,191"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d23"
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d45"
  - id: k058
    cluster_id: c059
    section: "QUALITY ASSESSMENT"
    label: "QA reading order: abstract, then full read, with Methods for quality"
    directive: "Begin a study with the abstract, then read the paper in full and rely on the Methods section to determine quality, while keeping in mind that practical relevance often appears in the Discussion rather than the Results."
    trigger: "When working through an individual study during quality assessment."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, p.176"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d25"
  - id: k059
    cluster_id: c060
    section: "QUALITY ASSESSMENT"
    label: "Use validated checklists; adapt rather than invent"
    directive: "Identify the QA checklists widely used in your discipline by examining published reviews, stick to validated/widely-accepted tools, and — if no suitable tool exists — adapt an existing checklist or combine criteria into a meta-checklist (with citations to the contributing tools) rather than devise one from scratch; note any adaptation in the methodology write-up; for qualitative studies, select from published, commonly-used, validated tools focused on methodological strengths and limitations."
    trigger: "When choosing a quality-assessment checklist."
    qualification: "Devising your own from scratch may indicate inadequate searching for an appropriate tool; checklist development is a science needing its own literature review and expert panel."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, pp.176-188"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d26"
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d27"
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d30"
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d31"
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d35"
  - id: k060
    cluster_id: c061
    section: "QUALITY ASSESSMENT"
    label: "Avoid scoring-system checklists and ill-defined quality labels"
    directive: "Use checklists without scoring systems and do not label studies with quality scores; if you do summarise studies by quality level (high/medium/low), be explicit about the classification criteria so the labelling could be reliably reproduced."
    trigger: "When selecting/applying a QA checklist or summarising study quality across the review."
    qualification: "Cochrane methods guide for systematic reviews actively discourages scoring-system checklists; QA is highly subjective and readers' concepts of 'high quality' may differ."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, pp.181,189"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d28"
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d37"
  - id: k061
    cluster_id: c062
    section: "QUALITY ASSESSMENT"
    label: "Treat checklists as guides, not caps"
    directive: "Treat QA checklists as a guide rather than a final answer: when relevant study features fall outside the checklist, report them anyway."
    trigger: "When using checklists to perform quality and relevance assessment."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, p.181"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d29"
  - id: k062
    cluster_id: c063
    section: "QUALITY ASSESSMENT"
    label: "Qualitative QA: 'risk to rigour'"
    directive: "For qualitative reviews, distinguish study-quality assessment from risk-of-bias assessment and focus on methodological strengths and limitations as a marker of rigour ('risk to rigour'); avoid excluding studies on quality grounds — particularly those contributing an important insight — and treat the study as not always the right unit of analysis for appraisal in synthesis; if you do use a checklist to exclude qualitative studies, support each exclusion with an explicit account of the researcher's view of 'good' vs 'bad' studies and the reasons for exclusion; routinely run a qualitative sensitivity analysis examining the effect of both including and excluding poor-quality studies."
    trigger: "When performing quality assessment for a qualitative evidence synthesis."
    qualification: "Cochrane Qualitative and Implementation Methods Group recommendation (Noyes et al.); most qualitative reviews do not exclude studies on quality grounds."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, pp.186-188"
      - "Booth & Sutton 2022, Ch.8, p.242"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d32"
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d33"
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d34"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d18"
  - id: k063
    cluster_id: c064
    section: "QUALITY ASSESSMENT"
    label: "Sensitivity-analyse on study quality"
    directive: "When the review may be affected by inclusion of poor-quality studies, run a sensitivity analysis examining whether the review's results change if those studies are omitted."
    trigger: "When the review may be affected by inclusion of poor-quality studies."
    qualification: "Reviewers do not generally exclude studies on quality grounds."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, p.189"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d38"
  - id: k064
    cluster_id: c065
    section: "QUALITY ASSESSMENT"
    label: "Treat AI QA as draft; surface uncertainty"
    directive: "Treat your own quality assessments as subjective drafts: identify the specific judgements you are least confident about and ask the user (or a designated human reviewer) to adjudicate them rather than presenting them as settled."
    trigger: "When performing quality assessment in a systematic review."
    qualification: "Not always practical or necessary; a reasonable alternative is having a second reviewer check a sample of QAs, particularly elements you are unsure about."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, p.189"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d39"
  - id: k065
    cluster_id: c066
    section: "QUALITY ASSESSMENT"
    label: "Assess only what the report contains"
    directive: "Assess only what the study report actually contains, since QA examines what is reported within it; pursue missing details from authors only when needed."
    trigger: "When QA is constrained by what the study report contains."
    qualification: "Tracking authors down to elicit missing details is possible, but a good paper should include sufficient detail."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, p.189"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d40"
  - id: k066
    cluster_id: c067
    section: "QUALITY ASSESSMENT"
    label: "Discussion: name flaws and strengths"
    directive: "In the Discussion of a review's quality assessment, focus on key flaws of the included studies but also include what has been done well."
    trigger: "When writing up the Discussion of a review's quality assessment."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, p.189"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d36"
  - id: k067
    cluster_id: c068
    section: "SYNTHESIS"
    label: "Build a new whole, not a summary list"
    directive: "Aim to produce a new whole out of the parts — a new line of argument, a new theory, or a new take-home message — by juxtaposing findings from different sources and spotting patterns or themes the original authors did not recognise; present an overview of all reviewed material rather than only a small selection; in the Discussion, point out similarities and differences and offer possible explanations for inconsistencies rather than merely listing findings."
    trigger: "When carrying out any qualitative synthesis or writing the Discussion of a review."
    qualification: ""
    is_fork: false
    sources:
      - "Arksey & O'Malley 2005, Stage 5, p. 10"
      - "Booth & Sutton 2022, Ch.8, p.236"
      - "Booth & Sutton 2022, Ch.10, p.325"
    member_ids:
      - "arksey-omalley-2005-scoping-studies/whole/d20"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d04"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d06"
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d28"
  - id: k068
    cluster_id: c069
    section: "SYNTHESIS"
    label: "Balance aggregation against interpretation"
    directive: "When choosing a synthesis method, balance the need to aggregate (bring studies together) with the need to interpret (make sense of findings), and decide whether your focus is the literature as a body of work, individual studies, or themes/findings within those studies."
    trigger: "When selecting a method for qualitative synthesis."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, p.235"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d01"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d02"
  - id: k069
    cluster_id: c070
    section: "SYNTHESIS"
    label: "Track meta-method effects on findings"
    directive: "When synthesising findings across qualitative studies, look not only for patterns in collective findings but also for differences attributable to how researchers conducted the individual studies (meta-method analysis)."
    trigger: "When synthesising findings across multiple qualitative studies."
    qualification: "Differences in methods used may explain inconsistencies in findings or suggest how best to conduct such studies in future."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, p.236"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d05"
  - id: k070
    cluster_id: c071
    section: "SYNTHESIS"
    label: "Do not weight evidence in scoping studies"
    directive: "When collating and reporting results in a scoping study, present what was found without synthesising evidence, aggregating findings across studies, or presenting a view on the 'weight' of evidence for any particular intervention or policy."
    trigger: "When collating and reporting results in a scoping study."
    qualification: "Because the scoping study does not assess quality of evidence, it cannot determine whether particular studies provide robust or generalizable findings."
    is_fork: false
    sources:
      - "Arksey & O'Malley 2005, Stage 5, p. 10"
    member_ids:
      - "arksey-omalley-2005-scoping-studies/whole/d21"
  - id: k071
    cluster_id: c072
    section: "SYNTHESIS"
    label: "Plan synthesis but stay flexible"
    directive: "Plan an initial synthesis strategy before approaching the literature but switch to an appropriate alternative as patterns from the literature emerge; whichever method you use, map similarity, keep categories exclusive and non-overlapping, and create secure well-defined concepts as building blocks; if you will review the entire body of literature the order of papers does not matter, but if you sample purposively make sure your sampling frame is correctly constructed."
    trigger: "Early in the synthesis stage of a qualitative review."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, pp.242-243"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d19"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d20"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d21"
  - id: k072
    cluster_id: c073
    section: "SYNTHESIS"
    label: "Re-read original findings during synthesis"
    directive: "While extracting and interpreting qualitative findings, reread the original findings to compare emerging ideas against the concepts as originally written, looking for overlap, similarities, and contradictions; revisit data-extraction forms and data continually as new interpretations emerge, rather than deciding everything in advance."
    trigger: "When extracting and interpreting qualitative findings during synthesis."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, p.241"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d15"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d16"
  - id: k073
    cluster_id: c074
    section: "SYNTHESIS"
    label: "Actively seek disconfirming cases"
    directive: "While synthesis steers toward patterns of similarity, actively hunt for divergent, disconfirming, or negative cases — sample purposively from outside the original sampling frame, bring different perspectives into the team, and harness procedures that challenge the emerging 'orthodoxy'; pay similar attention to nuanced findings from inconsistencies or contradictions as you pay to the main line of argument; guard against premature analytic closure and against excluding evidence because it is inconvenient or extraneous to your theorising."
    trigger: "When moving from synthesis into analysis and conclusion-drawing in a qualitative review."
    qualification: "Frequently overlooked because synthesis gravitates toward commonality rather than dissonance."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, pp.244-257"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d24"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d27"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d32"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d38"
  - id: k074
    cluster_id: c075
    section: "SYNTHESIS"
    label: "Make counter-arguments to your line of argument explicit"
    directive: "After laying out a persuasive line of argument, enumerate the strongest objections to it from within the same evidence and invite the user to push back on any step where data is being shoehorned."
    trigger: "When working with the user (or as a team) on synthesis."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, p.255"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d28"
  - id: k075
    cluster_id: c076
    section: "SYNTHESIS"
    label: "Ground theories in the data"
    directive: "Keep any theories, hypotheses, patterns, themes, relationships, or conclusions grounded in the primary source data — even while exercising the creativity pattern-seeking requires — and verify each against the source data so they remain accurate and confirmable."
    trigger: "When generating or verifying theories, hypotheses, or conclusions from qualitative synthesis."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, p.255"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d29"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d31"
  - id: k076
    cluster_id: c077
    section: "SYNTHESIS"
    label: "Revise conclusions as new data lands"
    directive: "As new data is accommodated during ongoing synthesis, continually revise conclusions and conceptual models so they remain inclusive of the new data."
    trigger: "When new data is incorporated during ongoing synthesis."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, p.255"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d30"
  - id: k077
    cluster_id: c078
    section: "SYNTHESIS"
    label: "Probe representativeness and publication bias"
    directive: "When testing or confirming review findings, ask explicitly: Are any particular groups underrepresented or overrepresented? Are their characteristics misrepresented or misinterpreted? Did researchers in component studies favour particular interventions or trigger inadvertent effects via their professional identity? Use a matrix to check whether populations, age groups, or countries are under-represented; brainstorm disciplines likely to have studied the focus and compare against included studies; when authors in a field neglect to cite a particular author or school, ask whether the omission reflects ignorance, conflict, or intention, and use that observation to inform analysis."
    trigger: "When testing or confirming review findings and investigating publication or citation bias."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, pp.256-260"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d33"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d34"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d47"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d49"
  - id: k078
    cluster_id: c079
    section: "SYNTHESIS"
    label: "Weigh by quality, not vote-count"
    directive: "When weighting evidence during analysis, do not draw conclusions by vote-counting; instead, rank studies from highest to lowest quality and ask whether positive or negative aspects cluster at particular points in the ranking."
    trigger: "When weighting evidence during analysis."
    qualification: "Not all studies are equal."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, p.257"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d35"
  - id: k079
    cluster_id: c080
    section: "SYNTHESIS"
    label: "Name and explain extreme or unique findings"
    directive: "When a study reports extreme results or is the unique source of a theme, name it explicitly, propose alternative explanations for why it might differ, and either explore them in the analysis or flag them as open hypotheses; when a study does not fit where its place within a pattern would predict, record the surprise explicitly so it does not normalise, and surface it to the user as a finding worth explaining; when individual studies are genuine outliers, reconsider whether they belong in the overarching analysis or should be analysed separately."
    trigger: "When taking precautions against over-generalisation in qualitative synthesis and handling outlier studies."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, pp.257-261"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d36"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d52"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d37"
  - id: k080
    cluster_id: c081
    section: "SYNTHESIS"
    label: "If-then tests; rule out third-variable explanations"
    directive: "When testing the strength of evidence for an apparent relationship in synthesis, run an if-then test: if one condition holds, check whether a second holds; if so, you are on the way, if not, conjecture differently; after an apparent relationship survives if-then testing, rule out spurious relations by considering whether a third factor or variable explains it away."
    trigger: "When testing the strength of evidence for relationships in synthesis."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, p.257"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d39"
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d40"
  - id: k081
    cluster_id: c082
    section: "SYNTHESIS"
    label: "Validate findings on held-out or adjacent literature"
    directive: "When seeking to replicate or validate a synthesised finding, either cross-check it against an adjacent literature where the underlying mechanism should also appear, or split the sources into a generation set and a test set and check whether the finding holds in the test set."
    trigger: "When seeking to replicate or validate a synthesised finding."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, p.257"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d41"
  - id: k082
    cluster_id: c083
    section: "SYNTHESIS"
    label: "Record per-study theories and revisit at synthesis completion"
    directive: "While extracting data from each study, record any theory underpinning it; keep your mind open to alternative explanations; and revisit these theories when the synthesis is complete."
    trigger: "Throughout data extraction and at completion of synthesis."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, p.257"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d42"
  - id: k083
    cluster_id: c084
    section: "SYNTHESIS"
    label: "Stress-test theoretical saturation"
    directive: "When checking whether theoretical saturation in a qualitative review is genuine, make strenuous attempts to sample from other disciplines relevant to the review question or from other types of literature."
    trigger: "When testing whether theoretical saturation in a qualitative review is genuine."
    qualification: "Authors are incentivised to report innovative insights and are not independent informants like primary-research interviewees."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, p.258"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d45"
  - id: k084
    cluster_id: c085
    section: "SYNTHESIS"
    label: "Disclose standpoint and reflexivity"
    directive: "In the analysis and limitations of the review, acknowledge that the systematic review is 'situated, partial, and perspectival' — name the likely challenges to objectivity posed by your own preoccupations and prejudices, state explicit position and any subjective decisions in data analysis, and (for qualitative evidence synthesis) include a reflexivity statement (between half a page and a full page) prospectively in Methods describing planned handling of pre-existing biases and retrospectively in Results/Discussion describing biases that materialised; treat conflict-of-interest disclosure as covering non-financial sources of bias (professional, personal, political, academic affiliations) as well as financial ones, making them transparent rather than trying to eradicate them."
    trigger: "When writing the analysis, limitations, reflexivity, or conflict-of-interest sections of a review."
    qualification: "Systematic reviews claim objectivity but only aspire to 'disciplined subjectivity'."
    is_fork: false
    sources:
      - "Arksey & O'Malley 2005, Stage 5, p. 11"
      - "Booth & Sutton 2022, Ch.8, p.259"
      - "Booth & Sutton 2022, Ch.10, pp.319-320"
    member_ids:
