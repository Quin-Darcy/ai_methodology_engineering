  - id: k009
    cluster_id: c009
    section: "SCOPE / QUESTION DEFINITION"
    label: "Distinguish foreground from background questions"
    directive: "Separate the foreground question (the explicit review question driving systematic search) from background questions (context to be handled in introduction or discussion via review articles or targeted searches), and keep background concerns from hijacking the review."
    trigger: "When clarifying which question(s) the literature search will address."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.5, p.125"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d01"
  - id: k010
    cluster_id: c010
    section: "SCOPE / QUESTION DEFINITION"
    label: "Specify unexpected and negative outcomes too"
    directive: "When specifying outcomes during scope definition, include unexpected and negative outcomes alongside anticipated ones, since both are useful and restricting to welcome outcomes biases the review."
    trigger: "When specifying outcomes during scope definition."
    qualification: ""
    is_fork: false
    sources:
