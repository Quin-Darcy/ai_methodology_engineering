    member_ids:
      - "arksey-omalley-2005-scoping-studies/whole/d17"
  - id: k044
    cluster_id: c045
    section: "STUDY SELECTION / SCREENING"
    label: "Record exclusion reasons per stage"
    directive: "At title-and-abstract screening, record one main exclusion reason per reference (typically tied to a PICO criterion); at full-text screening, document inclusion and exclusion decisions equally rigorously and record the most immediately apparent reason for exclusion (or, to emphasise a particular criterion's impact, that criterion); in the write-up, present exclusion reasons for studies excluded at the full-text stage — typically as an appendix list — citing studies that appeared to meet inclusion criteria but were excluded, with reasons."
    trigger: "When excluding a reference at any screening stage, and when reporting study selection under PRISMA 2020."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.6, pp.160-192"
      - "Booth & Sutton 2022, Ch.10, p.325"
    member_ids:
