  - id: k012
    cluster_id: c012
    section: "SCOPE / QUESTION DEFINITION"
    label: "Combine qualitative and quantitative for complex systems"
    directive: "When reviewing a complex intervention or system, combine quantitative and qualitative data in a mixed-methods approach, since no single study type or method can provide all the required answers."
    trigger: "When reviewing a complex intervention or system."
    qualification: ""
    is_fork: false
    sources:
