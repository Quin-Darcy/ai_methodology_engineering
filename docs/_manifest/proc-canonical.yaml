      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d22"
  - id: k029
    cluster_id: c029
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Build per-concept synonym and related-term lists"
    directive: "For each concept in the framework, assemble synonym and related-term lists (e.g. include 'mortality' alongside 'life expectancy'); decide which concepts to capture by search terms (typically population/perspective and intervention) and which are easier to identify at screening; recognise some synonyms work in isolation and others only when paired or restricted to certain disciplines; account for inconsistent terminology and problematic indexing by including alternative terms used in known papers."
    trigger: "When translating a question framework (e.g. PICOS, SPICE) into a search and assembling term lists."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.5, pp.133,154"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d26"
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d27"
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d67"
  - id: k030
    cluster_id: c030
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Apply Boolean and syntax discipline"
    directive: "Use the database's advanced search features; treat database searches as title/abstract/index-field searches (not full text); apply truncation cautiously (e.g. 'nurs*' also catches 'nursery'); use wildcards for mid-word spelling variants (e.g. 'colo?r', 'wom#n'); quote phrases and check each platform's hyphen handling (search 'socioeconomic' OR 'socio-economic' when in doubt); combine synonyms with OR, different concepts with AND, and use NOT only with caution — examining at least a sample of records you have excluded; quote everyday phrases containing AND/OR/NOT (e.g. 'low- and middle-income countries') to stop them from being parsed as Boolean; use proximity/adjacency operators when a concept admits many phrasings and check each database's proximity syntax; build the strategy concept by concept (synonyms within → OR; concepts across → AND); combine population AND intervention/exposure first, add outcome terms if unmanageable, then comparison terms or limits; when a new term is found mid-search, add it and rerun excluding already-screened records via NOT (e.g. '#22 = #21 NOT #20'); check abbreviations are not ambiguous across contexts (e.g. 'DNA')."
    trigger: "When constructing free-text search terms, combining them with Boolean operators, or running searches in bibliographic databases."
    qualification: "Title screening is relatively quick — account for that when judging whether the result set is manageable."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.5, pp.126-155"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d09"
