      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d19"
  - id: k085
    cluster_id: c086
    section: "SYNTHESIS"
    label: "Theme frequency is not theme importance"
    directive: "When weighting themes across qualitative papers, do not assume that the frequency with which a theme is reported relates to its importance, since research papers (unlike people) have a vested interest in being different from one another."
    trigger: "When weighting themes by frequency across qualitative papers."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, p.260"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d48"
  - id: k086
    cluster_id: c087
    section: "SYNTHESIS"
    label: "Avoid attributing differences to a single variable"
    directive: "When identifying disconfirming or conflicting findings across studies, treat differences as potentially arising from the interaction of many variables rather than over-weighting a single preferred variable."
    trigger: "When identifying disconfirming or conflicting findings across studies."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, p.260"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d50"
  - id: k087
    cluster_id: c088
    section: "SYNTHESIS"
    label: "Document and surface synthesis 'hunches'"
    directive: "Document each intuitive leap and assumption behind a synthesis step so you can retrace them, and surface the load-bearing premises to the user for confirmation rather than burying them in the conclusion."
    trigger: "When working through the synthesis, especially when intuitive leaps occur."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, p.261"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d53"
  - id: k088
    cluster_id: c089
    section: "SYNTHESIS"
    label: "Hold reasoning when disagreement is groundless; propose resolving research"
    directive: "When stakeholders or others disagree with your synthesised interpretation, do not automatically assume your reasoning is wrong; if conflicting evidence or viewpoints persist, propose specific research that would resolve the issue."
    trigger: "When stakeholders or other parties disagree with your synthesised interpretation."
    qualification: "Your synthesised insights extend beyond those of any individual researcher immersed in a single context."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.8, p.261"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d54"
  - id: k089
    cluster_id: c090
    section: "REPORTING / WRITE-UP"
    label: "Report numerically and thematically with a consistent template"
    directive: "Present scoping-study findings in two ways: first, a basic numerical analysis of the extent, nature, and distribution of studies (with tables and charts mapping geography, recipient groups, interventions, methods, and effectiveness measures); second, a thematic organisation of the literature; develop a consistent reporting template and apply it to each thematic group so cross-category comparisons, contradictions, and gaps surface systematically."
    trigger: "When reporting the results of a scoping study."
    qualification: ""
    is_fork: false
    sources:
      - "Arksey & O'Malley 2005, Stage 5, pp. 10-11"
    member_ids:
      - "arksey-omalley-2005-scoping-studies/whole/d22"
      - "arksey-omalley-2005-scoping-studies/whole/d24"
  - id: k090
    cluster_id: c091
    section: "REPORTING / WRITE-UP"
    label: "Specify research recommendations concretely"
    directive: "When writing recommendations for future research, replace any 'more research is needed' phrasing with a specific description of the type of research and the exact questions to be addressed — name the missing theoretical framework, the under-researched population, the absent outcome measure, the un-investigated intervention adjustment, or the suggested research design — and frame remaining questions concretely in 1:3:25 or analogous decision-maker reports; act as an honest broker rather than a beneficiary of future commissioned research, and picture where finite funds are best targeted instead of generating an endless priority list."
    trigger: "When writing recommendations for future research at the end of a review or decision-maker report."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, pp.310-336"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d02"
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d04"
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d39"
  - id: k091
    cluster_id: c092
    section: "REPORTING / WRITE-UP"
    label: "Practice recommendations: consult an applicability checklist"
    directive: "When the review has identified methods or interventions you want to highlight for use in practice, consult an applicability or transferability checklist (e.g. FITAR or TRANSFER) and consider context explicitly rather than assuming findings transfer from the study population to the target population."
    trigger: "When the review highlights methods or interventions for potential use in practice."
    qualification: "Practitioner-researchers may already know the target context; external researchers may need to engage stakeholders and a steering group."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, p.310"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d03"
  - id: k092
    cluster_id: c093
    section: "REPORTING / WRITE-UP"
    label: "Name the review's contribution type"
    directive: "When framing the rationale and intended contribution of an evidence synthesis, state explicitly which of the four contributions — theory testing/validation, theory generation, problem solving, or fact finding — the review is making; also consider whether a contribution outside these four headings applies."
    trigger: "When framing the rationale and intended contribution of an evidence synthesis."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, p.312"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d05"
  - id: k093
    cluster_id: c094
    section: "REPORTING / WRITE-UP"
    label: "Explain divergence from prior reviews"
    directive: "When multiple reviews on the same or closely related topic yield different conclusions, identify and explain the differences rather than try to eliminate them."
    trigger: "When comparing your review with prior reviews on the same topic."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, p.313"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d08"
  - id: k094
    cluster_id: c095
    section: "REPORTING / WRITE-UP"
    label: "Match tone to the audience's behaviour-change goal"
    directive: "When framing the discussion and recommendations of a review for a specific audience, adapt the tone to the audience's current beliefs and the behavioural change you want — start-starting, start-stopping, stop-stopping, stop-starting, or start-thinking."
    trigger: "When framing the discussion and recommendations of a review for a specific audience."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, p.314"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d10"
  - id: k095
    cluster_id: c096
    section: "REPORTING / WRITE-UP"
    label: "Test draft against three audience questions"
    directive: "When checking a draft review for a specific primary audience, test it against three audience questions: 'do I understand it, do I believe it, do I care?'"
    trigger: "When checking a draft review for a specific primary audience."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, p.315"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d11"
  - id: k096
    cluster_id: c097
    section: "REPORTING / WRITE-UP"
    label: "Pick audience-specific reporting format"
    directive: "Choose the report's structure to fit the primary audience: for research funders, summarise the review as two boxes of bullet points — 'what is already known' and 'what this review adds' — and let that structure shape the conclusions; for policy-makers and decision-makers, address external validity explicitly (state limitations on applying results to their context), write for decision support (provide answers or direction) preferring an actionable answer drawn from lower-level evidence to a non-actionable 'robust studies cannot answer' conclusion, prefer a holistic picture over a single tightly focused lens, and consider a graded-entry format such as 1:3:25 (1 page take-home, 3 pages executive summary, 25 pages full review) instead of IMRAD; for the public, define the review product by how it is more useful as a result of the methods rather than by claiming the methods are technically superior, and focus visual communication on the people whose lives will be changed by your findings (not on PRISMA flowcharts); when writing a 1:3:25 'main messages' page, balance practical importance against not going beyond what the review contains, and structure the executive summary with the most meaningful content at the top; choose dissemination tools (infographics vs critical-appraisal formats) to fit the specific audience's preferences."
    trigger: "When choosing the report structure or dissemination format and the primary audience is non-academic."
    qualification: "Some authors argue IMRAD may impair decision-making; individuals differ in preferred formats by age, education, personality, and learning preferences."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, pp.316-335"
    member_ids:
