  - id: k097
    cluster_id: c098
    section: "REPORTING / WRITE-UP"
    label: "Include study type in the title"
    directive: "When titling any systematic review, meta-analysis, rapid evidence assessment, meta-ethnography, or related review type, include the study type — typically as a subtitle following a colon, e.g. ': a systematic review' or ': a systematic review and meta-analysis' — so retrieval, indexing, and reader expectations align."
    trigger: "When titling any systematic review or related review type."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, p.323"
    member_ids:
