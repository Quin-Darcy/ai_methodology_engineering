  - id: k006
    cluster_id: c006
    section: "SCOPE / QUESTION DEFINITION"
    label: "Use mapping and logic models to characterise scope"
    directive: "Use descriptive mapping, data/text mining, concept mapping (mind-mapping/idea webbing), and logic models to characterise the available literature, refine scope, and choose an appropriate review method; for visually-minded reviewers especially, draw a concept map and populate it with candidate search terms before the scoping search; when key concepts lack clarity in the literature, conduct a concept analysis; beware selection bias when a topic's literature exceeds what you can review."
    trigger: "When refining a review scope and selecting a review method, particularly for complex interventions or wide-ranging questions with varied terminology."
    qualification: "Descriptive mapping may use existing keyword sets (e.g., EPPI-Centre) or bespoke ones."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.4, pp.93-111"
      - "Booth & Sutton 2022, Ch.5, p.126"
    member_ids:
