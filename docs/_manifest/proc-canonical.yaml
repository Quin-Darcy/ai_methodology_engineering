  - id: k025
    cluster_id: c025
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Follow the eight-stage search process"
    directive: "When identifying evidence systematically for a literature review, work through the eight key stages: deciding who searches; aims and purpose; preparation (scoping); search strategy; bibliographic database searching; supplementary searching; managing references; reporting the search."
    trigger: "When identifying evidence systematically for a literature review."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.5, p.126"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d03"
  - id: k026
    cluster_id: c026
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Declare aim and eligible evidence types up front"
    directive: "Establish at the outset whether the aim is a comprehensive survey or a selective sampling approach, state clearly what types of evidence are eligible, and — for iterative review types (qualitative evidence synthesis, realist synthesis) — state up front how emerging sub-topics will be handled."
    trigger: "When establishing the aims and purpose of the literature search."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.5, p.126"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d05"
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d06"
  - id: k027
    cluster_id: c027
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Tune sensitivity vs specificity to review type"
    directive: "Balance sensitivity (retrieving all relevant results) against specificity (minimising unwanted results to screen) according to review type and required comprehensiveness; for qualitative evidence syntheses that reach theoretical saturation, redirect remaining search time to additional purposive searches for under-represented disciplines, perspectives, or elusive publication types rather than more of the same; for scoping searches, concentrate on specific (high-precision) terms aiming for sufficient sensitivity to estimate the literature's size and identify key papers."
    trigger: "When designing or refining a search strategy."
    qualification: "The right balance depends on review type and comprehensiveness requirements."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.5, pp.125,128,132"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d02"
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d19"
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d23"
  - id: k028
    cluster_id: c028
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Run a scoping search before the main search"
    directive: "Before fixing the main search, run initial searches of bibliographic databases (and a selection of grey-literature sources) to gauge where research gaps lie and whether a new review is needed; for multidisciplinary topics, sample purposively across diverse disciplines in the scoping search; when scoping returns large citation volumes, use text-mining/machine-learning tools (e.g. Rayyan, Abstrackr, EPPI-Reviewer Web) to rank by likely relevance and estimate how many more results are worth screening manually."
    trigger: "When evaluating whether a new review is warranted and preparing the main search."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.4, pp.106,109"
      - "Booth & Sutton 2022, Ch.5, pp.129,132"
    member_ids:
