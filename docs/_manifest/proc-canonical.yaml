  - id: k005
    cluster_id: c005
    section: "SCOPE / QUESTION DEFINITION"
    label: "Shape question to named audience"
    directive: "When defining scope, ask the user to name the intended primary audience, surface what that audience would most need answered, and test the candidate question against those needs; when findings will likely inform practice or policy, recommend specific expert categories for input; when commercial/community/professional stakes are high, recommend stakeholder involvement without letting any single party dictate findings; generate stakeholder- and colleague-style critiques (clinician, policy-maker, methodologist, target user) of the candidate question before fixing it; for rapid reviews aimed at practice/policy, propose a telescoped outcome list ordered by relevance and ask the user to confirm priorities."
    trigger: "When defining a review scope where audience or stakeholder needs matter."
    qualification: "No review has a single audience; prioritise the primary audience without overly compromising secondary needs. Stakeholder involvement does not mean any individual dictates the findings."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.4, pp.97-102"
      - "Booth & Sutton 2022, Ch.10, pp.310-314"
    member_ids:
