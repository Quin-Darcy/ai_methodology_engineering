  - id: k031
    cluster_id: c031
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Use controlled-vocabulary / thesaurus searching"
    directive: "When a database offers a controlled vocabulary, use thesaurus (subject-heading) searching for higher specificity than abstract-only searching, exploit heading hierarchies for broader/narrower terms, check the scope note when uncertain whether a heading is relevant, and — for systematic searching — search databases one at a time even when they share a platform, since subject headings vary across databases."
    trigger: "When searching a database that offers a controlled vocabulary or thesaurus."
    qualification: "Subject-heading schemes evolve; check scope notes for newer or shifting terms."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.5, p.136"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d39"
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d40"
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d41"
  - id: k032
    cluster_id: c032
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Justify and document each search limit"
    directive: "Make explicit decisions about coverage limits (time span, language, indexing fields) before searching; choose a date limit with a methodological, practice, or policy justification (e.g. date of last review, policy change, major report) rather than arbitrary 5/10-year windows; weigh date restrictions against topic-specific consequences (dropping older studies may shift meta-analysis bottom lines; keeping older qualitative studies may introduce stale context); consider bias risk for language limits, and treat English-only as inappropriate for global/multi-country reviews unless translation resources are limited; apply indexing-based limits only for targeted specificity-maximising searches, not where sensitivity is critical, since indexing can be inaccurate or incomplete; record the reason for each limit decision and acknowledge in the Discussion that limits may cause relevant papers to be missed."
    trigger: "When applying any search limits or shortcuts."
    qualification: "Limits may be necessary for practical reasons (time, budget, translation costs); document trade-offs."
    is_fork: false
    sources:
      - "Arksey & O'Malley 2005, Stage 2, pp. 6-7"
      - "Booth & Sutton 2022, Ch.5, pp.134-138"
    member_ids:
      - "arksey-omalley-2005-scoping-studies/whole/d07"
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d30"
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d31"
