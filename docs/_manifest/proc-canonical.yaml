  - id: k099
    cluster_id: c100
    section: "REPORTING / WRITE-UP"
    label: "Acknowledge controversy even-handedly"
    directive: "If genuine controversy exists in the topic — for example significant variations in practice — acknowledge it in the Introduction and characterise both sides as even-handedly as possible."
    trigger: "When writing the Introduction of a review whose topic involves genuine controversy."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.10, p.323"
    member_ids:
