  - id: k004
    cluster_id: c004
    section: "SCOPE / QUESTION DEFINITION"
    label: "Check existing reviews and registers first"
    directive: "Before committing to a review, run a scoping search whose objectives include surveying PROSPERO and other study registers (not only published reviews) to identify existing or ongoing reviews; if another team is already working on a closely related topic, surface the overlap to the user and recommend collaboration or pivot to a unique adjacent sub-topic."
    trigger: "When checking whether to proceed with a review on a given topic."
    qualification: "Scoping searches typically do not aim to be fully comprehensive; their other objectives include gauging literature scale and identifying key publications (pearl growing)."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.4, p.97"
      - "Booth & Sutton 2022, Ch.5, p.129"
    member_ids:
