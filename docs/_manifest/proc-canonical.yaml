      - "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d54"
  - id: k008
    cluster_id: c008
    section: "SCOPE / QUESTION DEFINITION"
    label: "Describe complex interventions via TIDieR and process evaluations"
    directive: "Describe the intervention of interest as precisely as possible using TIDieR (12 items) or TIDieR-Lite (by whom, what, where, intensity, how often), and run targeted scoping searches to learn how the intervention is described in the literature; when included studies lack detail, redirect scoping searches toward process evaluations and flag relevant authors the user could contact."
    trigger: "When defining a review question that involves a specific intervention, especially a complex one."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.4, p.103"
    member_ids:
