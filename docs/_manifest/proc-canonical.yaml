  - id: k002
    cluster_id: c002
    section: "SCOPE / QUESTION DEFINITION"
    label: "Pick framework matched to question type"
    directive: "Structure the review question via an established framework — PICOS for intervention questions (substitute Exposure for Intervention when no planned response), SPIDER or SPICE for qualitative questions, CIMO for management or realist syntheses, PerSPE(c)TiF for complex interventions — and use the framework to shape search, inclusion/exclusion, and data extraction; state the chosen framework in the Introduction."
    trigger: "When formulating a structured review question (specific framework follows question type)."
    qualification: "Frameworks may retrieve too many (sensitivity) or too few (specificity) results; not all frameworks are suitable for fully comprehensive reviews, so often searching 2–3 essential facets is sufficient."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.4, pp.97-100"
