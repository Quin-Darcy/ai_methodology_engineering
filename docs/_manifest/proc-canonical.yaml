      - "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d51"
  - id: k018
    cluster_id: c018
    section: "PROTOCOL / PLANNING / DOCUMENTATION"
    label: "Re-anchor to original scope and question throughout"
    directive: "At each major stage of the review — especially while searching and at the analysis stage — refer back to the original protocol and question to confirm you are answering what was identified, and stop drift from question-driven to literature-driven work."
    trigger: "Throughout the review process, especially during searching and analysis."
    qualification: "By analysis stage you have been so engaged with the literature that drift is likely."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.4, p.116"
      - "Booth & Sutton 2022, Ch.8, p.265"
    member_ids:
