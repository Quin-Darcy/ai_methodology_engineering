  - id: k014
    cluster_id: c014
    section: "SCOPE / QUESTION DEFINITION"
    label: "Systematise selected stages when full SR is infeasible"
    directive: "If a full Systematic Review is not realistic, systematise specific stages of the process where resources allow and where doing so strengthens credibility (e.g. conduct a wide-ranging search but skip formal quality assessment), and state which stages were systematised."
    trigger: "When full systematic review is not feasible for the topic and resources."
    qualification: ""
    is_fork: false
    sources:
