  - id: k022
    cluster_id: c022
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Pilot one database, then propagate"
    directive: "Pilot the search strategy on one database (e.g. MEDLINE) and refine it in light of early results before converting it for each subsequent database; supplement piloting with pearl growing — examine titles, abstracts, and indexing of a small set of known key papers to harvest useful search terms and identify similar material — and follow reference lists for key authors."
    trigger: "When developing the electronic-database search strategy from scoping results."
    qualification: ""
    is_fork: false
    sources:
      - "Arksey & O'Malley 2005, Stage 2, p. 7"
      - "Booth & Sutton 2022, Ch.5, p.132"
    member_ids:
