  - id: k040
    cluster_id: c040
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Target review-only databases for highest-level evidence"
    directive: "When prioritising high-level evidence early in a review, search specialist databases of reviews or apply review-type search filters/publication-type limits to identify the highest-level evidence first."
    trigger: "When prioritising high-level evidence early in a review."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.4, p.97"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d14"
  - id: k041
    cluster_id: c042
    section: "STUDY SELECTION / SCREENING"
    label: "Develop and apply explicit inclusion/exclusion criteria"
    directive: "Develop inclusion and exclusion criteria — a priori for systematic reviews, post hoc (based on growing familiarity with the literature) for scoping studies — then apply them transparently to every potentially relevant study: check each criterion in turn, and exclude any study that fails an inclusion criterion or meets an exclusion criterion; be systematic so relevant studies are not missed and irrelevant ones not included."
    trigger: "When selecting studies from a literature-search result list."
    qualification: "Justified as a way to reduce selection bias; scoping-study practice of post-hoc criteria reflects the iterative, breadth-seeking character of the search."
    is_fork: false
    sources:
      - "Arksey & O'Malley 2005, Stage 3, pp. 8-9"
      - "Booth & Sutton 2022, Ch.6, pp.160,191"
    member_ids:
      - "arksey-omalley-2005-scoping-studies/whole/d14"
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d01"
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d02"
      - "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d44"
  - id: k042
    cluster_id: c043
    section: "STUDY SELECTION / SCREENING"
    label: "Order full text when abstract is ambiguous"
    directive: "When screening references, examine titles first and move to abstracts only for studies whose relevance the title cannot settle; when the abstract is ambiguous, order the full article rather than decide from the abstract alone."
    trigger: "When screening citations whose abstracts are ambiguous about relevance."
    qualification: "Where time is at a premium, reviewers often combine title and abstract screening."
    is_fork: false
    sources:
      - "Arksey & O'Malley 2005, Stage 3, p. 9"
