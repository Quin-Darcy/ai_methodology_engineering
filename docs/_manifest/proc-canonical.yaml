  - id: k003
    cluster_id: c003
    section: "SCOPE / QUESTION DEFINITION"
    label: "Keep parameters wide, tighten after scoping"
    directive: "Begin with wide definitions and include all study designs; run a scoping search first to gauge volume and nature of the literature; tighten parameters only after the field's size and shape are known, before writing the protocol."
    trigger: "When defining the parameters of a review at the outset."
    qualification: "Wide definitions reduce missed-article risk but can generate unmanageably large reference sets; scoping searches are less exhaustive than full systematic searches; the process is iterative, not linear."
    is_fork: false
    sources:
      - "Arksey & O'Malley 2005, Framework overview & Stage 1, pp. 5-6"
      - "Booth & Sutton 2022, Ch.4, p.95"
