  - id: k021
    cluster_id: c021
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Combine databases with supplementary searches"
    directive: "Draw on multiple source types — bibliographic databases (broad multidisciplinary plus topic-specific), reference lists of included studies (especially systematic and traditional reviews) checked until saturation, citation searching (forward-tracking on Scopus, Web of Science, or Google Scholar 'cited by' — most useful for papers >=5 years old cited within their own discipline for findings), tables of contents of key journals, known-author searches when names are uncommon, grey-literature targeted strategy with direct visits to organisational websites and records kept, and known authoritative organizations and expert networks — rather than relying on databases alone; flag any source type you cannot access so the user can supplement; prioritise high-yield or high-risk supplementary sources given time costs; when reference-list checking reveals papers your search missed, investigate why (indexing? omitted term?) and run targeted searches if the omission would have changed the review."
    trigger: "At the identifying-relevant-studies stage and when supplementing the main bibliographic database search."
    qualification: "Continue reference-checking until saturation (no new references); author searches without other terms only work when names are uncommon."
    is_fork: false
    sources:
      - "Arksey & O'Malley 2005, Stage 2, pp. 6-8"
      - "Booth & Sutton 2022, Ch.5, pp.126-140"
    member_ids:
