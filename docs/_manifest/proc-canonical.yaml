      - "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d55"
  - id: k019
    cluster_id: c019
    section: "PROTOCOL / PLANNING / DOCUMENTATION"
    label: "Keep a process audit trail"
    directive: "Document every stage of the review — search-strategy decisions, sources used, supplementary methods, inclusion/exclusion decisions with reasons per study and per screening stage — in sufficient detail that the study could be replicated by others; when writing up, devote a section to how you decided on the question's conceptualisation, choice of sources, and supplementary methods, and include an example search string; demonstrate transparency by showing procedures were actually followed, not just by name-checking a methods source."
    trigger: "Throughout the conduct of any systematic approach to the literature."
    qualification: "Anticipating and forestalling potential criticisms is better than relying on the audit trail to defend findings after the fact."
    is_fork: false
    sources:
      - "Arksey & O'Malley 2005, Framework overview, p. 5"
      - "Booth & Sutton 2022, Ch.5, pp.133,141,154"
