  - id: k007
    cluster_id: c007
    section: "SCOPE / QUESTION DEFINITION"
    label: "Lump or split to fit available capacity"
    directive: "Decide whether to lump or split review questions according to what is manageable within time and resources; if the literature exceeds what you can realistically review, either narrow focus (more specific intervention/population) or restrict evidence type (date, study type, geography); if the question is really four or five sub-questions, prioritise them (a logic model helps); if a scoping search returns nothing, expand one concept at a time so you can gauge each expansion's impact, or relax inclusion criteria."
    trigger: "When the topic contains multiple candidate questions, returns more literature than is manageable, or returns nothing."
    qualification: "Record all decisions; consider text/data mining for screening assistance; adjust scope early rather than late since defining the question is iterative."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.4, pp.102-122"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d29"
      - "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d52"
