  - id: k098
    cluster_id: c099
    section: "REPORTING / WRITE-UP"
    label: "Write the abstract last and reveal findings"
    directive: "Write the abstract last so it reflects the final review, and state findings briefly rather than promising that the review 'goes on to describe findings of critical importance'."
    trigger: "When drafting the abstract of a review."
    qualification: ""
    is_fork: false
    sources:
