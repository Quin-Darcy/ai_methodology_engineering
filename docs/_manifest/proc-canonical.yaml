      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d24"
  - id: k023
    cluster_id: c023
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Engage or escalate to a search specialist"
    directive: "When designing sensitive or systematic searches, recommend that the user involve an experienced information specialist/librarian from project outset (planning, protocol, search development, write-up advice), name them as applicant and co-author where applicable, and maintain ongoing communication between searcher and review team; if the user is proceeding without one, draft the search strategy explicitly, flag it for expert review, consider the PRESS (Peer Review of Electronic Search Strategies) checklist, and — where prior subject knowledge is thin or the review is a realist review — recruit expert advisors to suggest starter papers and verify search terms."
    trigger: "When designing electronic-database searches for a scoping study or systematic review."
    qualification: "If the user is a student or lone researcher, they will probably need to run the searches themselves but should still obtain librarian advice; PRESS may be infeasible for student dissertations."
    is_fork: false
    sources:
