    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d55"
  - id: k038
    cluster_id: c038
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Omit outcome terms from PICO(S) effectiveness searches"
    directive: "When supporting a systematic review of intervention effectiveness based on PICO(S), focus the search on population, intervention, and study type; omit outcome terms because including them significantly reduces sensitivity and risks missing relevant studies."
    trigger: "When translating a PICO(S) effectiveness-review question into a search strategy."
    qualification: ""
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.5, p.146"
    member_ids:
      - "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d61"
  - id: k039
    cluster_id: c039
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Tier evidence stepwise in rapid reviews"
    directive: "For a rapid review, take a stepwise approach to evidence: first assess how far existing systematic reviews can answer the question, then move to higher-quality designs for primary studies."
    trigger: "When including evidence in a rapid review."
    qualification: "Specific to rapid reviews."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.4, p.97"
    member_ids:
