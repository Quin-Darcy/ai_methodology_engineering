  - id: k016
    cluster_id: c016
    section: "PROTOCOL / PLANNING / DOCUMENTATION"
    label: "Write a PRISMA-P-style protocol up front"
    directive: "Once scope is defined and before the main search begins, write a review protocol following PRISMA-P that lays out: administrative information; introduction (rationale, objectives); methods for identifying evidence, selecting studies, extracting data, and assessing risk of bias; approach to data synthesis and to evaluating strength of evidence; sources to be searched and at what stage(s); supplementary methods; study-selection method (including who selects, how disagreements resolve, and the title/abstract/full-text sift process); data extraction plan (existing form to adapt or new form to design); and a timeline; record all scoping-stage decisions a priori; for rapid reviews, prompt the user to confirm protocol sign-off by commissioner and deposit in PROSPERO or OSF before search begins."
    trigger: "When the review scope has been defined and before the main search begins."
    qualification: "If working alone on study selection, record that fact."
    is_fork: false
    sources:
      - "Booth & Sutton 2022, Ch.4, pp.93-120"
      - "Booth & Sutton 2022, Ch.5, pp.126,134"
