component: proc
cluster_count: 188
directive_count: 430
clusters:
  - id: c001
    section: "SCOPE / QUESTION DEFINITION"
    label: "Begin with answerable, scope-bounded research question"
    note: "variants: same protocol — start a review by stating an explicit, answerable research question and bounding the scope, with framework support"
    fork_hint: false
    members:
      - id: "arksey-omalley-2005-scoping-studies/whole/d04"
        source: "Arksey & O'Malley 2005, Stage 1, p. 6"
        decision: keep
        directive: "Begin by identifying the research question, and consider explicitly which 'facets' of it (e.g. study population, interventions, outcomes) are particularly important, since this guides how search strategies are built."
        trigger: "At Stage 1 (identifying the research question) of a scoping study."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d01"
        source: "Booth & Sutton 2022, Ch.4, p.93"
        decision: keep
        directive: "Begin a review with an answerable research question, and consider using a framework to structure and define the key concepts of your research."
        trigger: "When starting to define the scope of a literature review."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d02"
        source: "Booth & Sutton 2022, Ch.4, p.93"
        decision: keep
        directive: "Set out the aims of your research at the outset of the review."
        trigger: "When planning a review."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d03"
        source: "Booth & Sutton 2022, Ch.4, p.93"
        decision: keep
        directive: "Be clear about what is and what is not within the scope of your review."
        trigger: "When defining review scope, to support literature searching and study selection."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d06"
        source: "Booth & Sutton 2022, Ch.4, p.94"
        decision: keep
        directive: "Decide three related things when starting: on what specific aspect of the topic to focus, what topics and evidence types to include and exclude, and what type of review to conduct."
        trigger: "When beginning to plan a review."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d07"
        source: "Booth & Sutton 2022, Ch.4, p.94"
        decision: keep
        directive: "Set objectives that are specific, measurable, achievable, realistic and time-limited (SMART), rather than vague and aspirational."
        trigger: "When planning a review and setting objectives."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d08"
        source: "Booth & Sutton 2022, Ch.4, p.94"
        decision: keep
        directive: "Make clear to your audience what you have covered as well as what you chose to omit (and why)."
        trigger: "When reporting a review so the audience can be confident the stated question has been answered."
        qualification: ""
  - id: c002
    section: "SCOPE / QUESTION DEFINITION"
    label: "Question-framework selection (PICO, SPIDER, CIMO, etc.)"
    note: "variants: same protocol of structuring the review question via an established framework, with method-appropriate variant selection; recognise framework limits for fully comprehensive reviews"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d18"
        source: "Booth & Sutton 2022, Ch.4, p.97"
        decision: keep
        directive: "Identify the key concepts of your scope using a question framework (e.g., PICOS: Population, Intervention, Comparator, Outcome, Study type)."
        trigger: "When deciding the scope of a review."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d19"
        source: "Booth & Sutton 2022, Ch.4, p.98"
        decision: keep
        directive: "If your topic does not relate to an intervention (a planned response), replace Intervention with Exposure (an unintentional occurrence) in the PICOS framework."
        trigger: "When applying PICOS to a non-intervention topic."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d22"
        source: "Booth & Sutton 2022, Ch.4, p.99"
        decision: keep
        directive: "For qualitative questions, prefer SPIDER (Sample–Phenomenon of Interest–Design–Evaluation–Research type) or SPICE (Setting–Perspective–Intervention/Interest–Comparison–Evaluation) rather than PICOS."
        trigger: "When framing a qualitative review question."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d23"
        source: "Booth & Sutton 2022, Ch.4, p.99"
        decision: keep
        directive: "For management or realist synthesis questions, consider CIMO (Context–Intervention–Mechanisms–Outcomes) as an alternative to PICO."
        trigger: "When framing a management or realist synthesis question."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d24"
        source: "Booth & Sutton 2022, Ch.4, p.99"
        decision: keep
        directive: "Recognise that not all frameworks are suitable for fully comprehensive reviews; often it is sufficient to search for 2–3 of the most important concepts or facets."
        trigger: "When translating a conceptual framework into a practical search strategy."
        qualification: "Frameworks may retrieve too many (sensitivity/recall) or too few (specificity) results."
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d25"
        source: "Booth & Sutton 2022, Ch.4, pp.99–100"
        decision: keep
        directive: "For complex interventions, consider using the PerSPE(c)TiF question structure (Perspective–Setting–Phenomenon of interest–Environment–comparison–Timing–Findings) to elicit relevant elements."
        trigger: "When defining the scope for a complex-intervention review."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d07"
        source: "Booth & Sutton 2022, Ch.8, p.239"
        decision: keep
        directive: "Structure your review question (using PICO, SPICE, SPIDER, PerSPE(c)TiF, or another framework) to shape the subsequent search, inclusion/exclusion and data extraction processes."
        trigger: "When formulating the question for a qualitative synthesis."
        qualification: "Regardless of the framework used."
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d23"
        source: "Booth & Sutton 2022, ch. 10, p. 323"
        decision: keep
        directive: "Use a structured statement of the review question in the Introduction, employing PICOS, SPICE, PICOC or some equivalent framework."
        trigger: "When writing the Introduction of a systematic review."
        qualification: "''"
  - id: c003
    section: "SCOPE / QUESTION DEFINITION"
    label: "Wide-then-narrow scoping with deferred parameters"
    note: "variants: keep parameters wide initially, gain feel for the literature, then tighten; include all study designs initially"
    fork_hint: false
    members:
      - id: "arksey-omalley-2005-scoping-studies/whole/d02"
        source: "Arksey & O'Malley 2005, Framework overview, p. 5"
        decision: keep
        directive: "Identify all relevant literature regardless of study design, rather than restricting the search to particular study designs as in a systematic review."
        trigger: "When identifying literature for a scoping study."
        qualification: ""
      - id: "arksey-omalley-2005-scoping-studies/whole/d03"
        source: "Arksey & O'Malley 2005, Framework overview, p. 5"
        decision: keep
        directive: "Do not place strict limitations on search terms, identification of relevant studies, or study selection at the outset; treat the process as iterative rather than linear and repeat steps reflexively as familiarity with the literature grows."
        trigger: "When designing the search and selection process for a scoping study."
        qualification: ""
      - id: "arksey-omalley-2005-scoping-studies/whole/d05"
        source: "Arksey & O'Malley 2005, Stage 1, p. 6"
        decision: keep
        directive: "Maintain a wide approach to definitions in order to generate breadth of coverage, and defer decisions about how to set parameters on the reference set until some sense of the volume and general scope of the field has been gained."
        trigger: "When defining the parameters of a scoping study at the outset."
        qualification: "Wide definitions reduce the likelihood of missing relevant articles but can generate an unmanageably large number of references; parameters can be tightened later once volume is known."
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d09"
        source: "Booth & Sutton 2022, Ch.4, p.95"
        decision: keep
        directive: "Define your scope after an initial estimate of the size and nature of the relevant literature, based on a scoping search."
        trigger: "When fixing the scope of a review."
        qualification: "Typically; scoping search is less exhaustive than a full systematic search."
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d10"
        source: "Booth & Sutton 2022, Ch.4, p.95"
        decision: keep
        directive: "Scope your topic properly before writing your protocol, so you have an approximate idea of how much literature and what previous reviews exist on similar topics, and can target a unique 'niche'."
        trigger: "Before writing the review protocol."
        qualification: ""
  - id: c004
    section: "SCOPE / QUESTION DEFINITION"
    label: "Avoid duplicating existing reviews"
    note: "variants: check existing reviews and registers before launching"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d11"
        source: "Booth & Sutton 2022, Ch.4, p.97"
        decision: keep
        directive: "Check for existing reviews on the topic, including PROSPERO or other study registers for protocols of ongoing reviews, to make sure you are not duplicating effort."
        trigger: "When checking whether to proceed with a review on a given topic."
        qualification: "Do not just look at published reviews; also check registers of ongoing protocols."
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d12"
        source: "Booth & Sutton 2022, Ch.4, p.97"
        decision: adapt
        directive: "When a scoping check surfaces another group working on a closely related review, surface this overlap to the user and recommend either reaching out for collaboration or pivoting to a unique but related sub-topic."
        trigger: "When a scoping check reveals another team is planning a closely related review."
        qualification: ""
        original_directive: "If another group is planning a review in a closely related topic, contact them with a view to possible collaboration; if you are a student, consider moving to a unique but related topic."
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d20"
        source: "Booth & Sutton 2022, Ch.5, p.129"
        decision: keep
        directive: "Start with a scoping search whose three objectives are: identify any existing reviews around the topic (to avoid duplicating work); assess the nature and scale of the literature (to ensure feasibility); and identify key publications to familiarise yourself with the topic and inform subsequent searches (pearl growing)."
        trigger: "When preparing for a literature review."
        qualification: "Scoping searches typically do not aim to be fully comprehensive."
  - id: c005
    section: "SCOPE / QUESTION DEFINITION"
    label: "Audience-driven scope and framing"
    note: "variants: shape question and presentation to the intended audience(s)"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d15"
        source: "Booth & Sutton 2022, Ch.4, p.97"
        decision: adapt
        directive: "When defining a review scope, prompt the user to name the intended audience and surface what that audience would most need answered, then test the candidate question against those needs."
        trigger: "When defining a review scope, especially where audience needs matter."
        qualification: ""
        original_directive: "Consider your review audience when defining the scope; consult key people with an interest in, or affected by, the review to confirm your question is appropriate."
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d16"
        source: "Booth & Sutton 2022, Ch.4, p.97"
        decision: adapt
        directive: "When a review's findings will likely inform professional practice or policy, flag the need for expert consultation to the user and recommend specific expert categories whose input would strengthen the question."
        trigger: "When review findings will likely influence practice or policy."
        qualification: ""
        original_directive: "If your review findings are likely to inform professional practice or to enable decision-makers to change policy, contact experts for their input."
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d17"
        source: "Booth & Sutton 2022, Ch.4, p.97"
        decision: adapt
        directive: "Where commercial, community or professional interest in the findings is identified, recommend stakeholder involvement to the user and help draft the review question to incorporate stakeholder concerns without letting any single party dictate findings."
        trigger: "When strong external interest exists in the review's findings."
        qualification: "Stakeholder involvement does not mean individuals dictate the findings."
        original_directive: "Where you identify strong commercial, community or professional interest in your findings, involve key opinion leaders or stakeholders from the outset and jointly devise the review question."
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d26"
        source: "Booth & Sutton 2022, Ch.4, p.101"
        decision: adapt
        directive: "When framing a review question, generate stakeholder- and colleague-style critiques of the candidate question (clinician, policy-maker, methodologist, target user) and test the question against each before fixing it."
        trigger: "When framing a review question (including for complex interventions)."
        qualification: ""
        original_directive: "Let your review question be guided by what you or your target audience need to know, and discuss the question widely with colleagues or stakeholders to ensure it addresses their needs."
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d28"
        source: "Booth & Sutton 2022, Ch.4, p.102"
        decision: adapt
        directive: "For a rapid review aimed at practice and policy, propose a telescoped outcome list ordered by relevance to professionals, policy-makers and the public, and prompt the user to confirm priorities (or to consult stakeholders for confirmation)."
        trigger: "When choosing outcomes for a rapid review aimed at practice and policy."
        qualification: "Telescope the outcome list because of rapid-review time and resource limits."
        original_directive: "For a rapid review intended to influence practice and policy, select outcomes that are relevant to professionals, policy-makers and the public, and involve stakeholders in prioritising outcomes."
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d01"
        source: "Booth & Sutton 2022, ch. 10, p. 310"
        decision: keep
        directive: "Identify the primary audience for your review and let that audience shape subsequent decisions about how to present the synthesis."
        trigger: "When writing up and presenting a systematic review or other systematic approach to the literature."
        qualification: "No review product has a single target audience; you should prioritise the primary audience without compromising too much on the needs of secondary audiences (p. 313–314)."
  - id: c006
    section: "SCOPE / QUESTION DEFINITION"
    label: "Concept-mapping and logic-model scoping"
    note: "variants: use mapping/logic-model/concept-analysis techniques to characterise scope"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d05"
        source: "Booth & Sutton 2022, Ch.4, p.93"
        decision: keep
        directive: "Use processes such as descriptive mapping, data mining, concept mapping and logic models to characterise the available literature so you can refine your scope and choose an appropriate review method."
        trigger: "When refining your review scope and selecting a review method."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d34"
        source: "Booth & Sutton 2022, Ch.4, p.104"
        decision: keep
        directive: "Use logic models to clarify and prioritise review questions when defining your scope, especially to understand intervention complexity and ensure you explore all contributing elements."
        trigger: "When defining the scope of a review (particularly of a complex intervention)."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d37"
        source: "Booth & Sutton 2022, Ch.4, p.106"
        decision: keep
        directive: "Use other mapping techniques (descriptive mapping, data mining/text mining, concept mapping) after scoping-search results are in to further define the scope of your question."
        trigger: "After completing a scoping search and before fixing the final scope."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d38"
        source: "Booth & Sutton 2022, Ch.4, p.106"
        decision: keep
        directive: "Use descriptive mapping to define a body of literature by allocating keywords to the studies found, then present results as a descriptive map or table."
        trigger: "When characterising a body of literature on a topic and identifying research gaps."
        qualification: "You may use existing keyword sets (e.g., EPPI-Centre) or devise your own."
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d40"
        source: "Booth & Sutton 2022, Ch.4, p.109"
        decision: keep
        directive: "Use concept mapping (mind mapping / idea webbing) when defining your scope, especially if you are visually minded, to identify key concepts, additional search terms, structure, and conceptual relationships."
        trigger: "When defining a review scope, particularly for visually-minded reviewers."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d41"
        source: "Booth & Sutton 2022, Ch.4, p.109"
        decision: keep
        directive: "If preliminary sensitisation to the literature reveals a lack of clarity around one or more key concepts, undertake a concept analysis to gain a better understanding."
        trigger: "When key concepts in your topic lack clarity in the literature."
        qualification: "Works well for wide-ranging questions and terminology used in varied ways."
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d42"
        source: "Booth & Sutton 2022, Ch.4, p.111"
        decision: keep
        directive: "Where too many publications exist for you to review them all in a concept analysis, beware of selection bias."
        trigger: "When conducting a concept analysis in a topic with extensive literature."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d07"
        source: "Booth & Sutton 2022, Ch.5, p.126"
        decision: keep
        directive: "During preparation, draw a concept map and populate it with lists of possible search terms, then conduct a scoping search to assess the size and nature of the literature and define the boundaries (the scope) around the topic."
        trigger: "When preparing (scoping) for a literature search."
        qualification: ""
  - id: c007
    section: "SCOPE / QUESTION DEFINITION"
    label: "Manage multi-question / lump-or-split decisions"
    note: "variants: decide whether to lump or split, narrow when literature too large, prioritise sub-questions"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d29"
        source: "Booth & Sutton 2022, Ch.4, p.102"
        decision: keep
        directive: "Decide whether to 'lump' or 'split' your review questions according to what is manageable within the time and resources available."
        trigger: "When the available evidence on a complex intervention is heterogeneous."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d52"
        source: "Booth & Sutton 2022, Ch.4, p.121"
        decision: keep
        directive: "If you find more literature than you can realistically review, either narrow your focus (e.g., a more specific intervention or population) or place restrictions on the evidence type you will include (e.g., date, study type, geographical coverage)."
        trigger: "When a topic returns more literature than can be reviewed."
        qualification: "Clearly record all decisions and be aware of potential biases; consider whether text or data mining can assist screening."
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d53"
        source: "Booth & Sutton 2022, Ch.4, p.121"
        decision: keep
        directive: "If your research question is really four or five questions, limit these to what is manageable and answerable; consider using a logic model to prioritise the research question."
        trigger: "When the review topic contains multiple candidate questions."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d54"
        source: "Booth & Sutton 2022, Ch.4, p.122"
        decision: keep
        directive: "If a scoping search returns nothing on your defined question, modify your topic by expanding one or more of your concepts one step at a time so you can assess the impact of each expansion, or consider relaxing your inclusion criteria."
        trigger: "When a scoping search returns no results for your defined question."
        qualification: "Defining your research question is iterative; adjust scope early rather than late."
  - id: c008
    section: "SCOPE / QUESTION DEFINITION"
    label: "Complex-intervention description (TIDieR / process)"
    note: "variants: describe the intervention precisely; supplement via process evaluations"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d31"
        source: "Booth & Sutton 2022, Ch.4, p.103"
        decision: keep
        directive: "Describe the intervention of interest as precisely as possible so you know which studies to include; carry out specific scoping searches to investigate how the intervention is described in the literature."
        trigger: "When defining a review question that involves a specific intervention."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d32"
        source: "Booth & Sutton 2022, Ch.4, p.103"
        decision: keep
        directive: "Use TIDieR (12 items) or the abridged TIDieR-Lite (by whom, what, where, to what intensity, and how often) to describe the components of an intervention."
        trigger: "When describing intervention components for a review."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d33"
        source: "Booth & Sutton 2022, Ch.4, p.103"
        decision: adapt
        directive: "When studies provide insufficient detail about a complex intervention, redirect scoping searches toward secondary study types such as process evaluations, and flag to the user which authors would be worth contacting for the missing detail."
        trigger: "When studies provide insufficient detail about a complex intervention."
        qualification: ""
        original_directive: "To overcome a lack of information about the intervention, focus scoping searches on secondary study types such as process evaluations, or contact authors directly for further information."
  - id: c009
    section: "SCOPE / QUESTION DEFINITION"
    label: "Distinguish foreground vs background questions"
    note: "singleton: keep background concerns from hijacking the review"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d01"
        source: "Booth & Sutton 2022, Ch.5, p.125"
        decision: keep
        directive: "Distinguish between a foreground question (an explicit review question requiring a systematic search) and a background question (a contextual question to be addressed in introduction or discussion via review articles or targeted searches), and do not allow background issues to hijack the review."
        trigger: "When clarifying the question(s) a literature search will address."
        qualification: ""
  - id: c010
    section: "SCOPE / QUESTION DEFINITION"
    label: "Don't-bias outcomes by anticipating only welcome ones"
    note: "singleton: include unexpected/negative outcomes during scope definition"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d20"
        source: "Booth & Sutton 2022, Ch.4, p.98"
        decision: keep
        directive: "Do not introduce potential bias by only searching for anticipated or welcome outcomes; unexpected or negative outcomes can be equally useful."
        trigger: "When specifying outcomes during scope definition."
        qualification: ""
  - id: c011
    section: "SCOPE / QUESTION DEFINITION"
    label: "Match search facets to essential PICOS terms only"
    note: "singleton: retrieve essential facets, defer the rest to screening"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d21"
        source: "Booth & Sutton 2022, Ch.4, p.98"
        decision: keep
        directive: "In your search strategy, aim to retrieve the essential facets (those whose absence would lead you to reject a study) rather than all five PICOS facets, in order to reduce the literature to a manageable size."
        trigger: "When designing a search strategy using a PICOS-style framework."
        qualification: "You can still examine retrieved results more closely at the screening stage."
  - id: c012
    section: "SCOPE / QUESTION DEFINITION"
    label: "Mixed-methods for complex systems"
    note: "singleton: combine qual and quant for complex systems"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d30"
        source: "Booth & Sutton 2022, Ch.4, p.103"
        decision: keep
        directive: "Consider a mixed methods approach combining quantitative and qualitative data when modelling a complex system, since no single study type or methodological approach can provide all the answers required."
        trigger: "When reviewing a complex intervention or system."
        qualification: ""
  - id: c013
    section: "SCOPE / QUESTION DEFINITION"
    label: "Don't conflate complexity of intervention with review perspective"
    note: "singleton: a complex intervention does not require a complex review"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d27"
        source: "Booth & Sutton 2022, Ch.4, p.101"
        decision: keep
        directive: "Do not assume a complex intervention requires a complex review perspective; you can conduct a straightforward effectiveness review on specific outcomes while acknowledging the intervention's complexity and context."
        trigger: "When deciding the lens for a review of a complex intervention."
        qualification: ""
  - id: c014
    section: "SCOPE / QUESTION DEFINITION"
    label: "Systematise selectively when full SR not feasible"
    note: "singleton: systematise stages where it strengthens credibility"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d35"
        source: "Booth & Sutton 2022, Ch.4, p.104"
        decision: keep
        directive: "If a full Systematic Review is not realistic, choose to systematise some stages of the process where resources allow and where it strengthens the credibility of your review."
        trigger: "When full systematic review is not feasible for your topic and resources."
        qualification: "E.g., conduct a wide-ranging search but skip formal quality assessment."
  - id: c015
    section: "SCOPE / QUESTION DEFINITION"
    label: "Sampling-approach declaration"
    note: "variants: declare sampling approach (comprehensive / theoretical / pivotal) explicitly; justify non-comprehensive sampling"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d43"
        source: "Booth & Sutton 2022, Ch.4, p.114"
        decision: keep
        directive: "Whichever sampling approach you choose (comprehensiveness, theoretical saturation, representative, or pivotal works), be explicit in your methods so the reader is fully aware of the scope of your review and the criteria for selection and relevance."
        trigger: "When deciding how wide to go in sampling literature."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d09"
        source: "Booth & Sutton 2022, Ch.8, p.240"
        decision: adapt
        directive: "When you draw on less than the full relevant literature on a topic, state which slice you sampled, why, and how that sampling matches the synthesis purpose."
        trigger: "When the search for qualitative studies uses non-comprehensive sampling."
        qualification: ""
        original_directive: "Where approaches other than comprehensive sampling are used, justify your sampling strategy, match it to your synthesis method, and describe fully how it was implemented."
  - id: c016
    section: "PROTOCOL / PLANNING / DOCUMENTATION"
    label: "Write a review protocol up front"
    note: "variants: same protocol — pre-register the review plan in a structured protocol document"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d04"
        source: "Booth & Sutton 2022, Ch.4, p.93"
        decision: keep
        directive: "Complete a review protocol when defining your scope."
        trigger: "When defining the scope of a review."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d46"
        source: "Booth & Sutton 2022, Ch.4, p.116"
        decision: keep
        directive: "Write the review protocol in advance and use it to lay out how you will approach each step of the review process."
        trigger: "Once the review scope has been defined."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d47"
        source: "Booth & Sutton 2022, Ch.4, p.117"
        decision: keep
        directive: "When writing a protocol, follow the PRISMA-P reporting items and include administrative information, introduction (rationale, objectives), methods (for identifying evidence, selecting studies, data extraction, assessing risk of bias), approach to data synthesis, approach to evaluating strength of evidence, and a timeline."
        trigger: "When drafting a review protocol."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d48"
        source: "Booth & Sutton 2022, Ch.4, p.119"
        decision: keep
        directive: "In the protocol's data-extraction section, record what data you will extract (variables, themes, etc.); if you plan to use or adapt an existing data-extraction form record the details, and if you plan to design your own, state that intention."
        trigger: "When specifying data extraction in the protocol."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d49"
        source: "Booth & Sutton 2022, Ch.4, p.120"
        decision: keep
        directive: "Document the study-selection method in the protocol: state who will select studies and how, including how disagreements will be resolved, and record the sift process (title, abstract, full-text)."
        trigger: "When specifying the study-selection method in the protocol."
        qualification: "If working alone, record that you alone will select the studies."
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d50"
        source: "Booth & Sutton 2022, Ch.4, p.120"
        decision: adapt
        directive: "Before any rapid review, draft a complete protocol suitable for commissioner sign-off and registry deposit (e.g., PROSPERO or OSF), and prompt the user to confirm both have been completed before search begins."
        trigger: "When conducting a rapid review."
        qualification: ""
        original_directive: "Precede all rapid reviews with a protocol submitted to, and agreed with, the commissioner of the review; this protocol should be published (e.g., on PROSPERO or the Open Science Framework)."
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d08"
        source: "Booth & Sutton 2022, Ch.5, p.126"
        decision: keep
        directive: "Decide and state in your review protocol which sources you will search, at what stage(s) of the review you will conduct them (including update searches or alerts), and which supplementary methods you will use."
        trigger: "When devising the search strategy and writing the protocol."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d32"
        source: "Booth & Sutton 2022, Ch.5, p.134"
        decision: keep
        directive: "For systematic reviews, record all decisions taken at the scoping stage in your protocol a priori to minimise bias when conducting comprehensive searches."
        trigger: "When preparing the protocol for a systematic review."
        qualification: ""
  - id: c017
    section: "PROTOCOL / PLANNING / DOCUMENTATION"
    label: "Manage scope changes via a 'changes clause'"
    note: "variants: track and document protocol amendments"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d45"
        source: "Booth & Sutton 2022, Ch.4, p.116"
        decision: keep
        directive: "If you must amend your original scope, manage the change using a 'changes clause' in your protocol."
        trigger: "When amending the scope of an ongoing review."
        qualification: "Particularly important when working on official contracts or within a wider research team."
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d51"
        source: "Booth & Sutton 2022, Ch.4, p.120"
        decision: keep
        directive: "The rapid-review protocol should accommodate and document all post hoc changes to the protocol (e.g., eligibility criteria) within an efficient and iterative process."
        trigger: "When changes arise during a rapid review."
        qualification: ""
  - id: c018
    section: "PROTOCOL / PLANNING / DOCUMENTATION"
    label: "Re-anchor to original scope/question throughout"
    note: "variants: avoid scope creep; periodically re-align with the original question"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d44"
        source: "Booth & Sutton 2022, Ch.4, p.116"
        decision: keep
        directive: "Constantly refer back to your original scope during the review to ensure the project does not go off track and to avoid scope creep."
        trigger: "Throughout the review process, especially while searching the literature."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d55"
        source: "Booth & Sutton 2022, Ch.8, p.265"
        decision: keep
        directive: "Return to your review protocol and question throughout your review — particularly at the analysis stage — to check that the questions you are answering are those identified in the original protocol."
        trigger: "Throughout the review and especially at the analysis stage."
        qualification: "By the analysis stage you have been so engaged with the literature that the review could drift from being question-driven to literature-driven."
  - id: c019
    section: "PROTOCOL / PLANNING / DOCUMENTATION"
    label: "Keep a process audit trail"
    note: "variants: document every step (including search-strategy explanation) so the work can be replicated and defended"
    fork_hint: false
    members:
      - id: "arksey-omalley-2005-scoping-studies/whole/d01"
        source: "Arksey & O'Malley 2005, Framework overview, p. 5"
        decision: keep
        directive: "Conduct each stage of the scoping study in a rigorous and transparent way, and document the process in sufficient detail to enable the study to be replicated by others."
        trigger: "When conducting a scoping study."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d07"
        source: "Booth & Sutton 2022, ch. 10, p. 313"
        decision: keep
        directive: "Document all steps taken in conducting the review so that an audit trail records the evidence supporting each finding, where that evidence can be found, and how it was interpreted."
        trigger: "Throughout the conduct of any systematic approach to the literature."
        qualification: "It is better to anticipate and forestall potential criticisms than to rely on the audit trail to defend findings after the fact."
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d09"
        source: "Booth & Sutton 2022, ch. 10, p. 313"
        decision: keep
        directive: "Demonstrate transparency by documenting that procedures were actually followed, not merely by name-checking a well-regarded methods source."
        trigger: "When writing the Methods section or describing review procedures."
        qualification: "''"
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d25"
        source: "Booth & Sutton 2022, Ch.5, p.133"
        decision: keep
        directive: "When writing up your review, devote a section of the text to explaining how you decided on conceptualisation of the question, choice of sources, and supplementary methods, and provide an example search string."
        trigger: "When writing up the search strategy section of your review."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d58"
        source: "Booth & Sutton 2022, Ch.5, p.141"
        decision: keep
        directive: "Retain thorough documentation of all your search efforts to demonstrate that you have followed systematic search processes."
        trigger: "When reporting any systematic-style literature search."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d68"
        source: "Booth & Sutton 2022, Ch.5, p.154"
        decision: keep
        directive: "Evaluate your search results, modify your search strategies accordingly, and document the search process to allow accurate reporting when writing up your review."
        trigger: "After running searches, when iterating on the strategy."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d03"
        source: "Booth & Sutton 2022, Ch.6, p.160"
        decision: keep
        directive: "Keep a good audit trail of which references you have included and excluded, along with reasons for study exclusion."
        trigger: "Throughout the study-selection process, with a view to writing up the review."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d11"
        source: "Booth & Sutton 2022, Ch.6, p.162"
        decision: adapt
        directive: "Maintain an explicit per-study record of inclusion/exclusion decisions and the screening stage at which each decision was made, so any included or excluded study can be traced back to its decision point in your written review."
        trigger: "When managing references during the study-selection process."
        qualification: ""
        original_directive: "Tag references in a reference manager (e.g. with keywords like 'include abstract') so you can retrieve included studies and maintain an audit trail of which studies were included or excluded, at what stage, and by whom."
  - id: c020
    section: "PROTOCOL / PLANNING / DOCUMENTATION"
    label: "CART criteria over comprehensiveness"
    note: "singleton: hold the review to Clarity/Auditability/Replicability/Transparency"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d06"
        source: "Booth & Sutton 2022, ch. 10, p. 312–313"
        decision: keep
        directive: "Hold your review to the four CART criteria — Clarity, Auditability, Replicability, and Transparency — rather than to comprehensiveness, which is not a virtue all systematic approaches share."
        trigger: "When evaluating or presenting a systematic approach to the literature."
        qualification: "The authors deliberately exclude criteria such as comprehensiveness which 'may be present in some but not all such systematic approaches.'"
  - id: c021
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Multi-source / supplementary searching"
    note: "variants: combine databases with reference lists, hand-search, key authors, grey literature, organisations"
    fork_hint: false
    members:
      - id: "arksey-omalley-2005-scoping-studies/whole/d06"
        source: "Arksey & O'Malley 2005, Stage 2, p. 6"
        decision: adapt
        directive: "When scoping a literature, draw on multiple source types rather than databases alone: bibliographic databases, the reference lists of retrieved studies, the tables of contents of key journals, and known authoritative organizations or networks in the field; flag source types you cannot access so the user can supplement them."
        trigger: "At Stage 2 (identifying relevant studies) of a scoping study."
        qualification: ""
        original_directive: "Search for research evidence via multiple sources — electronic databases, reference lists, hand-searching of key journals, and existing networks/relevant organizations/conferences — rather than relying on databases alone."
      - id: "arksey-omalley-2005-scoping-studies/whole/d10"
        source: "Arksey & O'Malley 2005, Stage 2, p. 7"
        decision: keep
        directive: "Check the bibliographies of studies identified through database searches — especially systematic reviews and traditional literature reviews — to ensure they have been included in the scoping exercise."
        trigger: "After the database search has yielded studies."
        qualification: "Continue until a saturation point is reached where no new references are identified."
      - id: "arksey-omalley-2005-scoping-studies/whole/d11"
        source: "Arksey & O'Malley 2005, Stage 2, pp. 7-8"
        decision: adapt
        directive: "Identify the key journals in the field and review their tables of contents directly to catch articles missed by database and reference-list searches; note any journals you could not access so the user can supplement."
        trigger: "When seeking comprehensive coverage in a scoping study."
        qualification: ""
        original_directive: "Hand-search key journals to identify articles that have been missed in database and reference-list searches, because electronic databases may be incomplete, not up to date, or vary in coverage, indexing and depth."
      - id: "arksey-omalley-2005-scoping-studies/whole/d12"
        source: "Arksey & O'Malley 2005, Stage 2, p. 8"
        decision: adapt
        directive: "Identify relevant national or local organizations and known expert networks in the field, and surface their publicly available reports, working papers and grey literature; flag where contacting them directly would likely yield further unpublished work the user should pursue."
        trigger: "When searching for relevant studies in a scoping study."
        qualification: ""
        original_directive: "Use existing knowledge and networks, and contact relevant national or local organizations working in the field, to generate information about primary research and identify unpublished work."
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d10"
        source: "Booth & Sutton 2022, Ch.5, pp.126-127"
        decision: keep
        directive: "Supplement database searching with searches for known authors in the field, checking reference lists of included papers, citation searching of included studies, and grey-literature searching of websites or general search engines."
        trigger: "When supplementing the main bibliographic database search."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d28"
        source: "Booth & Sutton 2022, Ch.5, p.133"
        decision: keep
        directive: "Consider broad multidisciplinary databases, in addition to those directly related to your review topic."
        trigger: "When choosing sources to search."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d29"
        source: "Booth & Sutton 2022, Ch.5, p.134"
        decision: keep
        directive: "Always consider the extra time supplementary searching requires and prioritise high-yield or high-risk sources."
        trigger: "When deciding how much supplementary and grey-literature searching to do."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d50"
        source: "Booth & Sutton 2022, Ch.5, pp.138-139"
        decision: keep
        directive: "Because no single search engine covers all grey literature sources, decide what types of grey literature you require and develop a targeted strategy for finding them that balances practicality with methodological rigour."
        trigger: "When planning grey-literature searching."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d51"
        source: "Booth & Sutton 2022, Ch.5, p.139"
        decision: keep
        directive: "Visit organisational websites directly to access grey-literature content not indexed by general search engines, and keep records of your grey-literature searches so you can report how you identified the evidence."
        trigger: "When searching for grey literature."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d52"
        source: "Booth & Sutton 2022, Ch.5, p.139"
        decision: keep
        directive: "Check reference lists of included papers; if you find apparently relevant papers your search missed, investigate why (indexing? omitted term?) and consider running targeted searches if the omission would have changed the review."
        trigger: "When verifying a search strategy via supplementary methods."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d53"
        source: "Booth & Sutton 2022, Ch.5, pp.139-140"
        decision: keep
        directive: "If your scoping search identified key authors, search for them by name to find their other publications (provided their names are sufficiently uncommon), and consider contacting them directly for ongoing or unpublished research."
        trigger: "When supplementary searching by author."
        qualification: "Author searches without other terms only work when names are sufficiently uncommon."
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d54"
        source: "Booth & Sutton 2022, Ch.5, p.140"
        decision: keep
        directive: "Use citation searching (forward chaining / forward citation tracking) — most powerfully on Scopus or Web of Science, or via Google Scholar's 'cited by' — particularly for papers at least five years old that have been cited within their own discipline for their findings."
        trigger: "When using citation searching to verify your searches."
        qualification: "Most helpful for papers at least five years old, and where citations are within the same discipline (for findings) rather than methodological."
  - id: c022
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Pilot then expand the search strategy"
    note: "variants: pilot one database, refine, then propagate"
    fork_hint: false
    members:
      - id: "arksey-omalley-2005-scoping-studies/whole/d08"
        source: "Arksey & O'Malley 2005, Stage 2, p. 7"
        decision: keep
        directive: "Pilot the search strategy on one database (e.g. MEDLINE) and refine it in light of early results before converting it for each subsequent database."
        trigger: "When developing the electronic-database search strategy."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d24"
        source: "Booth & Sutton 2022, Ch.5, p.132"
        decision: keep
        directive: "Use pearl growing — examine titles, abstracts, and indexing of a small number of known key papers to identify useful search terms and similar material — and check reference lists for key authors to explore further."
        trigger: "When developing the main search strategy from the scoping results."
        qualification: ""
  - id: c023
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Engage a search/information specialist (or escalate to one)"
    note: "variants: same protocol — recommend or use an expert when designing sensitive searches"
    fork_hint: false
    members:
      - id: "arksey-omalley-2005-scoping-studies/whole/d09"
        source: "Arksey & O'Malley 2005, Stage 2, p. 7"
        decision: adapt
        directive: "When designing electronic-database searches in a scoping study, recommend that the user engage a qualified information officer or librarian for sensitive searches; if proceeding without one, draft the search strategy explicitly and flag it for expert review."
        trigger: "When designing electronic-database searches for a scoping study."
        qualification: ""
        original_directive: "Engage a qualified information officer or librarian to design and execute sensitive search strategies, since researchers may lack the necessary technical skills."
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d04"
        source: "Booth & Sutton 2022, Ch.5, p.126"
        decision: keep
        directive: "Ideally engage an experienced information specialist/librarian to conduct the searches, and maintain ongoing communication between the searcher and the rest of the review team."
        trigger: "When deciding who will conduct the literature search."
        qualification: "If you are a student or lone researcher, you will probably need to do the searches yourself, but may still be able to obtain advice from an expert such as a librarian."
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d14"
        source: "Booth & Sutton 2022, Ch.5, p.127"
        decision: keep
        directive: "Involve someone with search expertise from the outset of the project — to plan and scope, write the protocol, develop and run searches, and advise on writing up search methods."
        trigger: "When planning a review project."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d15"
        source: "Booth & Sutton 2022, Ch.5, p.127"
        decision: keep
        directive: "Include your search expert as a named applicant on research grants and a co-author of any resulting publications."
        trigger: "When formally crediting collaborators on a review project."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d16"
        source: "Booth & Sutton 2022, Ch.5, p.127"
        decision: keep
        directive: "If you will be running the searches yourself, consider seeking advice from a librarian/information professional, and consider using the PRESS (Peer Review of Electronic Search Strategies) checklist."
        trigger: "When conducting the searches yourself, without an embedded information specialist."
        qualification: "PRESS use is not always possible for student dissertations."
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d17"
        source: "Booth & Sutton 2022, Ch.5, pp.127-128"
        decision: keep
        directive: "If you have limited prior subject knowledge, recruit expert advisors to suggest starter papers (for validating your searches) and to verify your search terms — particularly important for realist reviews."
        trigger: "When working on a topic where you have limited prior subject knowledge, or conducting a realist review."
        qualification: ""
  - id: c024
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Recruit subject experts to validate searches"
    note: "singleton: enlist topic experts when prior knowledge is thin"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d18"
        source: "Booth & Sutton 2022, Ch.5, p.128"
        decision: keep
        directive: "For systematic reviews of effectiveness of interventions, prioritise sensitivity in your literature search to cover every relevant study meeting inclusion criteria."
        trigger: "When supporting a systematic review of intervention effectiveness."
        qualification: "The need to keep results manageable often requires effectiveness reviews to adopt a narrow focus with strict eligibility criteria."
  - id: c025
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Eight-stage search-process scaffold"
    note: "singleton: follow the eight stages of search work"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d03"
        source: "Booth & Sutton 2022, Ch.5, p.126"
        decision: keep
        directive: "Follow the eight key stages of the search process — deciding who searches; aims and purpose; preparation (scoping); search strategy; bibliographic database searching; supplementary searching; managing references; reporting the search."
        trigger: "When identifying evidence systematically for a literature review."
        qualification: ""
  - id: c026
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Define search aims (comprehensive vs sampling)"
    note: "variants: state up front whether the search is exhaustive or selective and what counts as eligible"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d05"
        source: "Booth & Sutton 2022, Ch.5, p.126"
        decision: keep
        directive: "Decide whether your aim is a comprehensive survey of the literature or a selective, sampling approach, and state clearly from the outset what types of evidence you consider eligible for inclusion."
        trigger: "When establishing the aims and purpose of the literature search."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d06"
        source: "Booth & Sutton 2022, Ch.5, p.126"
        decision: keep
        directive: "For more iterative review types (e.g. qualitative evidence synthesis or realist synthesis), state up front how you plan to deal with emerging sub-topics."
        trigger: "When the review is iterative (qualitative evidence synthesis, realist synthesis, etc.)."
        qualification: ""
  - id: c027
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Sensitivity vs specificity trade-off"
    note: "variants: tune search recall vs precision to review type"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d02"
        source: "Booth & Sutton 2022, Ch.5, p.125"
        decision: keep
        directive: "Balance the trade-off between sensitivity (retrieving all relevant results) and specificity (minimising unwanted results to screen) according to the type of review and how comprehensive coverage needs to be."
        trigger: "When designing a search strategy."
        qualification: "The right balance depends on review type and comprehensiveness requirements."
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d19"
        source: "Booth & Sutton 2022, Ch.5, p.128"
        decision: keep
        directive: "For qualitative evidence syntheses, when you reach theoretical saturation consider spending remaining searching time on additional purposive searches for under-represented disciplines or perspectives, or on elusive publication types such as grey literature or theses, rather than continuing to retrieve more of the same."
        trigger: "When conducting a qualitative evidence synthesis and theoretical saturation is reached."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d23"
        source: "Booth & Sutton 2022, Ch.5, p.132"
        decision: keep
        directive: "For your scoping search, concentrate on terms that are specific (highly likely to indicate relevance) rather than on broader, sensitive terms; aim for sufficient sensitivity to estimate the size of the literature while quickly identifying key papers."
        trigger: "When choosing search terms for a scoping search."
        qualification: ""
  - id: c028
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Scoping-search before main search"
    note: "variants: run a scoping/preliminary search to gauge size, find pearls, calibrate scope"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d36"
        source: "Booth & Sutton 2022, Ch.4, p.106"
        decision: keep
        directive: "Carry out initial searches of bibliographic databases to identify where research gaps lie and where a new review is needed."
        trigger: "When evaluating whether a new review is warranted."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d39"
        source: "Booth & Sutton 2022, Ch.4, p.109"
        decision: keep
        directive: "When scoping searches return large numbers of citations, employ text-mining/machine-learning software tools (e.g., Rayyan, Abstrackr, EPPI-Reviewer Web) to rank results by likely relevance and predict how many more results are worth screening manually."
        trigger: "When a scoping search returns large numbers of citations."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d21"
        source: "Booth & Sutton 2022, Ch.5, p.129"
        decision: keep
        directive: "Cover a selection of both core electronic databases and grey literature sources in your scoping search."
        trigger: "When conducting a scoping search."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d22"
        source: "Booth & Sutton 2022, Ch.5, p.132"
        decision: keep
        directive: "If your topic is multidisciplinary, sample purposively across diverse disciplines in your scoping search."
        trigger: "When the review topic is multidisciplinary."
        qualification: ""
  - id: c029
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Concept/term-list construction"
    note: "variants: assemble synonym/related-term lists per concept; account for terminology variation"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d26"
        source: "Booth & Sutton 2022, Ch.5, p.133"
        decision: keep
        directive: "Decide which concepts to include in your search (typically population/perspective and intervention) and which will be easier to identify through study screening rather than via search terms."
        trigger: "When translating a question framework (e.g. PICOS, SPICE) into a search."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d27"
        source: "Booth & Sutton 2022, Ch.5, p.133"
        decision: keep
        directive: "Decide which terms you will treat as synonyms and which as related terms for the same concept (e.g. include 'mortality' alongside 'life expectancy'), and recognise that some subgroups of synonyms are useful in isolation while others only matter when paired or restricted to certain disciplines."
        trigger: "When assembling the term lists for each concept of the search."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d67"
        source: "Booth & Sutton 2022, Ch.5, p.154"
        decision: keep
        directive: "Take into account limitations of the literature, such as inconsistent terminology and problematic indexing, and include alternative search terms (including those used in known papers)."
        trigger: "When developing search terms."
        qualification: ""
  - id: c030
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Boolean / syntax discipline"
    note: "variants: same family of search-syntax rules — use AND/OR/NOT carefully, escape Boolean words, use proximity, phrases, wildcards, truncation"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d09"
        source: "Booth & Sutton 2022, Ch.5, p.126"
        decision: keep
        directive: "Use advanced search features (where available) on bibliographic databases for maximum control over your results."
        trigger: "When searching bibliographic databases."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d35"
        source: "Booth & Sutton 2022, Ch.5, p.135"
        decision: keep
        directive: "Do not assume databases contain full text of articles; recognise you will typically only be able to search article titles, abstracts, and index fields."
        trigger: "When entering free-text searches into bibliographic databases."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d36"
        source: "Booth & Sutton 2022, Ch.5, p.135"
        decision: keep
        directive: "Apply truncation to find singular/plural forms and other word endings, but be careful not to truncate too early (e.g. 'nurs*' finds 'nurse', 'nurses', 'nursing' but also 'nursery')."
        trigger: "When constructing free-text search terms in databases."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d37"
        source: "Booth & Sutton 2022, Ch.5, p.135"
        decision: keep
        directive: "Use wildcards where spellings vary in the middle of a word (e.g. 'colo?r' for colour/color; 'wom#n' for woman/women on Ovid)."
        trigger: "When search terms have spelling variants within the word."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d38"
        source: "Booth & Sutton 2022, Ch.5, p.135"
        decision: keep
        directive: "When searching for phrases, check database help pages to confirm how phrases are interpreted; encase phrases in quotation marks where necessary; and check how the platform interprets hyphens — when in doubt, search for all variant forms (e.g. 'socioeconomic' OR 'socio-economic') and combine them with OR."
        trigger: "When entering multi-word phrases or hyphenated terms into a database search."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d42"
        source: "Booth & Sutton 2022, Ch.5, p.137"
        decision: keep
        directive: "Combine synonyms (or terms relating to the same concept) with OR to broaden the search; combine different concepts with AND to narrow the search; use NOT only to exclude unwanted terms, with caution."
        trigger: "When combining search terms with Boolean operators."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d43"
        source: "Booth & Sutton 2022, Ch.5, p.137"
        decision: keep
        directive: "Use NOT with caution because of unintended 'double negative' effects, and if you do use NOT, examine at least a sample of the records you have excluded to check that the effect is as intended."
        trigger: "When using the Boolean NOT operator."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d44"
        source: "Booth & Sutton 2022, Ch.5, p.137"
        decision: keep
        directive: "Be careful around everyday phrases that contain Boolean operator words (e.g. 'low- and middle-income countries'); enclose such phrases in quotation marks to prevent the database from interpreting them as Boolean commands."
        trigger: "When a search term contains the literal words AND/OR/NOT."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d45"
        source: "Booth & Sutton 2022, Ch.5, p.137"
        decision: keep
        directive: "Use a proximity (adjacency) search when one of your search concepts could be expressed in many different phrasings, and always check the help pages or 'search tips' for the proximity operators of each database you use."
        trigger: "When a concept could appear in many phrase variations, or when using proximity operators."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d62"
        source: "Booth & Sutton 2022, Ch.5, p.152"
        decision: keep
        directive: "Assemble a search strategy by combining terms within the same concept with OR; first combine population AND intervention/exposure terms; if the result set is unmanageable, add outcome terms; if still unmanageable, add comparison terms or apply limits."
        trigger: "When building a search strategy from concept-by-concept term lists."
        qualification: "Title screening is relatively quick, so account for this when judging whether the result set is manageable."
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d63"
        source: "Booth & Sutton 2022, Ch.5, p.155"
        decision: keep
        directive: "When you discover an additional useful search term after completing a search, add it and rerun, using NOT to exclude already-screened records (e.g. '#22 = #21 NOT #20')."
        trigger: "When you find a missed search term after completing your initial searching."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d64"
        source: "Booth & Sutton 2022, Ch.5, p.155"
        decision: keep
        directive: "When using abbreviations in search terms, check that the abbreviation is not meaningful in multiple different contexts (e.g. 'DNA' for 'did not attend' would also retrieve 'deoxyribonucleic acid')."
        trigger: "When considering using abbreviations in search terms."
        qualification: ""
  - id: c031
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Use thesaurus / controlled vocabulary"
    note: "variants: leverage subject headings and check scope notes; search databases one at a time"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d39"
        source: "Booth & Sutton 2022, Ch.5, p.136"
        decision: keep
        directive: "Use thesaurus (subject-heading) searching where the database offers a controlled vocabulary, since presence of a term in the subject-heading field generally yields higher specificity than in an abstract alone, and hierarchies of headings can suggest broader or narrower terms."
        trigger: "When searching a database that offers a controlled vocabulary / thesaurus."
        qualification: "Subject-heading schemes evolve over time; check scope notes for newer or shifting terms; for systematic searching, search databases one at a time even on the same platform."
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d40"
        source: "Booth & Sutton 2022, Ch.5, p.136"
        decision: keep
        directive: "For systematic searching, search databases one at a time even when they share a platform, because subject headings vary between databases."
        trigger: "When conducting systematic searches across multiple databases on the same platform."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d41"
        source: "Booth & Sutton 2022, Ch.5, p.136"
        decision: keep
        directive: "Check the scope note of a subject heading if you are uncertain whether it is relevant to your topic."
        trigger: "When evaluating whether to use a thesaurus subject heading."
        qualification: ""
  - id: c032
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Justify and document search limits (date/language/indexing)"
    note: "variants: same protocol — apply limits only with rationale, document each, acknowledge bias risk"
    fork_hint: false
    members:
      - id: "arksey-omalley-2005-scoping-studies/whole/d07"
        source: "Arksey & O'Malley 2005, Stage 2, pp. 6-7"
        decision: keep
        directive: "Make explicit decisions at the outset about coverage in terms of time span and language, and acknowledge that any such limits may cause potentially relevant papers to be missed."
        trigger: "At the outset of a scoping study, before searching."
        qualification: "Limits may be necessary for practical reasons (time, budget, translation costs) but their cost in missed papers should be acknowledged."
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d30"
        source: "Booth & Sutton 2022, Ch.5, p.134"
        decision: keep
        directive: "If applying date limits to your search, choose a date with a methodological, practice or policy justification (e.g. the date of the last review on this topic, a change of government, the introduction of a new intervention, or the publication of a major report) rather than arbitrary date ranges such as 5 or 10 years."
        trigger: "When considering date limits on a search."
        qualification: "You can always apply a subsequent cut-off date during screening if needed, remembering to amend your protocol."
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d31"
        source: "Booth & Sutton 2022, Ch.5, p.134"
        decision: keep
        directive: "Carefully consider date restrictions for each topic — they may change the bottom line of meta-analyses if older studies are dropped, or introduce stale contextual factors if older qualitative studies are kept."
        trigger: "When considering limiting inclusion by study date of publication."
        qualification: "Date restrictions are pragmatic shortcuts; weigh them against topic-specific consequences."
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d33"
        source: "Booth & Sutton 2022, Ch.5, pp.134-135"
        decision: keep
        directive: "Note down why you made each search-limitation decision, and document any limitations or shortcuts for use in the Discussion of your final report."
        trigger: "When applying any search limits or shortcuts."
        qualification: "Restricting to English-only studies is not appropriate for global or multi-country reviews but may be pragmatic if translation resources are limited."
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d46"
        source: "Booth & Sutton 2022, Ch.5, pp.137-138"
        decision: keep
        directive: "Consider the potential risk of bias when applying language limits to search results."
        trigger: "When considering limiting search results by language."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d47"
        source: "Booth & Sutton 2022, Ch.5, p.138"
        decision: keep
        directive: "Apply indexing-based limits (e.g. age group, study type) only for targeted, specificity-maximising searches, not for searches where sensitivity is critical, because indexing can be inaccurate or incomplete (especially for in-process records)."
        trigger: "When considering applying database limits based on indexing."
        qualification: ""
  - id: c033
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Validate search filters"
    note: "variants: prefer validated filters; conduct an initial search before deciding on filters"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d48"
        source: "Booth & Sutton 2022, Ch.5, p.138"
        decision: keep
        directive: "When using a search filter, prefer one that has been carefully developed and validated against a 'gold standard' set of results to verify its sensitivity and specificity."
        trigger: "When using an off-the-shelf search filter."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d66"
        source: "Booth & Sutton 2022, Ch.5, p.155"
        decision: keep
        directive: "Conduct an initial search before deciding whether to use a search filter — if results are manageable you probably do not need one; use a filter when the literature is plentiful and you need to limit by study design or population (e.g. an RCT filter, or a UK geographic filter)."
        trigger: "When deciding whether to apply a search filter."
        qualification: ""
  - id: c034
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Save / record full search strings"
    note: "variants: keep complete, rerunnable strings with database/platform/date metadata"
    fork_hint: false
    members:
      - id: "arksey-omalley-2005-scoping-studies/whole/d13"
        source: "Arksey & O'Malley 2005, Stage 2, p. 8"
        decision: keep
        directive: "Record, for each database searched, the years it covered and the date it was searched, since this is important if there is any likelihood of having to update the searches in the future."
        trigger: "Each time a database is searched in a scoping study."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d49"
        source: "Booth & Sutton 2022, Ch.5, p.138"
        decision: adapt
        directive: "When designing or running a database search, record each constructed search string in full (including database, platform, syntax, and date) so the user can rerun it later to correct errors, add omitted terms, or refresh against newly-published papers."
        trigger: "When running searches in a database that supports saving."
        qualification: ""
        original_directive: "Save your searches in the database platform so you can rerun them quickly if you need to correct errors, add omitted terms, or check for newly published papers."
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d59"
        source: "Booth & Sutton 2022, Ch.5, p.144"
        decision: keep
        directive: "Document at minimum: databases searched (with platform/provider and years covered); date searches conducted; the search-strategy description in methods; any filters applied (with citations); numbers of results retrieved at each stage; and at least one example search string reproduced in full as an appendix."
        trigger: "When writing up the search documentation."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d25"
        source: "Booth & Sutton 2022, ch. 10, p. 324"
        decision: keep
        directive: "Document the search process in enough detail that all database searches are reproducible, and report at least one of your database searches in sufficient detail to repeat it."
        trigger: "When writing the Methods section's search-strategy reporting for a systematic review."
        qualification: "Cochrane expectations require reporting of 'sources, searched, when, by whom and using which terms.'"
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d30"
        source: "Booth & Sutton 2022, ch. 10, p. 326"
        decision: keep
        directive: "Copy and paste the complete search string for all primary bibliographic databases into an appendix exactly as run and in full."
        trigger: "When preparing appendices for a published systematic review."
        qualification: "Capturing a screenshot of the search may be more feasible (Rader et al., 2014); some databases allow exporting the strategy as a Word document or text file."
  - id: c035
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Iterative search-log keeping"
    note: "variants: log decisions and counts as the search progresses"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d11"
        source: "Booth & Sutton 2022, Ch.5, p.127"
        decision: keep
        directive: "Export your search results to reference management software to remove duplicates and facilitate study selection."
        trigger: "When managing references retrieved by your searches."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d12"
        source: "Booth & Sutton 2022, Ch.5, p.127"
        decision: keep
        directive: "Keep a search log of sources searched, terms used, and how you combined them; aim to make how you identified evidence as transparent as possible; and consider saving one or more search strings in full for an appendix (essential for systematic reviews)."
        trigger: "When reporting the search process."
        qualification: "For systematic reviews, saving full search strings in an appendix is essential."
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d13"
        source: "Booth & Sutton 2022, Ch.5, p.127"
        decision: keep
        directive: "Follow the PRISMA-S reporting guidance when reporting literature searches in systematic reviews."
        trigger: "When reporting the search process for a systematic review."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d34"
        source: "Booth & Sutton 2022, Ch.5, p.135"
        decision: keep
        directive: "For reviews using iterative search methods, keep a journal, log, or search summary table recording decisions you make as you conduct your searches and how many results you find via each method."
        trigger: "When conducting a review with iterative search methods."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d60"
        source: "Booth & Sutton 2022, Ch.5, p.144"
        decision: keep
        directive: "Be consistent with the reporting method you use across all the searching for your review, reporting the same elements each time."
        trigger: "When reporting search methods across multiple searches in one review."
        qualification: ""
  - id: c036
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Reference-management and de-duplication"
    note: "variants: export to manager; manual + automated de-dup; account for every reference"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d56"
        source: "Booth & Sutton 2022, Ch.5, p.140"
        decision: keep
        directive: "Be able to account for all references retrieved in the search throughout the systematic literature review, to ensure your methods are transparent."
        trigger: "When managing references during a systematic literature review."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d57"
        source: "Booth & Sutton 2022, Ch.5, p.141"
        decision: keep
        directive: "Use online systematic-review software (e.g. Covidence, DistillerSR, Rayyan, EPPI-Reviewer) to streamline your review, and reuse templates and forms across reviews to save time — but learn new software in between, not during, rapid reviews."
        trigger: "When considering tools to accelerate a rapid review."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d65"
        source: "Booth & Sutton 2022, Ch.5, p.155"
        decision: keep
        directive: "After running automated de-duplication via reference-management software, perform an additional manual duplicate check, since automated checks only find exact-format matches; record the totals before and after de-duplication for your PRISMA flowchart, and retain duplicates in 'Trash' rather than deleting them."
        trigger: "When de-duplicating references from multiple databases."
        qualification: ""
  - id: c037
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Do not substitute journal-website search for database search"
    note: "singleton: hand-searching not a database substitute"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d55"
        source: "Booth & Sutton 2022, Ch.5, p.140"
        decision: keep
        directive: "Do not use full-text journal searching as a replacement for database searching, since journal-website search functionality is far less sophisticated; use it only to search for highly specific terms not in titles, abstracts, or other indexed fields."
        trigger: "When considering hand-searching or full-text searches of online journals."
        qualification: ""
  - id: c038
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Iterate and revise search after first runs"
    note: "singleton: evaluate results, modify, repeat"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch5-searching-literature/d61"
        source: "Booth & Sutton 2022, Ch.5, p.146"
        decision: keep
        directive: "When supporting a systematic review of effectiveness using a PICO(S) model, focus search strategies on population, intervention(s), and study type(s); avoid adding outcomes terms because doing so significantly reduces sensitivity and risks missing relevant studies."
        trigger: "When translating a PICO(S) review question into a search strategy for an effectiveness review."
        qualification: ""
  - id: c039
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Rapid-review evidence prioritisation"
    note: "singleton: stepwise — existing SRs first, then high-quality primary"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d13"
        source: "Booth & Sutton 2022, Ch.4, p.97"
        decision: keep
        directive: "For a rapid review, take a stepwise approach to evidence: first assess how far you can get using existing systematic reviews, then move on to higher-quality designs for primary studies."
        trigger: "When including evidence in a rapid review."
        qualification: "Specific to rapid reviews."
  - id: c040
    section: "SEARCH STRATEGY / EXECUTION"
    label: "Search specialist databases of reviews"
    note: "singleton: target highest-level evidence first"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch4-defining-scope/d14"
        source: "Booth & Sutton 2022, Ch.4, p.97"
        decision: keep
        directive: "Search specialist databases of reviews or use search filters and publication-type limits for reviews to identify the highest-level evidence first."
        trigger: "When prioritising high-level evidence early in a review."
        qualification: ""
  - id: c042
    section: "STUDY SELECTION / SCREENING"
    label: "Develop and apply explicit inclusion/exclusion criteria"
    note: "variants: same protocol — define criteria (post-hoc for scoping reviews; a priori for SR), apply them transparently"
    fork_hint: false
    members:
      - id: "arksey-omalley-2005-scoping-studies/whole/d14"
        source: "Arksey & O'Malley 2005, Stage 3, pp. 8-9"
        decision: keep
        directive: "Develop inclusion and exclusion criteria post hoc, based on increasing familiarity with the literature, and then apply them to all citations to determine relevance."
        trigger: "At Stage 3 (study selection) of a scoping study."
        qualification: "This contrasts with systematic-review practice, where criteria are set at the outset; in a scoping study post-hoc criteria reflect the iterative, breadth-seeking character of the search."
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d01"
        source: "Booth & Sutton 2022, Ch.6, p.160"
        decision: keep
        directive: "Be systematic when selecting studies from your literature search results so that you exclude studies that are not relevant while ensuring that you do not miss studies that are relevant."
        trigger: "When selecting studies from a literature-search result list for inclusion in a review."
        qualification: "Justified as a way to reduce selection bias within the review."
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d02"
        source: "Booth & Sutton 2022, Ch.6, p.160"
        decision: keep
        directive: "Look at your inclusion and exclusion criteria and assess how each potentially relevant study fulfils each criterion in turn; if a study fails an inclusion criterion or meets any exclusion criterion, do not include it."
        trigger: "When applying explicit inclusion/exclusion criteria during study selection."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d44"
        source: "Booth & Sutton 2022, Ch.6, p.191 (Key learning points)"
        decision: keep
        directive: "Use the inclusion and exclusion criteria you devised earlier to select studies for your review in a transparent manner."
        trigger: "When selecting studies for inclusion in any review."
        qualification: ""
  - id: c043
    section: "STUDY SELECTION / SCREENING"
    label: "Order full text when abstract is ambiguous"
    note: "variants: do not exclude on abstract alone; screen titles before abstracts"
    fork_hint: false
    members:
      - id: "arksey-omalley-2005-scoping-studies/whole/d16"
        source: "Arksey & O'Malley 2005, Stage 3, p. 9"
        decision: keep
        directive: "If the relevance of a study is unclear from the abstract, order the full article rather than deciding from the abstract alone, since abstracts cannot be assumed to be representative of the full article or to capture its full scope."
        trigger: "When screening citations whose abstracts are ambiguous about relevance."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d06"
        source: "Booth & Sutton 2022, Ch.6, p.161"
        decision: keep
        directive: "Screen articles for inclusion by first examining titles, then moving to abstracts only for studies whose relevance you could not judge from the title alone."
        trigger: "When screening a long list of references for inclusion."
        qualification: "Where time is at a premium, reviewers often combine title and abstract screening."
  - id: c044
    section: "STUDY SELECTION / SCREENING"
    label: "Set a deadline / cutoff for inclusion"
    note: "singleton: set a stopping point and disclose later-arriving items"
    fork_hint: false
    members:
      - id: "arksey-omalley-2005-scoping-studies/whole/d17"
        source: "Arksey & O'Malley 2005, Stage 3, p. 9"
        decision: keep
        directive: "Set a deadline after which no further studies will be added to the analysis, and indicate in an appendix any articles that have not been reviewed but which may be of interest to other researchers."
        trigger: "When working under time constraints in a scoping study."
        qualification: ""
  - id: c045
    section: "STUDY SELECTION / SCREENING"
    label: "Document exclusion reasons (per stage)"
    note: "variants: record one reason at title-abstract; full reasons at full-text; report the latter"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d04"
        source: "Booth & Sutton 2022, Ch.6, p.160"
        decision: keep
        directive: "At the title-and-abstract stage, document only one main reason for excluding any reference, likely linked to your PICO criteria."
        trigger: "When excluding a reference at the title-and-abstract screening stage."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d05"
        source: "Booth & Sutton 2022, Ch.6, p.160"
        decision: keep
        directive: "Document inclusion and exclusion decisions equally rigorously at the full-text stage; choose the most immediately apparent reason for exclusion unless you want to emphasise the impact of a particular criterion."
        trigger: "When excluding a paper at the full-text screening stage."
        qualification: "If you want to highlight the impact of a particular criterion (e.g. excluding non-RCTs), you may select that reason rather than the most apparent one."
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d09"
        source: "Booth & Sutton 2022, Ch.6, p.161"
        decision: keep
        directive: "When excluding studies at the full-text stage, record reasons for exclusion of each study for the sake of transparency and to help in subsequent reporting."
        trigger: "When excluding studies at the full-text examination stage."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d42"
        source: "Booth & Sutton 2022, Ch.6, p.192 (FAQ 6.2)"
        decision: keep
        directive: "Record the reasons for exclusion at each stage of screening; in the write-up, record reasons only for studies excluded at the full-text stage, typically as an appendix list with brief reasons."
        trigger: "When deciding what exclusion documentation to keep and present in the write-up."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d27"
        source: "Booth & Sutton 2022, ch. 10, p. 325"
        decision: keep
        directive: "Cite studies that appeared to meet inclusion criteria but were excluded, and explain why they were excluded."
        trigger: "When reporting study selection in the Results section under PRISMA 2020."
        qualification: "''"
  - id: c046
    section: "STUDY SELECTION / SCREENING"
    label: "Flag uncertain inclusion decisions to user"
    note: "singleton: surface borderline calls rather than silently deciding"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d41"
        source: "Booth & Sutton 2022, Ch.6, p.192 (FAQ 6.1)"
        decision: adapt
        directive: "When you are uncertain whether to include a study, do not silently decide; flag the uncertainty to the user, restate the relevant inclusion/exclusion criteria, and ask the user (or a designated colleague) to apply the criteria as a second opinion."
        trigger: "When you are unsure whether to include a study in your review."
        qualification: ""
        original_directive: "When unsure whether to include a study, ask for a second opinion - hand the inclusion/exclusion criteria to a colleague and have them apply the criteria independently; in funded systematic reviews, double-screen at least a proportion of studies and use a third reviewer for unresolved disagreements."
  - id: c047
    section: "DATA EXTRACTION / CHARTING"
    label: "Pre-specify and pilot the data-extraction form"
    note: "variants: design and trial extraction templates; iterate before full application"
    fork_hint: false
    members:
      - id: "arksey-omalley-2005-scoping-studies/whole/d18"
        source: "Arksey & O'Malley 2005, Stage 4, pp. 9-10"
        decision: keep
        directive: "Apply a common analytical framework to all primary research reports and collect standard information on each study (the 'descriptive-analytical' method within the narrative tradition), rather than producing only a short summary or profile of each study."
        trigger: "At Stage 4 (charting the data) of a scoping study."
        qualification: "Simply producing a short summary of each study does not guarantee usefulness to readers making decisions; the descriptive-analytical method 'stands more chance of being useful'."
      - id: "arksey-omalley-2005-scoping-studies/whole/d19"
        source: "Arksey & O'Malley 2005, Stage 4, p. 10"
        decision: keep
        directive: "Chart a mixture of general information about each study (author, year, location) and specific information relating to the study population, intervention type, outcome measures and study design, on a 'data charting form'."
        trigger: "When designing the charting form for Stage 4 of a scoping study."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d12"
        source: "Booth & Sutton 2022, Ch.6, p.163"
        decision: keep
        directive: "Examine each included study in detail, taking all the meaningful information from each study (data extraction), before you start compiling and synthesising the information."
        trigger: "Once you have a list of studies meeting all inclusion criteria, before synthesis."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d43"
        source: "Booth & Sutton 2022, Ch.6, p.193 (FAQ 6.6)"
        decision: adapt
        directive: "Before applying any data-extraction or appraisal template across all included studies, trial it on a small subset (e.g., 3-5 studies), check whether it captures the needed fields and produces consistent entries, and revise the template before full application."
        trigger: "When constructing a data-extraction form (with or without combined critical appraisal)."
        qualification: ""
        original_directive: "Pilot any data extraction form (whether or not it includes critical appraisal) before using it throughout your review."
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d12"
        source: "Booth & Sutton 2022, Ch.8, p.241"
        decision: keep
        directive: "Pre-specify which elements of data are to be extracted, then examine which of those elements are present in each individual report, handling differing studies in a consistent manner."
        trigger: "When carrying out data extraction for a qualitative synthesis."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d14"
        source: "Booth & Sutton 2022, Ch.8, p.241"
        decision: keep
        directive: "Balance the granularity of the data extraction form with the quantities of relevant data; avoid both 'just-in-case' empty fields and large quantities of data lumped under broad labels."
        trigger: "When designing data-extraction forms."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d61"
        source: "Booth & Sutton 2022, Ch.8, p.270"
        decision: keep
        directive: "Picture what your final synthesis might look like before selecting data to be extracted."
        trigger: "When designing data extraction for a qualitative synthesis."
        qualification: ""
  - id: c048
    section: "DATA EXTRACTION / CHARTING"
    label: "Allow an 'unclassified' bucket in extraction"
    note: "singleton: keep room for material that doesn't fit current categories"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d13"
        source: "Booth & Sutton 2022, Ch.8, p.241"
        decision: adapt
        directive: "When summarising studies into a structured synthesis, keep an explicit 'unclassified' bucket for material that does not fit your current categories, and revisit it before concluding."
        trigger: "When designing a data extraction form for framework-style qualitative synthesis."
        qualification: ""
        original_directive: "Allow extra unlabelled fields on your data extraction form for uncoded data to which you will subsequently return."
  - id: c049
    section: "DATA EXTRACTION / CHARTING"
    label: "Extract context alongside content"
    note: "variants: keep contextual factors / relationships intact during extraction"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d17"
        source: "Booth & Sutton 2022, Ch.8, p.241"
        decision: keep
        directive: "Highlight information about contextual factors from included studies to explain differences across studies."
        trigger: "When extracting data from qualitative studies."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d22"
        source: "Booth & Sutton 2022, Ch.8, p.243"
        decision: keep
        directive: "When examining studies as a body of evidence, extract findings without losing the context and relationships within each report."
        trigger: "During preliminary analysis and interpretation of qualitative studies."
        qualification: ""
  - id: c050
    section: "DATA EXTRACTION / CHARTING"
    label: "Do not over-extract by easy bulk-paste"
    note: "singleton: keep relevance discipline when extraction is mechanically cheap"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d26"
        source: "Booth & Sutton 2022, Ch.8, p.253"
        decision: keep
        directive: "Do not let the ability to cut-and-paste blocks of text from articles into your extraction form distract you from recognising that not all data is equally relevant; revisit the review question to ensure only relevant (or potentially relevant) data is extracted."
        trigger: "When extracting qualitative data using software (e.g. NVivo) where bulk paste is easy."
        qualification: ""
  - id: c051
    section: "QUALITY ASSESSMENT"
    label: "Match QA depth to review type"
    note: "variants: depth scales with review aims; always do at least preliminary/comprehensive understanding"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d13"
        source: "Booth & Sutton 2022, Ch.6, p.163"
        decision: keep
        directive: "Match the depth of evidence-base assessment to the type and aim of your review: a systematic review needs in-depth quality assessment, while a mapping review only needs assessment sufficient to identify key characteristics."
        trigger: "When deciding how much effort to spend on assessing included studies."
        qualification: "All literature reviews benefit from some assessment; the depth scales with the review's aim."
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d14"
        source: "Booth & Sutton 2022, Ch.6, p.163"
        decision: keep
        directive: "Begin assessment by asking, 'What do I need to find out from my included studies to fulfil the aim of my literature review?'"
        trigger: "When starting to assess the evidence base."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d24"
        source: "Booth & Sutton 2022, Ch.6, pp.175-176 (LoBiondo-Wood et al., 2002, Box 6.1)"
        decision: keep
        directive: "Even if you do not undertake full quality assessment, always follow the first two stages: preliminary understanding (skim the paper) and comprehensive understanding (work up the concepts and research terms)."
        trigger: "When assessing any included study, regardless of review type."
        qualification: "Full QA also requires analysis understanding (breaking the study into parts) and synthesis understanding (making sense of relationships)."
  - id: c052
    section: "QUALITY ASSESSMENT"
    label: "Separate intrinsic from extrinsic factors in QA"
    note: "variants: discard prejudice about author/journal/funder; assess on intrinsic evidence"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d15"
        source: "Booth & Sutton 2022, Ch.6, p.166"
        decision: keep
        directive: "When deciding whether an article is worth reading, separate your factors into applicability, extrinsic factors, and intrinsic factors, and base quality assessment on the intrinsic factors using a structured checklist."
        trigger: "When triaging research articles and conducting quality assessment."
        qualification: "Quality assessment asks you to discard prejudices about extrinsic factors."
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d16"
        source: "Booth & Sutton 2022, Ch.6, p.167"
        decision: keep
        directive: "Discard prejudices about extrinsic factors (author, institution, journal, funder) when performing quality assessment."
        trigger: "When carrying out quality assessment of a study."
        qualification: ""
  - id: c053
    section: "QUALITY ASSESSMENT"
    label: "Diagnose flaws and trace impact"
    note: "variants: identify each weakness, weigh its impact on the study and on the review"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d17"
        source: "Booth & Sutton 2022, Ch.6, p.167"
        decision: keep
        directive: "Identify each weakness or flaw in every included study, and determine first its potential impact on that individual study's findings and second its implications for the findings of your review as a whole."
        trigger: "When assessing the evidence base of a literature review."
        qualification: "All studies have weaknesses; not all flaws are critical."
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d18"
        source: "Booth & Sutton 2022, Ch.6, p.167"
        decision: keep
        directive: "Be practical when performing quality assessment: do not pursue an ideal of study perfection, and judge whether a flaw with minimal impact on findings is really important."
        trigger: "When assessing the quality of an included study."
        qualification: "Avoid critical-appraisal 'nihilism'; the function of QA is application of research in practice, not perfection."
  - id: c054
    section: "QUALITY ASSESSMENT"
    label: "Ask whether the design fits the question"
    note: "singleton: early QA question — appropriate study design"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d19"
        source: "Booth & Sutton 2022, Ch.6, p.167"
        decision: keep
        directive: "Early in quality assessment, ask: 'Is this the most appropriate study design to answer this research question?'"
        trigger: "Early in the quality-assessment process for any included study."
        qualification: ""
  - id: c055
    section: "QUALITY ASSESSMENT"
    label: "Treat evidence hierarchies with caution"
    note: "variants: do not impose rigid hierarchies; consider methodological appropriateness instead"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d20"
        source: "Booth & Sutton 2022, Ch.6, p.170"
        decision: keep
        directive: "Treat hierarchies of evidence with caution: a poorly conducted RCT does not necessarily offer better evidence than a well-conducted observational study, and the most appropriate design may be limited by practical and ethical considerations."
        trigger: "When applying or relying on study-design hierarchies (e.g. OCEBM Levels of Evidence)."
        qualification: "Hierarchies are mostly health-research focused and are contested in other disciplines; consider a flexible per-question taxonomy instead (Petticrew & Roberts 2003)."
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d23"
        source: "Booth & Sutton 2022, Ch.8, p.243"
        decision: keep
        directive: "Do not implement a hierarchy of study designs; rather consider whether each method is suitable for the research question under examination."
        trigger: "When evaluating methods used by included qualitative studies."
        qualification: ""
  - id: c056
    section: "QUALITY ASSESSMENT"
    label: "Confounder identification check"
    note: "singleton: ensure confounders are addressed by analysis or stratification"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d21"
        source: "Booth & Sutton 2022, Ch.6, p.174"
        decision: keep
        directive: "When designing or appraising a study, ensure researchers have identified potential confounders at the beginning of the study and have addressed them either through analysis or stratification."
        trigger: "When assessing whether a study controls for confounding."
        qualification: ""
  - id: c057
    section: "QUALITY ASSESSMENT"
    label: "Practical vs statistical significance"
    note: "singleton: separate effect-size meaning from p-value threshold"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d22"
        source: "Booth & Sutton 2022, Ch.6, p.175"
        decision: keep
        directive: "Consider whether a study's results are practically meaningful, not only statistically significant: ask whether the effect is large enough to matter in practice."
        trigger: "When interpreting reliability and the results of a study."
        qualification: "Statistical significance uses arbitrary thresholds (typically 5%); a statistically significant change may still be too small to be practically significant."
  - id: c058
    section: "QUALITY ASSESSMENT"
    label: "Three QA questions: validity, reliability, generalisability"
    note: "variants: ask the canonical three for any included study; assess applicability separately"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d23"
        source: "Booth & Sutton 2022, Ch.6, p.175"
        decision: keep
        directive: "Once you have assessed validity and reliability, separately determine applicability by asking whether the study results are useful for the population and setting your review targets."
        trigger: "After assessing validity and reliability of an included study."
        qualification: "Applicability is concerned with the strength of recommendations for practice, not the strength of evidence itself."
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d45"
        source: "Booth & Sutton 2022, Ch.6, p.191 (Key learning points)"
        decision: keep
        directive: "When reading any included study, ask the three core quality-assessment questions: Are the results true (validity)? What are the results (reliability)? Can I generalise the results (generalisability)?"
        trigger: "When reading and assessing any individual study in a literature review."
        qualification: ""
  - id: c059
    section: "QUALITY ASSESSMENT"
    label: "QA reading order: abstract → methods → discussion"
    note: "singleton: prescribed reading flow during appraisal"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d25"
        source: "Booth & Sutton 2022, Ch.6, p.176"
        decision: keep
        directive: "Start reading a study with the abstract, then read the paper in full and rely on the Methods section to determine quality, while remembering that practical relevance often appears in the Discussion rather than the Results."
        trigger: "When working through an individual study during quality assessment."
        qualification: ""
  - id: c060
    section: "QUALITY ASSESSMENT"
    label: "Use validated QA checklists; don't roll-your-own"
    note: "variants: prefer validated/widely-used tools; adapt rather than invent; discipline-specific selection"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d26"
        source: "Booth & Sutton 2022, Ch.6, p.176"
        decision: keep
        directive: "Investigate methods used by published reviews in your topic area to understand which checklists are widely used and how authors present study features."
        trigger: "When deciding how to perform quality assessment in your discipline."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d27"
        source: "Booth & Sutton 2022, Ch.6, p.178"
        decision: keep
        directive: "Stick to checklists that have been validated or widely accepted in your discipline."
        trigger: "When choosing a quality-assessment checklist."
        qualification: "Identify the accepted checklists by examining reviews in your discipline."
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d30"
        source: "Booth & Sutton 2022, Ch.6, p.178"
        decision: keep
        directive: "Avoid devising your own quality-assessment checklist from scratch; if no suitable tool exists, adapt an existing checklist or combine criteria from existing checklists into a meta-checklist, and reference the contributing checklists."
        trigger: "When no validated checklist matches your review's needs."
        qualification: "Devising your own may indicate inadequate searching for an appropriate tool; checklist development is a science requiring its own literature review and expert panel (Whiting et al., 2017)."
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d31"
        source: "Booth & Sutton 2022, Ch.6, p.178"
        decision: keep
        directive: "If you adapt a published checklist, note the adaptation when writing up the methodology of your review."
        trigger: "When adapting a published quality-assessment checklist for your review."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d35"
        source: "Booth & Sutton 2022, Ch.6, p.186 (citing Noyes et al. 2018a)"
        decision: keep
        directive: "In the absence of a definitive risk-to-rigour tool for qualitative research, select from published, commonly used and validated tools that focus on the assessment of methodological strengths and limitations of qualitative studies."
        trigger: "When choosing a quality-assessment tool for qualitative studies."
        qualification: ""
  - id: c061
    section: "QUALITY ASSESSMENT"
    label: "Avoid scoring-based QA / quality labels"
    note: "variants: don't reduce studies to a quality score or band; if labelling, define criteria explicitly"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d28"
        source: "Booth & Sutton 2022, Ch.6, p.181"
        decision: keep
        directive: "Avoid checklists that employ scoring systems; do not label studies with quality scores."
        trigger: "When selecting or applying a quality-assessment checklist."
        qualification: "Cochrane methods guide for systematic reviews actively discourages scoring-system checklists (Higgins et al., 2021)."
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d37"
        source: "Booth & Sutton 2022, Ch.6, p.189"
        decision: keep
        directive: "Be cautious about labelling studies according to a level of quality (e.g. high, medium, low); if you do, be explicit about the criteria so the classification could be reliably reproduced."
        trigger: "When summarising study quality across a review."
        qualification: "QA is highly subjective; readers' concept of 'high quality' may differ from yours."
  - id: c062
    section: "QUALITY ASSESSMENT"
    label: "Treat checklists as guides, report features outside them"
    note: "singleton: don't let checklists cap reporting"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d29"
        source: "Booth & Sutton 2022, Ch.6, p.181"
        decision: keep
        directive: "Treat checklists as a guide, not a final answer: report study features that are not picked up by your checklist when relevant."
        trigger: "When using checklists to perform quality and relevance assessment."
        qualification: ""
  - id: c063
    section: "QUALITY ASSESSMENT"
    label: "Qualitative QA: 'risk to rigour' approach"
    note: "variants: use rigour-focused qualitative tools; support quality-based exclusions explicitly; sensitivity-analyse poor studies"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d32"
        source: "Booth & Sutton 2022, Ch.6, p.188"
        decision: keep
        directive: "When using checklists to exclude qualitative studies from a review, support all exclusions with an explicit account of the researcher's view of 'good' and 'bad' studies and reasons for exclusion."
        trigger: "When using a quality-assessment checklist to exclude qualitative studies from a review."
        qualification: "Sandelowski et al. (1997). Most qualitative reviews do not exclude studies on quality grounds."
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d33"
        source: "Booth & Sutton 2022, Ch.6, p.188"
        decision: keep
        directive: "Routinely look at the effect on the review of both including and excluding poor-quality qualitative studies (qualitative sensitivity analysis)."
        trigger: "When conducting a qualitative evidence synthesis."
        qualification: "Carroll & Booth (2015)."
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d34"
        source: "Booth & Sutton 2022, Ch.6, p.186 (citing Noyes et al. 2018a; 2021, CQIMG)"
        decision: keep
        directive: "For qualitative reviews, distinguish between assessment of study quality and assessment of risk of bias by focusing on assessment of methodological strengths and limitations as a marker of study rigour (a 'risk to rigour' approach)."
        trigger: "When performing quality assessment for a qualitative evidence synthesis."
        qualification: "Cochrane Qualitative and Implementation Methods Group recommendation."
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d18"
        source: "Booth & Sutton 2022, Ch.8, p.242"
        decision: keep
        directive: "Do not exclude an entire study on the basis of an appraisal of study quality, particularly if it contributes an important insight."
        trigger: "When deciding whether to drop a study following quality appraisal in a qualitative synthesis."
        qualification: "May not be appropriate; the 'study' is not the appropriate unit of analysis for quality appraisal in research synthesis."
  - id: c064
    section: "QUALITY ASSESSMENT"
    label: "Sensitivity analysis on study quality"
    note: "singleton: test whether conclusions change when poor studies omitted"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d38"
        source: "Booth & Sutton 2022, Ch.6, p.189"
        decision: keep
        directive: "Consider performing a sensitivity analysis to examine whether your review's results change if poor-quality studies are omitted."
        trigger: "When the review may be affected by inclusion of poor-quality studies."
        qualification: "Reviewers do not generally exclude studies on the basis of quality."
  - id: c065
    section: "QUALITY ASSESSMENT"
    label: "Treat AI-side QA judgements as drafts; surface uncertainty"
    note: "singleton: invite the user / second reviewer to adjudicate uncertain calls"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d39"
        source: "Booth & Sutton 2022, Ch.6, p.189 (citing Higgins et al. 2021)"
        decision: adapt
        directive: "Treat your own quality assessments as subjective drafts; surface the specific judgements you are least confident about and invite the user (or a designated human reviewer) to adjudicate them rather than presenting them as settled."
        trigger: "When performing quality assessment in a systematic review."
        qualification: "This is not always practical or necessary; a reasonable alternative is having a second reviewer check a sample of quality assessments, particularly elements you are unsure about."
        original_directive: "For systematic reviews, have quality assessment carried out by more than one person and compare the results."
  - id: c066
    section: "QUALITY ASSESSMENT"
    label: "Assess only what is reported in the study"
    note: "singleton: don't infer beyond the report; pursue authors only when needed"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d40"
        source: "Booth & Sutton 2022, Ch.6, p.189"
        decision: keep
        directive: "Remember that quality assessment examines what is reported within a study report, and assess only what is reported; pursue missing details from authors only when needed."
        trigger: "When QA is constrained by what the study report contains."
        qualification: "It is possible to track authors down to elicit missing details, but a good paper should include sufficient detail."
  - id: c067
    section: "QUALITY ASSESSMENT"
    label: "Discussion: name flaws but also strengths"
    note: "singleton: balance critique of included studies"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d36"
        source: "Booth & Sutton 2022, Ch.6, p.189"
        decision: keep
        directive: "In the Discussion of a review, focus on key flaws of the included studies, but do not forget to include what has been done well."
        trigger: "When writing up the Discussion of a review's quality assessment."
        qualification: ""
  - id: c068
    section: "SYNTHESIS"
    label: "Don't merely summarise — apply a common analytic frame"
    note: "variants: descriptive-analytical synthesis; juxtapose findings to make a new whole; don't list summaries"
    fork_hint: false
    members:
      - id: "arksey-omalley-2005-scoping-studies/whole/d20"
        source: "Arksey & O'Malley 2005, Stage 5, p. 10"
        decision: keep
        directive: "Present an overview of all material reviewed rather than only a small percentage of selected studies, since the scoping study aims to make all reviewed evidence visible rather than leaving non-included studies hidden."
        trigger: "At Stage 5 (collating, summarizing and reporting) of a scoping study."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d04"
        source: "Booth & Sutton 2022, Ch.8, p.236"
        decision: keep
        directive: "Recognise that the value of your review does not lie in merely identifying and bringing together related studies; juxtapose findings from different sources to spot patterns or themes not previously recognised by the original authors."
        trigger: "When conducting a qualitative review."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d06"
        source: "Booth & Sutton 2022, Ch.8, p.236"
        decision: keep
        directive: "Aim to make 'a new whole out of the parts' — produce a new line of argument, a new theory, or a new 'take home message' rather than a mere assemblage."
        trigger: "When carrying out any qualitative synthesis."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d28"
        source: "Booth & Sutton 2022, ch. 10, p. 325"
        decision: keep
        directive: "In the Discussion, summarise and evaluate the evidence by pointing out similarities and differences and offering possible explanations for inconsistencies, rather than merely listing findings."
        trigger: "When writing the Discussion section of a literature review."
        qualification: "''"
  - id: c069
    section: "SYNTHESIS"
    label: "Aggregation vs interpretation balance"
    note: "variants: balance grouping evidence with making sense of it; consider the unit of focus"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d01"
        source: "Booth & Sutton 2022, Ch.8, p.235"
        decision: keep
        directive: "When choosing your method of synthesis, balance the need to aggregate (bring studies together) with the need to interpret (make sense of findings from the studies)."
        trigger: "When selecting a method for qualitative synthesis."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d02"
        source: "Booth & Sutton 2022, Ch.8, p.235"
        decision: keep
        directive: "Consider whether your focus is on the literature as a body of work, on the individual studies, or on themes or findings within those studies."
        trigger: "When designing a qualitative synthesis."
        qualification: ""
  - id: c070
    section: "SYNTHESIS"
    label: "Include meta-method analysis (method differences explain finding differences)"
    note: "singleton: track how method choice shapes findings"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d05"
        source: "Booth & Sutton 2022, Ch.8, p.236"
        decision: keep
        directive: "Look not only for patterns in collective findings but also for differences explained by how researchers carried out the individual studies (meta-method)."
        trigger: "When synthesising findings across multiple qualitative studies."
        qualification: "Differences in methods used may explain inconsistencies in findings or suggest how best to conduct such studies in future."
  - id: c071
    section: "SYNTHESIS"
    label: "Don't aggregate weight of evidence in scoping studies"
    note: "singleton: scoping reviews don't weight evidence"
    fork_hint: false
    members:
      - id: "arksey-omalley-2005-scoping-studies/whole/d21"
        source: "Arksey & O'Malley 2005, Stage 5, p. 10"
        decision: keep
        directive: "Do not attempt to synthesize evidence or aggregate findings across studies, and do not present a view regarding the 'weight' of evidence for any particular intervention or policy."
        trigger: "When collating and reporting results in a scoping study."
        qualification: "Because the scoping study does not assess quality of evidence, it cannot determine whether particular studies provide robust or generalizable findings."
  - id: c072
    section: "SYNTHESIS"
    label: "Plan synthesis but stay flexible"
    note: "variants: have a plan; switch when patterns emerge; map similarity with exclusive categories"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d19"
        source: "Booth & Sutton 2022, Ch.8, p.242"
        decision: keep
        directive: "Plan your initial synthesis strategy before approaching the literature, but be prepared to switch from your initial strategy to an appropriate alternative as patterns from the literature become clearer."
        trigger: "Early in the synthesis stage of a qualitative review."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d20"
        source: "Booth & Sutton 2022, Ch.8, p.242"
        decision: keep
        directive: "Whatever method of synthesis you use, map similarity, ensure categories are exclusive and avoid overlap, and create secure and well-defined concepts as the building blocks of your process."
        trigger: "When carrying out qualitative synthesis."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d21"
        source: "Booth & Sutton 2022, Ch.8, p.243"
        decision: keep
        directive: "If you intend to read and review the entire body of literature, the order of papers does not matter; if you intend to sample purposively, ensure you have constructed your sampling frame appropriately."
        trigger: "When deciding the order in which to handle papers in a qualitative synthesis."
        qualification: ""
  - id: c073
    section: "SYNTHESIS"
    label: "Re-read original findings during synthesis"
    note: "variants: continually compare emerging concepts back to the original text"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d15"
        source: "Booth & Sutton 2022, Ch.8, p.241"
        decision: keep
        directive: "When synthesising qualitative research, reread the original findings to compare emerging ideas with the concepts as originally written, continually looking out for overlap, similarities and contradictions."
        trigger: "When extracting and interpreting qualitative findings during synthesis."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d16"
        source: "Booth & Sutton 2022, Ch.8, p.241"
        decision: keep
        directive: "Rather than deciding everything in advance, revisit your data extraction forms and data continuously as new interpretations emerge."
        trigger: "During interpretive qualitative synthesis where ideas/concepts are the unit of extraction."
        qualification: ""
  - id: c074
    section: "SYNTHESIS"
    label: "Actively seek disconfirming / divergent cases"
    note: "variants: same protocol — hunt outliers, negative cases, dissonance, contradictions to guard against premature closure"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d24"
        source: "Booth & Sutton 2022, Ch.8, p.244"
        decision: keep
        directive: "While synthesis steers the reader towards patterns of similarity, be particularly active in seeking the divergent or disconfirming case."
        trigger: "When moving from synthesis into full analysis and interpretation."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d27"
        source: "Booth & Sutton 2022, Ch.8, p.255"
        decision: keep
        directive: "Do not focus all your attention on constructing a 'line of argument'; pay similar attention to nuanced findings from inconsistencies or contradictions."
        trigger: "When analysing qualitative findings, given the human tendency to identify overall patterns ahead of inconsistencies or exceptions."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d32"
        source: "Booth & Sutton 2022, Ch.8, p.255"
        decision: keep
        directive: "Guard against being locked into a particular pattern (premature analytic closure) and against excluding pertinent evidence because it is inconvenient or extraneous to your theorising."
        trigger: "At the conclusion-drawing and verification stage of qualitative synthesis."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d38"
        source: "Booth & Sutton 2022, Ch.8, p.257"
        decision: keep
        directive: "Actively seek disconfirmation of what you believe to be true; sample purposively from outside the original sampling frame, bring together different perspectives within the research team, or harness other procedures to challenge the 'orthodoxy'."
        trigger: "When looking for negative evidence in qualitative synthesis."
        qualification: "Frequently overlooked because synthesis gravitates towards commonality rather than dissonance."
  - id: c075
    section: "SYNTHESIS"
    label: "Surface counter-arguments to your line of argument"
    note: "singleton: make the strongest case against your synthesis explicit"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d28"
        source: "Booth & Sutton 2022, Ch.8, p.255"
        decision: adapt
        directive: "After laying out a persuasive line of argument, explicitly enumerate the strongest objections to it from within the same evidence, and invite the user to push back on any step where the data is being shoehorned."
        trigger: "When working as a review team (or student/supervisor pair) on synthesis."
        qualification: ""
        original_directive: "Maximise opportunities to 'challenge' persuasive or seductive lines of argument; ensure those closest to the data, especially newer team members, feel able to challenge and resist interpretations into which data is inappropriately 'shoehorned'."
  - id: c076
    section: "SYNTHESIS"
    label: "Ground theories in the data"
    note: "variants: keep creativity tethered to evidence; verify themes against primary sources"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d29"
        source: "Booth & Sutton 2022, Ch.8, p.255"
        decision: keep
        directive: "Ground any theories or hypotheses in your data at all times, even though creativity is an important feature of pattern seeking and interpretation."
        trigger: "When generating theories or hypotheses from qualitative synthesis."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d31"
        source: "Booth & Sutton 2022, Ch.8, p.255"
        decision: keep
        directive: "Verify any patterns, themes, relationships, or conclusions with your primary source data to ensure that they are both accurate and confirmable."
        trigger: "When drawing or verifying conclusions in qualitative synthesis."
        qualification: ""
  - id: c077
    section: "SYNTHESIS"
    label: "Revise conclusions as new data lands"
    note: "singleton: keep conceptual models inclusive of new data"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d30"
        source: "Booth & Sutton 2022, Ch.8, p.255"
        decision: keep
        directive: "As new data is accommodated, continually revise any conclusions or conceptual models so that they continue to be inclusive."
        trigger: "When new data is incorporated during ongoing synthesis."
        qualification: ""
  - id: c078
    section: "SYNTHESIS"
    label: "Investigate over-/under-representation"
    note: "variants: probe representativeness, researcher effects, citation patterns, publication bias"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d33"
        source: "Booth & Sutton 2022, Ch.8, p.256"
        decision: keep
        directive: "When examining representativeness, ask yourself: Are any particular groups underrepresented? Overrepresented? Am I confident that the characteristics of a particular group are not misrepresented or misinterpreted?"
        trigger: "When testing or confirming review findings."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d34"
        source: "Booth & Sutton 2022, Ch.8, p.256"
        decision: keep
        directive: "Cultivate a healthy scepticism when exploring likely researcher effects in component studies (e.g. did researchers favour a particular intervention or trigger inadvertent effects via their professional identity)."
        trigger: "When testing or confirming qualitative review findings."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d47"
        source: "Booth & Sutton 2022, Ch.8, p.259"
        decision: keep
        directive: "Explore likely publication bias with regard to qualitative or theoretical/conceptual studies — e.g. by using a matrix to examine whether populations, age groups or countries are under-represented, or by brainstorming disciplines that are likely to have studied the focus of interest and comparing your list with the included studies."
        trigger: "When investigating publication bias in qualitative synthesis."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d49"
        source: "Booth & Sutton 2022, Ch.8, p.260"
        decision: keep
        directive: "When the same field's authors neglect to cite a particular author or school of thought, ask 'Why has this happened? Are other authors ignorant of particular arguments, do conflicts or tensions exist, or is this intentional?' and use such observations to inform your own analysis."
        trigger: "When examining citation patterns in theoretical/conceptual studies."
        qualification: ""
  - id: c079
    section: "SYNTHESIS"
    label: "Don't vote-count; weigh by quality"
    note: "singleton: rank by quality and look for clusters"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d35"
        source: "Booth & Sutton 2022, Ch.8, p.257"
        decision: keep
        directive: "Ensure your conclusions are not simply based on 'vote counting'; look at the effect of ordering studies from highest to lowest quality and ask whether positive or negative aspects cluster around particular points in this ranking."
        trigger: "When weighting evidence during analysis."
        qualification: "Not all studies are equal."
  - id: c080
    section: "SYNTHESIS"
    label: "Surface and explain extreme/unique findings"
    note: "variants: name outlier sources; propose alternative explanations"
    fork_hint: false
    related_to:
      - c074
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d36"
        source: "Booth & Sutton 2022, Ch.8, p.257"
        decision: adapt
        directive: "When a study reports extreme results or is the unique source of a theme, name it explicitly, propose alternative explanations for why it might differ, and either explore them in the analysis or flag them as open hypotheses."
        trigger: "When taking precautions against over-generalisation in qualitative synthesis."
        qualification: ""
        original_directive: "Examine studies that show particularly extreme results or that are a unique source of a particular theme; discuss these with colleagues and topical experts to elicit possible explanations and explore them in your analysis or as hypotheses for future research."
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d52"
        source: "Booth & Sutton 2022, Ch.8, p.261"
        decision: keep
        directive: "When individual studies differ from the overall set as genuine outliers, reconsider whether it makes sense to include them in an overarching analysis or whether to analyse them separately."
        trigger: "When handling outlier studies in qualitative synthesis."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d37"
        source: "Booth & Sutton 2022, Ch.8, p.257"
        decision: adapt
        directive: "When a source does not fit where you would have predicted within a pattern, note the surprise explicitly in your analysis (do not let it normalise), and surface it to the user as a finding worth explaining."
        trigger: "When one or more studies do not fit their anticipated place within a pattern."
        qualification: ""
        original_directive: "Do more than look for outliers when following up surprises; record surprises as you encounter them, since over time they may lose their capacity to surprise; once validated, highlight them in publications, oral presentations and press releases, and invite explanations."
  - id: c081
    section: "SYNTHESIS"
    label: "If-then testing and ruling out spurious relations"
    note: "variants: probe inferred relationships with conditional tests; consider third-variable explanations"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d39"
        source: "Booth & Sutton 2022, Ch.8, p.257"
        decision: keep
        directive: "Test possible relationships using if–then tests: if one condition is the case, look to see if a second one is; if it is, you are on the way; if not, make other conjectures."
        trigger: "When testing the strength of evidence for relationships in synthesis."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d40"
        source: "Booth & Sutton 2022, Ch.8, p.257"
        decision: keep
        directive: "After if–then testing, rule out spurious relations: consider whether a third factor or variable may explain away the apparent relationship."
        trigger: "After identifying an apparent relationship via if–then testing."
        qualification: ""
  - id: c082
    section: "SYNTHESIS"
    label: "Validate findings on a held-out / adjacent set"
    note: "singleton: replicate in adjacent literature or split-set test"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d41"
        source: "Booth & Sutton 2022, Ch.8, p.257"
        decision: adapt
        directive: "When validating a finding from a body of literature, either cross-check it against an adjacent literature where the underlying mechanism should also appear, or split your sources into a generation set and a test set and check whether the finding holds in the test set."
        trigger: "When seeking to replicate or validate a synthesised finding."
        qualification: ""
        original_directive: "Replicate findings by referring to external data sources, extending your sampling frame to an adjacent area of literature, or splitting your set of studies and using half to generate the theory and the other half to test and validate it."
  - id: c083
    section: "SYNTHESIS"
    label: "Record underlying theories per study and revisit"
    note: "singleton: track theoretical underpinnings across the synthesis"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d42"
        source: "Booth & Sutton 2022, Ch.8, p.257"
        decision: keep
        directive: "Keep your mind open to alternative explanations; record any theory underpinning each study as you extract data from it, and revisit these theories when you complete your synthesis."
        trigger: "Throughout data extraction and at completion of synthesis."
        qualification: ""
  - id: c084
    section: "SYNTHESIS"
    label: "Stress-test theoretical saturation"
    note: "singleton: sample from other disciplines/literature types"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d45"
        source: "Booth & Sutton 2022, Ch.8, p.258"
        decision: keep
        directive: "To challenge theoretical saturation, make strenuous attempts to sample from other disciplines relevant to the review question or from other types of literature."
        trigger: "When testing whether theoretical saturation in a qualitative review is genuine."
        qualification: "Authors are incentivised to report innovative insights and are not independent informants like primary-research interviewees."
  - id: c085
    section: "SYNTHESIS"
    label: "Acknowledge interpretive subjectivity / 'situated, partial, perspectival'"
    note: "variants: disclose your standpoint; reflexivity statement; explicit limitations of objectivity"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d46"
        source: "Booth & Sutton 2022, Ch.8, p.259"
        decision: keep
        directive: "Acknowledge in your analysis the likely challenges to objectivity posed by your own preoccupations and prejudices; recognise that your systematic review is 'situated, partial and perspectival' and communicate these limitations to your reader."
        trigger: "When writing the analysis/limitations of a systematic review."
        qualification: "Systematic reviews claim objectivity but only aspire to 'disciplined subjectivity'."
      - id: "arksey-omalley-2005-scoping-studies/whole/d23"
        source: "Arksey & O'Malley 2005, Stage 5, p. 11"
        decision: keep
        directive: "Retain a clarity of reporting strategy and make explicit the position, potential bias, and any subjective decisions regarding data analysis, so that the reader can determine any potential bias in reporting or recommendations."
        trigger: "When reporting findings in a scoping study."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d18"
        source: "Booth & Sutton 2022, ch. 10, p. 319"
        decision: keep
        directive: "In a qualitative evidence synthesis, include a reflexivity statement (between half a page and a full page) that describes upfront in the Methods section how the team plans to handle pre-existing biases, and retrospectively in the Results and/or Discussion sections any biases that materialised."
        trigger: "When conducting and reporting a qualitative evidence synthesis."
        qualification: "Length 'between half a page and a full page'; appears 'prospectively in the Methods section and retrospectively in the Results and/or Discussion sections.'"
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d19"
        source: "Booth & Sutton 2022, ch. 10, p. 320"
        decision: keep
        directive: "Do not treat conflict-of-interest disclosure as financial-only; make non-financial sources of bias (professional, personal, political, academic affiliations) transparent so the reader can identify where each reviewer stands relative to the intervention."
        trigger: "When writing the conflict-of-interest or bias-disclosure section of a review."
        qualification: "Make potential bias 'transparent rather than trying to eradicate it completely.'"
  - id: c086
    section: "SYNTHESIS"
    label: "Don't equate theme frequency with importance"
    note: "singleton: themes' citation count is not their weight"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d48"
        source: "Booth & Sutton 2022, Ch.8, p.260"
        decision: keep
        directive: "Do not assume that the frequency with which a particular theme is reported relates to its importance, since research papers (unlike people) have a vested interest in being different from one another."
        trigger: "When weighting themes by their frequency across qualitative papers."
        qualification: ""
  - id: c087
    section: "SYNTHESIS"
    label: "Avoid attribution to a single variable"
    note: "singleton: differences may be multi-variable interactions"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d50"
        source: "Booth & Sutton 2022, Ch.8, p.260"
        decision: keep
        directive: "Try not to attach too much importance to a single preferred variable when a difference may be attributable to the interaction of many variables."
        trigger: "When identifying disconfirming or conflicting findings across studies."
        qualification: ""
  - id: c088
    section: "SYNTHESIS"
    label: "Document and surface synthesis 'hunches'"
    note: "singleton: make intuitive leaps inspectable"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d53"
        source: "Booth & Sutton 2022, Ch.8, p.261"
        decision: adapt
        directive: "Document the intuitive leaps and assumptions behind any synthesis step you take so you can retrace them, and surface the load-bearing premises to the user for confirmation rather than burying them in the conclusion."
        trigger: "When working through the synthesis to guard against being led to a wrong conclusion."
        qualification: ""
        original_directive: "Document all your hunches and other intuitive steps in the process so you can retrace your steps and construct an alternative argument; test premises with a supervisor or mentor and check assumptions with stakeholders or user representatives."
  - id: c089
    section: "SYNTHESIS"
    label: "Don't auto-defer to disagreement; suggest research to resolve"
    note: "singleton: stand by reasoning when others disagree without grounds"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d54"
        source: "Booth & Sutton 2022, Ch.8, p.261"
        decision: keep
        directive: "Do not automatically assume that your line of reasoning is wrong just because your perceptions are not confirmed by other parties; if conflicting evidence or viewpoints persist, suggest specific research that is needed to resolve the issue."
        trigger: "When stakeholders or other parties disagree with your synthesised interpretation."
        qualification: "Your synthesised insights extend beyond those of an individual researcher immersed in a single context."
  - id: c090
    section: "REPORTING / WRITE-UP"
    label: "Present numerical and thematic mapping"
    note: "variants: dual-form reporting (counts/maps + themes); consistent template across themes"
    fork_hint: false
    members:
      - id: "arksey-omalley-2005-scoping-studies/whole/d22"
        source: "Arksey & O'Malley 2005, Stage 5, p. 10"
        decision: keep
        directive: "Present findings in two ways: first, a basic numerical analysis of the extent, nature and distribution of studies (with tables and charts mapping geography, recipient groups, interventions, methods, and effectiveness measures); second, a thematic organization of the literature."
        trigger: "When reporting the results of a scoping study."
        qualification: ""
      - id: "arksey-omalley-2005-scoping-studies/whole/d24"
        source: "Arksey & O'Malley 2005, Stage 5, p. 11"
        decision: keep
        directive: "Develop a consistent reporting 'template' and apply it to each thematic group, so that comparisons across categories, contradictory evidence, and gaps can be identified systematically."
        trigger: "When reporting thematically organized findings of a scoping study."
        qualification: ""
  - id: c091
    section: "REPORTING / WRITE-UP"
    label: "Specific, actionable research-gap recommendations"
    note: "variants: same protocol — never write 'more research is needed'; specify what, where, and how"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d02"
        source: "Booth & Sutton 2022, ch. 10, p. 310–311"
        decision: keep
        directive: "Do not write 'More research is needed'; instead specify the exact type of research and the specific question(s) the further work should address."
        trigger: "When writing recommendations for future research at the end of a review."
        qualification: "Rather than generate an endless list of priorities, picture where finite funds are best targeted; make recommendations as an honest broker, not as the potential beneficiary of future commissioned research."
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d04"
        source: "Booth & Sutton 2022, ch. 10, p. 311"
        decision: keep
        directive: "When pointing out research gaps, be as specific as possible about what is lacking — name the missing theoretical framework, the under-researched population, the absent outcome measure, or the un-investigated intervention adjustment, rather than making a generic call for more work."
        trigger: "When writing the section that highlights recommendations for future research."
        qualification: "''"
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d39"
        source: "Booth & Sutton 2022, ch. 10, p. 335–336"
        decision: keep
        directive: "When writing the 'further research' section of a decision-maker report, frame specific questions remaining to be answered together with suggested research designs, rather than writing 'further research is needed'."
        trigger: "When writing the further-research section of a 1:3:25 or analogous decision-maker report."
        qualification: "''"
  - id: c092
    section: "REPORTING / WRITE-UP"
    label: "Practice/applicability recommendations with context check"
    note: "singleton: use applicability checklists; consider context"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d03"
        source: "Booth & Sutton 2022, ch. 10, p. 310"
        decision: keep
        directive: "When writing recommendations for practice, consult an applicability or transferability checklist (e.g. FITAR or TRANSFER) and consider context explicitly, rather than assuming findings from a study population transfer to a target population."
        trigger: "When the review has identified methods or interventions you want to highlight for potential use in practice."
        qualification: "If you are a practitioner-researcher you may already be familiar with your target context; otherwise, as an external researcher, you may need to engage with stakeholders and a steering group."
  - id: c093
    section: "REPORTING / WRITE-UP"
    label: "State review's contribution type"
    note: "singleton: name which of theory testing/generation/problem solving/fact finding the review serves"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d05"
        source: "Booth & Sutton 2022, ch. 10, p. 312"
        decision: keep
        directive: "Make explicit which of the four contributions (theory testing/validation, theory generation, problem solving, or fact finding) your review is making to existing research."
        trigger: "When framing the rationale and intended contribution of an evidence synthesis."
        qualification: "The author also asks the reviewer to consider whether contributions outside these four generic headings apply."
  - id: c094
    section: "REPORTING / WRITE-UP"
    label: "Compare to prior reviews — explain differences"
    note: "singleton: focus on explaining divergence rather than eliminating it"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d08"
        source: "Booth & Sutton 2022, ch. 10, p. 313"
        decision: keep
        directive: "When multiple reviews on identical or closely related topics yield differing conclusions, focus on identifying and explaining the differences rather than on eliminating them completely."
        trigger: "When comparing your review with prior reviews of the same or closely related topic."
        qualification: "''"
  - id: c095
    section: "REPORTING / WRITE-UP"
    label: "Tailor tone to behaviour change goal (start/stop)"
    note: "singleton: pick narrative tone for desired audience action"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d10"
        source: "Booth & Sutton 2022, ch. 10, p. 314"
        decision: keep
        directive: "Adapt the tone of the accompanying narrative to the audience's current beliefs and to the behavioural change you want — start-starting, start-stopping, stop-stopping, stop-starting, or start-thinking."
        trigger: "When framing the discussion and recommendations of a review for a specific audience."
        qualification: "''"
  - id: c096
    section: "REPORTING / WRITE-UP"
    label: "Test draft against three audience questions"
    note: "singleton: do I understand it / believe it / care?"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d11"
        source: "Booth & Sutton 2022, ch. 10, p. 315"
        decision: keep
        directive: "Test your draft review against the three audience questions: 'do I understand it, do I believe it, do I care?'"
        trigger: "When checking a draft review for a specific primary audience."
        qualification: "''"
  - id: c097
    section: "REPORTING / WRITE-UP"
    label: "Audience-specific reporting formats (1:3:25, IMRAD, etc.)"
    note: "variants: same protocol — pick a layout matched to audience (funders, policy-makers, public, decision-makers)"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d12"
        source: "Booth & Sutton 2022, ch. 10, p. 316"
        decision: keep
        directive: "When writing for research funders, summarise the review as two boxes of bullet points — one for what is already known and one for what this review adds — and use that structure to construct your conclusions."
        trigger: "When writing up a review whose audience includes research funders."
        qualification: "''"
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d13"
        source: "Booth & Sutton 2022, ch. 10, p. 316"
        decision: keep
        directive: "When writing for policy-makers, address the external validity of your findings — explicitly state any limitations or reservations in applying results from elsewhere to their context."
        trigger: "When the audience for your review includes policy-makers."
        qualification: "''"
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d14"
        source: "Booth & Sutton 2022, ch. 10, p. 316"
        decision: keep
        directive: "When writing for policy-makers, write for decision support (provide answers or direction) rather than knowledge support, and prefer offering an actionable answer drawing on lower-level evidence to a non-actionable conclusion that 'robust studies are unable to provide answers'."
        trigger: "When the audience for your review includes policy-makers or decision-makers."
        qualification: "''"
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d15"
        source: "Booth & Sutton 2022, ch. 10, p. 316"
        decision: keep
        directive: "For policy-maker audiences, prefer a holistic picture addressing the full range of questions managers and policy-makers ask, over a simple lens that answers a single tightly focused question."
        trigger: "When deciding how broad to make the framing of a review whose audience includes policy-makers."
        qualification: "''"
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d16"
        source: "Booth & Sutton 2022, ch. 10, p. 316"
        decision: keep
        directive: "Consider using a graded entry format (e.g. the 1:3:25 format) rather than the IMRAD format when writing for clinicians, policy-makers, or other decision-makers."
        trigger: "When the primary audience comprises decision-makers rather than other researchers."
        qualification: "Some authors argue IMRAD may impair decision-making; the 1:3:25 format involves 1 page of take-home messages, 3 pages of executive summary, and 25 pages of full systematic review."
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d17"
        source: "Booth & Sutton 2022, ch. 10, p. 319"
        decision: keep
        directive: "When writing for the public, define the review product not just by claiming the methods are technically superior but by stressing how the review product is more useful as a result of applying these methods."
        trigger: "When communicating review results to a public audience."
        qualification: "''"
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d36"
        source: "Booth & Sutton 2022, ch. 10, p. 333"
        decision: keep
        directive: "When publicising findings to the general public, focus visual communication on the people whose lives will be changed by your findings, rather than on PRISMA flowcharts of methods."
        trigger: "When designing visuals for public-facing dissemination of a review."
        qualification: "Always use the highest quality graphics feasible."
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d37"
        source: "Booth & Sutton 2022, ch. 10, p. 335"
        decision: keep
        directive: "When writing the 'main messages' page of a 1:3:25 report, strike a balance between having something of practical importance to report and not going beyond what the review actually contains."
        trigger: "When producing a 1:3:25 report or analogous decision-maker summary."
        qualification: "''"
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d38"
        source: "Booth & Sutton 2022, ch. 10, p. 335"
        decision: keep
        directive: "Structure the executive summary using the journalistic technique of placing the most meaningful content at the top, with background, context, and less important information further down."
        trigger: "When writing the 3-page executive summary of a 1:3:25 report (or any decision-maker summary)."
        qualification: "''"
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d42"
        source: "Booth & Sutton 2022, ch. 10, p. 334"
        decision: keep
        directive: "Target dissemination tools to the specific preferences and needs of different audiences rather than assuming a single preferred format — recognise that infographics are aesthetically appealing while critical-appraisal formats are clearer and more comprehensible."
        trigger: "When choosing knowledge-dissemination and translation formats for a review."
        qualification: "Individuals differ in preferred formats by age, education, personality, and learning preferences; the same individual may prefer different formats for different purposes."
  - id: c098
    section: "REPORTING / WRITE-UP"
    label: "Title with study type"
    note: "singleton: include study-type subtitle"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d20"
        source: "Booth & Sutton 2022, ch. 10, p. 323"
        decision: keep
        directive: "Include the study type in the title — typically as a subtitle following a colon, e.g. ': a systematic review' or ': a systematic review and meta-analysis' — so retrieval, indexing, and reader expectations align."
        trigger: "When titling any systematic review, meta-analysis, rapid evidence assessment, meta-ethnography, or related review type."
        qualification: "''"
  - id: c099
    section: "REPORTING / WRITE-UP"
    label: "Abstract last; reveal don't tease"
    note: "variants: write abstract last; state findings briefly"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d21"
        source: "Booth & Sutton 2022, ch. 10, p. 323"
        decision: keep
        directive: "Write the abstract last so it reflects the final version of the review it summarises."
        trigger: "When drafting the abstract of a review."
        qualification: "''"
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d22"
        source: "Booth & Sutton 2022, ch. 10, p. 323"
        decision: keep
        directive: "Write the abstract to reveal, not tease — state findings briefly rather than promising that the review 'goes on to describe findings of critical importance'."
        trigger: "When drafting the abstract of a review."
        qualification: "''"
  - id: c100
    section: "REPORTING / WRITE-UP"
    label: "Acknowledge controversy in introduction even-handedly"
    note: "singleton: characterise both sides fairly"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d24"
        source: "Booth & Sutton 2022, ch. 10, p. 323"
        decision: keep
        directive: "If genuine controversy exists in the topic — for example, significant variations in practice — acknowledge it in the Introduction and characterise both sides as even-handedly as possible."
        trigger: "When writing the Introduction of a review whose topic involves genuine controversy."
        qualification: "''"
  - id: c101
    section: "REPORTING / WRITE-UP"
    label: "PRISMA flow diagram for any review"
    note: "variants: produce PRISMA-style flow; signal reference→paper→study transitions transparently"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d26"
        source: "Booth & Sutton 2022, ch. 10, p. 325"
        decision: keep
        directive: "Produce a PRISMA flow diagram of study selection — including numbers screened, assessed for eligibility, and included, with reasons for exclusion at each stage — and use it for any type of review, not just full systematic reviews."
        trigger: "When reporting study selection in a literature review of any type."
        qualification: "Authors note 'a PRISMA flow diagram is a useful aid for the reader for any type of review.'"
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d32"
        source: "Booth & Sutton 2022, ch. 10, p. 329"
        decision: keep
        directive: "When using a PRISMA flow diagram, signal transparently the transitions from numbers of references to numbers of papers, and from papers to studies — because duplicate references inflate reference counts and one study may appear in multiple papers."
        trigger: "When constructing or reporting a PRISMA flow diagram for a review."
        qualification: "''"
  - id: c102
    section: "REPORTING / WRITE-UP"
    label: "Discussion: locate findings in prior context"
    note: "singleton: tie back to introduction; frame as Implications-for-Practice/Research"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d29"
        source: "Booth & Sutton 2022, ch. 10, p. 325"
        decision: keep
        directive: "In the Discussion, return to what was previously known (as described in the Introduction) to locate the new results within the context of other evidence, and frame implications using 'Implications for Practice' and 'Implications for Research' rather than 'Recommendations'."
        trigger: "When writing the Discussion and conclusions of a literature review."
        qualification: "Some funders resist 'Recommendations' because they imply a commitment to follow-up actions."
  - id: c103
    section: "REPORTING / WRITE-UP"
    label: "Choose a reporting standard via the hierarchy"
    note: "singleton: walk the reporting-standard decision tree"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d31"
        source: "Booth & Sutton 2022, ch. 10, p. 322 (Box 10.4) and p. 326"
        decision: keep
        directive: "Choose a reporting standard by walking the hierarchy: first look for a standard specific to your synthesis type; if none, follow a generic standard in entirety; if not, combine sections from multiple generic standards; if not, supplement a generic standard with stage-specific guidance; if not, compile relevant items from a recent collection of review features."
        trigger: "When deciding which reporting standard or combination of standards to follow for your review."
        qualification: "Hierarchy outlined for qualitative reviews (Flemming et al., 2018) but offered as the basis for the chapter's general checklist."
  - id: c104
    section: "REPORTING / WRITE-UP"
    label: "Tables placement and editing discipline"
    note: "variants: appendices for full extraction; in-body for summaries; edit out filler"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d33"
        source: "Booth & Sutton 2022, ch. 10, p. 329"
        decision: keep
        directive: "Place fully reported data extraction tables in an appendix to increase the auditability of the review, while keeping summary tables of fewer than 20 included studies inside the main body."
        trigger: "When deciding placement of tables in a review report."
        qualification: "Summary tables 'are typically included within the main body of the text unless your review includes more than 20 included studies.'"
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d57"
        source: "Booth & Sutton 2022, Ch.8, p.264"
        decision: keep
        directive: "Choose a natural order for listed studies in tables (e.g. chronological, reverse chronological, geographical region) to support the accompanying narrative; if no obvious order, use author surname then date so the reader can locate familiar studies quickly."
        trigger: "When constructing tables of included studies."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d58"
        source: "Booth & Sutton 2022, Ch.8, p.264"
        decision: keep
        directive: "Edit table content carefully — strip out unnecessary text (e.g. 'This study was conducted in'), standardise the format and detail across studies, and avoid splitting tables and cells across pages."
        trigger: "When preparing tables of included studies for a review."
        qualification: ""
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d59"
        source: "Booth & Sutton 2022, Ch.8, p.264"
        decision: keep
        directive: "Standardise inconsistent data under common labels where appropriate to help identify patterns across columns, but not where labels carry meaningful distinctions or where the labels used by authors are themselves the focus of study."
        trigger: "When tabulating data from heterogeneous studies."
        qualification: "Categorising 'Survey design', 'Survey questionnaire' and 'Survey' under 'Survey' is appropriate; conflating 'Third World', 'Developing Countries' and 'Low- and Middle-Income Countries' may not be."
  - id: c105
    section: "REPORTING / WRITE-UP"
    label: "Forest-plot orientation/caption checks"
    note: "singleton: verify direction, caption, point-of-no-effect notation"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d34"
        source: "Booth & Sutton 2022, ch. 10, p. 329–330"
        decision: keep
        directive: "When relabelling or redrawing a forest plot, check the orientation (is more of an outcome better or worse?), the caption (what exactly is the outcome?), and the notation for the point of no effect (one for ratios, zero for differences)."
        trigger: "When preparing forest plots from meta-analysis software for publication."
        qualification: "''"
  - id: c106
    section: "REPORTING / WRITE-UP"
    label: "Compile references as you go"
    note: "singleton: maintain reference list throughout"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d35"
        source: "Booth & Sutton 2022, ch. 10, p. 330"
        decision: keep
        directive: "Compile your reference list as you identify each new item, rather than waiting for the end of the review."
        trigger: "Throughout the conduct of any literature review."
        qualification: "''"
  - id: c107
    section: "REPORTING / WRITE-UP"
    label: "EPICOT+ for research recommendations"
    note: "singleton: structure future-research recs with EPICOT+"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d40"
        source: "Booth & Sutton 2022, ch. 10, p. 336–337"
        decision: keep
        directive: "When formulating research recommendations, structure them using EPICOT+ — Evidence (current state), Population, Intervention, Comparison, Outcome, Time stamp — with optional disease burden, time aspects, and study type as needed."
        trigger: "When writing the research recommendations section of a review of treatment effects."
        qualification: "EPICOT was proposed for treatment-effects recommendations specifically; the optional elements are Disease burden, Time aspect, and Study type."
  - id: c108
    section: "REPORTING / WRITE-UP"
    label: "Empty-review reporting discipline"
    note: "singleton: don't smuggle in non-eligible evidence; use the empty review to highlight gaps"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch10-writing-prisma/d41"
        source: "Booth & Sutton 2022, ch. 10, p. 339"
        decision: keep
        directive: "If the review comes up empty, do not endorse conclusions based on excluded or non-eligible studies, on other unrelated evidence, or on no evidence at all."
        trigger: "When writing the conclusions of an 'empty' review (one that found no eligible studies)."
        qualification: "Use the empty review instead to highlight major gaps and to provide specific research-design recommendations."
  - id: c109
    section: "REPORTING / WRITE-UP"
    label: "Limitations: explain consequences, not just list them"
    note: "singleton: spell out impact of methodological limits on findings"
    fork_hint: false
    members:
      - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d56"
        source: "Booth & Sutton 2022, Ch.8, p.267"
        decision: keep
        directive: "Do not simply list systematic errors and associated problems with validity when discussing review limitations; explain the meaning of any errors and their likely influence so the audience gains a clear picture of how methodological limitations impact on the findings."
        trigger: "When writing up the limitations of a qualitative review."
        qualification: ""
  - id: c110
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Cross-discipline / cross-area methodological transfer"
    note: "variants: bring tools/considerations from another sub-area when one is stuck"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch1-dever-what-is-philosophical-methodology/d01"
        source: "Dever 2016, 'What is Philosophical Methodology?', §9 'Eliminatedivism', p. 20"
        decision: keep
        directive: "Be on the lookout for the relevance of considerations from one philosophical sub-discipline (e.g. epistemology) to questions in another (e.g. philosophy of language), rather than allowing your work to reside entirely within one subdiscipline."
        trigger: "When working on a question within any single philosophical sub-discipline."
        qualification: "There is no recipe specifying precisely when to invoke considerations from another sub-discipline; this guidance functions only as a loose aphorism, calling for skillful receptiveness rather than rule-following."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch1-dever-what-is-philosophical-methodology/d02"
        source: "Dever 2016, 'What is Philosophical Methodology?', §8 'Interlude: The Puzzle Solved' and §9, pp. 18-20"
        decision: keep
        directive: "When a problem appears intractable within the area in which it was first posed, try recharacterizing it in another area and bringing that other area's resources to bear on it."
        trigger: "When a question or problem in one philosophical (or analogous theoretical) sub-area resists progress under the methods native to that area."
        qualification: "The relations between sub-areas do not form a pre-given hierarchy; the redirection is part of an ongoing attempt to do better work, not the tracing of a fixed dependency structure, and there is no rule specifying when such redirection will succeed."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d04"
        source: "Hájek 2016, ch. 19, p. 349"
        decision: keep
        directive: "Beget new arguments out of old by exploiting analogies between domains (e.g., space, time, and modality; rationality and morality)."
        trigger: "When looking for new arguments or counterexamples in a target domain that resembles one for which arguments are already known."
        qualification: ""
  - id: c111
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Counterexample search via extreme/edge cases"
    note: "variants: extreme, near-extreme, self-referential, trial-and-error enumeration"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d01"
        source: "Hájek 2016, ch. 19, p. 349"
        decision: keep
        directive: "Check extreme cases, and near-extreme cases."
        trigger: "When searching for counterexamples to a thesis or analysis."
        qualification: "Heuristic only — a defeasible guide that tends to work, not a sure-fire recipe; reduces but does not eliminate the search space."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d02"
        source: "Hájek 2016, ch. 19, p. 349"
        decision: keep
        directive: "Plug a function into itself as its own argument, and more generally appeal to self-referential cases ('death by diagonalization')."
        trigger: "When constructing arguments or counterexamples about functions, predicates, or domains that include themselves."
        qualification: "Defeasible — 'it worked for Cantor, Russell, and Gödel; it may work for you.'"
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d03"
        source: "Hájek 2016, ch. 19, p. 349"
        decision: keep
        directive: "Check whether a philosophical position or argument that falls in the very domain it purports to cover treats itself consistently."
        trigger: "When evaluating a philosophical position or argument whose subject matter includes positions or arguments of its own kind."
        qualification: ""
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d05"
        source: "Hájek 2016, ch. 19, p. 349"
        decision: keep
        directive: "When ingenuity fails, run systematically through the relevant cases by trial and error until you find one that meets your needs."
        trigger: "When you cannot see by insight which case will do the work, and the relevant cases can be enumerated."
        qualification: ""
  - id: c112
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Definite/indefinite-description checks"
    note: "variants: probe uniqueness/existence/indeterminacy under 'the F' / 'a(n) F' / paraphrased forms"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d06"
        source: "Hájek 2016, ch. 19, §1.1, p. 350"
        decision: keep
        directive: "When a philosophical thesis or analysis involves a definite description 'the F', ask (i) whether there are or could be multiple F's, and (ii) whether there are or could be no F's."
        trigger: "Whenever a thesis or analysis is phrased using a definite description ('the F')."
        qualification: "These two sub-tasks correspond to tests for uniqueness and existence familiar from mathematics; the heuristic breaks the hard task of looking for problem cases into two easier ones."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d07"
        source: "Hájek 2016, ch. 19, §1.2, p. 352"
        decision: keep
        directive: "When a philosophical thesis or analysis involves an indefinite description 'a(n) F', ask whether there are or could be no F's."
        trigger: "Whenever a thesis or analysis is phrased using an indefinite description ('a(n) F')."
        qualification: "Falling back from a definite to an indefinite description does not rescue an analysis whose existence presupposition fails."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d08"
        source: "Hájek 2016, ch. 19, §1.3, p. 352"
        decision: keep
        directive: "When a definite or indefinite description may be lurking in disguise, expose it by paraphrase before applying the uniqueness/existence checks."
        trigger: "When a thesis or analysis does not literally use 'the' or 'a(n)' but may presuppose uniqueness or existence under paraphrase (e.g., 'maximize' paraphrased as 'achieve the greatest amount')."
        qualification: ""
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d09"
        source: "Hájek 2016, ch. 19, §1.4, p. 353"
        decision: keep
        directive: "Check whether the count of F's, or whether 'the F' has a determinate referent, may itself be indeterminate — not merely zero or many."
        trigger: "When a thesis appeals to 'the F' or 'a(n) F' and ordinary uniqueness/existence checks do not yield a problem case."
        qualification: ""
  - id: c113
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Arbitrariness as a flaw signal; symmetry-breaking response"
    note: "variants: arbitrary choice = prima facie problem; respond via symmetry-breaking first"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d10"
        source: "Hájek 2016, ch. 19, §2, pp. 353–354"
        decision: keep
        directive: "Treat arbitrariness in a philosophical position's choice among multiple equally good candidates as a prima facie sign of a flaw in the position."
        trigger: "When a philosophical position must select one item from multiple candidates that all appear to satisfy the relevant role equally well."
        qualification: "Not all arbitrary choices are fatal: choices that are 'partly' arbitrary (where some setting must be made and a range of reasonable settings exists) are typically not troubling."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d11"
        source: "Hájek 2016, ch. 19, §2.3, p. 359"
        decision: keep
        directive: "When responding to arbitrariness, look first to symmetry-breaking strategies, and only when they fail to leave just one candidate standing, look to symmetry-preserving strategies over the candidates that remain."
        trigger: "When choosing among the available responses to a philosophical position threatened by arbitrariness."
        qualification: "Different cases require different responses, and case-by-case philosophical judgement remains necessary; Hájek does not have a heuristic for deciding which response to use."
  - id: c114
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Do the opposite / turn things around"
    note: "variants: invert quantifiers, dualize, take converse configurations"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d12"
        source: "Hájek 2016, ch. 19, §2.2.6, p. 358"
        decision: keep
        directive: "Do the opposite: take some approach to a problem and follow the opposite, dual, or complementary approach (e.g., replace universal quantifiers by existential, necessities by possibilities, conjunctions by disjunctions, parameter values by complementary values)."
        trigger: "When a philosophical approach is on the table and you wish to canvass alternatives or generate new approaches."
        qualification: "Self-cautioned by the 'see definite descriptions in neon lights' heuristic — this assumes there is exactly one such opposite approach."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d20"
        source: "Hájek 2016, ch. 19, §4.1, p. 365"
        decision: keep
        directive: "Turn things around: take the configuration of a problem (e.g., which side of an analysis comes in degrees) and consider the converse configuration."
        trigger: "When you have analyzed a problem under one orientation and want to canvas its dual."
        qualification: "Hájek labels this 'another philosophical heuristic in its own right.'"
  - id: c115
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Continuity reasoning with bidirectional sanity check"
    note: "variants: small input → small output expected; check the metric; beware unbridled slope"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d13"
        source: "Hájek 2016, ch. 19, §3.1, pp. 359–360"
        decision: keep
        directive: "Apply continuity reasoning: when one variable is a function of another, treat small changes in the input as a reason to expect small changes in the output, and treat large output changes from small input changes as suspect."
        trigger: "When evaluating a thesis or argument that maps similar inputs (cases, persons, premises) to dissimilar outputs (verdicts, treatments, solutions)."
        qualification: ""
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d14"
        source: "Hájek 2016, ch. 19, §3.1, p. 360"
        decision: keep
        directive: "Beware of the slippery slope from unbridled continuity reasoning: check whether the same continuity premise can be run in the opposite direction, since driving it both ways yields a contradiction."
        trigger: "When wielding a continuity-based or slippery-slope argument."
        qualification: "Continuity reasoning is nonetheless a useful heuristic; the warning is against unbridled use, not against use itself."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d15"
        source: "Hájek 2016, ch. 19, §3.1, p. 360"
        decision: keep
        directive: "When deploying continuity-based arguments, make explicit the metric of 'distance' (numerical or at least more than a comparative ordering) by which similarity is being judged, and consider whether the choice of metric is itself arbitrary."
        trigger: "When the persuasive force of an argument depends on cases being 'similar' or 'nearby'."
        qualification: "The metric need not be numerical, but it must be more than merely a comparative ordering."
  - id: c116
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Outsource philosophy to mathematics, but spell out premises"
    note: "variants: import maths theorems; identify ancillary philosophical premises in any maths→phil derivation"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d16"
        source: "Hájek 2016, ch. 19, §3.2, pp. 361–362"
        decision: keep
        directive: "Outsource philosophical work to mathematics where possible: import established theorems involving continuity (e.g., the intermediate value theorem, Brouwer's fixed point theorem) to do philosophical work."
        trigger: "When a philosophical problem can be cast in terms of continuous functions on suitable spaces."
        qualification: "Subject to Benacerraf's caution about deriving philosophical conclusions from mathematical theorems."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d17"
        source: "Hájek 2016, ch. 19, §3.3, p. 363"
        decision: keep
        directive: "When somebody purports to establish a philosophical thesis with a mathematical theorem, identify and spell out the ancillary philosophical premises they have assumed."
        trigger: "When evaluating an argument that purports to derive a philosophical conclusion from a mathematical theorem."
        qualification: "Hájek calls this a good philosophical heuristic in its own right; spelling out the premises clarifies what the argument really should be and fixes targets for further debate."
  - id: c117
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Degree-mismatch diagnostic for analyses; tollense vs ponens"
    note: "variants: check analysandum/analysans degree mismatch; consider running argument tollens"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d18"
        source: "Hájek 2016, ch. 19, §4, pp. 364–365"
        decision: keep
        directive: "Diagnose putative analyses by checking for a mismatch of degrees between analysandum and analysans (one side coming in degrees while the other does not, or admitting borderline cases while the other does not)."
        trigger: "When evaluating a putative philosophical analysis of a concept C."
        qualification: ""
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d19"
        source: "Hájek 2016, ch. 19, §4.1, p. 365"
        decision: keep
        directive: "Tollense where others ponens: when faced with a valid argument whose conclusion you reject, consider running it as a modus tollens against one of its premises rather than as a modus ponens to its conclusion."
        trigger: "When confronting an argument whose conclusion is unwelcome but whose form is valid."
        qualification: ""
  - id: c118
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Failed analysis as residual heuristic"
    note: "singleton: a refuted analysis can still guide central cases"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d21"
        source: "Hájek 2016, ch. 19, §4.2, p. 366"
        decision: keep
        directive: "Treat a bad analysis as a potentially good heuristic: even when an analysis fails to give necessary and sufficient conditions, it may still be a reliable enough guide to the analysandum to serve as a useful way to think about the associated concept."
        trigger: "When a philosophical analysis has been refuted or is widely regarded as failed."
        qualification: "It will typically not be a total failure — it typically gets a wide range of central cases right, otherwise it would never have seen the light of day; but good rules of thumb are not the last word."
  - id: c119
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Replace hard notions with tractable surrogates"
    note: "variants: probability→frequency; intensional→extensional; hard→easier-to-think-with"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d22"
        source: "Hájek 2016, ch. 19, §5, pp. 366–367"
        decision: keep
        directive: "Translate a probability problem into a parallel frequency problem (or pretend that probabilities are frequencies) when reasoning probabilistically."
        trigger: "When working through a probability problem prone to base-rate neglect or other probabilistic confusions."
        qualification: "This is a heuristic, not a metaphysical claim — probabilities are not frequencies; frequentist thinking is just a good heuristic for probabilistic thinking."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d23"
        source: "Hájek 2016, ch. 19, §5, pp. 367–369"
        decision: keep
        directive: "Replace non-extensional notions (intensional and hyperintensional) with extensional surrogates when reasoning."
        trigger: "When reasoning about modal, counterfactual, indeterminacy, conditional, property-theoretic, normative, or other non-extensional notions that are opaque to natural thought."
        qualification: "The surrogate need not provide an analysis or reduction; the heuristic is analytically and metaphysically innocent. One must be careful that the distance between original and surrogate is not so great that the surrogate misguides; in 'an especially happy replacement', the replaceans has the same logic as the replaceandum."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d24"
        source: "Hájek 2016, ch. 19, §5, p. 369"
        decision: keep
        directive: "More generally, replace hard notions with easier surrogates — concepts that come more naturally to us, e.g., that are expressible using first-order logic and set theory."
        trigger: "When grappling with a concept that confounds you and a more tractable close relative is available."
        qualification: "Be careful that there is not too much distance between the original concept and its surrogate; otherwise the surrogate will misguide you. Good rules of thumb are not the last word."
  - id: c120
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Visualise relationships in diagrams"
    note: "singleton: render obscure conceptual relationships visually"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d25"
        source: "Hájek 2016, ch. 19, §6, pp. 369–370"
        decision: adapt
        directive: "When conceptual relationships are obscure, render them in a text-representable visual form (ASCII Venn/causal/Kripke diagrams, structured tables, or step-by-step verbal descriptions of the diagram's regions and relations) rather than relying solely on prose; pair with the extensional-surrogate move when applicable."
        trigger: "When conceptual relationships are obscure when cloaked in words or symbols, or when checking the validity of an inference."
        qualification: "Works particularly well in tandem with the 'replace non-extensional with extensional' heuristic: translate first, then diagram."
        original_directive: "Draw a picture: represent conceptual relationships visually (e.g., Venn diagrams for set-theoretic relationships, Kripke diagrams for modal systems, neuron diagrams or causal networks for causation, Minkowski diagrams for relativity)."
  - id: c121
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Self-consistency / unwelcome-consequence checks on outputs"
    note: "singleton: routine consistency audit of philosophical products"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d26"
        source: "Hájek 2016, ch. 19, §7, p. 370"
        decision: keep
        directive: "When doing philosophy, check the products of your work (intuitions deployed, arguments analyzed, definitions refined, normative constraints adduced) for consistency and for unwelcome consequences."
        trigger: "When collecting, deploying, or systematizing intuitions; analyzing arguments; conducting thought experiments; refining definitions; or adducing normative constraints."
        qualification: "Logic is the great tool for this but is by no means the only tool — the heuristics collectively form a Swiss army knife alongside it."
  - id: c122
    section: "PHILOSOPHICAL / HISTORIOGRAPHICAL READING"
    label: "Prefer middling-generality heuristics"
    note: "singleton: heuristic-design principle"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d27"
        source: "Hájek 2016, ch. 19, §7, p. 371"
        decision: keep
        directive: "Prefer heuristics of middling generality — general enough to be applicable in a wide range of cases, but specific enough to have real bite."
        trigger: "When selecting or formulating a heuristic to teach, deploy, or include in one's repertoire."
        qualification: "Heuristics can vary considerably in generality among themselves and still earn their keep — the criterion is not uniform middling generality but avoidance of the extremes ('make an insightful point!' is too general; 'when someone argues that space is purely relational, reply with Kant's problem of incongruous counterparts!' is too specific)."
  - id: c123
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Reconstruct the question before paraphrasing the answer"
    note: "variants: same protocol — recover the problem-context the writer was answering before reconstructing or appraising arguments"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d28"
        source: "Skinner 2002, ch. 4, p. 101"
        decision: keep
        directive: "Reconstruct the specific question to which a writer's doctrine was intended as a solution before critically examining the doctrine."
        trigger: "When interpreting a doctrine in a classic philosophical text."
        qualification: ""
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d01"
        source: "Beiser 2016, ch. 26 sec. 3, p. 511"
        decision: keep
        directive: "Identify the problem behind a passage — the question the author is attempting to answer — before reconstructing or appraising its arguments."
        trigger: "When applying the analytic method to a philosophical text."
        qualification: "Beiser endorses this rule but holds that, applied without historical scholarship, it will misfire on texts from distant epochs, languages, and cultures."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d02"
        source: "Beiser 2016, ch. 26 sec. 3, p. 511"
        decision: keep
        directive: "Reconstruct the arguments the author gives for the solution by formulating them into premises and conclusion."
        trigger: "When analyzing a philosophical text's argumentative content."
        qualification: "Reconstruction must draw on knowledge of historical context and content; reading a text in isolation risks missing key variables (meaning of central terms, hidden presuppositions, underlying problems)."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d08"
        source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, pp. 33-34"
        decision: keep
        directive: "Account for which questions philosophers in the past did and did not ask, and what they would have taken to be satisfactory answers — not only the answers themselves."
        trigger: "When studying any historical philosophical milieu."
        qualification: "Some past questions may no longer be reasonably askable; some present questions may have been unaskable in the past."
  - id: c124
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Internal critique by author's own goals/standards"
    note: "variants: appraise via internal criteria (validity, evidence sufficiency, achievement of intent)"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d03"
        source: "Beiser 2016, ch. 26 sec. 3, p. 511"
        decision: keep
        directive: "Appraise reconstructed arguments by determining their formal validity and the quality of the evidence for them."
        trigger: "After reconstructing the arguments of a philosophical text."
        qualification: "Appraisal should proceed by internal critique using the author's own goals and standards, not external criteria assumed to be universal."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d12"
        source: "Beiser 2016, ch. 26 sec. 4, pp. 516-517"
        decision: keep
        directive: "Criticize a text by internal or immanent critique — according to the goals and standards of the author himself — rather than by an external standard purporting to be a universal criterion of reason."
        trigger: "When evaluating the truth or soundness of a historically-distant philosophical text."
        qualification: "Internal critique permits only falsification, not verification: it can reject a standpoint but cannot tell us which standpoint is true."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d13"
        source: "Beiser 2016, ch. 26 sec. 4, p. 517"
        decision: keep
        directive: "When conducting internal critique, examine whether the author achieves his own goals, gives sufficient evidence for his premises, whether his premises entail his conclusions, and whether his meaning is ambiguous."
        trigger: "When applying internal critique to a philosophical text."
        qualification: "All aspects of the formal structure of a text, as well as whether the author follows his intentions, are fair game; consistency is one but not the only dimension."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d18"
        source: "Beiser 2016, ch. 26 sec. 5, p. 520"
        decision: keep
        directive: "When the author's intention is known, additionally appraise whether the argument achieves the purpose he or she intended — whether, if true, it would fully establish what the author intended."
        trigger: "When the historian has identified the author's purpose behind an argument."
        qualification: "This added dimension of appraisal does not commit the genetic fallacy: asking whether an argument serves an author's ends differs from disregarding it because one disapproves of those ends."
  - id: c125
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Don't bypass historical scholarship with armchair imagination"
    note: "variants: required historical context for interpretation; multi-language consultation"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d04"
        source: "Beiser 2016, ch. 26 sec. 3, p. 512"
        decision: keep
        directive: "Do not attempt to reconstruct or appraise a text's arguments without sound knowledge of its historical context and content."
        trigger: "When interpreting any philosophical text — especially one from a distant epoch, language, or culture."
        qualification: "Beiser concedes the analytic method 'is likely to work best on texts within our own culture and recent historical past'; the prohibition is strongest for texts from very different epochs, languages, and cultures."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d05"
        source: "Beiser 2016, ch. 26 sec. 3, p. 512"
        decision: keep
        directive: "Do not substitute armchair imagination or intuitions about 'what the author could possibly mean' for historical scholarship."
        trigger: "When tempted to bypass historical research by extrapolating from one's own conceptual repertoire."
        qualification: "The prohibition rests on the claim that there is no a priori reason to expect contemporary imagination to exhaust the discourse and practices of another culture."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d06"
        source: "Beiser 2016, ch. 26 sec. 3, pp. 512-513"
        decision: adapt
        directive: "When interpreting a philosophical text written in a language other than the conversation's working language, consult the original-language text and compare multiple translations rather than relying on a single translator's rendering; flag where translation choices materially affect interpretation."
        trigger: "When interpreting a philosophical text written in a language other than one's own."
        qualification: "Beiser cites Kristeller's strong form (no Greek = no validity) and extends it to French and German philosophy; the rationale is that meaning depends on language and context, and translations always contain mistakes and offer only one decipherment."
        original_directive: "When working on philosophy in another language, learn the language and study the culture rather than relying on a division of labor with translators."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d09"
        source: "Beiser 2016, ch. 26 sec. 4, p. 515"
        decision: keep
        directive: "Identify the historical context behind a text in two dimensions: the intellectual (what contemporaries and predecessors wrote on the same topic) and the social-political (the current crises, problems, and conflicts of the author's culture)."
        trigger: "When undertaking historical interpretation of a philosophical text."
        qualification: "Beiser endorses this rule but warns that, taken alone as a complete or sufficient guide, the historicist rules reduce the history of philosophy to history alone."
  - id: c126
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Charity before critique; intelligibility presumption"
    note: "variants: same protocol of interpretive charity — seek coherence and unity, accept incoherence only with explanation, presume face-value meaning, prefer making-sense reading; defer criticism until charity has been exhausted; extends Davidsonian charity to historical texts"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d07"
        source: "Beiser 2016, ch. 26 sec. 3, p. 514"
        decision: keep
        directive: "Apply the principle of interpretive charity — seek coherence and unity in a text — before criticizing it."
        trigger: "When beginning interpretation of a philosophical work."
        qualification: "The principle is regulative, not constitutive: proceed as if the work were a rational whole; if apparent inconsistencies persist after the most concerted attempt to find unity and clarity, they are then taken to be real."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d08"
        source: "Beiser 2016, ch. 26 sec. 3, p. 515"
        decision: keep
        directive: "Do not criticize prematurely; the most compelling criticisms come after the deepest sympathy and charity."
        trigger: "When formulating criticisms of a philosophical text."
        qualification: "Beiser's complaint about Strawson and Bennett is that they 'shoot first and ask questions later'; charity is not a bar to criticism but a precondition for non-superficial criticism."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d04"
        source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, p. 33"
        decision: keep
        directive: "Make the texts you study intelligible to yourself and your audience; accept an interpretation on which the text does not make sense only if you have an explanation for why it might not (e.g. textual corruption, deliberate or inadvertent incoherence)."
        trigger: "When proposing an interpretation of a historical philosophical text."
        qualification: "When such an explanation is offered, the historian is then studying the text only to access another implicit text the author really wrote or would have written but for extra-philosophical factors."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d05"
        source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, p. 33"
        decision: keep
        directive: "If there is an interpretation that makes sense of the text, prefer it to a search for an implicit text behind the text at hand."
        trigger: "When weighing a face-value reading of a text against a 'hidden' or 'coded' reading."
        qualification: "Normore later notes (pp. 42-43) that Strauss-influenced readings adopting a 'hermeneutics of suspicion' challenge this default; the priority of the face-value interpretation is therefore a defeasible default rather than an absolute."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d11"
        source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, p. 42"
        decision: keep
        directive: "Treat as a default presumption that a text means what it seems to mean and that a philosopher accepts what that philosopher asserts."
        trigger: "When interpreting any philosophical text."
        qualification: "The presumption is plausible but defeasible; it has been challenged within the History of Philosophy, notably by Leo Strauss and his followers, who would have it that a 'hermeneutics of suspicion' should be applied in contexts where a reasonable person who believed p would not assert p."
      - id: "davidson-1984-inquiries/conceptual-scheme/d09"
        source: "Davidson 1984, 'On the Very Idea of a Conceptual Scheme', pp. 196-197"
        decision: adapt
        directive: "When interpreting the user, count them right on most matters by default; treat charity not as optional generosity but as a precondition for any workable interpretation, while still leaving room for explicable error."
        trigger: "Whenever attempting to understand another speaker's words and thoughts."
        qualification: "Charity does not aim to eliminate disagreement but to make meaningful disagreement possible; it leaves room for explicable error and differences of opinion."
        original_directive: "When interpreting others, count them right in most matters; apply charity not as an option but as a precondition for any workable theory of interpretation."
      - id: "davidson-1984-inquiries/conceptual-scheme/d10"
        source: "Davidson 1984, 'On the Very Idea of a Conceptual Scheme', p. 197"
        decision: adapt
        directive: "When choosing among candidate readings of what the user said, prefer the reading that optimizes (not maximizes) agreement between your view and theirs, leaving explicit room for differences of opinion you can explain."
        trigger: "When choosing among candidate interpretations of another speaker's words and thoughts."
        qualification: "Optimizing agreement is not maximizing it without remainder; the policy explicitly accommodates differences of opinion that can be explained."
        original_directive: "Interpret in a way that optimizes agreement between interpreter and speaker, while leaving room for explicable error."
      - id: "davidson-1984-inquiries/introduction/d04"
        source: "Davidson 1984, Introduction, pp. xvi-xvii (pdf 19-20)"
        decision: keep
        directive: "Apply the Principle of Charity across the board when interpreting a speaker, since evidence about credence to sentences does not on its own separate the contributions of belief and meaning."
        trigger: "When interpreting a speaker's verbal behaviour, especially when one cannot rely on Quine's notion of stimulus meaning to fix the interpretation of particular sentences."
        qualification: "Davidson rejects 'minimize disagreement' / 'maximize agreement' as the goal — this is 'a confused ideal'; the aim is understanding, secured by interpreting in a way that makes for 'the right sort of agreement', which is no easier to specify than what counts as a good reason for a belief."
      - id: "davidson-1984-inquiries/radical-interpretation/d10"
        source: "Davidson 1984, 'Radical Interpretation' (Essay 9), pp. 135-136"
        decision: adapt
        directive: "When choosing among candidate interpretations of the user's utterance, prefer the one that makes the largest share of their stated commitments come out true by your own lights, while allowing for intelligible error and weighting more-likely mistakes accordingly."
        trigger: "When selecting among candidate theories of truth that fit the evidence about which sentences speakers hold true."
        qualification: "Maximization cannot be taken literally because sentences are infinite in number; once the theory takes shape it makes sense to accept intelligible error and to make allowance for the relative likelihood of various kinds of mistake."
        original_directive: "Choose the theory of truth that maximizes agreement — that makes the speaker right, by our own standards, as often as possible — subject to the formal constraints on a theory of truth."
      - id: "davidson-1984-inquiries/radical-interpretation/d11"
        source: "Davidson 1984, 'Radical Interpretation' (Essay 9), p. 137"
        decision: adapt
        directive: "When the user's wording is ambiguous or apparently false, hold their beliefs constant as far as possible and adjust your reading of what their words mean, choosing the interpretation that makes them right where plausibly possible by your own standards."
        trigger: "When facing the joint underdetermination of belief and meaning during interpretation."
        qualification: "What justifies the procedure is that disagreement and agreement alike are intelligible only against a background of massive agreement; it is not a charitable assumption about human intelligence that could turn out false but a precondition for treating a creature as rational, as having beliefs, or as saying anything."
        original_directive: "Solve for meaning by holding belief constant as far as possible — assign truth conditions to alien sentences that make native speakers right when plausibly possible, by our own view of what is right."
      - id: "davidson-1984-inquiries/radical-interpretation/d12"
        source: "Davidson 1984, 'Radical Interpretation' (Essay 9), pp. 136-137"
        decision: adapt
        directive: "Apply the charity heuristic across all of the user's sentences, not only to logical connectives or obvious tautologies; do not restrict charitable reading to a privileged sub-class of utterances."
        trigger: "When deciding the scope over which to apply charity in interpretation."
        qualification: "This is explicitly contrasted with Quine, who emphasizes charity only in connection with the (pure) sentential connectives."
        original_directive: "Apply the principle of charity across the board — to all sentences — not merely to the identification of the sentential connectives."
  - id: c127
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Recover author intent and standpoint"
    note: "variants: identify intentions, illocutionary force, the standpoint of the author"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d10"
        source: "Beiser 2016, ch. 26 sec. 4, p. 515"
        decision: keep
        directive: "Recover the intention of the author — the specific purposes for which he or she wrote at a specific time and place."
        trigger: "When historically interpreting a philosophical text."
        qualification: "Recovering intention is necessary but not sufficient; understanding also requires grasping the work's logical geography."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d11"
        source: "Beiser 2016, ch. 26 sec. 4, p. 515"
        decision: keep
        directive: "Attempt as far as possible to understand the text from the standpoint of the person who wrote it."
        trigger: "When interpreting a historical philosophical text."
        qualification: "This standpoint reconstruction is a goal of historical interpretation but must be combined with analysis of the work's logical structure."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d16"
        source: "Beiser 2016, ch. 26 sec. 5, pp. 518-519"
        decision: keep
        directive: "Inquire into the author's purpose, motive, or intention behind an argument, not just the validity of the argument itself."
        trigger: "Whenever doing the history of philosophy."
        qualification: "This inquiry serves historical understanding, not philosophical truth; uncovering motives does not, on its own, validate or discredit an argument (avoiding the genetic fallacy)."
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d27"
        source: "Skinner 2002, ch. 4, p. 100"
        decision: keep
        directive: "Grasp not merely what a writer says but the intended illocutionary force with which the utterance is issued — i.e. what they are doing in saying it."
        trigger: "When interpreting any serious utterance from a past writer."
        qualification: ""
  - id: c128
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Map the text's logical geography"
    note: "singleton: trace premises, implications, term meanings, sufficiency of evidence, contradictions"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d14"
        source: "Beiser 2016, ch. 26 sec. 4, pp. 517-518"
        decision: keep
        directive: "In addition to recovering historical context and intention, map the text's 'logical geography': the premises required to justify a proposition, its implications, the various meanings of central terms, the sufficiency of evidence, and any internal contradictions."
        trigger: "When claiming to understand a philosophical text in the deeper sense."
        qualification: "Knowing this geography requires the interpreter's active appropriation and assimilation of the structure of the author's thought, going beyond passive learning to exploration."
  - id: c129
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Synthesis: historical context + internal critique"
    note: "singleton: combine historical reconstruction with internal appraisal"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d15"
        source: "Beiser 2016, ch. 26 sec. 5, p. 518"
        decision: keep
        directive: "Reconstruct arguments on the basis of their historical context, and appraise them according to an internal critique."
        trigger: "When practicing the history of philosophy as a synthesis of historical and analytic methods."
        qualification: "This synthesis secures the search for truth only modestly: judgments are valid within the context of a particular text or thinker, not on general issues."
  - id: c130
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Investigate non-philosophical motives, not just arguments"
    note: "variants: probe moral/religious/political motives even when reasoning seems intact"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch26-beiser-history-of-ideas-defense/d17"
        source: "Beiser 2016, ch. 26 sec. 5, pp. 519-520"
        decision: keep
        directive: "Investigate non-philosophical motives (moral, religious, political) of a philosopher constantly, not only in exceptional cases when philosophical reasoning breaks down."
        trigger: "When historically explaining a philosopher's positions, even those in metaphysics or logic."
        qualification: "Investigating motives is for historical understanding; it does not by itself validate or discredit the position. The genetic fallacy is real but does not foreclose this inquiry."
  - id: c131
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Specialise rather than attempt the whole"
    note: "singleton: scope historiographical claims to a figure/period and name the scope"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d12"
        source: "Normore 2016, 'The Methodology of the History of Philosophy', §3 Practice, §3.1 'Specialize', p. 44"
        decision: adapt
        directive: "When answering a question in the history of philosophy, scope your treatment to a particular figure or period rather than attempting a global synthesis, and name the chosen scope explicitly to the user."
        trigger: "When orienting one's research program in the History of Philosophy and one lacks the heroic linguistic and disciplinary range of the 'ideal Historian of the whole of Philosophy.'"
        qualification: "Specialization brings forgivable ignorance of certain languages and contexts only on assumptions (e.g. that nothing in those languages bears on the figure) that are themselves revisable."
        original_directive: "Specialize: study a particular figure (e.g. Aristotle, Descartes, Locke, Hegel) or a particular period (e.g. 'Ancient Philosophy', 'Early Modern Philosophy') rather than attempting the whole of the History of Philosophy."
  - id: c132
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Doxology — read past texts with present concerns, marking the move"
    note: "singleton: contemporary-reading mode of historical texts (forks with c123/c127 strict historicism)"
    fork_hint: true
    related_to:
      - c123
      - c127
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d13"
        source: "Normore 2016, 'The Methodology of the History of Philosophy', §3.2 'Do Doxology', p. 45"
        decision: adapt
        directive: "When the user engages with a past philosophical text that has immediate philosophical appeal to a contemporary reader, perform doxological interpretation — examine its theses and arguments using considerations and weightings drawn from contemporary philosophy — and mark that you are doing so."
        trigger: "When teaching or writing about the past of Philosophy within Philosophy departments and schools."
        qualification: "Which texts have such immediate appeal changes with time; the maxim is contingent on Doxology remaining centred in Philosophy departments."
        original_directive: "Do Doxology: interpret to a contemporary audience those texts of past philosophers that hold immediate philosophical appeal for present readers."
  - id: c133
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Test understanding by prediction (anthropology of philosophy)"
    note: "singleton: predict what the figure would say next, then check"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d14"
        source: "Normore 2016, 'The Methodology of the History of Philosophy', §3.3 'Aspire to Anthropology of Philosophy', p. 45"
        decision: adapt
        directive: "When claiming to understand an unfamiliar philosophical milieu or figure, test that claim before asserting it: predict what the figure would say on a related question or in a passage you have not yet examined, then check the prediction against the actual text and report any mismatch."
        trigger: "When trying to gauge whether you have achieved an Anthropology-of-Philosophy-style understanding of an unfamiliar philosophical milieu."
        qualification: "One can be surprised even in one's own cultural environment; failures of prediction are akin to overgeneralizing from a restricted diet of examples and call for the historiographical principle 'Exhaust the Evidence!'"
        original_directive: "Test your understanding of a past philosophy by reading to the bottom of a page you have not read or no longer remember, then stopping and predicting what you will find as you turn the page; if you can reliably do so, you have the verstehen-style understanding of how philosophers in that milieu went on."
  - id: c134
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Exhaust the evidence (regulative ideal)"
    note: "singleton: actively seek any factor that would change the picture"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d15"
        source: "Normore 2016, 'The Methodology of the History of Philosophy', §3.4 'Exhaust the Evidence', pp. 45-46"
        decision: keep
        directive: "Treat 'Exhaust the Evidence' as a regulative ideal: actively seek out, including in hitherto neglected texts, any Philosophical factor that, when considered, would change the picture at issue."
        trigger: "When developing or defending a historical interpretation in the History of Philosophy."
        qualification: "It is at best a regulative ideal; there is likely no finite specification of all the evidence bearing on any question in the history of philosophy."
  - id: c135
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Caution about deliberate-inconsistency reading (Strauss-style)"
    note: "fork-flagging singleton: usual canons assume coherence; Straussian hermeneutics of suspicion treated as last resort; Stage 5 should mark the fork between trust and suspicion"
    fork_hint: true
    related_to:
      - c126
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d16"
        source: "Normore 2016, 'The Methodology of the History of Philosophy', §3.5 'Struggle with Strauss', p. 46"
        decision: keep
        directive: "When a text on its face contradicts itself, approach the supposition that the author was deliberately inconsistent with the most caution among the available strategies (denying inconsistency, attributing change of mind, locating unexamined philosophical presuppositions, or attributing intentional inconsistency)."
        trigger: "When you cannot find an interpretation that makes sense of a text as a whole because the text contradicts itself."
        qualification: "The reason for caution is that adopting the 'deliberate inconsistency' strategy is to abandon the usual canons for determining the worth of an interpretation; consistency 'is the lifeblood of History of Philosophy.'"
  - id: c136
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Test interpretation against all relevant text"
    note: "singleton: an interpretation incompatible with some of the text is disqualified"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d06"
        source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, p. 33"
        decision: keep
        directive: "Test any interpretation you propose against all the relevant text, and treat any interpretation that is incompatible with some of the relevant text as thereby disqualified as an interpretation of any of it."
        trigger: "When defending or evaluating an interpretation of a philosophical text."
        qualification: "''"
  - id: c137
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Explain unfamiliar uses of source's vocabulary"
    note: "singleton: don't paper over unfamiliar word-use; explicate it"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d07"
        source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, p. 33"
        decision: keep
        directive: "Do not rest content with merely repeating the original-language wording or a dictionary translation; explain unfamiliar uses of the source's language to the audience, even if doing so requires excursions into related earlier and later texts and contemporary work."
        trigger: "When a historical text uses ordinary words in unfamiliar ways (e.g. Aristotle's claim that the intellect 'becomes' what is thought about)."
        qualification: "The historian may come away still with the sense that there is more here than yet understood; the requirement is to render the claim intelligible 'to some extent', not to settle it definitively."
  - id: c138
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Distinguish History of Philosophy from its kin"
    note: "singleton: don't conflate Doxology, Intellectual History, Anthropology, Cultural History"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d02"
        source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, p. 28"
        decision: keep
        directive: "Distinguish History of Philosophy from its near kin — Intellectual History, Social History, Doxology, and Anthropology of Philosophy — rather than conflating them under a single label."
        trigger: "When labelling, classifying, or describing work that engages with the past of Philosophy."
        qualification: "Normore acknowledges that all of these subjects legitimately study the past of Philosophy; the directive concerns terminological discipline, not exclusion."
  - id: c139
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Choose contemporary or contemporaries' questions explicitly"
    note: "singleton: announce which interpretive register you are operating in"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d03"
        source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, p. 32"
        decision: keep
        directive: "Approach a historical text with explicit questions, and decide whether you are asking what you would ask of a contemporary philosopher's text or what one of the writer's own philosopher contemporaries would have asked."
        trigger: "When beginning interpretive work on a historical philosophical text."
        qualification: "Both options have 'respectable followings'; Normore does not require choosing one over the other but treats the choice as a 'central methodological issue which must be faced by any Historian of Philosophy.'"
  - id: c140
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Internal-history default for History of Philosophy"
    note: "singleton: default to philosophical reasons internal to the practice; concede defeasibility"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d01"
        source: "Normore 2016, 'The Methodology of the History of Philosophy', §1 Introduction, p. 27"
        decision: keep
        directive: "Aim to present the history of Philosophy internally — i.e. as driven by philosophical considerations and reasons internal to the practice of Philosophy — as the default."
        trigger: "When undertaking History of Philosophy as opposed to Intellectual History, Cultural History, Doxology, or Anthropology of Philosophy."
        qualification: "This is a default, not an absolute; the chunk concedes that 'internal' history rests on the controversial assumption that philosophers adopt and change views on the basis of philosophical considerations (p. 38), and that context can play an important role (p. 40)."
  - id: c141
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Evaluate past reasoning from both perspectives"
    note: "singleton: compare past reasonableness to present standards"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d09"
        source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, p. 41"
        decision: keep
        directive: "When evaluating whether a past philosopher's response was rational or reasonable, evaluate it both from your own perspective (typically that of your current Philosophical community) and from the perspective of the thinker and that thinker's Philosophical community."
        trigger: "When assessing the rationality, reasonableness, or merit of a historical philosophical position or argument."
        qualification: "The extent to which the two perspectives agree is in part empirical; remain open both to the possibility that standards of reasonableness have changed and to the possibility that they have not."
  - id: c142
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Distinguish History of Philosophy from History of Theology by motive"
    note: "singleton: when grounds for a position were non-philosophical, mark them and pass on"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d10"
        source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, pp. 41-42"
        decision: keep
        directive: "When a past philosopher adopted a position for non-philosophical (e.g. Theological) reasons even though it could have been adopted on then-prevalent philosophical grounds, note the background condition and pass on rather than treating it as part of the History of Philosophy."
        trigger: "When you have established that a thinker's grounds for a position were not taken by the thinker to be philosophical."
        qualification: "It may not be easy to tell whether the reasons were taken to be philosophical; the same doctrine (e.g. 'real accidents') may belong to the History of Philosophy via one author (Buridan) and to the History of Theology via another (Ockham)."
  - id: c143
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Discount your own preconceptions when interpreting"
    note: "singleton: classification through familiar models is unavoidable but must be discounted"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d01"
        source: "Skinner 2002, ch. 4, pp. 76-77"
        decision: keep
        directive: "Treat the models and preconceptions you bring to a text as determinants of what you will perceive, and discount accordingly."
        trigger: "When approaching any classic text, especially one from an alien culture."
        qualification: "The dilemma is inescapable — classification in terms of the familiar is unavoidable — but the danger to be guarded against is letting expectations dictate what the agent must have been saying."
  - id: c144
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Mythology of doctrines: don't manufacture a doctrine from fragments"
    note: "variants: same protocol — don't convert scattered remarks into a doctrine, attribute later doctrines via terminological coincidence, fault writers for not articulating expected doctrines, or extrapolate beliefs they didn't state"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d02"
        source: "Skinner 2002, ch. 4, pp. 77-80"
        decision: keep
        directive: "Do not convert scattered or incidental remarks by a classic theorist into their 'doctrine' on one of the themes you expected to find."
        trigger: "When a writer's text offers only passing or fragmentary remarks on a topic the interpreter expects them to address."
        qualification: ""
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d03"
        source: "Skinner 2002, ch. 4, p. 78"
        decision: keep
        directive: "Do not credit a writer with a doctrine on the strength of a chance similarity of terminology to an argument they cannot in principle have meant to contribute to."
        trigger: "When a passage in an older text resembles a doctrine whose terms became available only later."
        qualification: ""
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d04"
        source: "Skinner 2002, ch. 4, pp. 78-79"
        decision: keep
        directive: "When denying that a writer held a later doctrine, ground the denial in the impropriety of supposing they could have meant to contribute to a debate whose terms were unavailable to them — not merely in a re-reading of the text."
        trigger: "When evaluating attributions of later doctrines to earlier writers."
        qualification: ""
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d05"
        source: "Skinner 2002, ch. 4, p. 80"
        decision: keep
        directive: "When a writer is said to have intimated a doctrine but never articulated it, ask why — if they meant to articulate it — they so signally failed to do so."
        trigger: "When an interpreter reconstructs a writer's 'doctrine' from guesses and hints rather than explicit statement."
        qualification: ""
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d09"
        source: "Skinner 2002, ch. 4, pp. 82-83"
        decision: keep
        directive: "Do not criticise a classic theorist for failing to come up with a doctrine on one of the themes the interpreter expects them to address."
        trigger: "When tempted to fault a past writer for an 'omission' on a mandatory topic."
        qualification: ""
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d10"
        source: "Skinner 2002, ch. 4, p. 83"
        decision: keep
        directive: "Do not supply a classic theorist with beliefs they did not state by extrapolating what they 'would have' thought about a topic they did not address."
        trigger: "When tempted to ascribe a view to a writer on a topic they did not discuss."
        qualification: ""
  - id: c145
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Mythology of unit ideas: don't hypostasise floating doctrines"
    note: "variants: don't talk of doctrines emerging/persisting independent of agents who used the words; don't stage 'really there' debates"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d06"
        source: "Skinner 2002, ch. 4, pp. 80-81"
        decision: keep
        directive: "Do not hypostasise a doctrine into an entity that 'emerges', 'gains ground', or 'fails to materialise' independently of the agents who actually used the words."
        trigger: "When writing or reading histories that trace a 'unit idea' across periods."
        qualification: ""
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d08"
        source: "Skinner 2002, ch. 4, pp. 81-82"
        decision: keep
        directive: "Do not stage debates about whether a 'unit idea' has 'really emerged' or is 'really there' in a given writer."
        trigger: "When evaluating claims of the form 'doctrine X is (or is not) already present in writer Y'."
        qualification: ""
  - id: c146
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Mythology of prolepsis: don't read history teleologically"
    note: "variants: don't praise/blame past writers for anticipating us; treat 'awaiting future for meaning' readings as a sign of the prolepsis fallacy"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d07"
        source: "Skinner 2002, ch. 4, p. 81"
        decision: keep
        directive: "Do not write history that consists in pointing out earlier 'anticipations' of later doctrines, nor praise or blame past writers for how far they aspired to the condition of being ourselves."
        trigger: "When tempted to describe an earlier writer as 'anticipating' a later figure or doctrine."
        qualification: ""
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d17"
        source: "Skinner 2002, ch. 4, pp. 90-92"
        decision: keep
        directive: "Do not describe a text's significance for us in a way that leaves no place for analysis of what its author intended or meant — do not conflate retrospective significance with the agent's meaning."
        trigger: "When a work's later historical importance frames the description of what its author was doing."
        qualification: ""
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d18"
        source: "Skinner 2002, ch. 4, p. 92"
        decision: keep
        directive: "Treat any reading whose target episode 'has to await the future to learn its meaning' as a sign of the mythology of prolepsis and reject it as a teleological account."
        trigger: "When evaluating an interpretation of what a past writer was doing."
        qualification: ""
  - id: c147
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Mythology of coherence: don't manufacture system where there is none"
    note: "variants: don't supply a coherence the text lacks; don't reread until coherence appears; don't discount author's intentions to extract a unified message"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d11"
        source: "Skinner 2002, ch. 4, pp. 84-85"
        decision: keep
        directive: "Do not assume a priori that whatever a writer produced was intended as the most systematic contribution they were capable of making to their discipline."
        trigger: "When deciding whether a writer's text constitutes a 'failure' to address a topic."
        qualification: ""
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d12"
        source: "Skinner 2002, ch. 4, pp. 85-86"
        decision: keep
        directive: "Do not treat it as the interpreter's task to supply texts with a coherence they may appear to lack."
        trigger: "When a classic writer's text seems inconsistent or unsystematic."
        qualification: ""
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d13"
        source: "Skinner 2002, ch. 4, p. 86"
        decision: keep
        directive: "Do not read a text 'over and over' until the argument 'assumes some coherence' that it did not display."
        trigger: "When a writer's system is not 'readily accessible' and the interpreter is tempted to keep rereading until coherence appears."
        qualification: ""
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d14"
        source: "Skinner 2002, ch. 4, pp. 86-87"
        decision: keep
        directive: "Do not discount an author's own statements of intention, or whole works of theirs, in the interest of extracting a more coherent message."
        trigger: "When statements of intent or particular works conflict with the interpreter's proposed unified reading."
        qualification: ""
  - id: c148
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Influence claims: pass three tests before invoking"
    note: "singleton: B studied A; couldn't have got it elsewhere; couldn't have arrived independently"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d19"
        source: "Skinner 2002, ch. 4, pp. 93-94"
        decision: keep
        directive: "Before invoking 'influence' to explain a doctrine's appearance in writer B, check that (i) B is known to have studied A's works, (ii) B could not have found the doctrine in any writer other than A, and (iii) B could not have arrived at the doctrine independently."
        trigger: "When tempted to explain a similarity between two writers by saying B was influenced by A."
        qualification: "Skinner does not deny that 'influence' can be used fruitfully — he uses it himself — only that its use must do something to pass these tests."
  - id: c149
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Don't impose familiar paradigm on alien argument"
    note: "singleton: if it makes the text's features baffling, the paradigm is wrong"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d20"
        source: "Skinner 2002, ch. 4, pp. 94-95"
        decision: keep
        directive: "Do not conceptualise an alien argument with a familiar paradigm whose application makes the text's characteristic features look baffling — the difficulty of accounting for them is evidence the paradigm is wrong."
        trigger: "When applying a familiar concept (e.g. 'liberal democracy', 'government by consent') to a foreign or earlier political argument."
        qualification: ""
  - id: c150
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Don't attribute meanings the agent couldn't have accepted"
    note: "variants: same family — attribute only what the agent could in principle have intended/recognised; check intention exists before alleging failure"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d21"
        source: "Skinner 2002, ch. 4, pp. 95-96"
        decision: keep
        directive: "Do not attribute to an agent any meaning or achievement they could never be brought to accept as a correct description of what they meant or achieved."
        trigger: "When framing an account of what an agent meant or did in producing an utterance."
        qualification: "This does not exclude that an observer might give a fuller or more convincing account than the agent could give themselves (psychoanalysis is cited); it does exclude accounts that depend on criteria of description unavailable to the agent."
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d22"
        source: "Skinner 2002, ch. 4, p. 96"
        decision: keep
        directive: "Before saying an agent 'failed' to do something, check that it is first clear that they could have had — and did in fact have — the intention to perform that action."
        trigger: "When tempted to claim a writer failed to enunciate a doctrine, failed to be coherent, or failed to address a theme."
        qualification: ""
  - id: c151
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Recognise messiness of thinking; don't over-systematise"
    note: "singleton: keep room for the actual disorder of thought"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d23"
        source: "Skinner 2002, ch. 4, pp. 96-97"
        decision: keep
        directive: "Recognise that thinking is an effortful, often disordered activity — do not insist on a level of coherence at which the wrestling and confusion that ordinarily mark thinking are made to disappear."
        trigger: "When constructing a 'systematic' presentation of a writer's scattered thoughts."
        qualification: ""
  - id: c152
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Check for diachronic semantic change in writer's terms"
    note: "singleton: a writer's words may have meant different things to them"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d24"
        source: "Skinner 2002, ch. 4, pp. 97-98"
        decision: keep
        directive: "Check whether the meanings of the terms a writer uses have changed since they wrote — what a writer says about a concept may be a misleading guide to what they meant."
        trigger: "When interpreting a writer's statements about a concept whose vocabulary is still in use today."
        qualification: ""
  - id: c153
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Allow for irony / oblique rhetoric; don't fix on literal sense"
    note: "singleton: irony, masking, indirection prise apart said and meant"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d25"
        source: "Skinner 2002, ch. 4, p. 98"
        decision: keep
        directive: "Allow that a writer may be deploying an oblique rhetorical strategy such as irony, which prises apart what is said from what is meant — do not assume the literal sense exhausts the meaning."
        trigger: "When interpreting texts whose authors may have had reason to mask their views (e.g. on contested religious or political topics)."
        qualification: ""
  - id: c154
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Use extra-textual evidence (reception, editorial choices, risks)"
    note: "singleton: weigh face-value vs sceptical readings using author-context evidence"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d26"
        source: "Skinner 2002, ch. 4, pp. 99-100"
        decision: keep
        directive: "Use information beyond the text — including contemporary reception, the author's later editorial choices, and the risks the author faced — to assess whether a text's overt message is what was meant."
        trigger: "When deciding between a 'face-value' and a 'sceptical' reading of a sensitive text."
        qualification: ""
  - id: c155
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Don't seek essential meaning of an idea across writers"
    note: "variants: study varying contexts/intentions; don't infer continuity from terminological persistence"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d29"
        source: "Skinner 2002, ch. 4, pp. 102-104"
        decision: keep
        directive: "Do not look for an 'essential meaning' of an idea that must 'remain the same' across writers; study instead the varying contexts and intentions with which a word or expression was used."
        trigger: "When writing or reading a history of a 'unit idea'."
        qualification: ""
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d30"
        source: "Skinner 2002, ch. 4, pp. 102-103"
        decision: keep
        directive: "Do not assume that the persistence of a particular expression across time signals the persistence of the questions it was used to answer; check what questions its use was thought to answer in each context."
        trigger: "When tracking a recurring term or expression across writers or periods."
        qualification: ""
  - id: c156
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Delineate range of conventional possible communications"
    note: "variants: use the social-linguistic context to bound interpretation; treat context as 'court of appeal' between rival readings"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d31"
        source: "Skinner 2002, ch. 4, pp. 104-105"
        decision: keep
        directive: "Begin interpretation by delineating the full range of communications that could conventionally have been performed on the given occasion by the issuing of the given utterance, then trace the relations between the utterance and this wider linguistic context to decode the writer's intentions."
        trigger: "When undertaking to understand a text as an intentional act of communication."
        qualification: ""
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d32"
        source: "Skinner 2002, ch. 4, p. 105"
        decision: keep
        directive: "Use the social context as a 'court of appeal' for assessing the relative plausibility of incompatible ascriptions of intention — i.e. for deciding what meanings it might in principle have been possible for the agent to have intended to communicate."
        trigger: "When choosing between rival interpretations of a writer's intention."
        qualification: ""
  - id: c157
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Reject 'perennial problems' justification for studying past texts"
    note: "variants: justify the history of ideas via revealing variety of viable commitments, not perennial questions"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d33"
        source: "Skinner 2002, ch. 4, p. 106"
        decision: keep
        directive: "Do not justify the study of past ideas by appealing to 'perennial problems' allegedly addressed in the classic texts."
        trigger: "When stating why a classic text is worth studying."
        qualification: "Skinner does not deny long continuities in moral, social and political philosophy (p. 103); his denial concerns 'perennial problems' as such."
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d34"
        source: "Skinner 2002, ch. 4, pp. 106-107"
        decision: keep
        directive: "Treat the classic texts as a means of revealing the variety of viable moral and political commitments — not their essential sameness — and thereby use the history of ideas to expose the contingency of one's own arrangements."
        trigger: "When asking what philosophical value the history of ideas has."
        qualification: ""
  - id: c158
    section: "HISTORY OF PHILOSOPHY (Normore, Beiser, Skinner)"
    label: "Apparent contradictions: take seriously, don't force resolution"
    note: "variants: Ockham's razor on contradictions; allow author to have changed mind"
    fork_hint: false
    members:
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d15"
        source: "Skinner 2002, ch. 4, p. 88"
        decision: keep
        directive: "Apply Ockham's razor to apparent contradictions: treat an apparent contradiction as a possible real contradiction, not as a puzzle to be resolved at all costs."
        trigger: "When a text exhibits apparent inconsistency."
        qualification: ""
      - id: "skinner-2002-visions-of-politics-vol1/ch4-meaning-and-understanding/d16"
        source: "Skinner 2002, ch. 4, pp. 88-89"
        decision: keep
        directive: "Allow that an author may have changed their mind: do not construct a generalised scheme that 'resolves antinomies' between an author's earlier and later works at the cost of denying their development."
        trigger: "When apparent contradictions between an author's earlier and later works tempt a unifying reading."
        qualification: ""
  - id: c159
    section: "KELLY (DISAGREEMENT EPISTEMOLOGY)"
    label: "Empirical-facts-into-disagreement-account procedure"
    note: "singleton: plug case facts into your account of disagreement to derive a verdict"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch20-kelly-disagreement-in-philosophy/d01"
        source: "Kelly 2016, ch. 20, §1, p. 375"
        decision: keep
        directive: "When asking whether disagreement should move you to revise a belief, take the correct general account of how to respond to disagreement and apply it to the case at hand by plugging in the empirical facts about the disagreement."
        trigger: "When trying to decide whether a particular pattern of disagreement (e.g., within philosophy) warrants belief revision or agnosticism."
        qualification: "Kelly notes there is no agreed-upon general account of disagreement, so in practice the conclusion will depend on which view of disagreement-epistemology one adopts; the directive is the ideal procedure, not a guarantee of consensus."
  - id: c160
    section: "KELLY (DISAGREEMENT EPISTEMOLOGY)"
    label: "Count peers, weight by independence"
    note: "variants: same protocol — let numbers count; don't generalise from two-person idealisations; lopsided majorities can license confidence"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch20-kelly-disagreement-in-philosophy/d02"
        source: "Kelly 2016, ch. 20, §3, p. 387"
        decision: keep
        directive: "Let the numbers count: when assessing whether disagreement should undermine your belief that p, do not stop at noting that some peer disagrees — take into account how many peers stand on each side."
        trigger: "When learning that a peer (or peers) disagree with your belief that p, and other peers' opinions are also available."
        qualification: "Conditional on a measure of independence in how the peers arrived at their views; the directive is what 'no clear-headed conciliationist will deny.'"
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch20-kelly-disagreement-in-philosophy/d03"
        source: "Kelly 2016, ch. 20, §4, p. 386-387"
        decision: keep
        directive: "Be wary of generalizing conclusions drawn from idealized two-person, evenly-divided cases of peer disagreement to real cases in which opinion is not evenly divided."
        trigger: "When applying lessons from disagreement-epistemology examples (e.g., Mental Math Case, two-person peer cases) to real-world distributions of opinion."
        qualification: "Evenly-divided opinion is 'a very special case' of controversy and 'is seldom realized when dealing with populations of any significant size.'"
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch20-kelly-disagreement-in-philosophy/d06"
        source: "Kelly 2016, ch. 20, §5, p. 392"
        decision: keep
        directive: "Do not confuse moderating one's views in response to learning what others think with ending up with moderate (middling) opinions; on a plausible conciliatory view, lopsided majorities license relatively high confidence in the majority position."
        trigger: "When applying or evaluating a conciliatory view of disagreement, especially in cases where competent opinion is unevenly divided."
        qualification: "Holds 'at least if there is a significant amount of independence in the way that those in the majority arrived at their view.'"
  - id: c161
    section: "KELLY (DISAGREEMENT EPISTEMOLOGY)"
    label: "Require positive evidence of peerhood, not absence of superiority"
    note: "singleton: don't treat 'no evidence I'm better' as enough"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch20-kelly-disagreement-in-philosophy/d04"
        source: "Kelly 2016, ch. 20, §3, p. 384"
        decision: keep
        directive: "Do not treat the mere absence of evidence that you are epistemically superior as enough to require belief revision in the face of disagreement; require positive evidence that the other person is at least your approximate equal."
        trigger: "When you find yourself disagreeing with someone and are deciding whether their opinion should move you to revise your belief."
        qualification: "Endorsed via Christensen's preferred conciliationist view; presupposes a conciliationist framework. The strength of the undermining is proportional to the strength of one's dispute-independent evidence of parity."
  - id: c162
    section: "KELLY (DISAGREEMENT EPISTEMOLOGY)"
    label: "Minimal-reliability proviso for conciliation"
    note: "singleton: only conciliate where peers are above-chance reliable on the topic"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch20-kelly-disagreement-in-philosophy/d05"
        source: "Kelly 2016, ch. 20, §4, p. 389-390"
        decision: keep
        directive: "Apply conciliationist norms only within domains where the peers are (reasonably believed to be) at least marginally more reliable than chance with respect to the relevant subject matter (the 'Minimal Reliability Proviso')."
        trigger: "When deciding whether to conciliate (revise toward the group's view) in response to peer disagreement."
        qualification: "Below the chance threshold, conciliating is mathematically suboptimal — you do better sticking with your original opinion (Grofman et al. 1983); the proviso is offered as the charitable reading of conciliationism, not an explicit conciliationist commitment."
  - id: c163
    section: "KELLY (DISAGREEMENT EPISTEMOLOGY)"
    label: "Restrict peerhood by surrounding-issue agreement"
    note: "singleton: someone wrong about surrounding issues isn't a peer on the disputed one"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch20-kelly-disagreement-in-philosophy/d07"
        source: "Kelly 2016, ch. 20, §3, p. 382"
        decision: keep
        directive: "When deciding whether someone counts as your epistemic peer on a 'messy' real-world question, take into account that the disputed issue is typically tangled up with surrounding issues; if you take the other person to be wrong about those surrounding issues, do not count them as a peer with respect to the disputed question."
        trigger: "When applying an Equal-Weight or peer-disagreement norm to a real-world controversial question whose resolution interacts with many other disputed claims."
        qualification: "Attributed to Elga's defense of the Equal Weight View; restricts the scope of conciliation, not a free-standing endorsement that all controversies should be handled this way."
  - id: c164
    section: "LIST & VALENTINI (POLITICAL THEORY METHODOLOGY)"
    label: "Concept analysis: respect intuitions, justify overrides"
    note: "singleton: prefer interpretations in line with intuitions; overrule with strong reasons"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d01"
        source: "List & Valentini 2016, sec. 3.3, p. 532"
        decision: keep
        directive: "When interpreting a political concept that has a common-sense interpretation, prefer interpretations broadly in line with our intuitions; if your interpretation classifies intuitively clear cases on the wrong side, either give strong reasons for overruling the intuitive judgements or search for a better interpretation."
        trigger: "Analysing a political concept (e.g. freedom, democracy) that has an established common-sense interpretation."
        qualification: "Strong reasons may justify overruling intuitive judgements; reflective equilibrium may be used to adjudicate conflicts between theoretical conclusions and intuitive judgments."
  - id: c165
    section: "LIST & VALENTINI (POLITICAL THEORY METHODOLOGY)"
    label: "Choose concept interpretation by role-playing fitness"
    note: "singleton: prefer interpretations that play the intended role"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d02"
        source: "List & Valentini 2016, sec. 3.3, pp. 532-533"
        decision: keep
        directive: "Choose an interpretation of a concept that successfully plays the intended normative, evaluative, or descriptive role; allow different roles to require different interpretations, but where possible look for a single interpretation that can play multiple roles to avoid a proliferation of rival interpretations."
        trigger: "Selecting among rival interpretations of a political concept for use in a principle, theory, or scientific explanation."
        qualification: "Different roles may legitimately require different interpretations."
  - id: c166
    section: "LIST & VALENTINI (POLITICAL THEORY METHODOLOGY)"
    label: "Inter-concept relational discipline"
    note: "singleton: respect entailments and differentiation between connected concepts"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d03"
        source: "List & Valentini 2016, sec. 3.3, p. 533"
        decision: keep
        directive: "Require concepts to stand in the right relationship to other concepts: respect entailment relations between connected concepts, sometimes require direct inter-definability, and ensure concepts are sufficiently differentiated from one another to avoid redundancies or confusions."
        trigger: "Conducting joint analysis of two or more interrelated political concepts (e.g. rights and obligations, permissibility and obligatoriness)."
        qualification: ""
  - id: c167
    section: "LIST & VALENTINI (POLITICAL THEORY METHODOLOGY)"
    label: "Defining conditions: not too thick, not too thin"
    note: "singleton: pick relevant features only"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d04"
        source: "List & Valentini 2016, sec. 3.3, pp. 533-534"
        decision: keep
        directive: "Require a concept's defining conditions to be neither too 'thick' nor too 'thin' — they should refer to all relevant facts about the objects categorized but not to irrelevant ones."
        trigger: "Specifying the defining conditions of a political concept once its domain has been settled."
        qualification: "What counts as 'relevant', 'thick', or 'thin' is itself open to debate."
  - id: c168
    section: "LIST & VALENTINI (POLITICAL THEORY METHODOLOGY)"
    label: "Defining conditions: epistemically accessible"
    note: "singleton: in-principle knowable membership criteria"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d05"
        source: "List & Valentini 2016, sec. 3.3, p. 534"
        decision: keep
        directive: "Require a concept's defining conditions to be epistemically accessible — such that it is possible, at least in principle, to know whether an object meets them."
        trigger: "Constructing a concept intended for practical use."
        qualification: "The context and intended use may determine what counts as epistemically accessible."
  - id: c169
    section: "LIST & VALENTINI (POLITICAL THEORY METHODOLOGY)"
    label: "Don't conflate concept with theory or principle"
    note: "variants: concepts categorise; theories have truth-values; 'true conception' = appropriateness claim"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d06"
        source: "List & Valentini 2016, sec. 3.4, pp. 534-535"
        decision: keep
        directive: "Do not confuse concepts with principles or theories: only principles and theories have propositional content and truth-values; concepts categorize objects and are assessable only as more or less useful, plausible, or in line with established use or considered judgements."
        trigger: "Discussing whether some account of a political notion (e.g. 'freedom', 'democracy') is 'true' or 'correct'."
        qualification: ""
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d07"
        source: "List & Valentini 2016, sec. 3.4, p. 535"
        decision: keep
        directive: "When someone asserts that one conception of a contested term is 'the true' conception, treat this as shorthand for an appropriateness claim and spell out the criterion of appropriateness explicitly to avoid ambiguity."
        trigger: "Encountering or making claims of the form 'X is the true conception of Y' for a contested political concept."
        qualification: ""
  - id: c170
    section: "LIST & VALENTINI (POLITICAL THEORY METHODOLOGY)"
    label: "Theory-quality criteria: consistency, closure, axiomatisation, parsimony"
    note: "variants: foundational requirements on a good theory"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d08"
        source: "List & Valentini 2016, sec. 5.1, pp. 538-539"
        decision: keep
        directive: "Require a good theory to be logically consistent: the set of statements constituting the theory must be capable of being simultaneously true."
        trigger: "Assessing or constructing any theory (positive, normative, or evaluative)."
        qualification: "We may sometimes lower the bar by admitting some 'contained' or 'local' inconsistencies (paraconsistent logics), but a weakened consistency requirement is still imposed to rule out globally destructive inconsistencies."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d09"
        source: "List & Valentini 2016, sec. 5.1, p. 539"
        decision: keep
        directive: "Require a good theory to be deductively closed: any statement logically entailed by the theory must also belong to the theory."
        trigger: "Assessing or formulating a theory."
        qualification: "If a theory is initially given in non-deductively-closed form, redefine it as the set of all statements entailed by the original formulation."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d10"
        source: "List & Valentini 2016, sec. 5.1, pp. 539-540"
        decision: keep
        directive: "Aim to present a theory in axiomatized form — as the body of implications of a finite (or formally decidable) set of underlying principles — so its content can be summarized by a manageable theory formulation rather than enumerated."
        trigger: "Presenting or formulating a theory in political theory."
        qualification: ""
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d11"
        source: "List & Valentini 2016, sec. 5.1, p. 540"
        decision: keep
        directive: "Require a good theory to be parsimonious — as simple as possible in an appropriate sense, simpler than the target phenomenon it accounts for and simpler than its rival theories; for normative theories, simpler than an enumeration of all case-specific normative judgements."
        trigger: "Comparing or assessing rival theories that purport to account for the same subject matter."
        qualification: "What counts as 'simple' may depend on context and on what the theory is about; the bar of simplicity may be adjusted accordingly."
  - id: c171
    section: "LIST & VALENTINI (POLITICAL THEORY METHODOLOGY)"
    label: "Reflective equilibrium with cautioned-evidence intuitions"
    note: "fork-aware variants: iterate theory ↔ judgements; treat strict-evidence method with caution; preserves the contested place of intuitions in political theory"
    fork_hint: true
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d12"
        source: "List & Valentini 2016, sec. 5.2, pp. 541-542"
        decision: keep
        directive: "When testing a normative or evaluative theory by reflective equilibrium, iterate between theory and considered judgements until 'mutual fit' is reached: revise the theory to accommodate judgements you are unwilling to give up, and overrule judgements where you decide on reflection to embrace the theory's implications."
        trigger: "Assessing the external validity of a normative or evaluative theory in political theory."
        qualification: "There may not always be a unique equilibrium (non-uniqueness problem), no equilibrium may be reachable (non-existence problem), and arbitrary factors such as framing or order of consideration may determine the outcome (path-dependence problem)."
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d13"
        source: "List & Valentini 2016, sec. 5.2, p. 541"
        decision: keep
        directive: "Treat the strict-evidence method (taking intuitive judgements as independent evidence on a par with scientific observations) with caution: some judgements are tentative or absent, intuitive judgements may be subject to biases and framing effects, and they may be mutually inconsistent or entail conclusions we reject on reflection."
        trigger: "Considering whether to use intuitive judgements as direct evidence for or against a normative theory."
        qualification: ""
  - id: c172
    section: "LIST & VALENTINI (POLITICAL THEORY METHODOLOGY)"
    label: "Avoid applied-moral-philosophy method under reasonable pluralism"
    note: "singleton: don't justify a political theory by deriving it from a comprehensive moral theory"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d14"
        source: "List & Valentini 2016, sec. 5.3 (applied-moral-philosophy), pp. 543-544"
        decision: keep
        directive: "If the activity of political theory is taken to occur against the background of reasonable pluralism about moral matters, do not justify a political theory simply by deriving it from an independently accepted comprehensive moral theory (the 'applied-moral-philosophy method'), since that approach relies on the acceptance of a specific moral theory."
        trigger: "Justifying a normative political theory in the context of reasonable moral pluralism."
        qualification: "Theorists who view political theory as a subfield of moral philosophy may legitimately use the applied-moral-philosophy method."
  - id: c173
    section: "LIST & VALENTINI (POLITICAL THEORY METHODOLOGY)"
    label: "Distinguish theory from its supporting arguments/evidence"
    note: "singleton: don't roll thought experiments / observations into the theory itself"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d15"
        source: "List & Valentini 2016, sec. 4.3, pp. 537-538"
        decision: keep
        directive: "Distinguish a theory from the arguments, evidence, or justification offered in its support, and do not treat justificatory devices (e.g. thought experiments, observational evidence) as part of the theory itself."
        trigger: "Analysing, formulating, or assessing a theory in political theory."
        qualification: ""
  - id: c174
    section: "LIST & VALENTINI (POLITICAL THEORY METHODOLOGY)"
    label: "Don't downgrade with 'it is only a theory'"
    note: "singleton: 'theory' is a content-neutral term"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d16"
        source: "List & Valentini 2016, sec. 4.3, p. 538"
        decision: keep
        directive: "Do not attempt to downgrade a body of claims by saying 'it is only a theory': calling something a theory carries no assessment of truth or acceptability and is consistent with both well-supportedness and speculation."
        trigger: "Encountering or making rhetorical attacks of the form 'X is only a theory' (e.g. against evolutionary theory, climate science, or rival political theories)."
        qualification: ""
  - id: c175
    section: "LIST & VALENTINI (POLITICAL THEORY METHODOLOGY)"
    label: "Idealisations: assess fit-to-purpose, locate by level"
    note: "variants: don't reject idealisations a priori; distinguish theory/application/justification levels; state assumptions as antecedents"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d17"
        source: "List & Valentini 2016, sec. 6.2, pp. 544-545"
        decision: keep
        directive: "Do not reject idealizations in a theory from the outset; instead, ask whether the theory contains the 'right' idealizations given its purpose."
        trigger: "Evaluating whether a normative theory's use of simplifying assumptions or idealized thought experiments undermines it."
        qualification: ""
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d18"
        source: "List & Valentini 2016, sec. 6.2-6.4, pp. 545-546"
        decision: keep
        directive: "When diagnosing the role of idealizations in a theory, distinguish three loci at which they may occur — (1) the theory itself, (2) the conditions of application of its prescriptions, and (3) the justification offered for it — and do not assume that idealization at one level entails idealization at the others."
        trigger: "Assessing whether and how a normative theory is 'idealized'."
        qualification: ""
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d19"
        source: "List & Valentini 2016, sec. 6.4, p. 546"
        decision: keep
        directive: "When formulating a normative principle that depends on a simplifying assumption, state the assumption explicitly as an antecedent in a conditional ('if such-and-such conditions hold, then ...') rather than asserting the principle in unqualified universal terms."
        trigger: "Formulating principles whose validity depends on conditions that may not hold in real-world circumstances."
        qualification: ""
  - id: c176
    section: "LIST & VALENTINI (POLITICAL THEORY METHODOLOGY)"
    label: "Public-justifiability under reasonable pluralism"
    note: "singleton: principles must be acceptable to reasonable conflicting moral views"
    fork_hint: false
    members:
      - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch27-list-valentini-methodology-political-theory/d20"
        source: "List & Valentini 2016, sec. 7.1, pp. 546-547"
        decision: keep
        directive: "When developing principles meant to apply to and be acceptable in pluralistic societies, ensure they are at least in principle acceptable to individuals holding reasonable but conflicting moral views."
        trigger: "Defending normative or evaluative principles in political theory under conditions of reasonable pluralism."
        qualification: "What counts as 'reasonable' itself requires specification — epistemological vs moral interpretations each carry distinct virtues and vices."
  - id: c177
    section: "DAVIDSON (RADICAL INTERPRETATION + CONCEPTUAL SCHEME)"
    label: "Reductio: reject premises that strip mind of constitutive features"
    note: "singleton: argument-form ploy specific to philosophy-of-mind reasoning"
    fork_hint: false
    members:
      - id: "davidson-1984-inquiries/conceptual-scheme/d01"
        source: "Davidson 1984, 'On the Very Idea of a Conceptual Scheme', p. 185"
        decision: keep
        directive: "When a line of reasoning forces the conclusion that the mind is divorced from the traits that constitute it (e.g. that the agent has no desires/habits/dispositions, or that thought is possible without language), reject the premises rather than accept the conclusion."
        trigger: "When evaluating a philosophical argument whose conclusion strips the mind of its constitutive features (categories, concepts, dispositions, language)."
        qualification: "Davidson presents this as a recurring pattern across freedom and knowledge theories; the directive is to treat such conclusions as a reductio of the premises."
  - id: c178
    section: "DAVIDSON (RADICAL INTERPRETATION + CONCEPTUAL SCHEME)"
    label: "Don't establish substantive theses by fiat"
    note: "singleton: derive contested criteria via argument, not stipulation"
    fork_hint: false
    members:
      - id: "davidson-1984-inquiries/conceptual-scheme/d02"
        source: "Davidson 1984, 'On the Very Idea of a Conceptual Scheme', p. 186"
        decision: keep
        directive: "Do not establish a substantive thesis (such as 'translatability into a familiar tongue is a criterion of languagehood') by fiat; if it is a truth, derive it as the conclusion of an argument."
        trigger: "When tempted to assert a philosophically contested criterion or thesis as self-evident."
        qualification: "Davidson allows that the thesis in question may indeed be true; the directive concerns how it must be supported, not whether it holds."
  - id: c179
    section: "DAVIDSON (RADICAL INTERPRETATION + CONCEPTUAL SCHEME)"
    label: "Reject scheme/content dualism and 'organising' talk"
    note: "variants: don't treat the world as a single thing schemes 'organise'; reject conceptual-relativist 'fits experience' framings"
    fork_hint: false
    members:
      - id: "davidson-1984-inquiries/conceptual-scheme/d03"
        source: "Davidson 1984, 'On the Very Idea of a Conceptual Scheme', p. 192"
        decision: keep
        directive: "Do not treat a single undifferentiated object (the world, nature, reality) as something a language or scheme could 'organize'; the notion of organization applies only to pluralities of individuated items."
        trigger: "When evaluating or formulating claims that a conceptual scheme or language 'organizes' reality, the world, or experience."
        qualification: "Applies equally to 'experience' as object: any plurality to be organized must already be individuated according to familiar principles, so the organizing language must be very like our own."
      - id: "davidson-1984-inquiries/conceptual-scheme/d04"
        source: "Davidson 1984, 'On the Very Idea of a Conceptual Scheme', pp. 193-194"
        decision: keep
        directive: "Do not posit experience, sensory promptings, surface irritations, or 'the facts' as a further entity that sentences or theories 'fit'; reduce such talk to the simple notion of being true."
        trigger: "When formulating or evaluating an account on which a theory or sentence is correct because it 'fits', 'faces', 'copes with', or 'is borne out by' experience or the totality of sensory evidence."
        qualification: "Davidson grants that one may speak of facts making sentences true if one wishes, but the point is put better without mention of facts; the Tarskian disquotational form ('Snow is white' is true iff snow is white) suffices."
      - id: "davidson-1984-inquiries/introduction/d06"
        source: "Davidson 1984, Introduction, p. xviii (pdf 21)"
        decision: keep
        directive: "Reject the dualism of conceptual scheme and uninterpreted content; do not treat language as a screen or filter through which knowledge of the world must pass, and do not credit claims that different languages or conceptual schemes 'divide up' or 'cope with' reality in importantly different ways."
        trigger: "When evaluating claims of conceptual relativism, untranslatability between schemes, or scheme/content distinctions."
        qualification: "Giving up scheme/content does not require giving up the idea of an objective world independent of our knowledge of it; it bars conceptual relativism, not realism about the world."
  - id: c180
    section: "DAVIDSON (RADICAL INTERPRETATION + CONCEPTUAL SCHEME)"
    label: "Joint determination of belief and meaning in interpretation"
    note: "variants: build belief and meaning together; take 'holding-true' as the basic observable; don't ground interpretation on finely-discriminated attitudes"
    fork_hint: false
    members:
      - id: "davidson-1984-inquiries/conceptual-scheme/d05"
        source: "Davidson 1984, 'On the Very Idea of a Conceptual Scheme', p. 195"
        decision: adapt
        directive: "When interpreting a user's claim, build a joint working account of what the user means and what the user believes simultaneously, taking neither the meaning of their terms nor the content of their beliefs as given in advance."
        trigger: "When constructing a theory of meaning or interpretation for another speaker."
        qualification: "Required because attribution of fine-grained beliefs and translation of speech are interdependent; neither can be presupposed as a base on which to build the other."
        original_directive: "Build a theory of interpretation that simultaneously accounts for the speaker's attitudes (beliefs, intentions) and interprets the speaker's sentences, assuming neither in advance."
      - id: "davidson-1984-inquiries/conceptual-scheme/d06"
        source: "Davidson 1984, 'On the Very Idea of a Conceptual Scheme', pp. 195-196"
        decision: adapt
        directive: "When the user's vocabulary or framing is not assumed to match yours, take the sentences the user asserts (holds true) as the primary evidence for reconstructing what they mean and believe."
        trigger: "When beginning a project of radical interpretation of a speaker whose language is not assumed to be one's own."
        qualification: "A fuller theory would also draw on other attitudes towards sentences (wishing true, wondering whether true, intending to make true); 'holding true' is the crucial notion for the present discussion."
        original_directive: "Take the speaker's attitude of holding-sentences-true as the basic evidence for a theory of radical interpretation."
      - id: "davidson-1984-inquiries/radical-interpretation/d04"
        source: "Davidson 1984, 'Radical Interpretation' (Essay 9), pp. 127, 134"
        decision: adapt
        directive: "Do not ground an interpretation of the user's utterance on finely discriminated attributions of belief or intention to them; treat belief, intention, and meaning as jointly under-determined and flag this rather than asserting subtle intent."
        trigger: "When selecting evidence to support a theory that interprets a speaker's utterances."
        qualification: "The reason is that interpreting an agent's intentions, beliefs, and words is a single project no part of which can be assumed complete before the rest; attributions of subtle attitudes themselves depend on much the same evidence as interpretation."
        original_directive: "Do not take the speaker's finely discriminated beliefs and intentions as the evidential base for a theory of radical interpretation."
      - id: "davidson-1984-inquiries/radical-interpretation/d05"
        source: "Davidson 1984, 'Radical Interpretation' (Essay 9), pp. 134-135"
        decision: adapt
        directive: "When tracking the user's commitments across the conversation, record which sentences they hold true (assert, endorse, accept) under which circumstances, rather than imputing finer-grained beliefs or intentions."
        trigger: "When choosing the primary observable to record about speakers in the radical-interpretation setting."
        qualification: "Holding-true is itself a belief, but it is a single attitude applicable to all sentences and so does not require finely discriminated distinctions among beliefs; lies, commands, stories, and irony — once detected — can also reveal whether the speaker holds his sentences true."
        original_directive: "Take the attitude of holding a sentence true at a time and under specified circumstances as the basic evidence for a theory of interpretation."
  - id: c181
    section: "DAVIDSON (RADICAL INTERPRETATION + CONCEPTUAL SCHEME)"
    label: "Reinterpret words rather than attribute implausible beliefs"
    note: "variants: when face-value reading attributes implausible belief, prefer reinterpretation; first-pass: assign sentence truth-conditions you take to obtain"
    fork_hint: false
    members:
      - id: "davidson-1984-inquiries/conceptual-scheme/d07"
        source: "Davidson 1984, 'On the Very Idea of a Conceptual Scheme', p. 196"
        decision: adapt
        directive: "When a user's statement, read literally, would attribute to them an implausible belief they are otherwise well-positioned to avoid, prefer reinterpreting their words over attributing the false belief, and flag the reinterpretation."
        trigger: "When a speaker's utterance, taken at face value, would attribute to the speaker an implausible belief that the speaker is otherwise well-positioned to avoid (e.g. the ketch/yawl case)."
        qualification: "Reinterpretation is one option weighed against attributing a false belief; the choice is governed by what yields a viable joint theory of belief and meaning, and by background plausibility (e.g. whether the speaker's vision and line of sight are good)."
        original_directive: "When interpreting an utterance, decide in favour of reinterpretation of the speaker's words in order to preserve a reasonable theory of belief."
      - id: "davidson-1984-inquiries/conceptual-scheme/d08"
        source: "Davidson 1984, 'On the Very Idea of a Conceptual Scheme', p. 196"
        decision: adapt
        directive: "As a first pass when interpreting a user whose usage may diverge from yours, assign their asserted sentences truth-conditions that you take to actually obtain when they assert them, then revise for simplicity, social context, and explicable error."
        trigger: "At the start of interpreting a speaker whose beliefs are not yet known and whose language is not assumed to be ours."
        qualification: "Subject to considerations of simplicity, hunches about the effects of social conditioning, and common-sense or scientific knowledge of explicable error."
        original_directive: "Get a first approximation to a theory of interpretation by assigning to a speaker's sentences truth-conditions that actually obtain (in our own opinion) just when the speaker holds those sentences true."
  - id: c182
    section: "DAVIDSON (RADICAL INTERPRETATION + CONCEPTUAL SCHEME)"
    label: "Sharpen disagreement by enlarging shared base"
    note: "singleton: clarify difference-claims by enlarging the translatable/shared region"
    fork_hint: false
    members:
      - id: "davidson-1984-inquiries/conceptual-scheme/d11"
        source: "Davidson 1984, 'On the Very Idea of a Conceptual Scheme', p. 197"
        decision: keep
        directive: "Improve the clarity and bite of any declaration that another speaker differs from us — whether in scheme or in opinion — by enlarging the basis of shared (translatable) language or of shared opinion."
        trigger: "When attempting to articulate or assess a claim that another speaker, community, or tradition differs from us in concepts or beliefs."
        qualification: "No general principle or appeal to evidence forces the choice between locating a difference in beliefs versus in concepts; the line cannot be sharply drawn."
  - id: c183
    section: "DAVIDSON (RADICAL INTERPRETATION + CONCEPTUAL SCHEME)"
    label: "Two joint conditions on a meaning-theory"
    note: "singleton: must interpret all utterances and be verifiable without prior attitudinal knowledge"
    fork_hint: false
    members:
      - id: "davidson-1984-inquiries/introduction/d01"
        source: "Davidson 1984, Introduction, p. xiii (pdf 16)"
        decision: keep
        directive: "Require any theory that purports to answer what it is for words to mean what they do to satisfy two conditions jointly: it must provide an interpretation of all utterances, actual and potential, of a speaker or group of speakers; and it must be verifiable without knowledge of the detailed propositional attitudes of the speaker."
        trigger: "When evaluating or constructing a theory that purports to explain what it is for words to mean what they do."
        qualification: "A theory that does not satisfy both conditions cannot be said to answer the question in a philosophically instructive way."
  - id: c184
    section: "DAVIDSON (RADICAL INTERPRETATION + CONCEPTUAL SCHEME)"
    label: "Finite-vocabulary compositional constraint"
    note: "singleton: explain infinite sentence-meaning via finite vocabulary"
    fork_hint: false
    members:
      - id: "davidson-1984-inquiries/introduction/d02"
        source: "Davidson 1984, Introduction, p. xiii (pdf 16)"
        decision: keep
        directive: "Discover a finite basic vocabulary in the verbal phenomena to be interpreted, and treat the semantic features of the potential infinity of sentences as owed to the semantic features of items in that finite vocabulary."
        trigger: "When constructing a semantic theory intended to be useful to a creature with finite powers."
        qualification: "Stated as a requirement for usefulness to finite interpreters; theories that fail this condition (e.g. Frege on oblique contexts, Church's logic of sense and denotation, Tarski's informal treatment of quotation) are to be rejected on this ground."
  - id: c185
    section: "DAVIDSON (RADICAL INTERPRETATION + CONCEPTUAL SCHEME)"
    label: "Truth-theoretic axioms as laws (counterfactual support)"
    note: "singleton: theorems must support counterfactuals when used empirically"
    fork_hint: false
    members:
      - id: "davidson-1984-inquiries/introduction/d03"
        source: "Davidson 1984, Introduction, p. xiv (pdf 17)"
        decision: keep
        directive: "Treat the axioms and theorems of a theory of truth (when used as an empirical theory of meaning) as laws — that is, as capable of supporting counterfactual claims — not merely as true."
        trigger: "When deploying a theory of truth as an empirical theory of meaning for a speaker."
        qualification: "Davidson notes the concession to intensionality this involves depends on one's analysis of law, but holds that whatever the concession is, it must be made for any empirical science."
  - id: c186
    section: "DAVIDSON (RADICAL INTERPRETATION + CONCEPTUAL SCHEME)"
    label: "Don't posit metaphorical meanings"
    note: "singleton: explain metaphor with literal meanings"
    fork_hint: false
    members:
      - id: "davidson-1984-inquiries/introduction/d05"
        source: "Davidson 1984, Introduction, p. xix (pdf 22)"
        decision: keep
        directive: "Do not posit metaphorical meanings; explain what words in metaphor do by supposing they have the same meanings they have in non-figurative contexts."
        trigger: "When giving a semantic account of metaphorical uses of language."
        qualification: "Positing metaphorical meanings would lose our ability to account for metaphor and rule out responsible theory."
  - id: c187
    section: "DAVIDSON (RADICAL INTERPRETATION + CONCEPTUAL SCHEME)"
    label: "Distinguish grammatical mood from illocutionary force"
    note: "singleton: theory of meaning handles mood; force is outside its scope"
    fork_hint: false
    members:
      - id: "davidson-1984-inquiries/introduction/d07"
        source: "Davidson 1984, Introduction, p. xx (pdf 23)"
        decision: keep
        directive: "Distinguish grammatical mood, which a theory of meaning must account for, from the illocutionary force of utterances, which lies beyond the reach of comparable systematization."
        trigger: "When fixing the scope of a theory of meaning and deciding which features of utterances the theory must explain."
        qualification: "The scope must be broad enough to provide insight into how language serves our endless purposes, but restricted enough to be amenable to serious systematization; force is excluded on the latter ground."
  - id: c188
    section: "DAVIDSON (RADICAL INTERPRETATION + CONCEPTUAL SCHEME)"
    label: "Cite evidence for interpretation that doesn't presuppose interpretation"
    note: "singleton: in radical-interpretation, don't appeal to meaning/synonymy as evidence"
    fork_hint: false
    members:
      - id: "davidson-1984-inquiries/radical-interpretation/d03"
        source: "Davidson 1984, 'Radical Interpretation' (Essay 9), p. 128"
        decision: adapt
        directive: "When defending an interpretation of a speaker's utterance, do not rely on premises that already presuppose the meaning, synonymy, or interpretation in question; cite only evidence statable independently of those notions."
        trigger: "When choosing what counts as admissible evidence for confirming a theory of interpretation in the radical (non-prior-knowledge) case."
        qualification: "This restriction applies to the radical case where the interpreter does not already know how to interpret the utterances the theory is designed to cover; for an interpreter who already knows the language, sample correct interpretations may serve as evidence."
        original_directive: "Restrict the evidence base for a theory of radical interpretation to evidence that can be stated without essential use of linguistic concepts such as meaning, interpretation, or synonymy."
  - id: c189
    section: "DAVIDSON (RADICAL INTERPRETATION + CONCEPTUAL SCHEME)"
    label: "Acknowledge belief-meaning indeterminacy when citing single evidence"
    note: "singleton: cite a T-sentence only with the broader scheme it sits in; flag remaining indeterminacy"
    fork_hint: false
    members:
      - id: "davidson-1984-inquiries/radical-interpretation/d15"
        source: "Davidson 1984, 'Radical Interpretation' (Essay 9), pp. 138-139"
        decision: adapt
        directive: "When citing one piece of textual or contextual evidence to license an interpretation of a user's utterance or a passage, also state the broader interpretive scheme it sits in and acknowledge that some indeterminacy between attributed beliefs and assigned meanings remains."
        trigger: "When using an individual T-sentence to interpret an utterance."
        qualification: "Indeterminacy remains — there will be trade-offs between attributed beliefs and assigned interpretations — but any theory passing the constraints will yield acceptable interpretations; a T-sentence in isolation, or a canonical proof of one, does not by itself give the meaning of a sentence."
        original_directive: "Treat a T-sentence as licensing interpretation of a sentence only when one also knows the theory that entails it and knows that the theory meets the formal and empirical (holistic) criteria."
