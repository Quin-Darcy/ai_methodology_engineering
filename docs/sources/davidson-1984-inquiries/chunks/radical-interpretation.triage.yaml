  - id: "davidson-1984-inquiries/radical-interpretation/d14"
    decision: drop
    reason: "Sequencing step in building a truth theory for an unknown tongue using occasion sentences; no conversational analogue."
    adapted_directive: null
  - id: "davidson-1984-inquiries/radical-interpretation/d15"
    decision: adapt
    reason: "Holism caveat — a single interpretation is licensed only against the whole interpretive scheme — ports to citation hygiene."
    adapted_directive: "When citing one piece of textual or contextual evidence to license an interpretation of a user's utterance or a passage, also state the broader interpretive scheme it sits in and acknowledge that some indeterminacy between attributed beliefs and assigned meanings remains."
