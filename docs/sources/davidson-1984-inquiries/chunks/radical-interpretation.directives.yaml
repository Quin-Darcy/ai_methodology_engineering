directives:
  - id: "davidson-1984-inquiries/radical-interpretation/d01"
    source: "Davidson 1984, 'Radical Interpretation' (Essay 9), p. 128"
    directive: "State explicitly what an interpreter would have to know to interpret an infinity of possible utterances, and put that statement in finite form."
    trigger: "When constructing or evaluating a theory of interpretation for a speaker's language."
    qualification: "Meeting this finiteness requirement forces giving up any hope of a universal method of interpretation applicable to every possible language; the most that can be expected is a theory for a single language or finite number of languages."
    evidence: "'The interpreter must be able to understand any of the infinity of sentences the speaker might utter. If we are to state explicitly what the interpreter might know that would enable him to do this, we must put it in finite form. If this requirement is to be met, any hope of a universal method of interpretation must be abandoned.' (pp. 127-128)"
  - id: "davidson-1984-inquiries/radical-interpretation/d02"
    source: "Davidson 1984, 'Radical Interpretation' (Essay 9), p. 128"
    directive: "Describe what is wanted of a theory of interpretation without apparent reference to meanings or interpretations as entities; require instead that someone who knows the theory can interpret the utterances the theory applies to."
    trigger: "When specifying the deliverable of a theory of interpretation."
    qualification: "Treating interpretations as values of a function on utterances would make them entities 'no better than meanings'; this is why the reformulation is required."
    evidence: "'So it seems wise to describe what is wanted of the theory without apparent reference to meanings or interpretations: someone who knows the theory can interpret the utterances to which the theory applies.' (p. 128)"
  - id: "davidson-1984-inquiries/radical-interpretation/d03"
    source: "Davidson 1984, 'Radical Interpretation' (Essay 9), p. 128"
    directive: "Restrict the evidence base for a theory of radical interpretation to evidence that can be stated without essential use of linguistic concepts such as meaning, interpretation, or synonymy."
    trigger: "When choosing what counts as admissible evidence for confirming a theory of interpretation in the radical (non-prior-knowledge) case."
    qualification: "This restriction applies to the radical case where the interpreter does not already know how to interpret the utterances the theory is designed to cover; for an interpreter who already knows the language, sample correct interpretations may serve as evidence."
    evidence: "'The evidence must be of a sort that would be available to someone who does not already know how to interpret utterances the theory is designed to cover: it must be evidence that can be stated without essential use of such linguistic concepts as meaning, interpretation, synonymy, and the like.' (p. 128)"
  - id: "davidson-1984-inquiries/radical-interpretation/d04"
    source: "Davidson 1984, 'Radical Interpretation' (Essay 9), pp. 127, 134"
    directive: "Do not take the speaker's finely discriminated beliefs and intentions as the evidential base for a theory of radical interpretation."
    trigger: "When selecting evidence to support a theory that interprets a speaker's utterances."
    qualification: "The reason is that interpreting an agent's intentions, beliefs, and words is a single project no part of which can be assumed complete before the rest; attributions of subtle attitudes themselves depend on much the same evidence as interpretation."
    evidence: "'we cannot make the full panoply of intentions and beliefs the evidential base for a theory of radical interpretation' (p. 127); 'The evidence cannot consist in detailed descriptions of the speaker's beliefs and intentions, since attributions of attitudes, at least where subtlety is required, demand a theory that must rest on much the same evidence as interpretation.' (p. 134)"
  - id: "davidson-1984-inquiries/radical-interpretation/d05"
    source: "Davidson 1984, 'Radical Interpretation' (Essay 9), pp. 134-135"
    directive: "Take the attitude of holding a sentence true at a time and under specified circumstances as the basic evidence for a theory of interpretation."
    trigger: "When choosing the primary observable to record about speakers in the radical-interpretation setting."
    qualification: "Holding-true is itself a belief, but it is a single attitude applicable to all sentences and so does not require finely discriminated distinctions among beliefs; lies, commands, stories, and irony — once detected — can also reveal whether the speaker holds his sentences true."
    evidence: "'A good place to begin is with the attitude of holding a sentence true, of accepting it as true. This is, of course, a belief, but it is a single attitude applicable to all sentences, and so does not ask us to be able to make finely discriminated distinctions among beliefs.' (pp. 134-135)"
  - id: "davidson-1984-inquiries/radical-interpretation/d06"
    source: "Davidson 1984, 'Radical Interpretation' (Essay 9), p. 130"
    directive: "Do not adopt a translation manual as the form of a theory of interpretation."
    trigger: "When choosing the form a theory of interpretation should take."
    qualification: "A translation manual concerns a relation between two languages rather than interpretation of one; it leaves tacit what the interpreter needs to know about his own language and provides no insight into how meanings depend on sentence structure."
    evidence: "'I do not think a translation manual is the best form for a theory of interpretation to take... the method of translation leaves tacit and beyond the reach of theory what we need to know that allows us to interpret our own language.' (pp. 129-130)"
  - id: "davidson-1984-inquiries/radical-interpretation/d07"
    source: "Davidson 1984, 'Radical Interpretation' (Essay 9), pp. 130-131"
    directive: "Use a Tarski-style theory of truth — one that entails a T-sentence of the form 's is true (in the object language) if and only if p' for every sentence s of the object language — as the form of a theory of interpretation."
    trigger: "When formulating a theory that aims to interpret the utterances of a natural language."
    qualification: "For natural languages the theory must be modified to characterize truth relative to a time and a speaker so that indexical features (tense and the like) are handled; the recursive theory need not be converted to an explicit definition for the purposes of interpretation."
    evidence: "'We have such theories, I suggest, in theories of truth of the kind Tarski first showed how to give... What characterizes a theory of truth in Tarski's style is that it entails, for every sentence s of the object language, a sentence of the form: s is true (in the object language) if and only if p.' (pp. 130-131)"
  - id: "davidson-1984-inquiries/radical-interpretation/d08"
    source: "Davidson 1984, 'Radical Interpretation' (Essay 9), p. 134"
    directive: "Reverse Tarski's order of explanation: treat truth as basic and extract an account of translation or interpretation from it, rather than assuming translation in order to define truth."
    trigger: "When applying a theory of truth in the empirical (radical-interpretation) case."
    qualification: "In empirical applications we must abandon Tarski's assumption that correct translation can be recognized in advance, since assuming it pre-empts the point of radical interpretation."
    evidence: "'What I propose is to reverse the direction of explanation: assuming translation, Tarski was able to define truth; the present idea is to take truth as basic and to extract an account of translation or interpretation.' (p. 134)"
  - id: "davidson-1984-inquiries/radical-interpretation/d09"
    source: "Davidson 1984, 'Radical Interpretation' (Essay 9), p. 134"
    directive: "Rephrase Convention T without appeal to translation: require an acceptable theory of truth to entail, for every sentence s, a sentence 's is true if and only if p' where 'p' is replaced by any sentence that is true if and only if s is."
    trigger: "When stating the adequacy condition for a theory of truth used as a theory of interpretation in the radical case."
    qualification: "On its own this weaker condition would not yield interpretation; it works only when combined with appropriate formal and empirical restrictions on the theory as a whole, so that individual T-sentences in fact serve to yield interpretations."
    evidence: "'There is no difficulty in rephrasing Convention T without appeal to the concept of translation: an acceptable theory of truth must entail, for every sentence s of the object language, a sentence of the form: s is true if and only if p, where ‘p' is replaced by any sentence that is true if and only if s is.' (p. 134)"
  - id: "davidson-1984-inquiries/radical-interpretation/d10"
    source: "Davidson 1984, 'Radical Interpretation' (Essay 9), pp. 135-136"
    directive: "Choose the theory of truth that maximizes agreement — that makes the speaker right, by our own standards, as often as possible — subject to the formal constraints on a theory of truth."
    trigger: "When selecting among candidate theories of truth that fit the evidence about which sentences speakers hold true."
    qualification: "Maximization cannot be taken literally because sentences are infinite in number; once the theory takes shape it makes sense to accept intelligible error and to make allowance for the relative likelihood of various kinds of mistake."
    evidence: "'The method is rather one of getting a best fit. We want a theory that satisfies the formal constraints on a theory of truth, and that maximizes agreement, in the sense of making Kurt (and others) right, as far as we can tell, as often as possible. The concept of maximization cannot be taken literally here... it makes sense to accept intelligible error and to make allowance for the relative likelihood of various kinds of mistake.' (p. 136)"
  - id: "davidson-1984-inquiries/radical-interpretation/d11"
    source: "Davidson 1984, 'Radical Interpretation' (Essay 9), p. 137"
    directive: "Solve for meaning by holding belief constant as far as possible — assign truth conditions to alien sentences that make native speakers right when plausibly possible, by our own view of what is right."
    trigger: "When facing the joint underdetermination of belief and meaning during interpretation."
    qualification: "What justifies the procedure is that disagreement and agreement alike are intelligible only against a background of massive agreement; it is not a charitable assumption about human intelligence that could turn out false but a precondition for treating a creature as rational, as having beliefs, or as saying anything."
    evidence: "'This method is intended to solve the problem of the interdependence of belief and meaning by holding belief constant as far as possible while solving for meaning. This is accomplished by assigning truth conditions to alien sentences that make native speakers right when plausibly possible, according, of course, to our own view of what is right... If we cannot find a way to interpret the utterances and other behaviour of a creature as revealing a set of beliefs largely consistent and true by our own standards, we have no reason to count that creature as rational, as having beliefs, or as saying anything.' (p. 137)"
  - id: "davidson-1984-inquiries/radical-interpretation/d12"
    source: "Davidson 1984, 'Radical Interpretation' (Essay 9), pp. 136-137"
    directive: "Apply the principle of charity across the board — to all sentences — not merely to the identification of the sentential connectives."
    trigger: "When deciding the scope over which to apply charity in interpretation."
    qualification: "This is explicitly contrasted with Quine, who emphasizes charity only in connection with the (pure) sentential connectives."
    evidence: "'the principle of charity, which Quine emphasizes only in connection with the identification of the (pure) sentential connectives, I apply across the board.' (p. 136, footnote 16)"
  - id: "davidson-1984-inquiries/radical-interpretation/d13"
    source: "Davidson 1984, 'Radical Interpretation' (Essay 9), p. 136"
    directive: "Fit first-order quantificational logic (with identity) onto the new language as a whole — 'in one fell swoop' — rather than identifying logical constants one by one."
    trigger: "In the first step of devising a theory of truth for an unknown native tongue."
    qualification: "The relevant evidence is classes of sentences always held true or always held false by almost everyone almost all of the time (potential logical truths) and patterns of inference; this step identifies predicates, singular terms, quantifiers, connectives, and identity."
    evidence: "'First we look for the best way to fit our logic, to the extent required to get a theory satisfying Convention T, on to the new language; this may mean reading the logical structure of first-order quantification theory (plus identity) into the language, not taking the logical constants one by one, but treating this much of logic as a grid to be fitted on to the language in one fell swoop.' (p. 136)"
  - id: "davidson-1984-inquiries/radical-interpretation/d14"
    source: "Davidson 1984, 'Radical Interpretation' (Essay 9), p. 136"
    directive: "Use sentences whose held-true value changes with discoverable changes in the world (indexical, occasion sentences) as the second step in interpreting individual predicates."
    trigger: "After fitting the logical grid onto the language and before tackling the remaining sentences."
    qualification: "This step in conjunction with the first limits the possibilities for interpreting individual predicates; it does not by itself determine them."
    evidence: "'The second step concentrates on sentences with indexicals; those sentences sometimes held true and sometimes false according to discoverable changes in the world. This step in conjunction with the first limits the possibilities for interpreting individual predicates.' (p. 136)"
  - id: "davidson-1984-inquiries/radical-interpretation/d15"
    source: "Davidson 1984, 'Radical Interpretation' (Essay 9), pp. 138-139"
    directive: "Treat a T-sentence as licensing interpretation of a sentence only when one also knows the theory that entails it and knows that the theory meets the formal and empirical (holistic) criteria."
    trigger: "When using an individual T-sentence to interpret an utterance."
    qualification: "Indeterminacy remains — there will be trade-offs between attributed beliefs and assigned interpretations — but any theory passing the constraints will yield acceptable interpretations; a T-sentence in isolation, or a canonical proof of one, does not by itself give the meaning of a sentence."
    evidence: "'A T-sentence of an empirical theory of truth can be used to interpret a sentence, then, provided we also know the theory that entails it, and know that it is a theory that meets the formal and empirical criteria... When all the evidence is in, there will remain, as Quine has emphasized, the trade-offs between the beliefs we attribute to a speaker and the interpretations we give his words. But the resulting indeterminacy cannot be so great but that any theory that passes the tests will serve to yield interpretations.' (pp. 138-139)"
