directives:
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d01"
    source: "Hájek 2016, ch. 19, p. 349"
    directive: "Check extreme cases, and near-extreme cases."
    trigger: "When searching for counterexamples to a thesis or analysis."
    qualification: "Heuristic only — a defeasible guide that tends to work, not a sure-fire recipe; reduces but does not eliminate the search space."
    evidence: "p. 349 (bulleted list of heuristics from his 2014): 'Check extreme cases, and near-extreme cases. These are especially promising places to look first for counterexamples, and doing so reduces your search space.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d02"
    source: "Hájek 2016, ch. 19, p. 349"
    directive: "Plug a function into itself as its own argument, and more generally appeal to self-referential cases ('death by diagonalization')."
    trigger: "When constructing arguments or counterexamples about functions, predicates, or domains that include themselves."
    qualification: "Defeasible — 'it worked for Cantor, Russell, and Gödel; it may work for you.'"
    evidence: "p. 349: 'Death by diagonalization: reflexivity/self-reference. Plug into a function itself as its own argument, and more generally, appeal to self-referential cases. It worked for Cantor, Russell, and Gödel; it may work for you.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d03"
    source: "Hájek 2016, ch. 19, p. 349"
    directive: "Check whether a philosophical position or argument that falls in the very domain it purports to cover treats itself consistently."
    trigger: "When evaluating a philosophical position or argument whose subject matter includes positions or arguments of its own kind."
    qualification: ""
    evidence: "p. 349: 'Self-undermining views. Relatedly, check whether a philosophical position or argument that falls in the very domain that it purports to cover treats itself consistently.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d04"
    source: "Hájek 2016, ch. 19, p. 349"
    directive: "Beget new arguments out of old by exploiting analogies between domains (e.g., space, time, and modality; rationality and morality)."
    trigger: "When looking for new arguments or counterexamples in a target domain that resembles one for which arguments are already known."
    qualification: ""
    evidence: "p. 349: 'Begetting new arguments out of old. Good arguments are often easily transformed from one domain to another. Exploit analogies between, e.g. space, time, and modality; and between rationality and morality.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d05"
    source: "Hájek 2016, ch. 19, p. 349"
    directive: "When ingenuity fails, run systematically through the relevant cases by trial and error until you find one that meets your needs."
    trigger: "When you cannot see by insight which case will do the work, and the relevant cases can be enumerated."
    qualification: ""
    evidence: "p. 349: 'Trial and error. When ingenuity fails you, sometimes you can just run systematically through the relevant cases until you find one that meets your needs.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d06"
    source: "Hájek 2016, ch. 19, §1.1, p. 350"
    directive: "When a philosophical thesis or analysis involves a definite description 'the F', ask (i) whether there are or could be multiple F's, and (ii) whether there are or could be no F's."
    trigger: "Whenever a thesis or analysis is phrased using a definite description ('the F')."
    qualification: "These two sub-tasks correspond to tests for uniqueness and existence familiar from mathematics; the heuristic breaks the hard task of looking for problem cases into two easier ones."
    evidence: "p. 350: 'A philosophical thesis or an analysis that involves a definite description \"… the F …\" typically presupposes that there is exactly one F. Ask: i) Are there, or could there be, multiple F's? ii) Are there, or could there be, no F's? In short, check to see if there are any or many F's.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d07"
    source: "Hájek 2016, ch. 19, §1.2, p. 352"
    directive: "When a philosophical thesis or analysis involves an indefinite description 'a(n) F', ask whether there are or could be no F's."
    trigger: "Whenever a thesis or analysis is phrased using an indefinite description ('a(n) F')."
    qualification: "Falling back from a definite to an indefinite description does not rescue an analysis whose existence presupposition fails."
    evidence: "p. 352: 'A philosophical thesis, or an analysis, that involves an indefinite description \"… a(n) F …\" presupposes that there is at least one F. Ask whether there are, or could be, no F's.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d08"
    source: "Hájek 2016, ch. 19, §1.3, p. 352"
    directive: "When a definite or indefinite description may be lurking in disguise, expose it by paraphrase before applying the uniqueness/existence checks."
    trigger: "When a thesis or analysis does not literally use 'the' or 'a(n)' but may presuppose uniqueness or existence under paraphrase (e.g., 'maximize' paraphrased as 'achieve the greatest amount')."
    qualification: ""
    evidence: "p. 352: 'Sometimes a problematic definite or indefinite description can come in disguise, and when it does, it is harder to see any neon lights, because one does not actually see the word \"the\" or \"a(n)\". Still, it may be lurking in the background, to be revealed in its neon glory by paraphrase.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d09"
    source: "Hájek 2016, ch. 19, §1.4, p. 353"
    directive: "Check whether the count of F's, or whether 'the F' has a determinate referent, may itself be indeterminate — not merely zero or many."
    trigger: "When a thesis appeals to 'the F' or 'a(n) F' and ordinary uniqueness/existence checks do not yield a problem case."
    qualification: ""
    evidence: "p. 353: 'A different kind of problem arises when it is indeterminate how many F's there are, and in particular, it is indeterminate whether there is one, or indeterminate whether there is at least one. Similarly, the word \"the\" suggests that there is a determinate answer to a relevant question … But there might be indeterminacy regarding these things.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d10"
    source: "Hájek 2016, ch. 19, §2, pp. 353–354"
    directive: "Treat arbitrariness in a philosophical position's choice among multiple equally good candidates as a prima facie sign of a flaw in the position."
    trigger: "When a philosophical position must select one item from multiple candidates that all appear to satisfy the relevant role equally well."
    qualification: "Not all arbitrary choices are fatal: choices that are 'partly' arbitrary (where some setting must be made and a range of reasonable settings exists) are typically not troubling."
    evidence: "pp. 353–354: 'arbitrary choices are often regarded as fatal to philosophical positions that have to make them … More broadly, arbitrariness can be a sign of a flaw in a philosophical position. It is forced to make a choice; but why that choice, when it apparently could just as easily have made another one?'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d11"
    source: "Hájek 2016, ch. 19, §2.3, p. 359"
    directive: "When responding to arbitrariness, look first to symmetry-breaking strategies, and only when they fail to leave just one candidate standing, look to symmetry-preserving strategies over the candidates that remain."
    trigger: "When choosing among the available responses to a philosophical position threatened by arbitrariness."
    qualification: "Different cases require different responses, and case-by-case philosophical judgement remains necessary; Hájek does not have a heuristic for deciding which response to use."
    evidence: "p. 359: 'I suggest that where possible, one should look to the symmetry-breaking strategies first, and only when they fail to leave just one candidate standing, look to the symmetry-preserving strategies over those that remain.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d12"
    source: "Hájek 2016, ch. 19, §2.2.6, p. 358"
    directive: "Do the opposite: take some approach to a problem and follow the opposite, dual, or complementary approach (e.g., replace universal quantifiers by existential, necessities by possibilities, conjunctions by disjunctions, parameter values by complementary values)."
    trigger: "When a philosophical approach is on the table and you wish to canvass alternatives or generate new approaches."
    qualification: "Self-cautioned by the 'see definite descriptions in neon lights' heuristic — this assumes there is exactly one such opposite approach."
    evidence: "p. 358: 'we encounter another mini-heuristic: do the opposite. Take some approach to a problem, and follow the opposite approach, dual approach, or complementary approach. … For example, replace universal quantifiers by existential quantifiers, necessities by possibilities, conjunctions by disjunctions, or replace parameter values by values that are in some sense complementary.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d13"
    source: "Hájek 2016, ch. 19, §3.1, pp. 359–360"
    directive: "Apply continuity reasoning: when one variable is a function of another, treat small changes in the input as a reason to expect small changes in the output, and treat large output changes from small input changes as suspect."
    trigger: "When evaluating a thesis or argument that maps similar inputs (cases, persons, premises) to dissimilar outputs (verdicts, treatments, solutions)."
    qualification: ""
    evidence: "pp. 359–360: 'This is an example of continuity reasoning. Roughly, the pattern is that one variable is a function of another, and small changes in the former should lead to small changes in the latter. … discontinuities may induce some of the discomfort that arbitrariness may cause us.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d14"
    source: "Hájek 2016, ch. 19, §3.1, p. 360"
    directive: "Beware of the slippery slope from unbridled continuity reasoning: check whether the same continuity premise can be run in the opposite direction, since driving it both ways yields a contradiction."
    trigger: "When wielding a continuity-based or slippery-slope argument."
    qualification: "Continuity reasoning is nonetheless a useful heuristic; the warning is against unbridled use, not against use itself."
    evidence: "p. 360: 'Beware of the slippery slope that the unbridled use of continuity reasoning could send us down! We can drive continuity reasoning in two directions … Yet if we drive the reasoning in both directions, we will arrive at a contradiction.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d15"
    source: "Hájek 2016, ch. 19, §3.1, p. 360"
    directive: "When deploying continuity-based arguments, make explicit the metric of 'distance' (numerical or at least more than a comparative ordering) by which similarity is being judged, and consider whether the choice of metric is itself arbitrary."
    trigger: "When the persuasive force of an argument depends on cases being 'similar' or 'nearby'."
    qualification: "The metric need not be numerical, but it must be more than merely a comparative ordering."
    evidence: "p. 360: 'continuity-based arguments must appeal to some sort of metric, at least loosely specified—some measure of \"distance\" according to which we can judge roughly how close entities or cases are to each other. … Disputes might arise over the choice of metric, and favouring one metric over another might appear to be arbitrary.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d16"
    source: "Hájek 2016, ch. 19, §3.2, pp. 361–362"
    directive: "Outsource philosophical work to mathematics where possible: import established theorems involving continuity (e.g., the intermediate value theorem, Brouwer's fixed point theorem) to do philosophical work."
    trigger: "When a philosophical problem can be cast in terms of continuous functions on suitable spaces."
    qualification: "Subject to Benacerraf's caution about deriving philosophical conclusions from mathematical theorems."
    evidence: "p. 361: 'We philosophers can outsource a lot of our problems, and let practitioners of other fields do a lot of the hard work for us. In this case, various beautiful theorems involving continuity that mathematicians have proven can do philosophical work.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d17"
    source: "Hájek 2016, ch. 19, §3.3, p. 363"
    directive: "When somebody purports to establish a philosophical thesis with a mathematical theorem, identify and spell out the ancillary philosophical premises they have assumed."
    trigger: "When evaluating an argument that purports to derive a philosophical conclusion from a mathematical theorem."
    qualification: "Hájek calls this a good philosophical heuristic in its own right; spelling out the premises clarifies what the argument really should be and fixes targets for further debate."
    evidence: "p. 363: 'When somebody purports to establish a philosophical thesis with a mathematical theorem, they must have assumed some philosophical premises. In fact, keeping this caution in mind is a good philosophical heuristic in its own right! … None of these theorems establish what they are purported to without the aid of ancillary philosophical premises. Spelling them out clarifies what the associated arguments really should be, and in doing so fixes targets for further debate.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d18"
    source: "Hájek 2016, ch. 19, §4, pp. 364–365"
    directive: "Diagnose putative analyses by checking for a mismatch of degrees between analysandum and analysans (one side coming in degrees while the other does not, or admitting borderline cases while the other does not)."
    trigger: "When evaluating a putative philosophical analysis of a concept C."
    qualification: ""
    evidence: "pp. 364–365: 'It's a problem for a putative analysis of some concept, C, if C comes in degrees that vary continuously, while the analysans has discontinuous \"jumps\", or vice versa. More generally, it's a problem if there is a mismatch of the degrees of the analysandum and the analysans. … This in turn may involve a mismatch of vagueness, one side admitting borderline cases, the other not.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d19"
    source: "Hájek 2016, ch. 19, §4.1, p. 365"
    directive: "Tollense where others ponens: when faced with a valid argument whose conclusion you reject, consider running it as a modus tollens against one of its premises rather than as a modus ponens to its conclusion."
    trigger: "When confronting an argument whose conclusion is unwelcome but whose form is valid."
    qualification: ""
    evidence: "p. 365: 'another useful philosopher's technique—one person's modus ponens is another's modus tollens. And Parfit (1984) tollenses where others ponens, arguing that personal identity indeed comes in degrees.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d20"
    source: "Hájek 2016, ch. 19, §4.1, p. 365"
    directive: "Turn things around: take the configuration of a problem (e.g., which side of an analysis comes in degrees) and consider the converse configuration."
    trigger: "When you have analyzed a problem under one orientation and want to canvas its dual."
    qualification: "Hájek labels this 'another philosophical heuristic in its own right.'"
    evidence: "p. 365: 'Now turn things around (another philosophical heuristic in its own right!).' (Used to pivot from §4.1 'analysandum does not come in degrees, analysans does' to §4.2 'analysandum comes in degrees, analysans does not.')"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d21"
    source: "Hájek 2016, ch. 19, §4.2, p. 366"
    directive: "Treat a bad analysis as a potentially good heuristic: even when an analysis fails to give necessary and sufficient conditions, it may still be a reliable enough guide to the analysandum to serve as a useful way to think about the associated concept."
    trigger: "When a philosophical analysis has been refuted or is widely regarded as failed."
    qualification: "It will typically not be a total failure — it typically gets a wide range of central cases right, otherwise it would never have seen the light of day; but good rules of thumb are not the last word."
    evidence: "p. 366: 'But a bad analysis can provide a good heuristic. It will typically not be a total failure—it will typically get a wide range of central cases right. … While failing to give necessary and sufficient conditions for its analysandum, it may nevertheless usually be a reliable guide to the analysandum, reliable enough to serve as a useful way to think about the associated concept.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d22"
    source: "Hájek 2016, ch. 19, §5, pp. 366–367"
    directive: "Translate a probability problem into a parallel frequency problem (or pretend that probabilities are frequencies) when reasoning probabilistically."
    trigger: "When working through a probability problem prone to base-rate neglect or other probabilistic confusions."
    qualification: "This is a heuristic, not a metaphysical claim — probabilities are not frequencies; frequentist thinking is just a good heuristic for probabilistic thinking."
    evidence: "pp. 366–367: 'translate a probability problem into a parallel frequency problem, or if you like, pretend that probabilities are frequencies. … This is not to say that probabilities are frequencies (they are not): just that frequentist thinking is a good heuristic for probabilistic thinking.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d23"
    source: "Hájek 2016, ch. 19, §5, pp. 367–369"
    directive: "Replace non-extensional notions (intensional and hyperintensional) with extensional surrogates when reasoning."
    trigger: "When reasoning about modal, counterfactual, indeterminacy, conditional, property-theoretic, normative, or other non-extensional notions that are opaque to natural thought."
    qualification: "The surrogate need not provide an analysis or reduction; the heuristic is analytically and metaphysically innocent. One must be careful that the distance between original and surrogate is not so great that the surrogate misguides; in 'an especially happy replacement', the replaceans has the same logic as the replaceandum."
    evidence: "p. 367: 'I propose a related heuristic: replace intensional notions with extensional surrogates. … I submit that extensional notions are easier to think about and to deal with; intensional notions are more opaque to us.' p. 369: 'we might do better to restate our heuristic: replace non-extensional notions with extensional surrogates.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d24"
    source: "Hájek 2016, ch. 19, §5, p. 369"
    directive: "More generally, replace hard notions with easier surrogates — concepts that come more naturally to us, e.g., that are expressible using first-order logic and set theory."
    trigger: "When grappling with a concept that confounds you and a more tractable close relative is available."
    qualification: "Be careful that there is not too much distance between the original concept and its surrogate; otherwise the surrogate will misguide you. Good rules of thumb are not the last word."
    evidence: "p. 369: 'Replace non-extensional notions with extensional surrogates is a special case of a more general heuristic: replace hard notions with easier surrogates. … We must be careful that there is not too much distance between the original concepts and their surrogates, for if there is, we run the risk that the surrogates will misguide us.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d25"
    source: "Hájek 2016, ch. 19, §6, pp. 369–370"
    directive: "Draw a picture: represent conceptual relationships visually (e.g., Venn diagrams for set-theoretic relationships, Kripke diagrams for modal systems, neuron diagrams or causal networks for causation, Minkowski diagrams for relativity)."
    trigger: "When conceptual relationships are obscure when cloaked in words or symbols, or when checking the validity of an inference."
    qualification: "Works particularly well in tandem with the 'replace non-extensional with extensional' heuristic: translate first, then diagram."
    evidence: "p. 369: 'Conceptual relationships that may be obscure when cloaked in words or symbols often leap out at us when we represent them visually. … translate from non-extensional to extensional notions, then diagram the latter.' p. 370: 'However, the draw a picture heuristic can stand alone, unaided by the previous heuristic.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d26"
    source: "Hájek 2016, ch. 19, §7, p. 370"
    directive: "When doing philosophy, check the products of your work (intuitions deployed, arguments analyzed, definitions refined, normative constraints adduced) for consistency and for unwelcome consequences."
    trigger: "When collecting, deploying, or systematizing intuitions; analyzing arguments; conducting thought experiments; refining definitions; or adducing normative constraints."
    qualification: "Logic is the great tool for this but is by no means the only tool — the heuristics collectively form a Swiss army knife alongside it."
    evidence: "p. 370: 'when we are doing our job properly, we check for the consistency and for any unwelcome consequences of our products (and celebrate the welcome ones). The heuristics are to a large extent aids to these enterprises.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch19-hajek-philosophical-heuristics/d27"
    source: "Hájek 2016, ch. 19, §7, p. 371"
    directive: "Prefer heuristics of middling generality — general enough to be applicable in a wide range of cases, but specific enough to have real bite."
    trigger: "When selecting or formulating a heuristic to teach, deploy, or include in one's repertoire."
    qualification: "Heuristics can vary considerably in generality among themselves and still earn their keep — the criterion is not uniform middling generality but avoidance of the extremes ('make an insightful point!' is too general; 'when someone argues that space is purely relational, reply with Kant's problem of incongruous counterparts!' is too specific)."
    evidence: "p. 371: 'We want heuristics that have some generality, but that also have real bite. Too general, and they become useless … Too specific, and they become next to useless again … The best heuristics lie somewhere in the middle of the spectrum: general enough to be applicable in a wide range of cases, but not so general as to be empty.'"
