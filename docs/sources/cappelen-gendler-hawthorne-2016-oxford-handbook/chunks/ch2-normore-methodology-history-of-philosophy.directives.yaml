directives:
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d01"
    source: "Normore 2016, 'The Methodology of the History of Philosophy', §1 Introduction, p. 27"
    directive: "Aim to present the history of Philosophy internally — i.e. as driven by philosophical considerations and reasons internal to the practice of Philosophy — as the default."
    trigger: "When undertaking History of Philosophy as opposed to Intellectual History, Cultural History, Doxology, or Anthropology of Philosophy."
    qualification: "This is a default, not an absolute; the chunk concedes that 'internal' history rests on the controversial assumption that philosophers adopt and change views on the basis of philosophical considerations (p. 38), and that context can play an important role (p. 40)."
    evidence: "'I shall argue for aiming to present the history of Philosophy internally as a default.' (p. 27); reinforced p. 38: 'That an internal history of Philosophy is possible depends on it being the case that Philosophers adopt and change views on the basis of philosophical considerations and reasons.'"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d02"
    source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, p. 28"
    directive: "Distinguish History of Philosophy from its near kin — Intellectual History, Social History, Doxology, and Anthropology of Philosophy — rather than conflating them under a single label."
    trigger: "When labelling, classifying, or describing work that engages with the past of Philosophy."
    qualification: "Normore acknowledges that all of these subjects legitimately study the past of Philosophy; the directive concerns terminological discipline, not exclusion."
    evidence: "'there may be a place for what really is History of Philosophy, and confusing it with its near kin just breeds confusion.' (p. 28); 'I take it there are other subjects, for example Intellectual History and Social History, which study it in other ways. I take it too that there is something, not quite a subject in its own right, which I have called Doxology, and something else, also not quite a subject, that I will call Anthropology of Philosophy' (p. 28)"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d03"
    source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, p. 32"
    directive: "Approach a historical text with explicit questions, and decide whether you are asking what you would ask of a contemporary philosopher's text or what one of the writer's own philosopher contemporaries would have asked."
    trigger: "When beginning interpretive work on a historical philosophical text."
    qualification: "Both options have 'respectable followings'; Normore does not require choosing one over the other but treats the choice as a 'central methodological issue which must be faced by any Historian of Philosophy.'"
    evidence: "'a central methodological issue which must be faced by any Historian of Philosophy is what questions to ask. It is a commonplace that to understand a text (or a practice) one should approach it with questions—but which questions? As just suggested, at least two options present themselves: 1) ask what you would ask of a text by one of your philosopher contemporaries, or 2) ask what one of the writer's philosopher contemporaries would (as far as you can tell) have asked.' (p. 32)"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d04"
    source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, p. 33"
    directive: "Make the texts you study intelligible to yourself and your audience; accept an interpretation on which the text does not make sense only if you have an explanation for why it might not (e.g. textual corruption, deliberate or inadvertent incoherence)."
    trigger: "When proposing an interpretation of a historical philosophical text."
    qualification: "When such an explanation is offered, the historian is then studying the text only to access another implicit text the author really wrote or would have written but for extra-philosophical factors."
    evidence: "'Historians of Philosophy must seek to make the texts which they study intelligible to themselves and their audience. Historians of Philosophy can accept an interpretation of a text which has it not make sense to themselves only if they have an explanation of why the text might not make sense—say because it is corrupt or because the writer deliberately or inadvertently made it incoherent.' (p. 33)"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d05"
    source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, p. 33"
    directive: "If there is an interpretation that makes sense of the text, prefer it to a search for an implicit text behind the text at hand."
    trigger: "When weighing a face-value reading of a text against a 'hidden' or 'coded' reading."
    qualification: "Normore later notes (pp. 42-43) that Strauss-influenced readings adopting a 'hermeneutics of suspicion' challenge this default; the priority of the face-value interpretation is therefore a defeasible default rather than an absolute."
    evidence: "'if there is an interpretation which makes sense of the text, a Historian of Philosophy must prefer it to a search for an implicit text behind the text at hand.' (p. 33)"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d06"
    source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, p. 33"
    directive: "Test any interpretation you propose against all the relevant text, and treat any interpretation that is incompatible with some of the relevant text as thereby disqualified as an interpretation of any of it."
    trigger: "When defending or evaluating an interpretation of a philosophical text."
    qualification: "''"
    evidence: "'Historians of Philosophy must also be prepared to test any interpretation they do propose against all the relevant text. An interpretation that is incompatible with some of the relevant text is thereby disqualified as an interpretation of any of it.' (p. 33)"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d07"
    source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, p. 33"
    directive: "Do not rest content with merely repeating the original-language wording or a dictionary translation; explain unfamiliar uses of the source's language to the audience, even if doing so requires excursions into related earlier and later texts and contemporary work."
    trigger: "When a historical text uses ordinary words in unfamiliar ways (e.g. Aristotle's claim that the intellect 'becomes' what is thought about)."
    qualification: "The historian may come away still with the sense that there is more here than yet understood; the requirement is to render the claim intelligible 'to some extent', not to settle it definitively."
    evidence: "'Merely repeating or using a dictionary translation of Aristotle's Greek won't do. Such explanation may take the historian far afield—into related uses of the Greek, related earlier and later texts, and excursions into contemporary Philosophy of Mind. We may come away still with the sense that there is more here than yet understood, but unless we understand the claim to some extent, the Historian of Philosophy has left the job undone.' (p. 33)"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d08"
    source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, pp. 33-34"
    directive: "Account for which questions philosophers in the past did and did not ask, and what they would have taken to be satisfactory answers — not only the answers themselves."
    trigger: "When studying any historical philosophical milieu."
    qualification: "Some past questions may no longer be reasonably askable; some present questions may have been unaskable in the past."
    evidence: "'Philosophers in the past asked questions we no longer ask (and perhaps cannot reasonably ask any longer). Philosophers in the past also did not ask questions we find completely natural. Understanding why the questions asked were asked and those not were not, and understanding what was and would have been taken as satisfactory answers is also central to the History of Philosophy as I have demarcated it.' (pp. 33-34)"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d09"
    source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, p. 41"
    directive: "When evaluating whether a past philosopher's response was rational or reasonable, evaluate it both from your own perspective (typically that of your current Philosophical community) and from the perspective of the thinker and that thinker's Philosophical community."
    trigger: "When assessing the rationality, reasonableness, or merit of a historical philosophical position or argument."
    qualification: "The extent to which the two perspectives agree is in part empirical; remain open both to the possibility that standards of reasonableness have changed and to the possibility that they have not."
    evidence: "'they must be prepared to determine whether a response is rational or reasonable according to whatever standard is in play. I suggest this responsibility is twofold. Such evaluation must take place both from the Historian of Philosophy's own perspective (typically that of the Philosophical community to which s/he belongs) and from the perspective of the thinker whose thought is being studied and that thinker's Philosophical community. The extent to which they will agree is in part an empirical question—one must be open to the possibility that standards of reasonableness as well as style of reasoning have changed. One must be open as well, though, to the possibility that they have not' (p. 41)"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d10"
    source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, pp. 41-42"
    directive: "When a past philosopher adopted a position for non-philosophical (e.g. Theological) reasons even though it could have been adopted on then-prevalent philosophical grounds, note the background condition and pass on rather than treating it as part of the History of Philosophy."
    trigger: "When you have established that a thinker's grounds for a position were not taken by the thinker to be philosophical."
    qualification: "It may not be easy to tell whether the reasons were taken to be philosophical; the same doctrine (e.g. 'real accidents') may belong to the History of Philosophy via one author (Buridan) and to the History of Theology via another (Ockham)."
    evidence: "'The study of such background conditions is a significant part of Intellectual History but only a peripheral part of the History of Philosophy. Indeed, it is only part of the History of Philosophy at all in the sense that the Historian of Philosophy notes it and goes on.' (p. 41)"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d11"
    source: "Normore 2016, 'The Methodology of the History of Philosophy', §2 Theory, p. 42"
    directive: "Treat as a default presumption that a text means what it seems to mean and that a philosopher accepts what that philosopher asserts."
    trigger: "When interpreting any philosophical text."
    qualification: "The presumption is plausible but defeasible; it has been challenged within the History of Philosophy, notably by Leo Strauss and his followers, who would have it that a 'hermeneutics of suspicion' should be applied in contexts where a reasonable person who believed p would not assert p."
    evidence: "'it is a plausible but defeasible assumption of the History of Philosophy that a text means what it seems to mean and that a philosopher accepts what that philosopher asserts.' (p. 42)"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d12"
    source: "Normore 2016, 'The Methodology of the History of Philosophy', §3 Practice, §3.1 'Specialize', p. 44"
    directive: "Specialize: study a particular figure (e.g. Aristotle, Descartes, Locke, Hegel) or a particular period (e.g. 'Ancient Philosophy', 'Early Modern Philosophy') rather than attempting the whole of the History of Philosophy."
    trigger: "When orienting one's research program in the History of Philosophy and one lacks the heroic linguistic and disciplinary range of the 'ideal Historian of the whole of Philosophy.'"
    qualification: "Specialization brings forgivable ignorance of certain languages and contexts only on assumptions (e.g. that nothing in those languages bears on the figure) that are themselves revisable."
    evidence: "'I propose some maxims: 3.1 Specialize. One thing we do (and should do) is specialize. We study (say) Aristotle or Descartes or Locke or Hegel or we study \"Ancient Philosophy\" or \"Early Modern Philosophy\".' (p. 44)"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d13"
    source: "Normore 2016, 'The Methodology of the History of Philosophy', §3.2 'Do Doxology', p. 45"
    directive: "Do Doxology: interpret to a contemporary audience those texts of past philosophers that hold immediate philosophical appeal for present readers."
    trigger: "When teaching or writing about the past of Philosophy within Philosophy departments and schools."
    qualification: "Which texts have such immediate appeal changes with time; the maxim is contingent on Doxology remaining centred in Philosophy departments."
    evidence: "'3.2 Do Doxology. Doxology is and will remain central to the practice of the History of Philosophy as long as it is centred in Philosophy departments and schools. That is a good thing.' (p. 45)"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d14"
    source: "Normore 2016, 'The Methodology of the History of Philosophy', §3.3 'Aspire to Anthropology of Philosophy', p. 45"
    directive: "Test your understanding of a past philosophy by reading to the bottom of a page you have not read or no longer remember, then stopping and predicting what you will find as you turn the page; if you can reliably do so, you have the verstehen-style understanding of how philosophers in that milieu went on."
    trigger: "When trying to gauge whether you have achieved an Anthropology-of-Philosophy-style understanding of an unfamiliar philosophical milieu."
    qualification: "One can be surprised even in one's own cultural environment; failures of prediction are akin to overgeneralizing from a restricted diet of examples and call for the historiographical principle 'Exhaust the Evidence!'"
    evidence: "'Here is a test for one kind of understanding of a philosophy. Read to the bottom of a page you have not read or no longer remember. Stop and predict what you will find as you turn the page. If you can reliably do so there is a significant way in which you understand what is going on. This test is a test for a kind of understanding sometimes called verstehen' (p. 45)"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d15"
    source: "Normore 2016, 'The Methodology of the History of Philosophy', §3.4 'Exhaust the Evidence', pp. 45-46"
    directive: "Treat 'Exhaust the Evidence' as a regulative ideal: actively seek out, including in hitherto neglected texts, any Philosophical factor that, when considered, would change the picture at issue."
    trigger: "When developing or defending a historical interpretation in the History of Philosophy."
    qualification: "It is at best a regulative ideal; there is likely no finite specification of all the evidence bearing on any question in the history of philosophy."
    evidence: "'\"Exhaust the Evidence\" is, however, at least a regulative ideal. It is an appropriate criticism of a Historian of Philosophy that s/he failed to consider a Philosophical factor that, when considered, changes the picture at issue. We are all, and always, open to such criticism (and generally eventually subject to it). The search for the grounds of this criticism—often in hitherto neglected texts—is an important source of progress in the discipline.' (p. 46)"
  - id: "cappelen-gendler-hawthorne-2016-oxford-handbook/ch2-normore-methodology-history-of-philosophy/d16"
    source: "Normore 2016, 'The Methodology of the History of Philosophy', §3.5 'Struggle with Strauss', p. 46"
    directive: "When a text on its face contradicts itself, approach the supposition that the author was deliberately inconsistent with the most caution among the available strategies (denying inconsistency, attributing change of mind, locating unexamined philosophical presuppositions, or attributing intentional inconsistency)."
    trigger: "When you cannot find an interpretation that makes sense of a text as a whole because the text contradicts itself."
    qualification: "The reason for caution is that adopting the 'deliberate inconsistency' strategy is to abandon the usual canons for determining the worth of an interpretation; consistency 'is the lifeblood of History of Philosophy.'"
    evidence: "'All of these approaches have difficulties, but the last, to suppose the author was deliberately inconsistent, is the one to be approached with the most caution—because to adopt it is to abandon the usual canons for determining the worth of an interpretation. Consistency may be the hobgoblin of small minds but it is the lifeblood of History of Philosophy.' (p. 46)"
