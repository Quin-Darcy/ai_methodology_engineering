model: "claude-opus-4-7[1m]"
directives:
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d01"
    source: "Bohm 1996, On Dialogue ch. 2, p. 6"
    directive: "Before beginning a dialogue group, hold a discussion or seminar about dialogue itself — what it is and why you are doing it."
    trigger: "When initiating a new dialogue group."
    qualification: "You can start without this preparation, but then you must trust the group will continue and that these questions will surface later."
    evidence: "p. 6: 'I don't think it is wise to start a group before people have gone into all that, at least somewhat... have a discussion or a seminar about dialogue for a while, and those who are interested can then go on to have the dialogue.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d02"
    source: "Bohm 1996, On Dialogue ch. 2, p. 6"
    directive: "Do not worry whether you are or are not having dialogue."
    trigger: "When participating in a dialogue, especially in early sessions."
    qualification: "The worry itself is one of the blocks; it may be mixed."
    evidence: "p. 6: 'And you mustn't worry too much whether you are or are not having dialogue — that's one of the blocks. It may be mixed.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d03"
    source: "Bohm 1996, On Dialogue ch. 2, pp. 8-9"
    directive: "In dialogue, do not try to win, gain points, or make your particular view prevail."
    trigger: "When engaging in dialogue (as distinct from discussion or negotiation)."
    qualification: ""
    evidence: "pp. 7-8: 'In a dialogue, however, nobody is trying to win... there is no attempt to gain points, or to make your particular view prevail.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d04"
    source: "Bohm 1996, On Dialogue ch. 2, p. 9"
    directive: "Go into the pressures and the process of thought behind assumptions, not just the assumptions themselves."
    trigger: "When dialogue surfaces assumptions or opinions."
    qualification: ""
    evidence: "p. 9: 'The point is that dialogue has to go into all the pressures that are behind our assumptions. It goes into the process of thought behind the assumptions, not just the assumptions themselves.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d05"
    source: "Bohm 1996, On Dialogue ch. 2, p. 9"
    directive: "Pay attention to thought as a process, not only to its content."
    trigger: "When examining one's own or collective thinking."
    qualification: "Everything requires attention; thought is a process and will go wrong without it."
    evidence: "p. 9: 'We haven't really paid much attention to thought as a process. We have engaged in thoughts, but we have only paid attention to the content, not to the process.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d06"
    source: "Bohm 1996, On Dialogue ch. 2, p. 11"
    directive: "Pay attention to thought both individually and collectively."
    trigger: "When attempting to address the root of problems originating in thought."
    qualification: "Most thought comes from the collective background; language is collective."
    evidence: "p. 11: 'Therefore we need to pay attention to thought both individually and collectively.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d07"
    source: "Bohm 1996, On Dialogue ch. 2, p. 13"
    directive: "Aim for a dialogue group of about twenty to forty people."
    trigger: "When forming a dialogue group."
    qualification: "A group too small (five or six) settles into 'cozy adjustment'; forty is about as many as can be conveniently arranged in a circle (or use two concentric circles)."
    evidence: "p. 13: 'a group of about twenty to forty people is almost a microcosm of the whole society... when you raise the number to about twenty, something different begins to happen. And forty people is about as many as you can conveniently arrange in a circle.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d08"
    source: "Bohm 1996, On Dialogue ch. 2, p. 15"
    directive: "Have people sit in a circle for dialogue."
    trigger: "When arranging a dialogue group physically."
    qualification: "Such a geometric arrangement doesn't favor anybody and allows for direct communication."
    evidence: "p. 15: 'A basic notion for a dialogue would be for people to sit in a circle. Such a geometric arrangement doesn't favor anybody; it allows for direct communication.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d09"
    source: "Bohm 1996, On Dialogue ch. 2, p. 15"
    directive: "Hold the dialogue without any leader and without any agenda."
    trigger: "When conducting dialogue, in principle."
    qualification: "A facilitator may be useful to get the group going and explain what's happening, but the facilitator's function is to work himself out of a job."
    evidence: "p. 15: 'In principle, the dialogue should work without any leader and without any agenda... It may be useful to have a facilitator to get the group going... But his function is to work himself out of a job.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d10"
    source: "Bohm 1996, On Dialogue ch. 2, p. 15"
    directive: "Work through the anxiety of having no leader, agenda, or purpose by facing it."
    trigger: "When a dialogue starts and participants feel anxious without structure."
    qualification: "Experience shows that after an hour or two people get through it and talk more freely."
    evidence: "p. 15: 'I think we would find a great deal of anxiety in not knowing what to do. Thus, one of the things would be to work through that anxiety, to face it.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d11"
    source: "Bohm 1996, On Dialogue ch. 2, p. 15"
    directive: "Sustain the dialogue regularly over a long period — a year or two or more, meeting weekly or biweekly."
    trigger: "When committing to a dialogue group."
    qualification: "The point is not a fixed dialogue group forever — held too long it becomes caught in habits — but long enough to make a change."
    evidence: "p. 15: 'It may be that people must meet regularly and sustain the dialogue... meet week after week, or biweekly or whatever, and sustain it a long time — a year or two or more.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d12"
    source: "Bohm 1996, On Dialogue ch. 2, p. 17"
    directive: "Do not decide what to do about anything in the dialogue group."
    trigger: "When conducting a dialogue group, distinguishing it from a decision-making meeting."
    qualification: "This is crucial: otherwise we are not free. Relative purposes for investigation are allowed, but no absolute purpose."
    evidence: "p. 17: 'In the dialogue group we are not going to decide what to do about anything. This is crucial: Otherwise we are not free.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d13"
    source: "Bohm 1996, On Dialogue ch. 2, p. 17"
    directive: "Maintain an empty space where participants are not obliged to do anything, come to conclusions, or say anything."
    trigger: "When holding space for dialogue."
    qualification: "After finishing, just empty it — do not try to accumulate anything."
    evidence: "p. 17: 'We must have an empty space where we are not obliged to do anything, nor to come to any conclusions, nor to say anything or not say anything. It's open and free.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d14"
    source: "Bohm 1996, On Dialogue ch. 2, p. 17"
    directive: "Do not adopt a fixed or absolute purpose for the dialogue."
    trigger: "When framing what the dialogue is for."
    qualification: "Relative purposes for investigation are permitted; the purpose, if any, is 'to communicate coherently in truth.'"
    evidence: "p. 17: 'we have no fixed purpose — no absolute purpose, anyway. We may set up relative purposes for investigation, but we are not wedded to a particular purpose.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d15"
    source: "Bohm 1996, On Dialogue ch. 2, p. 17"
    directive: "Do not try to accomplish any useful purpose or goal in the dialogue."
    trigger: "When framing the activity of a dialogue group."
    qualification: "Any useful purpose carries an assumption about what is useful, which will limit the dialogue and cause trouble."
    evidence: "p. 17: 'we are not going to try to accomplish any useful thing. As soon as we try to accomplish a useful purpose or goal, we will have an assumption behind it as to what is useful, and that assumption is going to limit us.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d16"
    source: "Bohm 1996, On Dialogue ch. 2, p. 18"
    directive: "Stick with the dialogue through frustration, even when it is not entertaining or visibly useful."
    trigger: "When the dialogue becomes difficult, frustrating, or seems unproductive."
    qualification: "Do this because it is necessary; otherwise deep assumptions cannot surface."
    evidence: "p. 18: 'you may tend to drop it as soon as it gets difficult. But I suggest that it is very important to go on with it — to stay with it through the frustration.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d17"
    source: "Bohm 1996, On Dialogue ch. 2, pp. 19-20"
    directive: "Suspend your assumptions: neither carry them out nor suppress them, neither believe nor disbelieve them, neither judge them good nor bad."
    trigger: "When an assumption or reactive impulse arises during dialogue."
    qualification: "Suspend the outward act and the inward insult; hold the assumption in front of you as if reflected in a mirror so you can look at it."
    evidence: "pp. 19-20: 'what is called for is to suspend those assumptions, so that you neither carry them out nor suppress them. You don't believe them, nor do you disbelieve them; you don't judge them as good or bad.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d18"
    source: "Bohm 1996, On Dialogue ch. 2, p. 20"
    directive: "Notice the connection between the thoughts going on in the dialogue, the feelings in the body, and the emotions."
    trigger: "While participating in or observing the dialogue."
    qualification: "Body language as well as verbal language shows that everyone is in much the same boat."
    evidence: "p. 20: 'What's required then is that we notice the connection between the thoughts going on in the dialogue, the feelings in the body, and the emotions.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d19"
    source: "Bohm 1996, On Dialogue ch. 2, p. 20"
    directive: "Do not try to change anyone's opinion."
    trigger: "When listening to others' assumptions in dialogue."
    qualification: "Someone may or may not change his opinion after the meeting — that is not the aim."
    evidence: "p. 20: 'We are not trying to change anybody's opinion. When this meeting is over, somebody may or may not change his opinion.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d20"
    source: "Bohm 1996, On Dialogue ch. 2, p. 21"
    directive: "When temperatures rise, those not caught up in the particular opinion should come in to defuse the situation so participants can look at it."
    trigger: "When emotional escalation threatens to make the meeting unable to examine itself."
    qualification: "Keep it at a level where opinions come out but can still be looked at; do not suppress them."
    evidence: "p. 21: 'If temperatures do rise, then those who are not completely caught up in their particular opinions should come in to defuse the situation a bit so that people could look at it.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d21"
    source: "Bohm 1996, On Dialogue ch. 2, p. 23"
    directive: "When two absolute necessities clash, question whether the necessity is in fact absolute."
    trigger: "When a conflict of absolute necessities arises in dialogue and ordinary negotiation has no answer."
    qualification: "If it loosens, the conflict can be let go and the dialogue can creatively explore new notions of what is necessary."
    evidence: "p. 23: 'Now if you can question it and say, \"Is it absolutely necessary?\" then at some point it may loosen up... it becomes possible to let that conflict go and to explore new notions of what is necessary, creatively.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d22"
    source: "Bohm 1996, On Dialogue ch. 2, pp. 24-25"
    directive: "Make thought proprioceptive — be aware of the intention to think, the impulse, the thought, and the feeling it gives rise to, so the relation between intention and result is seen."
    trigger: "When watching one's own thought process."
    qualification: "Use the body, other people, and the group as mirrors that show the results of your thought."
    evidence: "pp. 24-25: 'The question is: can thought be proprioceptive? You have the intention to think... If you watch, you'll see an intention to think, an impulse to think. Then comes the thought, and the thought may give rise to a feeling, which might give rise to another intention to think.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d23"
    source: "Bohm 1996, On Dialogue ch. 2, p. 26"
    directive: "Suspend opinions and look at them — listen to everybody's opinions, suspend them, and see what they all mean."
    trigger: "When the object of dialogue is at stake (as opposed to analysis, winning an argument, or exchanging opinions)."
    qualification: "The aim is to share the appreciation of meanings; truth then emerges unannounced."
    evidence: "p. 26: 'The object of a dialogue is not to analyze things, or to win an argument, or to exchange opinions. Rather, it is to suspend your opinions and to look at the opinions — to listen to everybody's opinions, to suspend them, and to see what all that means.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d24"
    source: "Bohm 1996, On Dialogue ch. 2, p. 27"
    directive: "Do not seek to convince or to persuade in dialogue."
    trigger: "When tempted to win the other person over to one's view."
    qualification: "If something is right you don't need to be persuaded; persuasion implies doubt."
    evidence: "p. 27: 'Conviction and persuasion are not called for in a dialogue... There's no point in being persuaded or convinced. That's not really coherent or rational.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d25"
    source: "Bohm 1996, On Dialogue ch. 2, p. 30"
    directive: "Give space for each person to talk — do not jump in too fast, and do not hold back too much."
    trigger: "When the rhythm of contributions in a dialogue is at stake."
    qualification: "There may be silent periods; do not mull a single point so long that the conversation moves on without you."
    evidence: "p. 30: 'we must give space for each person to talk. We don't put this as a rule; rather we say that we can see the sense of it... there is sort of a subtle situation in between, where you are not jumping in too fast, nor holding back too much.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d26"
    source: "Bohm 1996, On Dialogue ch. 2, p. 30"
    directive: "Do not mull one point in your mind while the conversation moves on."
    trigger: "When tempted to dwell internally on a single remark."
    qualification: "By the time you have thought about it the group has moved on and what you would have said is irrelevant."
    evidence: "p. 30: 'But at the same time, you shouldn't be mulling it over in your mind — picking on one point and turning it over — while the conversation goes on to something else.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d27"
    source: "Bohm 1996, On Dialogue ch. 2, p. 34"
    directive: "Do not defend assumptions or opinions in the dialogue."
    trigger: "When evidence appears that one's assumption or opinion may not be right."
    qualification: "There is no reason to hold an assumption against evidence; the proper structure of an opinion is that it is open to evidence."
    evidence: "p. 34: 'As long as we have this defensive attitude — blocking and holding assumptions, sticking to them and saying, \"I've got to be right,\" — then intelligence is very limited... There is no reason to hold to an assumption if there is evidence that it is not right.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d28"
    source: "Bohm 1996, On Dialogue ch. 2, p. 34"
    directive: "Do not impose the opinions of the group on its members."
    trigger: "When the collective threatens to act like a conscience inducing guilt."
    qualification: "It is not necessary that everybody be convinced to have the same view; the sharing of consciousness matters more than agreement."
    evidence: "p. 34: 'That does not mean that we are going to impose the opinions of the group. In this way the collective can often be troublesome.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d29"
    source: "Bohm 1996, On Dialogue ch. 2, p. 37"
    directive: "Watch out for the notion of truth in dialogue — be concerned with meaning, not directly with truth."
    trigger: "When tempted to position one's view as the truth in dialogue."
    qualification: "Dialogue may arrive at truth, but only if meaning is coherent; if the meaning is incoherent you will never arrive at truth."
    evidence: "p. 37: 'Therefore, you have to watch out for the notion of truth. Dialogue may not be concerned directly with truth — it may arrive at truth, but it is concerned with meaning.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d30"
    source: "Bohm 1996, On Dialogue ch. 2, p. 39"
    directive: "Treat the other person's thought as your own thought, and hold any emotional charges together with the thoughts."
    trigger: "When another participant's thought or emotional charge appears in the dialogue."
    qualification: ""
    evidence: "p. 39: 'If you see other people's thought, it becomes your own thought, and you treat it as your own thought. And when an emotional charge comes up, you share all the emotional charges, too, if they affect you; you hold them together with all the thoughts.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d31"
    source: "Bohm 1996, On Dialogue ch. 2, p. 40"
    directive: "Be sensitive — observe the subtle cues, body language, and your own and others' responses, attending to differences and similarities."
    trigger: "When participating in or facilitating dialogue."
    qualification: "Sensitivity involves the senses and meaning together; defending assumptions is what blocks it."
    evidence: "p. 39-40: 'that requires sensitivity — a certain way of knowing how to come in and how not to come in, of watching all the subtle cues and the senses and your response to them.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d32"
    source: "Bohm 1996, On Dialogue ch. 2, p. 41"
    directive: "Be serious in dialogue — neither defend your opinions nor avoid what is unpleasant inside yourself."
    trigger: "When participating in dialogue."
    qualification: "If you are defending your opinions or evading inner discomfort, you are not serious in the sense required."
    evidence: "p. 41: 'On the whole, you could say that if you are defending your opinions, you are not serious. Likewise, if you are trying to avoid something unpleasant inside of yourself, that is also not being serious... But in a dialogue you have to be serious.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d33"
    source: "Bohm 1996, On Dialogue ch. 2, pp. 42-43"
    directive: "If a fully open dialogue is not possible, prefer a limited dialogue with a purpose to no dialogue, while accepting it as limited."
    trigger: "When participants are not ready to be completely open or when an institutional purpose (e.g., a corporation) constrains the setting."
    qualification: "Limiting dialogue means accepting assumptions that may be getting in the way; openness is the principle to aim for."
    evidence: "pp. 42-43: 'It would be best to accept the principle of letting it be open... However, if people are not ready to be completely open in their communication, they should do what they can.'"
  - id: "bohm-1996-on-dialogue/ch2-on-dialogue/d34"
    source: "Bohm 1996, On Dialogue ch. 2, p. 35"
    directive: "Dialogue with your own thought and the thought of those who will not participate, when others won't engage."
    trigger: "When one faction is interested in dialogue and the other is not."
    qualification: "You can dialogue among the willing, or by yourself — that is the attitude of dialogue."
    evidence: "p. 35: 'Even if one faction won't participate, we who are willing can participate in a dialogue between our thought and their thought. We can at least dialogue among ourselves as far as we can, or you may by yourself. That is the attitude of dialogue.'"
