directives:
  - id: "bohm-1996-on-dialogue/ch6-suspension-proprioception/d01"
    source: "Bohm 1996, On Dialogue ch. 6, pp. 73-74"
    directive: "Neither carry out the aggression (or anger, fear, etc.) nor turn it against yourself by suppressing it; instead suspend the activity, allowing it to reveal itself, to flower, to unfold, so that you see its actual structure inside of you."
    trigger: "When an aggressive, angry, or otherwise reactive impulse arises in oneself."
    qualification: "Suppression keeps you aggressive against yourself, so the observer of aggression remains pervaded with aggression and nothing changes."
    evidence: "pp. 73-74: 'There is another action, which is neither to carry out the aggression, nor to turn it against yourself by suppressing it. Rather, you may suspend the activity, allowing it to reveal itself, to flower, to unfold, and so you see the aggression and its actual structure inside of you.'"
  - id: "bohm-1996-on-dialogue/ch6-suspension-proprioception/d02"
    source: "Bohm 1996, On Dialogue ch. 6, p. 74"
    directive: "When suspending a reaction, observe the physical movements inside you — heartbeat, blood pressure, breathing, bodily tension — together with the kinds of thoughts that go along with these feelings, and become aware of their connection."
    trigger: "While in the act of suspending an aggressive or emotional reaction."
    qualification: "Ordinarily feelings/bodily reactions and thoughts are taken as separate and unconnected; the awareness aimed at is precisely of their connection."
    evidence: "p. 74: 'Movements are taking place inside of you — physical feelings — the heartbeat, the blood pressure, the way you breathe, the way your body feels tense; and also the kinds of thoughts that go along with these feelings. You can observe these things, be aware of them, and of their connection.'"
  - id: "bohm-1996-on-dialogue/ch6-suspension-proprioception/d03"
    source: "Bohm 1996, On Dialogue ch. 6, pp. 75-76"
    directive: "Suspend the manifestations of anger, fear, or violence in the middle at an unstable point — as on a knife-edge — so that you can look at the whole process."
    trigger: "When a strong emotion (anger, fear, violence) is present."
    qualification: "Do not suppress awareness of the emotion, do not suppress its manifestations, and do not carry them out — hold all three suspended."
    evidence: "p. 76: 'What is called for is not suppressing the awareness of anger, nor suppressing nor carrying out its manifestations, but rather, suspending them in the middle at sort of an unstable point — as on a knife-edge — so that you can look at the whole process.'"
  - id: "bohm-1996-on-dialogue/ch6-suspension-proprioception/d04"
    source: "Bohm 1996, On Dialogue ch. 6, p. 76"
    directive: "If you find you cannot suspend the action, then observe the process of suppression itself — without suppressing the suppression and without telling yourself you are not suppressing."
    trigger: "When the attempt to suspend an action fails and suppression takes over."
    qualification: "There is no formula here; this is a point of departure for inquiry, not a prescription."
    evidence: "p. 76: 'is it possible to suspend the action without suppressing it? If you find it is not possible, then you observe the process of suppression without suppressing the suppression — without telling yourself you're not suppressing.'"
  - id: "bohm-1996-on-dialogue/ch6-suspension-proprioception/d05"
    source: "Bohm 1996, On Dialogue ch. 6, p. 76"
    directive: "If you find there is an observer who is suspending the action, observe the suspension itself — observe that there is an effort to suspend the action."
    trigger: "When suspending a reaction surfaces a separate observer making the effort."
    qualification: "There is no formula or prescription; you cannot tell exactly where the inquiry will lead."
    evidence: "p. 76: 'In addition, you may find that there is an observer who is suspending the action. Then you observe the suspension — you observe that there is an effort to suspend the action. The point is, there is no formula for this.'"
  - id: "bohm-1996-on-dialogue/ch6-suspension-proprioception/d06"
    source: "Bohm 1996, On Dialogue ch. 6, pp. 76-77"
    directive: "If you cannot watch a hurt in the moment it happens, recall it afterwards by going over the words that hurt you and watch what those words do."
    trigger: "When a hurt or strongly charged thought has already passed and could not be observed live."
    qualification: "The same words that first hurt you will hurt you again; this approach is harder than watching a thought of lesser force."
    evidence: "pp. 76-77: 'If you can't watch it in the moment that it actually happens, you can watch it afterwards — you can recall it. Recall it by the words: go over the words which hurt you, and see what happened. You will find that the words which first hurt you will hurt you again.'"
  - id: "bohm-1996-on-dialogue/ch6-suspension-proprioception/d07"
    source: "Bohm 1996, On Dialogue ch. 6, p. 77"
    directive: "Find the words that express what is going on, and see what those words do — not for the purpose of finding their content, but for the purpose of seeing what they do."
    trigger: "When investigating a hurt, charged thought, or emotional reaction."
    qualification: "There is a difference between thinking about the hurt (treating it as an object 'out there' like a table) and thinking the hurt — letting the thought stand in the body and consciousness without being suppressed and without being carried out."
    evidence: "p. 77: 'The thing to do is to find the words which express what's going on, and see what those words do — not for the purpose of finding the content of the words, but for the purpose of seeing what they do.'"
  - id: "bohm-1996-on-dialogue/ch6-suspension-proprioception/d08"
    source: "Bohm 1996, On Dialogue ch. 6, p. 77"
    directive: "Think the hurt rather than think about the hurt — go through the thought and let it produce whatever it is going to do, letting it stand in the body and in consciousness without being suppressed and without being carried out."
    trigger: "When examining a hurt or painful thought in oneself."
    qualification: "Thinking about the hurt treats it as an external abstraction like a table; thinking the hurt acknowledges that the hurt is you."
    evidence: "p. 77: 'There is a difference between thinking about the hurt, and thinking the hurt... The other way is to think the hurt, which is to go through the thought and let it produce whatever it's going to do, which means to let it stand in the body and in consciousness without being suppressed and without being carried out.'"
  - id: "bohm-1996-on-dialogue/ch6-suspension-proprioception/d09"
    source: "Bohm 1996, On Dialogue ch. 6, pp. 77-78"
    directive: "When you encounter incoherence between your intentions and your results, acknowledge the incoherence, let go of your past knowledge, find out what is wrong, and change it — do not defend the knowledge."
    trigger: "When acting on knowledge produces results that contradict your intention."
    qualification: "Some incoherence is inevitable because all knowledge is limited (an abstraction from the whole); defending the knowledge puts you on a wrong track."
    evidence: "pp. 77-78: 'If your attitude is a proper one, you say, \"Okay. I acknowledge the incoherence. I will let go of my past knowledge. Let me find out.\" You find out what is wrong and change it. But if you defend that knowledge, you are off on a wrong track. There is no reason to defend knowledge, but people are caught up all the time in defending it.'"
  - id: "bohm-1996-on-dialogue/ch6-suspension-proprioception/d10"
    source: "Bohm 1996, On Dialogue ch. 6, p. 78"
    directive: "Cultivate sensitivity to incoherence as the road to coherence — do not look only at order, beauty, and harmony, which let you fool yourself."
    trigger: "When attending to the coherence of one's thinking, action, or shared inquiry."
    qualification: "Looking only at coherence allows self-deception; the 'negative' sense of incoherence is what enables you to find its source."
    evidence: "p. 78: 'But if somebody only looks at order, beauty, and harmony, he could easily start fooling himself and say that everything is working nicely... So we need the \"negative\" sense of incoherence — which is the road to coherence. If a person is sensitive to incoherence, he begins acknowledging it, and then finding out what its source is.'"
  - id: "bohm-1996-on-dialogue/ch6-suspension-proprioception/d11"
    source: "Bohm 1996, On Dialogue ch. 6, p. 78"
    directive: "Do not try to impose coherence; instead discover the incoherence and drop it."
    trigger: "When the desire for coherence prompts you to impose order on a process."
    qualification: "Imposing coherence is itself a kind of violence and a further extension of incoherence."
    evidence: "p. 78: 'if we have a desire for coherence we can go about it wrongly and simply try to impose coherence, rather than discovering the incoherence and dropping it. This is a kind of violence, and therefore a further extension of incoherence.'"
  - id: "bohm-1996-on-dialogue/ch6-suspension-proprioception/d12"
    source: "Bohm 1996, On Dialogue ch. 6, p. 78"
    directive: "Aim any change that really counts at the tacit, concrete process of thought itself, not only at abstract thought."
    trigger: "When attempting to bring about real change in one's thinking or response."
    qualification: "Coherence includes the entire process of mind, including the tacit processes; change in abstract thought alone is insufficient."
    evidence: "p. 78: 'Coherence includes the entire process of the mind — which includes the tacit processes of thought. Therefore, any change that really counts has to take place in the tacit, concrete process of thought itself. It cannot take place only in abstract thought.'"
  - id: "bohm-1996-on-dialogue/ch6-suspension-proprioception/d13"
    source: "Bohm 1996, On Dialogue ch. 6, p. 79"
    directive: "Be attentive to how thought produces a result outside yourself, to the results it produces within yourself, and — if possible — to how it immediately affects perception."
    trigger: "When attempting to make thought self-aware (proprioceptive)."
    qualification: "By being more attentive, awareness of these effects can be cultivated; perfect awareness is not claimed."
    evidence: "p. 79: 'By being more attentive, we can be aware of how thought produces a result outside ourselves. And then maybe we could also be attentive to the results it produces within ourselves. Perhaps we could even be immediately aware of how it affects perception.'"
  - id: "bohm-1996-on-dialogue/ch6-suspension-proprioception/d14"
    source: "Bohm 1996, On Dialogue ch. 6, pp. 80-81"
    directive: "When a strong feeling (a 'gut feeling') arises, do not take it as an independent perception of reality; trace it back to the impulse to think and the thought that preceded it, and recognize the feeling as caused by that thought."
    trigger: "When a 'gut feeling' arises, especially one that seems to justify anger or to validate a perception."
    qualification: "Without proprioception of thought, the feeling is tacitly taken as direct perception of reality and used to justify further thought, in a self-reinforcing cycle."
    evidence: "pp. 80-81: 'You use the feeling to justify the anger, and you say, \"Here is an independent gut feeling, which shows that I'm perceiving something...\" Without proprioception, you cannot get this right... if you had proprioception of thought, you would immediately say, \"Well, I had the impulse to think, I thought something, and then came that feeling. It was caused in that way, and therefore that is all it means.\"'"
  - id: "bohm-1996-on-dialogue/ch6-suspension-proprioception/d15"
    source: "Bohm 1996, On Dialogue ch. 6, p. 81"
    directive: "Treat thought as a movement (a process), not as truth that simply tells you the way things are."
    trigger: "When a thought presents itself as a direct report on reality."
    qualification: "In principle the movement of thought could be self-aware; the muddle that prevents this is what must be addressed."
    evidence: "p. 81: 'thought is also a movement -— if it is a process, it is also a movement. But thought doesn't treat itself as a movement. It treats itself as truth — as just being there, telling you the way things are. In principle the movement of thought could be self-aware...'"
