directives:
  - id: "cavell-1979-claim-of-reason/ch13c-living-skepticism-asymmetries/d01"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 459"
    directive: "See others only to the extent that you can take yourself as an other — make 'making oneself an other to oneself' the focus at which knowledge of oneself and of others meet."
    trigger: "When seeking to know another mind, or to know oneself, especially when one is tempted to treat self-knowledge as a separate or prior project from knowledge of others."
    qualification: "This is 'by no means a process of knowing from one's own case. It is simply not making one's own case exceptional.'"
    evidence: "'I should think a sensible axiom of the knowledge of persons would be this: that one can see others only to the extent that one can take oneself as an other. … This is by no means a process of knowing from one's own case. It is simply not making one's own case exceptional.' (p. 459)"

  - id: "cavell-1979-claim-of-reason/ch13c-living-skepticism-asymmetries/d02"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 459"
    directive: "Do not make your own case exceptional — refrain from treating your experience, sin, or shame as the one that representatively defines or escapes the human."
    trigger: "When tempted to take 'certain among one's experiences to represent one's own mind' in such a way that one's mind appears unknown so far as those experiences are unknown — i.e., when about to single oneself out as exceptional."
    qualification: "Stated as a corollary to the axiom that one sees others only to the extent that one can take oneself as an other; cited via Thoreau: 'I never knew, and never shall know, a worse man than myself.'"
    evidence: "'It is simply not making one's own case exceptional.' (p. 459); cf. p. 460–461 on singling oneself out for unknowableness as a 'different difference'."

  - id: "cavell-1979-claim-of-reason/ch13c-living-skepticism-asymmetries/d03"
    source: "Cavell 1979, Claim of Reason, ch. XIII, pp. 457–458"
    directive: "Do not treat a scenario as a serious skeptical hypothesis if you have no idea what it would be like to learn that it is your situation."
    trigger: "When evaluating a scientific-style skeptical scenario (e.g., 'I may be a brain in a vat') as a candidate ground for skeptical doubt."
    qualification: "One may still 'go on with the story', e.g., as a piece of science fiction; the directive bars treating it as a hypothesis whose entertainment compels doubt."
    evidence: "'It seems to me evident that I have no idea what it would be like to learn that I am a brain in a vat; which seems to be good reason to suppose that I cannot seriously consider the possibility, as a hypothesis, that I am one.' (pp. 457–458)"

  - id: "cavell-1979-claim-of-reason/ch13c-living-skepticism-asymmetries/d04"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 458"
    directive: "Reject any way of being offered a world sensuously indistinguishable from one's own as sufficient on its own to ground skeptical doubt; require also that the scenario afford a way of understanding how one came to be offered it."
    trigger: "When confronting a skeptical scenario that posits sensory equivalence to one's actual world (brain-in-a-vat, demon, simulation)."
    qualification: "Dreaming and hallucination scenarios pass this test as 'a separate feature' of those possibilities; brain-in-a-vat does not."
    evidence: "'The immediate value of such a story, for me, is its demonstration that not just any way of being offered a world sensuously indistinguishable from my world is enough to cause me skeptical doubt. I have, as it were, simultaneously to be afforded a way of understanding how I came to be offered it.' (p. 458)"

  - id: "cavell-1979-claim-of-reason/ch13c-living-skepticism-asymmetries/d05"
    source: "Cavell 1979, Claim of Reason, ch. XIII, pp. 456–457"
    directive: "Distinguish a thought experiment from a piece of science fiction: treat the thought experiment as counter-factual within a world you identify as ours, and treat the science fiction as working out the consequences of a hypothesis about a fictional world you do not identify as ours."
    trigger: "When constructing or interpreting philosophical fictions (e.g., Descartes's Evil Genius, the craftsman in the garden) and deciding what kind of conclusion they license."
    qualification: "A fictional tale 'is a history over which the teller has absolute authority'; this stipulative power blocks the kind of 'revelatory denial' (e.g., that an Evil Genius could exist as God-less-than-God) that a thought experiment can sustain."
    evidence: "'In particular, here, we would need to articulate the difference between what we might call a thought experiment and what we might call a piece of science fiction. In the latter case we may work out the consequences of a hypothesis about a fictional world, one which we do not identify as ours; in the former case the counter-factual nature of the fiction takes place within a world we do identify as ours.' (pp. 456–457)"

  - id: "cavell-1979-claim-of-reason/ch13c-living-skepticism-asymmetries/d06"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 447"
    directive: "When investigating skepticism, pursue 'an increasingly concrete study of the frames of mind in which skepticism appears and vanishes' rather than seeking a final argument that it is or is not possible."
    trigger: "When the question 'How is skepticism possible?' returns at the end of an inquiry as the question with which the inquiry began."
    qualification: "This formulation is offered as the last question about skepticism's being a return of the first; accepting it does not require giving up the claim that 'with respect to the existence of others, skepticism is in question.'"
    evidence: "'Or do you mean to say that the last question about skepticism is a return of the first question, namely, and unrhetorically, How is skepticism possible?; and that finally what we ask for is an increasingly concrete study of the frames of mind in which skepticism appears and vanishes?' (p. 447)"

  - id: "cavell-1979-claim-of-reason/ch13c-living-skepticism-asymmetries/d07"
    source: "Cavell 1979, Claim of Reason, ch. XIII, pp. 449–450"
    directive: "Do not accommodate skepticism with the qualification 'for practical purposes'; recognize that this qualification shows the study has not been left, that a genuine alternative to its isolation has not been reached."
    trigger: "When tempted to soften a skeptical conclusion (about the external world or about other minds) by saying one knows 'for practical purposes'."
    qualification: "In the arena of other minds the accommodation is even less tempting: 'such an accommodation would seem crazier than the thing it is meant to accommodate.'"
    evidence: "'Again, I find that the need for invoking the qualification \"for practical purposes\" shows not that the study has been left but on the contrary shows that a genuine alternative to the isolation of the study has not been reached. We have not been offered our life with objects again — tempered or chastened, if you like, by the revelation of skepticism; we have been given a philosopher's description of that life, a falsifying or intellectualized picture of it.' (pp. 449–450)"

  - id: "cavell-1979-claim-of-reason/ch13c-living-skepticism-asymmetries/d08"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 442"
    directive: "Reframe 'Do I know there are other minds?' as 'Do others know of my existence?' — pose the question of otherness from the side of being known rather than only from the side of knowing."
    trigger: "When undertaking an epistemological inquiry into other minds and noticing that the active formulation ('what I can know of another') is partial or prejudicial."
    qualification: "The reframing is offered as 'a more promising beginning for an epistemological inquiry'; it does not displace the active question, but corrects for the recital's missing 'duality in the problem of other minds.'"
    evidence: "'The question whether there are other minds is exactly as much a question about me as about anyone else. … Then the question is: Do others know of my existence? — This seems a more promising beginning for an epistemological inquiry.' (pp. 442–443)"

  - id: "cavell-1979-claim-of-reason/ch13c-living-skepticism-asymmetries/d09"
    source: "Cavell 1979, Claim of Reason, ch. XIII, pp. 445–446"
    directive: "Mark the difference between seeing and behavior in their epistemological weights: a claim to know a thing on having seen it generally stakes full authority; a claim to know a person on that person's behavior generally withholds full authority."
    trigger: "When modeling skepticism about other minds on the Cartesian skepticism about material objects and tempted to treat 'I know from his behavior' as parallel to 'I know from my senses'."
    qualification: "Behavior may be 'counterfeited' and may be 'suppressed'; the asymmetry shows up especially in the suppression direction (Caesar's feelings 'crossing the Rubicon' may simply never be known)."
    evidence: "'… to base your claim to knowledge of a thing on your having seen it is generally to stake full authority for your claim; whereas to base your claim to knowledge of a person on that person's behavior is generally to withhold full authority from your claim. Behavior is just made to contrast with something else that may tell how it really is with a person. Nothing tells better than seeing how it is with (sense-scale) things.' (pp. 445–446)"

  - id: "cavell-1979-claim-of-reason/ch13c-living-skepticism-asymmetries/d10"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 459"
    directive: "Read concealment as expression — when something in another is hidden, attend to the slight edge in their denials, the over-casualness of manner, the tint of automatonity in smile or gait, as the perfect expression of just what is concealed."
    trigger: "When attempting to know another whose inner state is being concealed, or when assessing what 'shows' of a person."
    qualification: "'There are those who know how to read such concealments. The concealment of what there is to express is an exacting art, like camouflage.' Concerning human beings 'there are only open secrets or open questions.'"
    evidence: "'Whatever in me I have to conceal I may betray exactly by the way in which I conceal it. Just that is what is concealed; the concealment of what it is up to me to express is a perfect expression of it — the slight edge to my denials, the over-casualness of my manner, the tint of automatonity in my smile or gait or posture …' (p. 459)"

  - id: "cavell-1979-claim-of-reason/ch13c-living-skepticism-asymmetries/d11"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 462"
    directive: "Do not believe the monster when he tells you that he is monstrous because others treat him as monstrous — recognize that he is monstrous because he lets the task of becoming human wait upon how others treat him."
    trigger: "When confronted with the claim (one's own or another's) that one's monstrousness, isolation, or unknownness is wholly the work of others' treatment."
    qualification: "Circumstances may have forced the waiting upon him; he may have a chance to rebel; for a child, 'a correct waiting here is necessary, it is legitimate.' The directive applies to grown human beings, not to children."
    evidence: "'(So do not believe the monster when he tells you that he is monstrous because others treat him as monstrous. He is monstrous because he lets the task of becoming human wait upon how others treat him. … For a child, a correct waiting here is necessary, it is legitimate.)' (p. 462)"

  - id: "cavell-1979-claim-of-reason/ch13c-living-skepticism-asymmetries/d12"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 462"
    directive: "Take the parable of breast-striking ('that one can have this very having of it') not as a piece of information and not as the offering of a criterion of identity, but as a reminder that to possess one's existence one must declare it."
    trigger: "When reading or producing a parabolic gesture of insistence on one's own existence in response to a Wittgensteinian therapy that seems to deny or slight one's inner life."
    qualification: "The parable's content is not 'the fact of my existence' alone, but 'the fact that to possess it I must declare it, as if taking it upon myself. Before this, there are no others for me.'"
    evidence: "'My thought here is this: When Wittgenstein presents himself to us as denying or slighting our existence, our inner life, we may be prompted to respond to this apparent denial with a parabolic gesture of insistence upon our existence. The parable is to teach not just the fact of my existence, but the fact that to possess it I must declare it, as if taking it upon myself. Before this, there are no others for me.' (p. 462)"
