chunk_id: cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans
source: cavell-1979-claim-of-reason
title: Framing acknowledgment/avoidance through "perfecting an automaton"
pages: "329-407 (book)"
components: ["exp"]
