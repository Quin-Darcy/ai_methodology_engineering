directives:
  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d01"
    source: "Cavell 1979, Claim of Reason, ch. XIII, pp. 335-336"
    directive: "When an utterance is hedged with quotation marks or pressed forward with insistence, step back from the conviction that it must be an assertion and consider that the speaker may have been prompted to insistent emptiness — to mean something incoherently."
    trigger: "When reading or hearing an utterance whose form looks like a plain assertion but is marked by insistence, scare-quotes, or other signs that it is 'not to be taken propria persona'."
    qualification: "'Meaning something incoherently' is distinct both from trying to mean something incoherent and from meaning something other than you think; it is meaning words 'all right, but … the wrong way, or with an unseen sense.'"
    evidence: "'The parable asks us to look again at that utterance, in particular to be suspicious of its insistence. We are, one might say, asked to step back from our conviction that this must be an assertion (or a reminder) and incline ourselves to suppose that someone has here been prompted to insistent emptiness, to mean something incoherently.' (p. 336)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d02"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 335"
    directive: "When an interlocutor's words appear, ask 'Only whom are we informing of this? And on what occasion?' — locate the imagined addressee and occasion before granting the utterance the status of an assertion."
    trigger: "When confronting a philosophical utterance that purports to convey information about something inner ('there is something there accompanying my cry of pain', etc.)."
    qualification: "These questions are out of place when the utterance was meant parabolically, ironically, or as the expression of a reservation rather than as an assertion of information."
    evidence: "'\"Only whom are we informing of this? And on what occasion?\" These questions are out of place here, because my intention was not one of informing anyone of anything; I was elaborating a parable.' (p. 335)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d03"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 334"
    directive: "When an interlocutor in a philosophical text supplies words on cue, treat the failure to pick up such a cue, and the failure to provide genuinely freeing words on it, as forms of philosophical (and literary) failure."
    trigger: "When reading dialectical philosophical writing in which an interlocutor is brought on to voice an insistent or reserved thought."
    qualification: "Wittgenstein's interlocutor is one mode of voicing such cues; the cue is 'not only for philosophers, and not for all philosophers.'"
    evidence: "'Failing to pick up such a cue, or failing to provide genuinely freeing words upon it, are two forms, newly recovered forms perhaps, of philosophical failure. One could also think of them at the same time as cases of literary failure.' (p. 334)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d04"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 337"
    directive: "Do not try to fill the slack of acknowledgment with knowledge — recognize that supplying further information will not, by itself, secure another's recognition."
    trigger: "When the issue between you and another is not their ignorance of a fact but their failure to acknowledge it (as with Kafka's Hunger Artist's audience, who 'came to lack not so much belief as interest')."
    qualification: "This does not mean the imagination cannot be fired by information — only that 'you cannot always know when the fire will strike.'"
    evidence: "'If I say … that the slack of acknowledgment can never be taken up by knowledge, I do not mean to say that the imagination can never be fired by information, rather that you cannot always know when the fire will strike.' (pp. 337–338)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d05"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 336"
    directive: "Describe what is wrong with an empty assertion — its momentary madness, its failure to amount to an assertion within an insistent sense that it is one — without seeming to deny what the assertion's words apparently affirm."
    trigger: "When a philosophical task requires diagnosing the emptiness of a metaphysical claim ('there must be something boiling in the pictured pot', 'there must be something behind the behavior', etc.)."
    qualification: ""
    evidence: "'The philosophical task posed by Wittgenstein's parable (not, again, notably unlike a literary task) is to describe what is wrong with the assertion that \"something is in the pictured pot\" — i.e., to describe the emptiness of the assertion, the momentary madness in the assertion … without at the same time seeming to deny that something is in the pictured pot.' (p. 338)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d06"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 353"
    directive: "When facing the other, use imagination — make the connections, see the possibilities, take the facts in — rather than relying on vivid imagery; for vivid imagery may defeat the purpose of grasping the other's situation."
    trigger: "When the task is acknowledging another's expression or scene of pain, anger, etc., where 'I have to take the facts in, realize the significance of what is going on, make the behavior real for myself, make a connection.'"
    qualification: "Imaginativeness (capacity for forming images) is not the same as imagination (capacity for making connections); Dickens-like imagery 'did not get them to see their connection with these pictures.'"
    evidence: "'Imagination, let us say, is the capacity for making connections, seeing or realizing possibilities … Vivid imagery, in fact, may defeat the purpose. … Imagination is called for, faced with the other, when I have to take the facts in, realize the significance of what is going on, make the behavior real for myself, make a connection.' (pp. 353–354)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d07"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 363"
    directive: "When paraphrasing a metaphor, do not treat the paraphrase as a reduction; treat it as a certain sort of instruction in how the metaphor is to be read."
    trigger: "When asked to paraphrase or translate a metaphor (for example, 'the human body is a text' or 'the body is the best picture of the soul')."
    qualification: "It is essential to an expression's counting as a metaphor that it can be paraphrased; the directive constrains how the paraphrase is to be received, not whether it can be given."
    evidence: "'Certainly it is essential to an expression's counting as a metaphor that it can be paraphrased. It is equally essential that the paraphrase not be treated as a reduction but rather as a certain sort of instruction.' (p. 363)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d08"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 363"
    directive: "When choosing a word for a phenomenon, ask not for a paraphrase of that word but for an account of why that word is the one you want — only after which you may move on from it."
    trigger: "When tempted to substitute one word or expression for another in philosophical writing (e.g., 'read', 'attitude', 'image')."
    qualification: ""
    evidence: "'Then what I need is not a paraphrase or translation of the word \"read\", but an account of why it is that that word is the one I want — after which I may move away from it or move on from it. (The willingness and the refusal to exchange one word or expression for another, as well as the usefulness or futility in doing so, are themes running throughout the Investigations.)' (p. 363)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d09"
    source: "Cavell 1979, Claim of Reason, ch. XIII, pp. 358–359"
    directive: "Know when to stop prompting — recognize the point at which further communication depends on your interlocutor's taking the next step unaided, and respect that point with proper waiting rather than further drilling."
    trigger: "When teaching or explaining in domains where 'we cannot prove anything' and instruction depends on imponderable evidence."
    qualification: "'It is the mark of a good teacher in certain domains'; people are not equally good at this, but it can be learned."
    evidence: "'It is the mark of a good teacher in certain domains to know when to stop prompting, domains in which further knowledge is earned not through further drilling but through proper waiting. … People are not equally good at this, certainly teachers are not equally good; but one can learn to be better.' (pp. 358–359)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d10"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 358"
    directive: "Distinguish 'I don't know how I know; I just know' from 'I can't tell you' when you say 'I can't tell you how I know'; and recognize that drawing the line of instruction at what you point to as obvious may itself be an expression of taking the evidence as all in evidence."
    trigger: "When you find yourself unable to articulate how you know something (cases of 'imponderable evidence' — recognizing humour, tone, allusion, the reality of another's feeling)."
    qualification: "Where and when one draws the line may seem, and may be, arbitrary or dogmatic; this risk is internal to the situation."
    evidence: "'Wittgenstein speaks in this connection of \"imponderable evidence\". This means in effect, \"I can't tell you how I know\". This is ambiguous. It may mean, \"I don't know how I know; I just know\" … But it may mean, \"I can't tell you\". … Or it could be an expression of my taking the evidence as all in evidence, drawing the line of instruction so that what I have pointed to is obvious, rock-bottom.' (p. 358)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d11"
    source: "Cavell 1979, Claim of Reason, ch. XIII, pp. 405–406"
    directive: "When constructing a philosophical thought experiment, ask whether you can stipulate the conditions you require; if you cannot, treat the result as science or fairy tale rather than philosophy."
    trigger: "When the cogency of a thought experiment depends on a stipulation (e.g., 'the friend is not a ringer'); especially when the experiment is in the first person."
    qualification: "A successful science or fairy tale would accept such stipulations 'without question'; the rules differ from those governing first-person philosophical staging."
    evidence: "'It is important to ask whether we can stipulate this. If we cannot, then it seems that the whole thing must simply be a science or a fairy tale. But if it were taken as science or fairy tale then we would not have to stipulate this. It would be accepted without question. — But only if it were a successful story. There are rules about these things.' (pp. 405–406)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d12"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 406"
    directive: "When you place yourself inside a philosophical fiction or thought experiment, do not stop the story before you have given enough evidence to make the speculation an interesting one; an incomplete first-person staging is incompetent storytelling, not provocative reticence."
    trigger: "When telling a thought experiment in the first person and reaching a decision point ('Do I intervene?')."
    qualification: "Telling the same story in the third person, ending at the dramatic point, may be a complete (if primitive) science fable; the rules differ for first-person inclusion."
    evidence: "'If, however, I tell it as I have, with myself in it, and I add the question, \"Do I intervene?\", then the story is not complete. If I stop there, a sensible reader will be contemptuous at my incompetence; I do not know the rules. I have not given enough evidence to know whether, for example, the friend is a ringer, nor to make the sheer speculation an interesting one.' (p. 406)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d13"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 407"
    directive: "When asking whether something humanoid is a human being, do not seek the missing characteristic 'just inside, or just outside' — looking inside (or further outside) cannot settle what was at issue."
    trigger: "When evaluating an automaton-style or zombie-style thought experiment about whether something is a human being or sentient."
    qualification: "Stipulations about insides (micro-computers, energy sources) settle the question only arbitrarily; refusing to press for a settlement is itself a state to be diagnosed, not a neutral epistemic stance."
    evidence: "'In any case, I have learned that if something humanoid differs in some respect from a human being — that it has all the characteristics of a human being save one — that respect will not be something going on just inside, or just outside. This is why my interest shifts away from the friend. I can learn no more from him, anyway, no more about him by looking inside him. I know what I will see if I look.' (p. 407)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d14"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 389"
    directive: "Treat the alternative to acknowledgment of the other as denial or avoidance, not as ignorance — and study acknowledgment by studying the avoidances that, e.g., tragedy studies."
    trigger: "When framing the problem of other minds, or analyzing failures to credit another's experience."
    qualification: ""
    evidence: "'… the fact that the alternative to my acknowledgment of the other is not my ignorance of him but my avoidance of him, call it my denial of him. Acknowledgment is to be studied, is what is studied, in the avoidances that tragedy studies.' (p. 389)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d15"
    source: "Cavell 1979, Claim of Reason, ch. XIII, pp. 372–373"
    directive: "When someone claims that a class of beings (slaves, embryos, enemies) are 'not human beings', do not take the claim at face value; ask in what spirit the words are said, what the speaker wants, sees, and feels — and consider whether the claim is being meant at all rather than merely uttered."
    trigger: "When confronting an utterance of the form 'these are not really human beings' (slaveowner's, abortion-conservative's, soldier's)."
    qualification: "'Of course the words mean something; they are not spoken at random.' The directive is to read for the spirit and the indefinite frame of mind, not to dismiss the utterance as random or insincere."
    evidence: "'But does one really believe such assertions? My feeling is that they cannot really be meant. Of course the words mean something; they are not spoken at random. In what spirit are such words said?' (pp. 372–373)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d16"
    source: "Cavell 1979, Claim of Reason, ch. XIII, pp. 382–383"
    directive: "Let yourself matter to the other — acknowledge that your expressions in fact express you, that they are yours, rather than treating your speech as falling short of who you are."
    trigger: "When tempted by the thought that 'all I can do is to groan, to weep … to talk' and that none of this is really 'what I feel, not who I am' — i.e., when you find yourself withdrawing acknowledgment of your own expressions."
    qualification: "There is a very good reason not to do so: 'You may discover that you do not matter.'"
    evidence: "'To let yourself matter is to acknowledge not merely how it is with you, and hence to acknowledge that you want the other to care, at least to care to know. It is equally to acknowledge that your expressions in fact express you, that they are yours, that you are in them.' (pp. 382–383)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d17"
    source: "Cavell 1979, Claim of Reason, ch. XIII, pp. 355–356"
    directive: "Read the human body — treat human expression as a physiognomy that must be interpreted, and treat your relation to your words as allegorical of your relation to yourself and to other persons."
    trigger: "When attempting to know another mind or to understand the import of someone's words and gestures."
    qualification: "This is not 'mere knowing'; the reading must be enacted in seeing the creature according to the reading and treating it according to the seeing."
    evidence: "'The idea of the allegory of words is that human expressions, the human figure, to be grasped, must be read. To know another mind is to interpret a physiognomy, and the message of this region of the Investigations is that this is not a matter of \"mere knowing\". I have to read the physiognomy, and see the creature according to my reading, and treat it according to my seeing.' (pp. 355–356)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d18"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 364"
    directive: "When a remark about the soul (or other 'figurative' talk about mental life) tempts you to call it metaphorical, consider instead whether it is mythological — a fragment of a myth — and that 'the mythological' may be what the idea of 'the metaphorical' is here a metaphor for."
    trigger: "When evaluating remarks like 'the body is a veil', 'the soul is a ghost in a machine', 'the state is a ship'."
    qualification: "Remarks about the soul are mythological in a sense that 'does not exclude the fact that there will be arguments about it, especially about whether and how it exists.'"
    evidence: "'Remarks which read a body as giving expression to a soul may be looked upon as myths, or fragments of a myth. … I should imagine that a reason one feels certain remarks about the soul to be metaphorical is that one does not want, or know how, to speak of them as mythological. The mythological would then be what the idea of the metaphorical here is a metaphor for.' (p. 364)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d19"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 355"
    directive: "When using examples in ordinary-language philosophy, treat them as imagined expressions of a soul — i.e., as imagined cases of words spoken by a being who means them."
    trigger: "When constructing or evaluating ordinary-language-philosophy examples (e.g., imagined sayings used to elicit grammatical points)."
    qualification: ""
    evidence: "'To imagine an expression (experience the meaning of a word) is to imagine it as giving expression to a soul. (The examples used in ordinary language philosophy are in this sense imagined.)' (p. 355)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d20"
    source: "Cavell 1979, Claim of Reason, ch. XIII, p. 368"
    directive: "When a philosopher's picture of internality ('what is internal is hidden from us', 'I cannot know what is going on in him') seems to express a metaphysical fact, treat it as a picture — 'the convincing expression of a conviction' — and ask what conviction the picture expresses, rather than treating the picture as a discovery."
    trigger: "When confronted with a 'picture' of unreachable hiddenness deployed in defense of skepticism about other minds."
    qualification: ""
    evidence: "'\"What is internal is hidden from us.\" — … \"I cannot know what is going on in him\" is above all a picture. It is the convincing expression of a conviction.' (p. 368) … 'What is the conviction? What does the picture of internality, or of unreachable hiddenness, express?' (p. 368)"

  - id: "cavell-1979-claim-of-reason/ch13a-framing-and-seeing-humans/d21"
    source: "Cavell 1979, Claim of Reason, ch. XIII, pp. 368–369"
    directive: "Locate the block to seeing the other not in the other's body but in your own incapacity or unwillingness to interpret or judge it accurately — diagnose 'aspect-blindness' in yourself rather than projecting hiddenness onto the other."
    trigger: "When you find yourself describing the other as essentially hidden, opaque, or behind a veil."
    qualification: "Aspect-blindness is 'something in me failing to dawn'; in the myth of reading the physiognomy 'this would be thought of as a kind of illiteracy; a lack of education.'"
    evidence: "'The block to my vision of the other is not the other's body but my incapacity or unwillingness to interpret or to judge it accurately, to draw the right connections. The suggestion is: I suffer a kind of blindness, but I avoid the issue by projecting this darkness upon the other.' (pp. 368–369)"
