directives:
  - id: "arksey-omalley-2005-scoping-studies/whole/d01"
    source: "Arksey & O'Malley 2005, Framework overview, p. 5"
    directive: "Conduct each stage of the scoping study in a rigorous and transparent way, and document the process in sufficient detail to enable the study to be replicated by others."
    trigger: "When conducting a scoping study."
    qualification: ""
    evidence: "p. 5: 'the methods used throughout the different stages are conducted in a rigorous and transparent way... The process should be documented in sufficient detail to enable the study to be replicated by others. This explicit approach increases the reliability of the findings...'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d02"
    source: "Arksey & O'Malley 2005, Framework overview, p. 5"
    directive: "Identify all relevant literature regardless of study design, rather than restricting the search to particular study designs as in a systematic review."
    trigger: "When identifying literature for a scoping study."
    qualification: ""
    evidence: "p. 5: 'Rather than being guided by a highly focussed research question that lends itself to searching for particular study designs (as might be the case in a systematic review), the scoping study method is guided by a requirement to identify all relevant literature regardless of study design.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d03"
    source: "Arksey & O'Malley 2005, Framework overview, p. 5"
    directive: "Do not place strict limitations on search terms, identification of relevant studies, or study selection at the outset; treat the process as iterative rather than linear and repeat steps reflexively as familiarity with the literature grows."
    trigger: "When designing the search and selection process for a scoping study."
    qualification: ""
    evidence: "p. 5: 'the researcher may not wish to place strict limitations on search terms, identification of relevant studies, or study selection at the outset. The process is not linear but iterative, requiring researchers to engage with each stage in a reflexive way and, where necessary, repeat steps to ensure that the literature is covered in a comprehensive way.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d04"
    source: "Arksey & O'Malley 2005, Stage 1, p. 6"
    directive: "Begin by identifying the research question, and consider explicitly which 'facets' of it (e.g. study population, interventions, outcomes) are particularly important, since this guides how search strategies are built."
    trigger: "At Stage 1 (identifying the research question) of a scoping study."
    qualification: ""
    evidence: "p. 6: 'the starting point is to identify the research question to be addressed as this guides the way that search strategies are built. Thus it is important to consider which aspects or "facets" (CRD, 2001) of the research question are particularly important, for example, the study population, interventions or outcomes.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d05"
    source: "Arksey & O'Malley 2005, Stage 1, p. 6"
    directive: "Maintain a wide approach to definitions in order to generate breadth of coverage, and defer decisions about how to set parameters on the reference set until some sense of the volume and general scope of the field has been gained."
    trigger: "When defining the parameters of a scoping study at the outset."
    qualification: "Wide definitions reduce the likelihood of missing relevant articles but can generate an unmanageably large number of references; parameters can be tightened later once volume is known."
    evidence: "p. 6: 'Our recommendation would be to maintain a wide approach in order to generate breadth of coverage. Decisions about how to set parameters on large numbers of bibliographic references can be made once some sense of the volume and general scope of the field has been gained.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d06"
    source: "Arksey & O'Malley 2005, Stage 2, p. 6"
    directive: "Search for research evidence via multiple sources — electronic databases, reference lists, hand-searching of key journals, and existing networks/relevant organizations/conferences — rather than relying on databases alone."
    trigger: "At Stage 2 (identifying relevant studies) of a scoping study."
    qualification: ""
    evidence: "p. 6: 'we adopted a strategy that involved searching for research evidence via different sources: electronic databases; reference lists; hand-searching of key journals; existing networks, relevant organizations and conferences.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d07"
    source: "Arksey & O'Malley 2005, Stage 2, pp. 6-7"
    directive: "Make explicit decisions at the outset about coverage in terms of time span and language, and acknowledge that any such limits may cause potentially relevant papers to be missed."
    trigger: "At the outset of a scoping study, before searching."
    qualification: "Limits may be necessary for practical reasons (time, budget, translation costs) but their cost in missed papers should be acknowledged."
    evidence: "pp. 6-7: 'decisions have to be made at the outset about the coverage of the review in terms of time span and language... Foreign language material was excluded because of the cost and time involved in translating material. Whilst we had to adopt these limits for practical reasons, it is worth pointing out that potentially relevant papers could have been missed.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d08"
    source: "Arksey & O'Malley 2005, Stage 2, p. 7"
    directive: "Pilot the search strategy on one database (e.g. MEDLINE) and refine it in light of early results before converting it for each subsequent database."
    trigger: "When developing the electronic-database search strategy."
    qualification: ""
    evidence: "p. 7: 'She then devised an initial search strategy, which was later refined in the light of early results. The final version was first used on the MEDLINE database and then converted for each subsequent database.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d09"
    source: "Arksey & O'Malley 2005, Stage 2, p. 7"
    directive: "Engage a qualified information officer or librarian to design and execute sensitive search strategies, since researchers may lack the necessary technical skills."
    trigger: "When designing electronic-database searches for a scoping study."
    qualification: ""
    evidence: "p. 7: 'Researchers may not have the skills necessary for designing and executing sensitive search strategies that qualified librarians have. An Information Officer from CRD worked with us to identify the relevant keywords... she also advised on what databases were most likely to produce the type of studies we were seeking.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d10"
    source: "Arksey & O'Malley 2005, Stage 2, p. 7"
    directive: "Check the bibliographies of studies identified through database searches — especially systematic reviews and traditional literature reviews — to ensure they have been included in the scoping exercise."
    trigger: "After the database search has yielded studies."
    qualification: "Continue until a saturation point is reached where no new references are identified."
    evidence: "p. 7: 'We found it valuable to check the bibliographies of studies found through the database searches—especially systematic reviews and traditional literature reviews—to ensure they had been included in the scoping exercise. This process did identify further references, although a saturation point was reached where no new ones were being identified.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d11"
    source: "Arksey & O'Malley 2005, Stage 2, pp. 7-8"
    directive: "Hand-search key journals to identify articles that have been missed in database and reference-list searches, because electronic databases may be incomplete, not up to date, or vary in coverage, indexing and depth."
    trigger: "When seeking comprehensive coverage in a scoping study."
    qualification: ""
    evidence: "pp. 7-8: 'It is important that key journals are hand-searched to identify articles that have been missed in database and reference list searches. This can occur because electronic databases may be incomplete, not up to date or because abstracting services can vary in coverage, indexing and depth of information.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d12"
    source: "Arksey & O'Malley 2005, Stage 2, p. 8"
    directive: "Use existing knowledge and networks, and contact relevant national or local organizations working in the field, to generate information about primary research and identify unpublished work."
    trigger: "When searching for relevant studies in a scoping study."
    qualification: ""
    evidence: "p. 8: 'using existing knowledge and networks can generate information about primary research. So, too, can contacting relevant national or local organizations working in the field, with a view to hand-searching libraries and/or identifying unpublished work.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d13"
    source: "Arksey & O'Malley 2005, Stage 2, p. 8"
    directive: "Record, for each database searched, the years it covered and the date it was searched, since this is important if there is any likelihood of having to update the searches in the future."
    trigger: "Each time a database is searched in a scoping study."
    qualification: ""
    evidence: "p. 8: 'The Information Officer recorded each database searched, the years it covered, and the date it was searched for each set of results when they were imported into Endnote. Knowing what databases were searched and from what date is important, especially if there is any likelihood of having to update the searches in the future.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d14"
    source: "Arksey & O'Malley 2005, Stage 3, pp. 8-9"
    directive: "Develop inclusion and exclusion criteria post hoc, based on increasing familiarity with the literature, and then apply them to all citations to determine relevance."
    trigger: "At Stage 3 (study selection) of a scoping study."
    qualification: "This contrasts with systematic-review practice, where criteria are set at the outset; in a scoping study post-hoc criteria reflect the iterative, breadth-seeking character of the search."
    evidence: "pp. 8-9: 'Systematic review methods develop inclusion and exclusion criteria, based on a specific research question, at the outset of the project... Our scoping study adopted similar methods, although criteria were devised post hoc, based on increasing familiarity with the literature, that we could then apply to all the citations to determine their relevance.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d15"
    source: "Arksey & O'Malley 2005, Stage 3, p. 9"
    directive: "Have two reviewers apply the inclusion and exclusion criteria to all citations."
    trigger: "When applying selection criteria to citations in a scoping study."
    qualification: ""
    evidence: "p. 9: 'Two reviewers then applied the inclusion and exclusion criteria to all the citations.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d16"
    source: "Arksey & O'Malley 2005, Stage 3, p. 9"
    directive: "If the relevance of a study is unclear from the abstract, order the full article rather than deciding from the abstract alone, since abstracts cannot be assumed to be representative of the full article or to capture its full scope."
    trigger: "When screening citations whose abstracts are ambiguous about relevance."
    qualification: ""
    evidence: "p. 9: 'If the relevance of a study was unclear from the abstract, then the full article was ordered... As Badger et al. (2000) note, abstracts cannot be assumed to be representative of the full article that follows, or to capture the full scope of an article.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d17"
    source: "Arksey & O'Malley 2005, Stage 3, p. 9"
    directive: "Set a deadline after which no further studies will be added to the analysis, and indicate in an appendix any articles that have not been reviewed but which may be of interest to other researchers."
    trigger: "When working under time constraints in a scoping study."
    qualification: ""
    evidence: "p. 9: 'A deadline was set, after which it was agreed that we would not include any more studies in the analysis. This is an important decision to make when time is limited, although it is good practice to indicate in an appendix any articles that have not been reviewed but which may be of interest to other researchers.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d18"
    source: "Arksey & O'Malley 2005, Stage 4, pp. 9-10"
    directive: "Apply a common analytical framework to all primary research reports and collect standard information on each study (the 'descriptive-analytical' method within the narrative tradition), rather than producing only a short summary or profile of each study."
    trigger: "At Stage 4 (charting the data) of a scoping study."
    qualification: "Simply producing a short summary of each study does not guarantee usefulness to readers making decisions; the descriptive-analytical method 'stands more chance of being useful'."
    evidence: "pp. 9-10: 'Simply producing a short summary or profile of each study does not guarantee helping those readers who might have to make important decisions based on the study findings... The "descriptive-analytical" method within the narrative tradition, which involves applying a common analytical framework to all the primary research reports and collecting standard information on each study, stands more chance of being useful.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d19"
    source: "Arksey & O'Malley 2005, Stage 4, p. 10"
    directive: "Chart a mixture of general information about each study (author, year, location) and specific information relating to the study population, intervention type, outcome measures and study design, on a 'data charting form'."
    trigger: "When designing the charting form for Stage 4 of a scoping study."
    qualification: ""
    evidence: "p. 10: 'What should the content of data charting forms include? Generally speaking, this will be a mixture of general information about the study and specific information relating to, for instance, the study population, the type of intervention, outcome measures employed and the study design.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d20"
    source: "Arksey & O'Malley 2005, Stage 5, p. 10"
    directive: "Present an overview of all material reviewed rather than only a small percentage of selected studies, since the scoping study aims to make all reviewed evidence visible rather than leaving non-included studies hidden."
    trigger: "At Stage 5 (collating, summarizing and reporting) of a scoping study."
    qualification: ""
    evidence: "p. 10: 'Whilst the process of collecting and reviewing studies for a full systematic review may require researchers to read and review a large number of studies, only a small percentage may be included in the final report. Evidence or findings from studies not included in the final review may consequently remain hidden from publication. In contrast, the scoping study seeks to present an overview of all material reviewed...'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d21"
    source: "Arksey & O'Malley 2005, Stage 5, p. 10"
    directive: "Do not attempt to synthesize evidence or aggregate findings across studies, and do not present a view regarding the 'weight' of evidence for any particular intervention or policy."
    trigger: "When collating and reporting results in a scoping study."
    qualification: "Because the scoping study does not assess quality of evidence, it cannot determine whether particular studies provide robust or generalizable findings."
    evidence: "p. 10: 'unlike a systematic review the scoping study does not seek to "synthesize" evidence or to aggregate findings from different studies... there is no attempt made to present a view regarding the "weight" of evidence in relation to particular interventions or policies. This is because the scoping study does not seek to assess quality of evidence...'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d22"
    source: "Arksey & O'Malley 2005, Stage 5, p. 10"
    directive: "Present findings in two ways: first, a basic numerical analysis of the extent, nature and distribution of studies (with tables and charts mapping geography, recipient groups, interventions, methods, and effectiveness measures); second, a thematic organization of the literature."
    trigger: "When reporting the results of a scoping study."
    qualification: ""
    evidence: "p. 10: 'we were able to present our narrative account of findings in two ways. First, attention was given to basic numerical analysis of the extent, nature and distribution of the studies included in the review. We produced tables and charts mapping: the distribution of studies geographically and for the different care recipient groups; the range of interventions included in the review; the research methods adopted and the measures of effectiveness used.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d23"
    source: "Arksey & O'Malley 2005, Stage 5, p. 11"
    directive: "Retain a clarity of reporting strategy and make explicit the position, potential bias, and any subjective decisions regarding data analysis, so that the reader can determine any potential bias in reporting or recommendations."
    trigger: "When reporting findings in a scoping study."
    qualification: ""
    evidence: "p. 11: 'it is crucial that the scoping study method retains a clarity of reporting strategy so that the reader can determine any potential bias in reporting or recommendations. As with any good quality research, the position, or potential bias, of any work must be identified and potentially subjective decisions regarding data analysis made clear.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d24"
    source: "Arksey & O'Malley 2005, Stage 5, p. 11"
    directive: "Develop a consistent reporting 'template' and apply it to each thematic group, so that comparisons across categories, contradictory evidence, and gaps can be identified systematically."
    trigger: "When reporting thematically organized findings of a scoping study."
    qualification: ""
    evidence: "p. 11: 'we sought to provide a consistent approach to reporting our findings and developed a "template" that we applied to each intervention group... By applying a consistent approach to reporting the findings we were able to make comparisons across intervention types; identify contradictory evidence...; identify gaps in the evidence base...'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d25"
    source: "Arksey & O'Malley 2005, Optional Stage, pp. 11-12"
    directive: "Include a consultation exercise with stakeholders (representatives from national bodies, local managers and practitioners, and key informants such as service users) to inform and validate findings from the main scoping review."
    trigger: "When conducting a scoping study aimed at producing useful results for policy makers, practitioners or consumers."
    qualification: "The consultation is described as an optional component of the framework, but the authors endorse its inclusion based on its 'added value' in their own study."
    evidence: "pp. 11-12: 'In the light of our experiences of the scoping study, we would certainly endorse this approach... the scoping study also included a consultation element... This involved three groups of stakeholders: representatives from national statutory and voluntary bodies; managers and practitioners from local organizations; and "key informant" carers... the consultation exercise did indeed provide "added value" to the literature review.'"
  - id: "arksey-omalley-2005-scoping-studies/whole/d26"
    source: "Arksey & O'Malley 2005, Resource Implications, p. 12"
    directive: "Do not assume a scoping study is a 'quick' or 'cheap' alternative to a systematic review, and budget accordingly for staff time, information-officer support, and inter-library-loan retrieval costs."
    trigger: "When planning, funding, or commissioning a scoping study."
    qualification: ""
    evidence: "p. 12: 'it would be wrong to assume that this method represents either a "quick" or "cheap" option... the scoping study should not be seen as a cheap alternative to the systematic review, and consequently we would urge funders and researchers to be cautious in assuming that a scoping study has significantly fewer resource implications than a systematic review.'"
