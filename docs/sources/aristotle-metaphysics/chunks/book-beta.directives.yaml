directives:
  - id: "aristotle-metaphysics/book-beta/d01"
    source: "Aristotle, Metaphysics III.1, 995a24–27"
    directive: "First go over the topics about which puzzles should be raised, before inquiring into the science you are pursuing."
    trigger: "When beginning an inquiry into a science (here: first philosophy)."
    qualification: "The puzzles to canvass include both topics on which thinkers have disagreed and any others that may have been overlooked."
    evidence: "\"It is necessary, with a view to the science we are inquiring into, first to go over topics about which we should first raise puzzles. These include both topics about which people have supposed divergent things, as well as any separate from these that may have been overlooked.\" (995a24–27, p. 106)"
  - id: "aristotle-metaphysics/book-beta/d02"
    source: "Aristotle, Metaphysics III.1, 995a27–29"
    directive: "Go through the puzzles well."
    trigger: "When you wish to reach a puzzle-free condition (euporia) on a question."
    qualification: "Thoroughness in the puzzle-raising stage is what enables the subsequent puzzle-free condition."
    evidence: "\"Now for those who wish to be puzzle-free it is useful to go through the puzzles well. For the subsequent puzzle-free condition is reached by untying the knots produced by the puzzles raised in advance.\" (995a27–30, p. 106)"
  - id: "aristotle-metaphysics/book-beta/d03"
    source: "Aristotle, Metaphysics III.1, 995a29–33"
    directive: "Make the knot in the subject matter explicit (as a puzzle in thought) before attempting to untie it."
    trigger: "When you face a difficulty in a subject matter and intend to resolve it."
    qualification: "It is impossible to untie a knot you are unaware of; thought that is puzzled is like a person tied up — incapable of moving forward until the knot is identified."
    evidence: "\"it is not possible to untie a knot you are unaware of. But a puzzle in thought makes clear the existence of a knot in the subject matter. For insofar as thought is puzzled it is like people who are tied up, since in both cases it is impossible to move forward.\" (995a29–33, p. 106)"
  - id: "aristotle-metaphysics/book-beta/d04"
    source: "Aristotle, Metaphysics III.1, 995a33–35"
    directive: "Get a theoretical grasp on all the difficulties beforehand."
    trigger: "When undertaking an inquiry."
    qualification: "Those who inquire without first going through the puzzles are like people who do not know where they have to go."
    evidence: "\"That is why we must get a theoretical grasp on all the difficulties beforehand, both for these reasons and because those who inquire without first going through the puzzles are like people who do not know where they have to go.\" (995a33–35, p. 106)"
  - id: "aristotle-metaphysics/book-beta/d05"
    source: "Aristotle, Metaphysics III.1, 995a35–b2"
    directive: "Grasp the puzzles first, so that you can recognize when you have found what you are inquiring into."
    trigger: "When the goal of the inquiry is not yet clear to you."
    qualification: "A person who has not already grasped the puzzles cannot tell whether what he has found is the answer; the end is unclear to him."
    evidence: "\"a person [who has not already grasped the puzzles] does not even know whether he has found what he is inquiring into. For to someone like that the end is not clear, whereas to a person who has already grasped the puzzles it is clear.\" (995a35–b2, p. 106)"
  - id: "aristotle-metaphysics/book-beta/d06"
    source: "Aristotle, Metaphysics III.1, 995b2–4"
    directive: "Hear all the contending arguments — as if they were opposing parties in a court case — before making a judgment."
    trigger: "When you must judge between competing positions on a question."
    qualification: ""
    evidence: "\"a person is necessarily in a better position to make a judgment when—as if they were opposing parties in a court case—he has heard all the contending arguments.\" (995b2–4, p. 106)"
  - id: "aristotle-metaphysics/book-beta/d07"
    source: "Aristotle, Metaphysics III.4, 1000a18–20"
    directive: "Cross-question those who use the language of demonstration, so as to learn from them why they assert what they do."
    trigger: "When dealing with thinkers who present their claims in demonstrative form (as opposed to mythical/poetic form)."
    qualification: "Contrast: with those who deal in mythical subtleties, serious investigation is not worthwhile."
    evidence: "\"Where mythical subtleties are concerned, to be sure, a serious investigation is not worthwhile, but we should cross-question those who use the language of demonstration to learn from them why in the world from the same things come, on the one hand, beings that are eternal in nature and, on the other, beings that pass away.\" (1000a17–22, pp. 117–118)"
  - id: "aristotle-metaphysics/book-beta/d08"
    source: "Aristotle, Metaphysics III.4, 1000a17–18"
    directive: "Do not undertake serious investigation of mythical subtleties."
    trigger: "When the position under consideration is presented in the idiom of myth (theologians of Hesiod's sort) rather than the idiom of demonstration."
    qualification: "The contrast class — claims phrased in demonstrative form — does warrant serious cross-examination."
    evidence: "\"Where mythical subtleties are concerned, to be sure, a serious investigation is not worthwhile, but we should cross-question those who use the language of demonstration to learn from them...\" (1000a17–20, p. 117)"
