chunk_id: booth-sutton-2022-systematic-approaches/ch6-assessing-evidence
source: booth-sutton-2022-systematic-approaches
title: Assessing the Evidence Base (quality, validity, hierarchies)
pages: "158-193 (book)"
components: ["proc"]
extracted_at: "2026-05-10T00:00:00Z"
model: "claude-opus-4-7[1m]"
directives:
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d01"
    source: "Booth & Sutton 2022, Ch.6, p.160"
    directive: "Be systematic when selecting studies from your literature search results so that you exclude studies that are not relevant while ensuring that you do not miss studies that are relevant."
    trigger: "When selecting studies from a literature-search result list for inclusion in a review."
    qualification: "Justified as a way to reduce selection bias within the review."
    evidence: "'Being systematic when selecting studies from the results of your literature search allows you to exclude studies that are not relevant to your review while ensuring that you do not miss studies that are relevant. This is important to help reduce selection bias within the review.' (p.160)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d02"
    source: "Booth & Sutton 2022, Ch.6, p.160"
    directive: "Look at your inclusion and exclusion criteria and assess how each potentially relevant study fulfils each criterion in turn; if a study fails an inclusion criterion or meets any exclusion criterion, do not include it."
    trigger: "When applying explicit inclusion/exclusion criteria during study selection."
    qualification: ""
    evidence: "'You look at your inclusion and exclusion criteria and assess how each potentially relevant study identified from the literature fulfils each criterion in turn. If a study does not fulfil a specific inclusion criterion or if it meets any of the exclusion criteria, you should not include that study in your review.' (p.160)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d03"
    source: "Booth & Sutton 2022, Ch.6, p.160"
    directive: "Keep a good audit trail of which references you have included and excluded, along with reasons for study exclusion."
    trigger: "Throughout the study-selection process, with a view to writing up the review."
    qualification: ""
    evidence: "'Looking forward to your review write-up, it is essential to keep a good audit trail of which references you have included and excluded, along with reasons for study exclusion.' (p.160)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d04"
    source: "Booth & Sutton 2022, Ch.6, p.160"
    directive: "At the title-and-abstract stage, document only one main reason for excluding any reference, likely linked to your PICO criteria."
    trigger: "When excluding a reference at the title-and-abstract screening stage."
    qualification: ""
    evidence: "'For references excluded when assessing titles and abstracts you should identify the main reason for exclusion at this stage, likely linked to your PICO criteria. You only need to document one reason when excluding any reference at the title and abstract stage.' (p.160)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d05"
    source: "Booth & Sutton 2022, Ch.6, p.160"
    directive: "Document inclusion and exclusion decisions equally rigorously at the full-text stage; choose the most immediately apparent reason for exclusion unless you want to emphasise the impact of a particular criterion."
    trigger: "When excluding a paper at the full-text screening stage."
    qualification: "If you want to highlight the impact of a particular criterion (e.g. excluding non-RCTs), you may select that reason rather than the most apparent one."
    evidence: "'Documenting your decisions on inclusion and exclusion are equally important at the full text stage. Again, there may be multiple reasons why a specific paper might be excluded but you will only need to document one of these to justify your decision... Usually, for practical reasons, you will choose the most immediately apparent reason for exclusion; however, in some cases you may want to emphasise the impact of a particular criterion.' (p.160)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d06"
    source: "Booth & Sutton 2022, Ch.6, p.161"
    directive: "Screen articles for inclusion by first examining titles, then moving to abstracts only for studies whose relevance you could not judge from the title alone."
    trigger: "When screening a long list of references for inclusion."
    qualification: "Where time is at a premium, reviewers often combine title and abstract screening."
    evidence: "'Experience suggests that the most efficient way of screening studies for inclusion in a literature review is first to examine the titles of articles from your literature searches... Often you can tell from the title of an article whether or not it is relevant. After screening titles, you move on to look at the abstracts of any studies where you could not judge relevance from the title alone.' (p.161)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d07"
    source: "Booth & Sutton 2022, Ch.6, p.161 (Rapid Review Tip 11, Garritty et al. 2021)"
    directive: "Develop a standardised title-and-abstract screening form and run a pilot exercise on the same 30-50 abstracts across the entire screening team to calibrate and test the form before full screening."
    trigger: "When setting up title-and-abstract screening for a (rapid) review with a screening team."
    qualification: ""
    evidence: "'You will find it helpful to develop a standardised title and abstract form (e.g. an Excel spreadsheet) and then conduct a pilot exercise using the same 30-50 abstracts for the entire screening team. The pilot helps to calibrate and test the review form efficiently.' (p.161)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d08"
    source: "Booth & Sutton 2022, Ch.6, p.161 (Rapid Review Tip 11)"
    directive: "Where independent double screening is not possible, use two reviewers to dual-screen at least 20% of abstracts (ideally more) with conflict resolution, then have one reviewer screen the remainder while a second reviewer screens all excluded abstracts."
    trigger: "In a rapid review where time does not permit independent double-observer screening of all abstracts."
    qualification: "Cited as Garritty et al. (2021) rapid-review guidance."
    evidence: "'As time often does not permit independent double observer screening, you can use two reviewers to dual-screen at least 20% (ideally more) of abstracts, with conflict resolution. One reviewer then screens the remaining abstracts and a second reviewer screens all excluded abstracts (to minimise the risk of discarding relevant studies).' (p.161)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d09"
    source: "Booth & Sutton 2022, Ch.6, p.161"
    directive: "When excluding studies at the full-text stage, record reasons for exclusion of each study for the sake of transparency and to help in subsequent reporting."
    trigger: "When excluding studies at the full-text examination stage."
    qualification: ""
    evidence: "'When excluding studies examined at the full text stage, you will find it useful to record reasons for exclusion of each study for the sake of transparency and to help in subsequent reporting.' (p.161)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d10"
    source: "Booth & Sutton 2022, Ch.6, p.161 (Rapid Review Tip 12)"
    directive: "Use a standardised full-text screening form and pilot it on the same 5-10 full-text articles across the entire screening team; then have a single reviewer screen all included full-text articles and a second reviewer screen all excluded full-text articles."
    trigger: "When setting up full-text screening for a (rapid) review with a screening team."
    qualification: "Cited as Garritty et al. (2021) rapid-review guidance."
    evidence: "'As for title/abstract screening, you should use a standardised full text form. For this stage you pilot the review form on the same 5-10 full text articles across the entire screening team. A single reviewer then screens all included full text articles and a second reviewer screens all excluded full text articles.' (p.161)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d11"
    source: "Booth & Sutton 2022, Ch.6, p.162"
    directive: "Tag references in a reference manager (e.g. with keywords like 'include abstract') so you can retrieve included studies and maintain an audit trail of which studies were included or excluded, at what stage, and by whom."
    trigger: "When managing references during the study-selection process."
    qualification: ""
    evidence: "'You can tag references that you have selected for inclusion in your review at the abstract stage with the keyword \"include abstract\"... At all times you should be able to know exactly which studies have been included or excluded, at what stage (title, abstract or full text examination) and, within a team, by whom they have been excluded.' (p.162)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d12"
    source: "Booth & Sutton 2022, Ch.6, p.163"
    directive: "Examine each included study in detail, taking all the meaningful information from each study (data extraction), before you start compiling and synthesising the information."
    trigger: "Once you have a list of studies meeting all inclusion criteria, before synthesis."
    qualification: ""
    evidence: "'You need to examine each study in detail, taking all the meaningful information from each included study (data extraction), before you start compiling and synthesising the information.' (p.163)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d13"
    source: "Booth & Sutton 2022, Ch.6, p.163"
    directive: "Match the depth of evidence-base assessment to the type and aim of your review: a systematic review needs in-depth quality assessment, while a mapping review only needs assessment sufficient to identify key characteristics."
    trigger: "When deciding how much effort to spend on assessing included studies."
    qualification: "All literature reviews benefit from some assessment; the depth scales with the review's aim."
    evidence: "'The extent to which you assess the evidence base depends on the type of review and its aim. For example, a systematic review generally involves an in-depth quality assessment of included studies... However, for a mapping review, where the aim is to map out and categorise the literature... you assess the evidence base to identify its key characteristics.' (p.163)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d14"
    source: "Booth & Sutton 2022, Ch.6, p.163"
    directive: "Begin assessment by asking, 'What do I need to find out from my included studies to fulfil the aim of my literature review?'"
    trigger: "When starting to assess the evidence base."
    qualification: ""
    evidence: "'To begin with, you should ask yourself, \"What do I need to find out from my included studies to fulfil the aim of my literature review?\".' (p.163)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d15"
    source: "Booth & Sutton 2022, Ch.6, p.166"
    directive: "When deciding whether an article is worth reading, separate your factors into applicability, extrinsic factors, and intrinsic factors, and base quality assessment on the intrinsic factors using a structured checklist."
    trigger: "When triaging research articles and conducting quality assessment."
    qualification: "Quality assessment asks you to discard prejudices about extrinsic factors."
    evidence: "'In addressing Exercise 6.3 you can probably divide your factors into three distinct groups: Applicability... Extrinsic factors... Intrinsic factors... Quality assessment asks you to discard prejudices you may have regarding the extrinsic factors. It asks you to make an initial judgement about the relevance of the study, to look then exclusively at the intrinsic factors using a structured checklist.' (pp.166-167)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d16"
    source: "Booth & Sutton 2022, Ch.6, p.167"
    directive: "Discard prejudices about extrinsic factors (author, institution, journal, funder) when performing quality assessment."
    trigger: "When carrying out quality assessment of a study."
    qualification: ""
    evidence: "'Quality assessment asks you to discard prejudices you may have regarding the extrinsic factors.' (pp.166-167)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d17"
    source: "Booth & Sutton 2022, Ch.6, p.167"
    directive: "Identify each weakness or flaw in every included study, and determine first its potential impact on that individual study's findings and second its implications for the findings of your review as a whole."
    trigger: "When assessing the evidence base of a literature review."
    qualification: "All studies have weaknesses; not all flaws are critical."
    evidence: "'Every study included in your literature review has weaknesses or flaws. You need to identify each weakness or flaw to determine, first, its potential impact on the findings of an individual study and, second, its implications for the findings of your review as a whole.' (p.167)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d18"
    source: "Booth & Sutton 2022, Ch.6, p.167"
    directive: "Be practical when performing quality assessment: do not pursue an ideal of study perfection, and judge whether a flaw with minimal impact on findings is really important."
    trigger: "When assessing the quality of an included study."
    qualification: "Avoid critical-appraisal 'nihilism'; the function of QA is application of research in practice, not perfection."
    evidence: "'You may find yourself becoming very scathing about studies when you are assessing their quality! This belief that no paper is ever good enough has been labelled critical appraisal \"nihilism\"... the function of quality assessment is not to pursue some ideal of study perfection... Therefore, if a particular flaw has minimal or limited impact on the findings of a study, is it really that important?' (p.167)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d19"
    source: "Booth & Sutton 2022, Ch.6, p.167"
    directive: "Early in quality assessment, ask: 'Is this the most appropriate study design to answer this research question?'"
    trigger: "Early in the quality-assessment process for any included study."
    qualification: ""
    evidence: "'Therefore, early in the process of quality assessment, you need to consider: \"Is this the most appropriate study design to answer this research question?\".' (p.167)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d20"
    source: "Booth & Sutton 2022, Ch.6, p.170"
    directive: "Treat hierarchies of evidence with caution: a poorly conducted RCT does not necessarily offer better evidence than a well-conducted observational study, and the most appropriate design may be limited by practical and ethical considerations."
    trigger: "When applying or relying on study-design hierarchies (e.g. OCEBM Levels of Evidence)."
    qualification: "Hierarchies are mostly health-research focused and are contested in other disciplines; consider a flexible per-question taxonomy instead (Petticrew & Roberts 2003)."
    evidence: "'However, classifying research designs in this way may cause problems... First, hierarchies can give a false impression that a poorly conducted randomised controlled trial offers better evidence than a well-conducted observational study. Second, it is often not straightforward to determine which research design is the most appropriate since the choice may be limited by practical and ethical considerations.' (p.170)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d21"
    source: "Booth & Sutton 2022, Ch.6, p.174"
    directive: "When designing or appraising a study, ensure researchers have identified potential confounders at the beginning of the study and have addressed them either through analysis or stratification."
    trigger: "When assessing whether a study controls for confounding."
    qualification: ""
    evidence: "'Studies can be designed to take account of potential confounding at the analysis stage, or to ensure that groups within the study are stratified to achieve equal distribution of participants with the confounding factor... Whichever method is chosen, the researcher should demonstrate that they have identified potential confounders at the beginning of the study.' (p.174)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d22"
    source: "Booth & Sutton 2022, Ch.6, p.175"
    directive: "Consider whether a study's results are practically meaningful, not only statistically significant: ask whether the effect is large enough to matter in practice."
    trigger: "When interpreting reliability and the results of a study."
    qualification: "Statistical significance uses arbitrary thresholds (typically 5%); a statistically significant change may still be too small to be practically significant."
    evidence: "'You should also consider whether results are meaningful - is the effect large enough to be practically significant? For example, a study might demonstrate a change in five points on a scale... This change of five points might be statistically significant but a teacher may only consider a change of ten points or more to be practically significant.' (p.175)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d23"
    source: "Booth & Sutton 2022, Ch.6, p.175"
    directive: "Once you have assessed validity and reliability, separately determine applicability by asking whether the study results are useful for the population and setting your review targets."
    trigger: "After assessing validity and reliability of an included study."
    qualification: "Applicability is concerned with the strength of recommendations for practice, not the strength of evidence itself."
    evidence: "'Once you have assessed the validity and reliability of a study, you need to determine whether the results actually are useful. Validity and reliability are concerned with estimating the strength of the evidence, whereas applicability is concerned with the strength of recommendations for practice.' (p.175)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d24"
    source: "Booth & Sutton 2022, Ch.6, pp.175-176 (LoBiondo-Wood et al., 2002, Box 6.1)"
    directive: "Even if you do not undertake full quality assessment, always follow the first two stages: preliminary understanding (skim the paper) and comprehensive understanding (work up the concepts and research terms)."
    trigger: "When assessing any included study, regardless of review type."
    qualification: "Full QA also requires analysis understanding (breaking the study into parts) and synthesis understanding (making sense of relationships)."
    evidence: "'Even if you do not undertake full quality assessment for your review, you always need to follow the first two steps in Box 6.1.' (p.175); Box 6.1 lists 'Preliminary understanding... Comprehensive understanding... Analysis understanding... Synthesis understanding' (p.176)."
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d25"
    source: "Booth & Sutton 2022, Ch.6, p.176"
    directive: "Start reading a study with the abstract, then read the paper in full and rely on the Methods section to determine quality, while remembering that practical relevance often appears in the Discussion rather than the Results."
    trigger: "When working through an individual study during quality assessment."
    qualification: ""
    evidence: "'A useful place to start is by reading the abstract... it is the Methods section that allows you to determine the quality of the paper. The Results section, too, may indicate the significance of the individual study. Remember that practical relevance may not feature in the Results section but may be considered in the Discussion section.' (p.176)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d26"
    source: "Booth & Sutton 2022, Ch.6, p.176"
    directive: "Investigate methods used by published reviews in your topic area to understand which checklists are widely used and how authors present study features."
    trigger: "When deciding how to perform quality assessment in your discipline."
    qualification: ""
    evidence: "'You can start to understand quality assessment in your discipline by investigating methods used in reviews in your topic. You can start to understand why particular approaches have been chosen, which checklists (or combinations of checklists) are widely used, and how authors present information on study features.' (p.176)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d27"
    source: "Booth & Sutton 2022, Ch.6, p.178"
    directive: "Stick to checklists that have been validated or widely accepted in your discipline."
    trigger: "When choosing a quality-assessment checklist."
    qualification: "Identify the accepted checklists by examining reviews in your discipline."
    evidence: "'Stick to checklists that have been validated or widely accepted in your discipline. Again, examining reviews in your discipline will help to identify the accepted checklists.' (p.181)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d28"
    source: "Booth & Sutton 2022, Ch.6, p.181"
    directive: "Avoid checklists that employ scoring systems; do not label studies with quality scores."
    trigger: "When selecting or applying a quality-assessment checklist."
    qualification: "Cochrane methods guide for systematic reviews actively discourages scoring-system checklists (Higgins et al., 2021)."
    evidence: "'Avoid checklists that employ scoring systems. It is dangerous to label studies with scores, and not particularly helpful in understanding how the study strengths and weaknesses contribute to the validity of the study findings. In fact, the Cochrane methods guide for systematic reviews actively discourages use of checklists that assess quality using a scoring system.' (p.181)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d29"
    source: "Booth & Sutton 2022, Ch.6, p.181"
    directive: "Treat checklists as a guide, not a final answer: report study features that are not picked up by your checklist when relevant."
    trigger: "When using checklists to perform quality and relevance assessment."
    qualification: ""
    evidence: "'Remember what you are trying to achieve through quality and relevance assessment - checklists are only a guide. You may spot study features that are not picked up by your checklist and these can still be reported.' (p.181)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d30"
    source: "Booth & Sutton 2022, Ch.6, p.178"
    directive: "Avoid devising your own quality-assessment checklist from scratch; if no suitable tool exists, adapt an existing checklist or combine criteria from existing checklists into a meta-checklist, and reference the contributing checklists."
    trigger: "When no validated checklist matches your review's needs."
    qualification: "Devising your own may indicate inadequate searching for an appropriate tool; checklist development is a science requiring its own literature review and expert panel (Whiting et al., 2017)."
    evidence: "'However, we advise that you try to avoid devising your own checklist as far as possible; it may indicate you have not looked carefully enough for an appropriate tool, it makes it difficult to compare your assessments to other reviews, and checklist development is now a science requiring its own literature review and expert panel!' (p.178); 'if a suitable tool really does not exist, rather than trying to create your own checklist from scratch (which is not advised), you could adapt an existing checklist, or select criteria from different checklists and devise your own meta-checklist. (However, do remember to justify why you have had to do so and reference the contributing checklist.)' (p.181)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d31"
    source: "Booth & Sutton 2022, Ch.6, p.178"
    directive: "If you adapt a published checklist, note the adaptation when writing up the methodology of your review."
    trigger: "When adapting a published quality-assessment checklist for your review."
    qualification: ""
    evidence: "'If you adapt a published checklist, be sure to note this when writing up the methodology for your review.' (p.178)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d32"
    source: "Booth & Sutton 2022, Ch.6, p.188"
    directive: "When using checklists to exclude qualitative studies from a review, support all exclusions with an explicit account of the researcher's view of 'good' and 'bad' studies and reasons for exclusion."
    trigger: "When using a quality-assessment checklist to exclude qualitative studies from a review."
    qualification: "Sandelowski et al. (1997). Most qualitative reviews do not exclude studies on quality grounds."
    evidence: "'You should be careful when using checklists to exclude studies from a review, making sure that all exclusions are supported by an explicit account of the researcher's view of \"good\" and \"bad\" studies, and reason for exclusions.' (p.188)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d33"
    source: "Booth & Sutton 2022, Ch.6, p.188"
    directive: "Routinely look at the effect on the review of both including and excluding poor-quality qualitative studies (qualitative sensitivity analysis)."
    trigger: "When conducting a qualitative evidence synthesis."
    qualification: "Carroll & Booth (2015)."
    evidence: "'It is good practice to look routinely at the effect on the review of both including and excluding poor-quality studies, so-called \"qualitative sensitivity analysis\".' (p.188)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d34"
    source: "Booth & Sutton 2022, Ch.6, p.186 (citing Noyes et al. 2018a; 2021, CQIMG)"
    directive: "For qualitative reviews, distinguish between assessment of study quality and assessment of risk of bias by focusing on assessment of methodological strengths and limitations as a marker of study rigour (a 'risk to rigour' approach)."
    trigger: "When performing quality assessment for a qualitative evidence synthesis."
    qualification: "Cochrane Qualitative and Implementation Methods Group recommendation."
    evidence: "'Cochrane Qualitative and Implementation Methods Group (CQIMG) guidance recommends that review authors should \"distinguish between assessment of study quality and assessment of risk of bias by focusing on assessment of methodological strengths and limitations as a marker of study rigour (a 'risk to rigour' approach)\".' (p.186)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d35"
    source: "Booth & Sutton 2022, Ch.6, p.186 (citing Noyes et al. 2018a)"
    directive: "In the absence of a definitive risk-to-rigour tool for qualitative research, select from published, commonly used and validated tools that focus on the assessment of methodological strengths and limitations of qualitative studies."
    trigger: "When choosing a quality-assessment tool for qualitative studies."
    qualification: ""
    evidence: "'Cochrane further recommends that review authors select from published, commonly used and validated (i.e. evaluated) tools that focus on \"the assessment of the methodological strengths and limitations of qualitative studies\".' (p.186)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d36"
    source: "Booth & Sutton 2022, Ch.6, p.189"
    directive: "In the Discussion of a review, focus on key flaws of the included studies, but do not forget to include what has been done well."
    trigger: "When writing up the Discussion of a review's quality assessment."
    qualification: ""
    evidence: "'Generally, the Discussion focuses on the key flaws, but you should not forget to include what has been done well!' (p.189)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d37"
    source: "Booth & Sutton 2022, Ch.6, p.189"
    directive: "Be cautious about labelling studies according to a level of quality (e.g. high, medium, low); if you do, be explicit about the criteria so the classification could be reliably reproduced."
    trigger: "When summarising study quality across a review."
    qualification: "QA is highly subjective; readers' concept of 'high quality' may differ from yours."
    evidence: "'Finally, be cautious about labelling studies according to a level of quality (e.g. high, medium and low). While in principle this might appear useful, you need to be explicit about the criteria by which studies are categorised, so that ultimately the classification of studies could be reliably reproduced.' (pp.189-190)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d38"
    source: "Booth & Sutton 2022, Ch.6, p.189"
    directive: "Consider performing a sensitivity analysis to examine whether your review's results change if poor-quality studies are omitted."
    trigger: "When the review may be affected by inclusion of poor-quality studies."
    qualification: "Reviewers do not generally exclude studies on the basis of quality."
    evidence: "'Reviewers do not generally exclude studies on the basis of quality. However, sometimes they perform a subgroup analysis to examine whether the results change if poor-quality studies are omitted (i.e. are results sensitive to study quality?). This form of subgroup analysis is usually referred to as a sensitivity analysis.' (pp.188-189)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d39"
    source: "Booth & Sutton 2022, Ch.6, p.189 (citing Higgins et al. 2021)"
    directive: "For systematic reviews, have quality assessment carried out by more than one person and compare the results."
    trigger: "When performing quality assessment in a systematic review."
    qualification: "This is not always practical or necessary; a reasonable alternative is having a second reviewer check a sample of quality assessments, particularly elements you are unsure about."
    evidence: "'Quality assessment is a subjective process. For systematic reviews, methods guides suggest that quality assessment should be carried out by more than one person and the results compared (Higgins et al., 2021). However, this is not always practical or necessary. Having a second reviewer check a sample of quality assessments offers a reasonable alternative.' (p.189)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d40"
    source: "Booth & Sutton 2022, Ch.6, p.189"
    directive: "Remember that quality assessment examines what is reported within a study report, and assess only what is reported; pursue missing details from authors only when needed."
    trigger: "When QA is constrained by what the study report contains."
    qualification: "It is possible to track authors down to elicit missing details, but a good paper should include sufficient detail."
    evidence: "'Lastly, remember that quality assessment examines what is reported within a study report, and thus studies can only be as good as their reporting. Often studies do not report enough details of the methods employed and quality assessment can only measure what is reported. While it is possible to track authors down to elicit missing details, a good paper should include sufficient detail to allow you to assess its quality.' (p.189)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d41"
    source: "Booth & Sutton 2022, Ch.6, p.192 (FAQ 6.1)"
    directive: "When unsure whether to include a study, ask for a second opinion - hand the inclusion/exclusion criteria to a colleague and have them apply the criteria independently; in funded systematic reviews, double-screen at least a proportion of studies and use a third reviewer for unresolved disagreements."
    trigger: "When you are unsure whether to include a study in your review."
    qualification: ""
    evidence: "'You could ask for a second opinion, for example from your supervisor or mentor. Alternatively, you could hand a colleague your inclusion and exclusion criteria and ask them to apply these to the study in question to see what decision they reach. Systematic reviews being conducted by research teams, particularly those that are funded, would double-screen at least a proportion of the studies, therefore any uncertainty can usually be resolved, including the opinion of a third reviewer/colleague if required.' (pp.191-192)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d42"
    source: "Booth & Sutton 2022, Ch.6, p.192 (FAQ 6.2)"
    directive: "Record the reasons for exclusion at each stage of screening; in the write-up, record reasons only for studies excluded at the full-text stage, typically as an appendix list with brief reasons."
    trigger: "When deciding what exclusion documentation to keep and present in the write-up."
    qualification: ""
    evidence: "'It will help to record the reasons for exclusion at each stage of screening... For your write-up, you only need to record reasons for any studies you exclude at full text. Systematic reviews usually include in the appendices a list of these with a (brief) reason for why they did not meet the inclusion criteria.' (p.192)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d43"
    source: "Booth & Sutton 2022, Ch.6, p.193 (FAQ 6.6)"
    directive: "Pilot any data extraction form (whether or not it includes critical appraisal) before using it throughout your review."
    trigger: "When constructing a data-extraction form (with or without combined critical appraisal)."
    qualification: ""
    evidence: "'With any data extraction form, whether including critical appraisal or not, it is useful to pilot it first before using it throughout your review.' (p.193)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d44"
    source: "Booth & Sutton 2022, Ch.6, p.191 (Key learning points)"
    directive: "Use the inclusion and exclusion criteria you devised earlier to select studies for your review in a transparent manner."
    trigger: "When selecting studies for inclusion in any review."
    qualification: ""
    evidence: "'Use the inclusion and exclusion criteria you devised in Chapter 4 to help you select studies for your review in a transparent manner.' (p.191)"
  - id: "booth-sutton-2022-systematic-approaches/ch6-assessing-evidence/d45"
    source: "Booth & Sutton 2022, Ch.6, p.191 (Key learning points)"
    directive: "When reading any included study, ask the three core quality-assessment questions: Are the results true (validity)? What are the results (reliability)? Can I generalise the results (generalisability)?"
    trigger: "When reading and assessing any individual study in a literature review."
    qualification: ""
    evidence: "'Three core components of quality assessment to consider when reading a study are: Are the results of a study true? (Validity); What are the results? (Reliability); Can I generalise the results? (Generalisability).' (p.191)"
