directives:
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d01"
    source: "Booth & Sutton 2022, Ch.8, p.235"
    directive: "When choosing your method of synthesis, balance the need to aggregate (bring studies together) with the need to interpret (make sense of findings from the studies)."
    trigger: "When selecting a method for qualitative synthesis."
    qualification: ""
    evidence: "'When choosing your method of synthesis you need to balance the need to aggregate (bring studies together) with the need to interpret (make sense of findings from the studies).' (p.235)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d02"
    source: "Booth & Sutton 2022, Ch.8, p.235"
    directive: "Consider whether your focus is on the literature as a body of work, on the individual studies, or on themes or findings within those studies."
    trigger: "When designing a qualitative synthesis."
    qualification: ""
    evidence: "'You should also consider whether your focus is on the literature as a body of work, on the individual studies or on themes or findings within those studies.' (p.235)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d03"
    source: "Booth & Sutton 2022, Ch.8, p.235"
    directive: "If you plan to integrate your qualitative synthesis with a quantitative review, consider in advance how to bring the two reviews together."
    trigger: "When planning a synthesis intended to be combined with a quantitative review."
    qualification: ""
    evidence: "'If you plan to integrate your qualitative synthesis with a quantitative review you must consider in advance how to bring the two reviews together (see Chapter 9).' (p.235)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d04"
    source: "Booth & Sutton 2022, Ch.8, p.236"
    directive: "Recognise that the value of your review does not lie in merely identifying and bringing together related studies; juxtapose findings from different sources to spot patterns or themes not previously recognised by the original authors."
    trigger: "When conducting a qualitative review."
    qualification: ""
    evidence: "'You must recognise that the value of your review does not lie in merely identifying and bringing together related studies. By juxtaposing findings from different sources (putting them side by side) you may spot patterns or themes not previously recognised by the authors of individual studies.' (p.236)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d05"
    source: "Booth & Sutton 2022, Ch.8, p.236"
    directive: "Look not only for patterns in collective findings but also for differences explained by how researchers carried out the individual studies (meta-method)."
    trigger: "When synthesising findings across multiple qualitative studies."
    qualification: "Differences in methods used may explain inconsistencies in findings or suggest how best to conduct such studies in future."
    evidence: "'you may not only spot patterns in the collective findings (what the individual authors found) but also notice differences that are explained by how researchers have carried out the individual studies (meta-method). Differences in methods used by included studies may explain inconsistencies in their findings...' (p.236)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d06"
    source: "Booth & Sutton 2022, Ch.8, p.236"
    directive: "Aim to make 'a new whole out of the parts' — produce a new line of argument, a new theory, or a new 'take home message' rather than a mere assemblage."
    trigger: "When carrying out any qualitative synthesis."
    qualification: ""
    evidence: "'A key principle of any synthesis is \"making a new whole out of the parts\" (Cruzes & Dybå, 2011b). This \"new whole\" may form a new line of argument, a new theory or a new \"take home message\".' (p.236)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d07"
    source: "Booth & Sutton 2022, Ch.8, p.239"
    directive: "Structure your review question (using PICO, SPICE, SPIDER, PerSPE(c)TiF, or another framework) to shape the subsequent search, inclusion/exclusion and data extraction processes."
    trigger: "When formulating the question for a qualitative synthesis."
    qualification: "Regardless of the framework used."
    evidence: "'Regardless of the framework used you should structure your review question (see Chapter 4) to shape the subsequent search, inclusion/exclusion and data extraction processes.' (p.239)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d08"
    source: "Booth & Sutton 2022, Ch.8, p.239"
    directive: "Involve stakeholders from the very beginning and throughout your entire review."
    trigger: "When formulating the review question and at all subsequent stages."
    qualification: ""
    evidence: "'You should involve stakeholders from the very beginning and throughout your entire review (Harris et al., 2015; Bayliss et al., 2016; Downe et al., 2019).' (p.239)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d09"
    source: "Booth & Sutton 2022, Ch.8, p.240"
    directive: "Where approaches other than comprehensive sampling are used, justify your sampling strategy, match it to your synthesis method, and describe fully how it was implemented."
    trigger: "When the search for qualitative studies uses non-comprehensive sampling."
    qualification: ""
    evidence: "'Sampling: Where approaches other than comprehensive sampling are used, reviewers must justify their sampling strategy, match it to their synthesis method and describe fully how it was implemented' (Table 8.1, p.240)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d10"
    source: "Booth & Sutton 2022, Ch.8, p.240"
    directive: "Given the comparatively low yield of qualitative topic-based searches, privilege specificity (retrieval of relevant items) and compensate for indexing deficiencies using well-chosen supplementary strategies."
    trigger: "When designing search procedures for qualitative evidence syntheses."
    qualification: ""
    evidence: "'Search procedures: Given comparatively low yield of qualitative topic-based searches, reviewers should privilege specificity (retrieval of relevant items)... You should compensate for indexing deficiencies using well-chosen supplementary strategies' (Table 8.1, p.240)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d11"
    source: "Booth & Sutton 2022, Ch.8, p.240"
    directive: "Determine which studies to include based on consensus from two reviewers, resolving conflicts through discussion or by consulting a third reviewer."
    trigger: "When screening qualitative studies for inclusion."
    qualification: "Enhances rigour."
    evidence: "'Determining which studies to include, based on consensus from two reviewers, enhances rig-our (Atkins et al., 2008)... You may use two reviewers to reach consensus on screening decisions, resolving conflicts through discussion or by consulting a third reviewer (Atkins et al., 2008).' (p.240)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d12"
    source: "Booth & Sutton 2022, Ch.8, p.241"
    directive: "Pre-specify which elements of data are to be extracted, then examine which of those elements are present in each individual report, handling differing studies in a consistent manner."
    trigger: "When carrying out data extraction for a qualitative synthesis."
    qualification: ""
    evidence: "'Remember that you are trying to ensure that you handle different studies, with their different designs and publishing conventions, in a consistent manner... Data extraction requires that you pre-specify, and then examine, which elements of data are present in each individual report (Munn et al., 2014).' (p.241)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d13"
    source: "Booth & Sutton 2022, Ch.8, p.241"
    directive: "Allow extra unlabelled fields on your data extraction form for uncoded data to which you will subsequently return."
    trigger: "When designing a data extraction form for framework-style qualitative synthesis."
    qualification: ""
    evidence: "'Allow extra unlabelled fields for uncoded data to which you will subsequently return.' (p.241)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d14"
    source: "Booth & Sutton 2022, Ch.8, p.241"
    directive: "Balance the granularity of the data extraction form with the quantities of relevant data; avoid both 'just-in-case' empty fields and large quantities of data lumped under broad labels."
    trigger: "When designing data-extraction forms."
    qualification: ""
    evidence: "'Your challenge is to balance the granularity of the data extraction form with the quantities of relevant data (Brunton et al., 2020); you do not want either \"just-in-case\" empty fields or large quantities of data lumped under broad labels.' (p.241)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d15"
    source: "Booth & Sutton 2022, Ch.8, p.241"
    directive: "When synthesising qualitative research, reread the original findings to compare emerging ideas with the concepts as originally written, continually looking out for overlap, similarities and contradictions."
    trigger: "When extracting and interpreting qualitative findings during synthesis."
    qualification: ""
    evidence: "'When synthesising qualitative research, reread the original findings to compare emerging ideas with the concepts as originally written. Continually look out for overlap, similarities and contradictions (Mays & Pope, 2020a).' (p.241)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d16"
    source: "Booth & Sutton 2022, Ch.8, p.241"
    directive: "Rather than deciding everything in advance, revisit your data extraction forms and data continuously as new interpretations emerge."
    trigger: "During interpretive qualitative synthesis where ideas/concepts are the unit of extraction."
    qualification: ""
    evidence: "'Rather than deciding everything in advance, revisit your forms and data continuously as new interpretations emerge.' (p.241)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d17"
    source: "Booth & Sutton 2022, Ch.8, p.241"
    directive: "Highlight information about contextual factors from included studies to explain differences across studies."
    trigger: "When extracting data from qualitative studies."
    qualification: ""
    evidence: "'You should also seek to highlight information about contextual factors from included studies to explain differences across studies (Booth et al., 2019a).' (p.241)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d18"
    source: "Booth & Sutton 2022, Ch.8, p.242"
    directive: "Do not exclude an entire study on the basis of an appraisal of study quality, particularly if it contributes an important insight."
    trigger: "When deciding whether to drop a study following quality appraisal in a qualitative synthesis."
    qualification: "May not be appropriate; the 'study' is not the appropriate unit of analysis for quality appraisal in research synthesis."
    evidence: "'Excluding an entire study on the basis of an appraisal of study quality may not be appropriate (Dixon-Woods et al., 2004), particularly if it contributes an important insight: \"the \"study\" is not the appropriate unit of analysis for quality appraisal in research synthesis. There are often nuggets of wisdom in methodologically weak studies and systematic review disregards them at its peril.\" (Pawson, 2006c)' (p.242)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d19"
    source: "Booth & Sutton 2022, Ch.8, p.242"
    directive: "Plan your initial synthesis strategy before approaching the literature, but be prepared to switch from your initial strategy to an appropriate alternative as patterns from the literature become clearer."
    trigger: "Early in the synthesis stage of a qualitative review."
    qualification: ""
    evidence: "'A key early stage is planning your initial synthesis strategy – how to approach the literature once you have assembled it (Petticrew et al., 2013b). You may, in fact, need to switch from your initial strategy (Box 8.4) to an appropriate alternative as patterns from the literature become clearer.' (p.242)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d20"
    source: "Booth & Sutton 2022, Ch.8, p.242"
    directive: "Whatever method of synthesis you use, map similarity, ensure categories are exclusive and avoid overlap, and create secure and well-defined concepts as the building blocks of your process."
    trigger: "When carrying out qualitative synthesis."
    qualification: ""
    evidence: "'Whatever methods of synthesis you use you will: map similarity, ensure that categories are exclusive and avoid overlap, and create secure and well-defined concepts as the building blocks of your process.' (p.242)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d21"
    source: "Booth & Sutton 2022, Ch.8, p.243"
    directive: "If you intend to read and review the entire body of literature, the order of papers does not matter; if you intend to sample purposively, ensure you have constructed your sampling frame appropriately."
    trigger: "When deciding the order in which to handle papers in a qualitative synthesis."
    qualification: ""
    evidence: "'Clearly if you intend to read and review an entire body of literature it will not matter in which order you handle the papers... If, however, you are planning to sample purposively from the literature (Combs et al., 2010) then you need to be confident that you have constructed your sampling frame appropriately (Benoot et al., 2016; Ames et al., 2019a).' (p.243)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d22"
    source: "Booth & Sutton 2022, Ch.8, p.243"
    directive: "When examining studies as a body of evidence, extract findings without losing the context and relationships within each report."
    trigger: "During preliminary analysis and interpretation of qualitative studies."
    qualification: ""
    evidence: "'Your challenge is to extract findings from these studies without losing the context and relationships within each report.' (p.243)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d23"
    source: "Booth & Sutton 2022, Ch.8, p.243"
    directive: "Do not implement a hierarchy of study designs; rather consider whether each method is suitable for the research question under examination."
    trigger: "When evaluating methods used by included qualitative studies."
    qualification: ""
    evidence: "'You need not implement a hierarchy of study designs (Petticrew & Roberts, 2003) but rather consider whether each method is suitable for the research question under examination.' (p.243)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d24"
    source: "Booth & Sutton 2022, Ch.8, p.244"
    directive: "While synthesis steers the reader towards patterns of similarity, be particularly active in seeking the divergent or disconfirming case."
    trigger: "When moving from synthesis into full analysis and interpretation."
    qualification: ""
    evidence: "'While synthesis steers the reader towards patterns of similarity you should be particularly active in seeking the divergent or disconfirming case (Booth et al., 2013a).' (p.244)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d25"
    source: "Booth & Sutton 2022, Ch.8, p.245"
    directive: "Start from one of the more accessible methods of synthesis, namely thematic synthesis or framework synthesis."
    trigger: "When choosing a qualitative synthesis method as a less experienced reviewer."
    qualification: ""
    evidence: "'We advise that you start from one of the more accessible methods of synthesis, namely thematic synthesis and framework synthesis. Both methods mirror corresponding established methods used for analysis of primary qualitative data...' (p.245)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d26"
    source: "Booth & Sutton 2022, Ch.8, p.253"
    directive: "Do not let the ability to cut-and-paste blocks of text from articles into your extraction form distract you from recognising that not all data is equally relevant; revisit the review question to ensure only relevant (or potentially relevant) data is extracted."
    trigger: "When extracting qualitative data using software (e.g. NVivo) where bulk paste is easy."
    qualification: ""
    evidence: "'A word of caution: Just because you can cut and paste blocks of text from articles into your extraction form should not stop you from recognising that not all data is equally relevant. Effective data extraction revisits the review question to ensure that only data that is relevant, or potentially relevant, is extracted.' (p.253)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d27"
    source: "Booth & Sutton 2022, Ch.8, p.255"
    directive: "Do not focus all your attention on constructing a 'line of argument'; pay similar attention to nuanced findings from inconsistencies or contradictions."
    trigger: "When analysing qualitative findings, given the human tendency to identify overall patterns ahead of inconsistencies or exceptions."
    qualification: ""
    evidence: "'You should not focus all your attention on constructing a \"line of argument\". You should pay similar attention to nuanced findings from inconsistencies or contradictions.' (p.255)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d28"
    source: "Booth & Sutton 2022, Ch.8, p.255"
    directive: "Maximise opportunities to 'challenge' persuasive or seductive lines of argument; ensure those closest to the data, especially newer team members, feel able to challenge and resist interpretations into which data is inappropriately 'shoehorned'."
    trigger: "When working as a review team (or student/supervisor pair) on synthesis."
    qualification: ""
    evidence: "'A review team (or student/supervisor) should maximise opportunities to \"challenge\" persuasive or seductive lines of argument (Booth et al., 2013a). Those closest to the data, especially newer members of the team, should feel able to challenge and resist interpretations into which data is inappropriately \"shoehorned\".' (p.255)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d29"
    source: "Booth & Sutton 2022, Ch.8, p.255"
    directive: "Ground any theories or hypotheses in your data at all times, even though creativity is an important feature of pattern seeking and interpretation."
    trigger: "When generating theories or hypotheses from qualitative synthesis."
    qualification: ""
    evidence: "'Although creativity is an important feature of pattern seeking and interpretation, it is important that, at all times, you ground any theories or hypotheses in your data.' (p.255)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d30"
    source: "Booth & Sutton 2022, Ch.8, p.255"
    directive: "As new data is accommodated, continually revise any conclusions or conceptual models so that they continue to be inclusive."
    trigger: "When new data is incorporated during ongoing synthesis."
    qualification: ""
    evidence: "'As new data is accommodated, you should continually revise any conclusions or conceptual models so that they continue to be inclusive (Miles et al., 2018).' (p.255)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d31"
    source: "Booth & Sutton 2022, Ch.8, p.255"
    directive: "Verify any patterns, themes, relationships, or conclusions with your primary source data to ensure that they are both accurate and confirmable."
    trigger: "When drawing or verifying conclusions in qualitative synthesis."
    qualification: ""
    evidence: "'You need to verify any patterns, themes, relationships or conclusions with your primary source data to ensure that they are both accurate and confirmable (Miles et al., 2018).' (p.255)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d32"
    source: "Booth & Sutton 2022, Ch.8, p.255"
    directive: "Guard against being locked into a particular pattern (premature analytic closure) and against excluding pertinent evidence because it is inconvenient or extraneous to your theorising."
    trigger: "At the conclusion-drawing and verification stage of qualitative synthesis."
    qualification: ""
    evidence: "'At this stage, you are particularly vulnerable to a cognitive bias such as being locked into a particular pattern (premature analytic closure) (Miles et al., 2018) or you may exclude pertinent evidence because it is inconvenient or extraneous to your theorising.' (p.255)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d33"
    source: "Booth & Sutton 2022, Ch.8, p.256"
    directive: "When examining representativeness, ask yourself: Are any particular groups underrepresented? Overrepresented? Am I confident that the characteristics of a particular group are not misrepresented or misinterpreted?"
    trigger: "When testing or confirming review findings."
    qualification: ""
    evidence: "'Representativeness: Requires that you explore whether the various study populations match the characteristics of the target population. Examine your component studies. Ask yourself, \"Are any particular groups underrepresented? Are any groups overrepresented? Am I confident that the characteristics of a particular group are not misrepresented or misinterpreted?\"' (Table 8.9, p.256)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d34"
    source: "Booth & Sutton 2022, Ch.8, p.256"
    directive: "Cultivate a healthy scepticism when exploring likely researcher effects in component studies (e.g. did researchers favour a particular intervention or trigger inadvertent effects via their professional identity)."
    trigger: "When testing or confirming qualitative review findings."
    qualification: ""
    evidence: "'Researcher effects: Cultivate a healthy scepticism when exploring likely researcher effects. Do the researchers favour a particular programme or intervention – for example, did they influence the selection of outcomes? Have they triggered inadvertent researcher effects, e.g. if a qualitative researcher is a doctor did this change how participants communicate or what they chose to share with them?' (Table 8.9, p.256)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d35"
    source: "Booth & Sutton 2022, Ch.8, p.257"
    directive: "Ensure your conclusions are not simply based on 'vote counting'; look at the effect of ordering studies from highest to lowest quality and ask whether positive or negative aspects cluster around particular points in this ranking."
    trigger: "When weighting evidence during analysis."
    qualification: "Not all studies are equal."
    evidence: "'Weighting the evidence: Asks you to ensure that your conclusions are not simply based on \"vote counting\". Not all studies are equal! Look at the effect of ordering studies from the highest quality to the lowest quality. Ask yourself \"Are positive or negative aspects clustered around particular points in this ranking?\"' (Table 8.9, p.257)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d36"
    source: "Booth & Sutton 2022, Ch.8, p.257"
    directive: "Examine studies that show particularly extreme results or that are a unique source of a particular theme; discuss these with colleagues and topical experts to elicit possible explanations and explore them in your analysis or as hypotheses for future research."
    trigger: "When taking precautions against over-generalisation in qualitative synthesis."
    qualification: ""
    evidence: "'Meaning of outliers: Take precautions against over-generalisation. Examine studies that show particularly extreme results... Discuss these findings with colleagues and topical experts. Ask them, \"Can you identify possible explanations for the difference in the findings?\". Explore colleagues' explanations in your analysis or suggest them as hypotheses to explore in future research' (Table 8.9, p.257)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d37"
    source: "Booth & Sutton 2022, Ch.8, p.257"
    directive: "Do more than look for outliers when following up surprises; record surprises as you encounter them, since over time they may lose their capacity to surprise; once validated, highlight them in publications, oral presentations and press releases, and invite explanations."
    trigger: "When one or more studies do not fit their anticipated place within a pattern."
    qualification: ""
    evidence: "'Following up surprises involves identifying where one or more studies do not fit within their anticipated place within a pattern. Do more than simply look for outliers; a \"surprise\" may lie embedded within the \"pack\" of studies but not where predicted. Record surprises as you encounter them because, over an extended period of time, they may lose their capacity to surprise. Having validated surprises, highlight them in publications, oral presentations and press releases, and invite explanations' (Table 8.9, p.257)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d38"
    source: "Booth & Sutton 2022, Ch.8, p.257"
    directive: "Actively seek disconfirmation of what you believe to be true; sample purposively from outside the original sampling frame, bring together different perspectives within the research team, or harness other procedures to challenge the 'orthodoxy'."
    trigger: "When looking for negative evidence in qualitative synthesis."
    qualification: "Frequently overlooked because synthesis gravitates towards commonality rather than dissonance."
    evidence: "'Looking for negative evidence: Frequently overlooked because synthesis gravitates towards commonality rather than dissonance. Actively seek disconfirmation of what you believe to be true. Sample purposively from outside the original sampling frame, bring together different perspectives within the research team or harness other procedures to challenge the \"orthodoxy\" (Booth et al., 2013a)' (Table 8.9, p.257)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d39"
    source: "Booth & Sutton 2022, Ch.8, p.257"
    directive: "Test possible relationships using if–then tests: if one condition is the case, look to see if a second one is; if it is, you are on the way; if not, make other conjectures."
    trigger: "When testing the strength of evidence for relationships in synthesis."
    qualification: ""
    evidence: "'Make if–then tests: Testing possible relationships: For example, \"if a study mentions that …, then the view expressed of… should resemble…\". If one condition is the case, look to see if a second one is. If it is, you are on the way towards understanding what is going on and can make further similar tests. If it is not true, then you need to make other conjectures' (Table 8.9, p.257)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d40"
    source: "Booth & Sutton 2022, Ch.8, p.257"
    directive: "After if–then testing, rule out spurious relations: consider whether a third factor or variable may explain away the apparent relationship."
    trigger: "After identifying an apparent relationship via if–then testing."
    qualification: ""
    evidence: "'Rule out spurious relations: To follow up if–then testing you need to rule out spurious relations... Consider whether a third factor or variable may possibly explain away the apparent relationship identified from the data' (Table 8.9, p.257)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d41"
    source: "Booth & Sutton 2022, Ch.8, p.257"
    directive: "Replicate findings by referring to external data sources, extending your sampling frame to an adjacent area of literature, or splitting your set of studies and using half to generate the theory and the other half to test and validate it."
    trigger: "When seeking to replicate or validate a synthesised finding."
    qualification: ""
    evidence: "'Replicate a finding: You may need to refer to external data sources, e.g. in order to replicate a finding. Perhaps, extend your sampling frame to an adjacent area of literature where the underlying explanatory mechanism is likely to be present. Alternatively, split your set of studies and use half of the studies to generate the theory or hypothesis and the other half to test and validate it' (Table 8.9, p.257)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d42"
    source: "Booth & Sutton 2022, Ch.8, p.257"
    directive: "Keep your mind open to alternative explanations; record any theory underpinning each study as you extract data from it, and revisit these theories when you complete your synthesis."
    trigger: "Throughout data extraction and at completion of synthesis."
    qualification: ""
    evidence: "'Check out rival explanations: Keep your mind open to alternative explanations and check out rival explanations. Record any theory underpinning each study as you extract the data from each. Revisit these theories when you complete your synthesis. Look for explanations in the Introductions/Discussions of the studies or accompanying editorial or commentary material' (Table 8.9, p.257)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d43"
    source: "Booth & Sutton 2022, Ch.8, p.257"
    directive: "Gain early and clear agreement on stakeholder roles and clearly explain how you plan to use any informant feedback alongside your synthesis."
    trigger: "When using informants to validate findings."
    qualification: "Respondent validation is controversial because the synthesis may not be recognisable to authors of a single study; how feedback is handled and weighted matters."
    evidence: "'Feedback from informants: Using informants to validate findings remains controversial, because the synthesis may not be recognisable to authors of a single study. This is not an argument against respondent validation per se but simply for how to handle and weight feedback against the synthesis. Gain early and clear agreement on stakeholder roles. Clearly explain how you plan to use any feedback alongside your synthesis' (Table 8.9, p.257)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d44"
    source: "Booth & Sutton 2022, Ch.8, p.258"
    directive: "Evaluate, with a colleague, supervisor, or mentor, whether you have reached theoretical saturation in an interpretative review."
    trigger: "When carrying out an interpretative qualitative review."
    qualification: ""
    evidence: "'For an interpretative review you should evaluate, with a colleague, supervisor or mentor, whether you have reached theoretical saturation (Booth, 2016).' (p.258)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d45"
    source: "Booth & Sutton 2022, Ch.8, p.258"
    directive: "To challenge theoretical saturation, make strenuous attempts to sample from other disciplines relevant to the review question or from other types of literature."
    trigger: "When testing whether theoretical saturation in a qualitative review is genuine."
    qualification: "Authors are incentivised to report innovative insights and are not independent informants like primary-research interviewees."
    evidence: "'To challenge theoretical saturation you should make strenuous attempts to sample from other disciplines relevant to the review question or from other types of literature.' (p.258-259)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d46"
    source: "Booth & Sutton 2022, Ch.8, p.259"
    directive: "Acknowledge in your analysis the likely challenges to objectivity posed by your own preoccupations and prejudices; recognise that your systematic review is 'situated, partial and perspectival' and communicate these limitations to your reader."
    trigger: "When writing the analysis/limitations of a systematic review."
    qualification: "Systematic reviews claim objectivity but only aspire to 'disciplined subjectivity'."
    evidence: "'As an honest reviewer your analysis should acknowledge likely challenges to objectivity posed by your own preoccupations and prejudices. You should recognise that your systematic review is \"situated, partial and perspectival\" (Badenhorst, 2018) and communicate these limitations to your reader.' (p.259)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d47"
    source: "Booth & Sutton 2022, Ch.8, p.259"
    directive: "Explore likely publication bias with regard to qualitative or theoretical/conceptual studies — e.g. by using a matrix to examine whether populations, age groups or countries are under-represented, or by brainstorming disciplines that are likely to have studied the focus of interest and comparing your list with the included studies."
    trigger: "When investigating publication bias in qualitative synthesis."
    qualification: ""
    evidence: "'You should therefore explore likely publication bias with regard to qualitative studies or theoretical/conceptual studies (Booth et al., 2018a). For qualitative studies you might use a matrix to examine whether any populations, age groups or countries where the focus of interest is common are comparatively under-represented. For theoretical/conceptual studies you might brainstorm... those disciplines that are likely to have studied the focus of interest. Compare your list with the characteristics of your included studies.' (p.259)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d48"
    source: "Booth & Sutton 2022, Ch.8, p.260"
    directive: "Do not assume that the frequency with which a particular theme is reported relates to its importance, since research papers (unlike people) have a vested interest in being different from one another."
    trigger: "When weighting themes by their frequency across qualitative papers."
    qualification: ""
    evidence: "'do not make the mistake of thinking that the frequency with which a particular theme is reported relates to its importance: \"sampling research papers is fundamentally not like sampling people. Unlike people, research papers have a vested interest in being different from one another, and are (in theory at least) only published if they are saying something new...\" (Dixon-Woods et al., 2006a)' (p.260)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d49"
    source: "Booth & Sutton 2022, Ch.8, p.260"
    directive: "When the same field's authors neglect to cite a particular author or school of thought, ask 'Why has this happened? Are other authors ignorant of particular arguments, do conflicts or tensions exist, or is this intentional?' and use such observations to inform your own analysis."
    trigger: "When examining citation patterns in theoretical/conceptual studies."
    qualification: ""
    evidence: "'For theoretical/conceptual studies you may wish to examine citation patterns. If authors neglect to cite a particular author or school of thought within the same field ask yourself, \"Why has this happened? Are other authors ignorant of particular arguments, do conflicts or tensions exist, or is this intentional?\". Look at how citations have cross-fertilised, or alternatively remain in \"silos\" across disciplines. Use such observations to inform your own analysis.' (p.260)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d50"
    source: "Booth & Sutton 2022, Ch.8, p.260"
    directive: "Try not to attach too much importance to a single preferred variable when a difference may be attributable to the interaction of many variables."
    trigger: "When identifying disconfirming or conflicting findings across studies."
    qualification: ""
    evidence: "'Such differences may typically occur across one or more specific variables. You should try not to attach too much importance to a single preferred variable when a difference may be attributable to the interaction of many variables.' (p.260)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d51"
    source: "Booth & Sutton 2022, Ch.8, p.260"
    directive: "Encourage diverse interpretations by valuing specific roles within the team, engineering different researcher viewpoints, and through triangulation."
    trigger: "When seeking to identify disconfirming cases or guard against premature closure."
    qualification: ""
    evidence: "'You can encourage diverse interpretations by valuing specific roles within the team, engineering different researcher viewpoints and through triangulation (Booth et al., 2013a).' (p.260)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d52"
    source: "Booth & Sutton 2022, Ch.8, p.261"
    directive: "When individual studies differ from the overall set as genuine outliers, reconsider whether it makes sense to include them in an overarching analysis or whether to analyse them separately."
    trigger: "When handling outlier studies in qualitative synthesis."
    qualification: ""
    evidence: "'Of course, individual studies may differ from the overall set of studies as genuine \"outliers\". In such cases, reconsider whether it makes sense to include outliers within an overarching analysis or whether you should analyse them separately.' (p.261)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d53"
    source: "Booth & Sutton 2022, Ch.8, p.261"
    directive: "Document all your hunches and other intuitive steps in the process so you can retrace your steps and construct an alternative argument; test premises with a supervisor or mentor and check assumptions with stakeholders or user representatives."
    trigger: "When working through the synthesis to guard against being led to a wrong conclusion."
    qualification: ""
    evidence: "'Because you could be led towards a wrong conclusion you must document all your hunches and other intuitive steps in the process. You can then retrace your steps and construct an alternative argument. Test any premises for your thinking with a supervisor or mentor and check assumptions with stakeholders or user representatives.' (p.261)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d54"
    source: "Booth & Sutton 2022, Ch.8, p.261"
    directive: "Do not automatically assume that your line of reasoning is wrong just because your perceptions are not confirmed by other parties; if conflicting evidence or viewpoints persist, suggest specific research that is needed to resolve the issue."
    trigger: "When stakeholders or other parties disagree with your synthesised interpretation."
    qualification: "Your synthesised insights extend beyond those of an individual researcher immersed in a single context."
    evidence: "'Do not automatically assume that your line of reasoning is wrong just because your perceptions are not confirmed by other parties... However, if conflicting evidence or viewpoints persist, you could suggest specific research that is needed to resolve the issue.' (p.261)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d55"
    source: "Booth & Sutton 2022, Ch.8, p.265"
    directive: "Return to your review protocol and question throughout your review — particularly at the analysis stage — to check that the questions you are answering are those identified in the original protocol."
    trigger: "Throughout the review and especially at the analysis stage."
    qualification: "By the analysis stage you have been so engaged with the literature that the review could drift from being question-driven to literature-driven."
    evidence: "'You should return to your review protocol and question throughout your review (Butler et al., 2016)... It is particularly important to do this at the analysis stage. By now you have been so intensively and extensively engaged with the literature that your review could drift from being question driven to literature driven. You need to check that the questions you are answering are those identified in the original review protocol.' (p.265)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d56"
    source: "Booth & Sutton 2022, Ch.8, p.267"
    directive: "Do not simply list systematic errors and associated problems with validity when discussing review limitations; explain the meaning of any errors and their likely influence so the audience gains a clear picture of how methodological limitations impact on the findings."
    trigger: "When writing up the limitations of a qualitative review."
    qualification: ""
    evidence: "'To discuss the limitations of your review well you do not simply list systematic errors and associated problems with validity. That is like a plumber who meets any problems, regardless of severity, with a sharp intake of breath! Instead, you should explain the meaning of any errors and their likely influence. Your audience will gain a clear picture of how methodological limitations impact on the findings of the review (Munthe-Kaas et al., 2018).' (p.267)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d57"
    source: "Booth & Sutton 2022, Ch.8, p.264"
    directive: "Choose a natural order for listed studies in tables (e.g. chronological, reverse chronological, geographical region) to support the accompanying narrative; if no obvious order, use author surname then date so the reader can locate familiar studies quickly."
    trigger: "When constructing tables of included studies."
    qualification: ""
    evidence: "'1. Has the author only presented the included studies in the order that they came to hand? 2. Could the author have chosen a natural order for listed studies to support the accompanying narrative? For example, chronological order... Reverse chronological order... Geographical region... 3. If there is no obvious alternative order, are listed studies organised by author surname and then by date of publication? This allows the reader to locate familiar studies quickly.' (Box, p.264)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d58"
    source: "Booth & Sutton 2022, Ch.8, p.264"
    directive: "Edit table content carefully — strip out unnecessary text (e.g. 'This study was conducted in'), standardise the format and detail across studies, and avoid splitting tables and cells across pages."
    trigger: "When preparing tables of included studies for a review."
    qualification: ""
    evidence: "'Has the author simply cut and pasted raw data from the original articles into the review tables without editing? Careful editing seeks (i) to strip out unnecessary text (e.g. \"This study was conducted in\"); (ii) to standardise the format and detail across studies; and (iii) to avoid splitting tables and cells across pages.' (Box, p.264)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d59"
    source: "Booth & Sutton 2022, Ch.8, p.264"
    directive: "Standardise inconsistent data under common labels where appropriate to help identify patterns across columns, but not where labels carry meaningful distinctions or where the labels used by authors are themselves the focus of study."
    trigger: "When tabulating data from heterogeneous studies."
    qualification: "Categorising 'Survey design', 'Survey questionnaire' and 'Survey' under 'Survey' is appropriate; conflating 'Third World', 'Developing Countries' and 'Low- and Middle-Income Countries' may not be."
    evidence: "'Has the author standardised inconsistent data under common labels, where appropriate, to help to identify patterns across columns? For example, categorising \"Survey design\", \"Survey questionnaire\" and \"Survey\" under a single common label of \"Survey\". Note that this is not always appropriate where labels carry meaningful distinctions or where labels used by authors are the focus of study (e.g. \"Third World\", \"Developing Countries\" and \"Low-and Middle-Income Countries\").' (Box, p.264)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d60"
    source: "Booth & Sutton 2022, Ch.8, p.270"
    directive: "Explore published methods and examples before selecting a qualitative synthesis methodology that is fit for purpose."
    trigger: "When selecting a method for qualitative synthesis."
    qualification: ""
    evidence: "'Numerous approaches to synthesis exist and you should explore published methods and examples before selecting a methodology that is fit for purpose.' (key learning points, p.270)"
  - id: "booth-sutton-2022-systematic-approaches/ch8-qualitative-synthesis/d61"
    source: "Booth & Sutton 2022, Ch.8, p.270"
    directive: "Picture what your final synthesis might look like before selecting data to be extracted."
    trigger: "When designing data extraction for a qualitative synthesis."
    qualification: ""
    evidence: "'Data extraction is a key step towards synthesis; you will find it helpful to picture what your final synthesis might look like before selecting data to be extracted.' (key learning points, p.270)"
